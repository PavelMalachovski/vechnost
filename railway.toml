[build]
# The repository's Dockerfile: dependencies from requirements.lock with
# hashes, Python pinned, and the same image CI builds and smokes before a
# merge. Nixpacks used to resolve every dependency afresh on each build, so a
# release upstream could break a deploy that changed nothing.
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m vechnost_bot.run_webhook"
# Railway sends traffic to a new deploy only once this answers 200, and keeps
# the previous deploy serving until then. Without it a build that cannot
# start (a dependency that no longer imports, a bad migration) replaced a
# working deploy with a restart loop; with it, the old one stays up.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

scale:
  - Категорически нет
  - Скорее нет
  - Затрудняюсь ответить
  - Скорее да
  - Полностью да

framings:
  gap: >-
    Вы по-разному ощущаете эту сферу. Одному из вас здесь хватает, второму
    нет. Это почва для скрытых обид.
  both_low: >-
    Это ваша общая болевая точка. Вы оба чувствуете проблему здесь, и это
    хорошая новость: вы признаёте реальность и можете начать работу.

recommendation: >-
  Обсудите вопросы №{numbers} из теста сегодня вечером за чаем.

critical_block: >-
  💡 Рекомендация: ваша ситуация в сфере «{sphere}» требует внимания. Не
  ждите, пока это станет причиной разрыва или крупной ссоры. Обсудите
  сегодня вопросы №{numbers}. А лучше запишитесь на поддерживающую
  сессию к семейному психологу, чтобы разобраться в этой сфере бережно и
  с вниманием друг к другу.

# Written by the implementer, not the product owner. Flagged in the spec
# for rewriting.
strengths_fallback: >-
  Пока ни одна сфера не вышла в зону силы. Это не приговор, а точка,
  с которой видно, куда расти.

spheres:
  - id: values
    title: Ценности и цели
    questions:
      - "Мы одинаково видим наше будущее через 5–10 лет (дети, место жительства, карьера)."
      - "Наши взгляды на религию, политику и важные жизненные принципы совпадают."
      - "Мы поддерживаем амбиции и профессиональный рост друг друга."
      - "У нас похожие представления о том, что такое «счастливая семья»."
      - "Мы оба готовы идти на компромиссы ради общих долгосрочных целей."
    synergy: >-
      Вы смотрите в одну сторону. Ваши видения «завтра» совпадают, и это
      даёт большое чувство безопасности и защищённости. Вы – дом и опора
      друг для друга.
    imbalance: >-
      Один из вас уже строит дом, а другой всё ещё хочет кочевать. Ваша
      проблема не в чувствах, а в разных «картах будущего». Без честного
      разговора о целях через год один из вас почувствует, что живёт
      чужую жизнь.
    crisis: >-
      Вы идёте по разным дорогам, случайно оказавшись в одной лодке. Если
      не найти общие смыслы сейчас, отношения превратятся в сожительство
      двух чужих людей и станут обузой для каждого из них.

  - id: money
    title: Финансы
    questions:
      - "Мы открыто обсуждаем доходы и расходы без чувства неловкости или страха."
      - "Наши стратегии трат и накоплений (кто «транжира», кто «экономный») не создают конфликтов."
      - "Мы согласны в том, каким должен быть наш бюджет (общий, раздельный или смешанный)."
      - "У нас есть общее понимание того, на что допустимо брать кредиты или тратить крупные суммы."
      - "Я доверяю партнёру в управлении нашими общими деньгами."
    synergy: >-
      Деньги для вас – инструмент, а не повод для власти. Вы доверяете
      друг другу, и это избавляет вашу пару от 70% бытовых ссор.
    imbalance: >-
      Для одного деньги – это свобода, для другого – безопасность. Вы
      спорите не о суммах, а о личных страхах. Это может привести к
      «финансовым секретам» друг от друга, будьте внимательны и бережны
      друг к другу. Возможно, одному из вас не хватает чувства
      безопасности и защищённости.
    crisis: >-
      Финансовый хаос или тотальный контроль. Деньги стали инструментом
      манипуляции или вечного стресса. Это «мина замедленного действия»
      для вашего союза. Пересмотрите эту сферу уже сейчас, чтобы избежать
      ссор и непониманий в будущем.

  - id: communication
    title: Коммуникация и конфликты
    questions:
      - "Во время ссоры мы стремимся решить проблему, а не «победить» или обидеть партнёра."
      - "Я чувствую, что партнёр меня действительно слышит, даже если он со мной не согласен."
      - "Мы умеем мириться и обсуждать обиды, не замалчивая их днями."
      - "Я могу честно признаться партнёру, что он меня задел, не боясь агрессии в ответ."
      - "Мы не возвращаемся к старым ошибкам и прошлым ссорам во время новых конфликтов."
    synergy: >-
      Вы умеете ссориться созидательно. Вы нападаете на проблему, а не
      друг на друга. Это признак очень зрелых отношений. Продолжайте в
      том же духе, вы чувствуетесь настоящей командой.
    imbalance: >-
      Один из вас хочет обсуждать всё сразу, а другой уходит в «пещеру».
      Это рождает чувство брошенности у одного и прессинга у другого. Вы
      копите обиды вместо их решения. Важно это заметить уже сейчас и
      обсудить варианты решения конфликтов, которые будут комфортны
      обоим.
    crisis: >-
      Ваши конфликты – это деструкция. Либо затяжное молчание, либо
      взаимное уничтожение. Вы перестали слышать боль друг друга за
      криками или холодом. Очень важно научиться выражать своё мнение и
      чувства, не раня другого. Хороший вариант – вместе начать учиться
      ненасильственному общению.

  - id: intimacy
    title: Секс и близость
    questions:
      - "Меня устраивают качество и частота нашей интимной жизни."
      - "Мы можем открыто обсуждать наши фантазии и то, что нам не нравится в постели."
      - "В наших отношениях достаточно нежности (объятия, прикосновения) вне секса."
      - "Мой партнёр проявляет инициативу в близости так, как мне это нравится."
      - "Мы чувствуем себя раскрепощённо и безопасно друг с другом в интимном плане."
    synergy: >-
      Ваша спальня – зона страсти и доверия. Вы чувствуете друг друга, и
      это подпитывает вашу любовь даже в серые будни. Огонёк в ваших
      отношениях горит всё так же ярко, как в начале.
    imbalance: >-
      У вас разный «темперамент» или разные языки любви. Один чувствует
      себя отвергнутым, другой – обязанным. Это создаёт невидимую стену в
      постели. Будет здорово поговорить друг с другом начистоту и найти
      точки соприкосновения, выяснить, как каждый из вас чувствует и
      выражает свою любовь и влечение.
    crisis: >-
      Сексуальное охлаждение или табу на обсуждение желаний. Если
      интимность исчезнет совсем, вы рискуете превратиться в «просто
      друзей» или «соседей». Именно поэтому вам очень важно начать
      качественно проводить время друг с другом и учиться восхищаться,
      выражать свои желания, принимать желания партнёра и вместе
      исследовать грани страсти друг друга.

  - id: home
    title: Быт и пространство
    questions:
      - "Разделение домашних обязанностей кажется мне справедливым и логичным."
      - "Мой партнёр уважает моё право на одиночество и личные хобби."
      - "Наши бытовые привычки (порядок, режим дня) комфортно сочетаются."
      - "Мы одинаково относимся к гостям и социальному шуму в нашем доме."
      - "Я чувствую себя «дома», когда нахожусь на нашей общей территории."
    synergy: >-
      Ваш дом – ваше место силы. Вы распределили роли так, что быт не
      «сжирает» романтику, а дополняет её. Вы настоящая команда, и быт
      только ещё раз доказывает это.
    imbalance: >-
      Один из вас чувствует себя «обслуживающим персоналом», а другой не
      замечает проблемы. Бытовая несправедливость – самый тихий убийца
      любви. Важно замечать вклад каждого в ваш быт и общее пространство,
      благодарить и уважать старания другого.
    crisis: >-
      Бытовой ад. Постоянные претензии из-за мелочей скрывают глубокое
      недовольство партнёром. Ваш дом перестал быть местом, куда хочется
      возвращаться, из-за чего отношения стали приносить дискомфорт и
      грозятся разрушить не только сами себя, но и душевный покой каждого
      из партнёров. Обратите внимание на распределение бытовых
      обязанностей, обсудите новую стратегию действий и внимательно
      послушайте партнёра: возможно, есть то, чего вы раньше не
      замечали.

  - id: trust
    title: Доверие и безопасность
    questions:
      - "Я не чувствую необходимости проверять телефон или соцсети партнёра."
      - "Я не сомневаюсь, что партнёр поддержит меня и будет на моей стороне в трудной ситуации."
      - "Я чувствую себя в полной эмоциональной безопасности рядом с партнёром."
      - "Мой партнёр выполняет свои обещания и договорённости."
      - "У меня нет ощущения, что мне нужно «заслуживать» любовь партнёра."
    synergy: >-
      Абсолютный покой. Вам не нужно контролировать друг друга, потому
      что вы уверены в преданности партнёра. Это высшая форма близости и
      доверия. Вы чувствуете безопасность и можете выражать настоящего
      себя, принимая партнёра таким, какой он есть.
    imbalance: >-
      Ревность или тревога. Один из вас постоянно «на чеку». Это
      изматывает обоих и не даёт отношениям расслабиться и расти, что
      подрывает доверие и создаёт излишнее напряжение. Необходим
      искренний разговор о границах и комфорте каждого в паре.
    crisis: >-
      Потеря доверия. Жизнь в режиме подозрения или после предательства.
      Без глубокой проработки это состояние разрушит вашу психику. Это
      очень важная сфера, которая не может остаться без внимания.
      Обратите внимание друг на друга, выслушайте то, что у партнёра на
      душе, и дайте другому ту безопасность, которой ему не хватает.

  - id: social
    title: Социальный круг
    questions:
      - "Влияние родителей (моих или партнёра) не создаёт проблем внутри нашей пары."
      - "Мне комфортно проводить время в кругу друзей моего партнёра."
      - "Мой партнёр уважает моих друзей и моих родственников."
      - "Мы умеем защищать границы нашей пары от вмешательства посторонних."
      - "У нас есть общие друзья, с которыми нам обоим интересно."
    synergy: >-
      Вы – суверенное государство. Вы уважаете близких, но никто не имеет
      права диктовать вам правила. Ваши друзья – ваше общее достижение.
      Вы в прекрасной компании, но при этом соблюдаете границы вас как
      пары.
    imbalance: >-
      В ваших отношениях всегда присутствует «третий лишний» (мама,
      друзья, бывшие). Вы не чувствуете, что партнёр полностью на вашей
      стороне. Если запустить этот вопрос, могут начаться проблемы с
      доверием и безопасностью в паре. Обратите внимание, что один
      честный разговор может решить большое количество общих недомолвок.
    crisis: >-
      Близкие разрушают ваш союз. Конфликты с родственниками или друзьями
      стали важнее, чем мир внутри пары. Вы теряете друг друга из-за
      чужого мнения. Повод задуматься, обсудить границы между собой и
      бережно выстроить их со всеми остальными в окружении.

  - id: empathy
    title: Эмоциональный интеллект
    questions:
      - "Мой партнёр замечает, когда мне плохо, даже если я об этом не говорю."
      - "Мы часто говорим друг другу комплименты и выражаем искреннее восхищение."
      - "Я чувствую, что меня ценят как личность, а не только за мои функции."
      - "Мы умеем вместе смеяться над проблемами и над собой."
      - "Мы уделяем время качественному общению друг с другом каждый день."
    synergy: >-
      Вы чувствуете состояние друг друга. Ваша эмпатия позволяет купировать
      любые проблемы ещё на взлёте. Вы – настоящие родственные души и
      всегда можете рассчитывать на поддержку и помощь друг друга.
    imbalance: >-
      Один из вас эмоционально включён, а другой кажется «холодным». Вы
      ждёте друг от друга разной степени вовлечённости, и это рождает
      чувство одиночества. Важно проработать типы привязанности и
      научиться работать с каждым из них, а также обсудить доверие в
      паре.
    crisis: >-
      Эмоциональная глухота. Вы перестали интересоваться внутренним миром
      друг друга. Отношения стали функциональными, но безжизненными. Это
      повод обратить внимание на многие сферы вашей общей жизни, а также
      на собственные проблемы и трудности, так как именно они часто не
      дают возможности полностью включиться в отношения.

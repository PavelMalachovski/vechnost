# Мастер-класс по нюдсам: гайд по чувственным снимкам.
#
# Это не про фотографию, а про то, чтобы посмотреть на себя как на
# произведение искусства.
#
# Структура – ступени, а не список категорий: человек проходит их по
# порядку, от света к безопасности, и на каждой видит, что делать дальше.
# У каждого пункта есть `art` – ключ схемы, которую Mini App рисует линиями
# (силуэт, где стоит свет, где камера). Ключей без рисунка быть не должно:
# webapp/index.html падает на отсутствующий тихо, а тест ловит громко.
#
# Позы помечены nsfw и уходят за подтверждение возраста. Свет, камера,
# обработка и безопасность открыты: это ремесло, а не откровенность, и
# прятать за возрастной гейт раздел про безопасность было бы странно.
#
# Длинных тире в файле нет.
type: guide
title: Мастер-класс по нюдсам
intro: >-
  Здесь нет места стеснению. Только теплота, уют и искрящееся возбуждение.
  Пять ступеней: свет, камера, поза, обработка и решение о том, где этим
  снимкам жить. Идите по порядку, и на выходе будет кадр, который не стыдно
  показать и приятно хранить.

steps:
  - id: light
    number: 1
    title: Свет
    lead: >-
      Дорогой кадр делает не камера, а один источник света и понимание, куда
      его поставить. Выбери одну схему и попробуй её целиком, прежде чем
      переходить к следующей.
    items:
      - id: side
        art: light-side
        title: Боковой драматизм
        text: >-
          Поставь лампу или встань боком к окну ровно под 90° к источнику.
          Одна сторона тела уходит в глубокую тень: это максимально
          подчёркивает рельеф, изгиб талии и линию бедра.
        tips:
          - Источник на уровне груди, не выше головы.
          - Чем ближе лампа, тем резче граница света и тени.
      - id: rim
        art: light-rim
        title: Ангельский контур
        text: >-
          Источник строго сзади, направлен тебе в спину. Вокруг тела
          появляется тонкий сияющий ободок, само тело остаётся в тени. Лучший
          способ скрыть детали и оставить безупречный силуэт.
        tips:
          - Камере нужна точка, где лампа не бьёт прямо в объектив.
          - Работает лучше всего в темной комнате, без второго источника.
      - id: soft
        art: light-soft
        title: Мягкий закат
        text: >-
          Накрой настольную лампу тонкой тканью тёплого оттенка: бежевой,
          персиковой или розовой. Кожа становится бархатистой и ровной, кадр
          получается нежным и домашним.
        tips:
          - Ткань не должна касаться лампы накаливания.
          - Поставь источник чуть выше уровня глаз и сбоку.
      - id: stripes
        art: light-stripes
        title: Полосы желания
        text: >-
          Встань так, чтобы свет падал через жалюзи, спинку стула или крупное
          кружево. Ритмичный рисунок теней превращает тело в арт-объект.
        tips:
          - Чем дальше преграда от тела, тем мягче полосы.
          - Поворачивайся медленно и следи, как рисунок ложится по изгибам.

  - id: camera
    number: 2
    title: Камера
    lead: >-
      Три настройки, которые отделяют случайный снимок от осознанного. Все
      три есть в любом смартфоне и делаются пальцем за десять секунд.
    items:
      - id: height
        art: camera-height
        title: Высота и таймер
        text: >-
          Телефон на уровне пупка или чуть ниже: это визуально удлиняет тело.
          Таймер на 10 секунд, чтобы успеть расслабиться и войти в образ.
        tips:
          - Обопри телефон о стопку книг, если нет штатива.
          - "Фон пустой: однотонная стена или кровать без лишних вещей."
      - id: exposure
        art: camera-exposure
        title: Экспозиция вниз
        text: >-
          Нажми на экран в самом светлом месте кадра и потяни «солнышко»
          вниз. Чуть приглушённый свет добавляет глубины и прячет лишнее в
          тенях.
        tips:
          - "Ориентир: света ровно столько, чтобы читался силуэт."
          - Пересвеченную кожу не вернуть обработкой, недосвеченную вернуть можно.
      - id: focus
        art: camera-focus
        title: Ручной фокус
        text: >-
          Не доверяй автоматике: тапни по той части тела, которую хочешь
          выделить. Ключица, изгиб бедра, линия шеи.
        tips:
          - После тапа удерживай палец, чтобы фокус залип и не уехал.
          - Если снимаешь себя, наведи фокус на место, где будешь стоять.

  - id: her
    number: 3
    title: Позы для неё
    nsfw: true
    lead: >-
      Десять поз от самой закрытой к самой открытой. Начни с первой, даже
      если хочется сразу к пятой: тело расслабляется по дороге.
    items:
      - id: her-1
        art: her-1
        title: Утренняя нега
        text: >-
          Сядь на край кровати боком к зеркалу. Спина прямая, одну ногу
          вытяни, вторую согни и обхвати руками, прижимая к груди.
        tips: ["Свет сбоку, чтобы одна сторона осталась в тени."]
      - id: her-2
        art: her-2
        title: Линия горизонта
        text: >-
          Ляг на бок, опираясь на локоть. Нижнюю ногу вытяни, верхнюю согни и
          положи перед собой: получится красивый S-образный изгиб от талии к
          бедру.
        tips: ["Свет сзади сверху.", "Рука мягко касается волос."]
      - id: her-3
        art: her-3
        title: Взгляд нимфы
        text: >-
          Встань спиной к камере, слегка поверни голову. Руки подними вверх,
          будто забираешь волосы в хвост.
        tips: ["Свет фронтальный, от окна на лицо.", "Акцент на изгибе позвоночника."]
      - id: her-4
        art: her-4
        title: В объятиях ткани
        text: >-
          Завернись в простыню, оставив одно плечо открытым. Сядь на пол,
          обхватив колени.
        tips: ["Свет мягкий рассеянный."]
      - id: her-5
        art: her-5
        title: Силуэт у окна
        text: >-
          Встань боком к окну, ноги чуть расставлены, одна на носочке. Веди
          руки вдоль тела.
        tips: ["Свет строго сзади: останется только контур."]
      - id: her-6
        art: her-6
        title: Текучесть
        text: >-
          Ляг на спину, подними руки за голову. Ноги согни в коленях и наклони
          в одну сторону.
        tips: ["Свет сверху.", "Снимай с высоты вытянутой руки."]
      - id: her-7
        art: her-7
        title: Прикосновение
        text: >-
          Кадр от подбородка до бёдер. Одна рука на ключице, вторая прикрывает
          грудь: руки создают геометрию.
        tips: ["Свет боковой, резкий."]
      - id: her-8
        art: her-8
        title: Поза лотоса
        text: >-
          Сядь по-турецки, наклонись вперёд и положи голову на скрещенные
          руки.
        tips: ["Свет сзади.", "Поза подчёркивает мягкость плеч."]
      - id: her-9
        art: her-9
        title: В тени
        text: >-
          Встань так, чтобы полосы света от жалюзи падали на тело. Руки на
          талии.
        tips: ["Световой рисунок делает всю работу за тебя."]
      - id: her-10
        art: her-10
        title: Вдохновение
        text: >-
          Сядь на стул верхом, спиной к камере. Руки на спинке, голова
          опущена.
        tips: ["Свет боковой.", "Акцент на лопатках и линии плеч."]

  - id: him
    number: 4
    title: Позы для него
    nsfw: true
    lead: >-
      Десять поз на силу и линию. Мужское тело читается через плечи, спину и
      напряжение рук, поэтому почти везде нужен жёсткий боковой свет.
    items:
      - id: him-1
        art: him-1
        title: Статика
        text: >-
          Встань спиной к камере, ноги на ширине плеч, руки сцепи за головой.
        tips: ["Резкий боковой свет вытянет V-образный силуэт."]
      - id: him-2
        art: him-2
        title: Мыслитель
        text: >-
          Сядь на пол, прижавшись спиной к стене. Одну ногу вытяни, вторую
          согни, локоть на колено, ладонь к подбородку.
        tips: ["Свет сверху даст тени под скулами."]
      - id: him-3
        art: him-3
        title: Контраст
        text: >-
          Стоя, в расстёгнутых джинсах, руки заведены за спину.
        tips: ["Свет сбоку, акцент на линии косых мышц живота."]
      - id: him-4
        art: him-4
        title: В движении
        text: >-
          Встань прямо, подними руки вверх, потягиваясь, живот подтянут.
        tips: ["Свет фронтальный рассеянный."]
      - id: him-5
        art: him-5
        title: Тень героя
        text: >-
          Встань боком к источнику света, руки свободно.
        tips: ["Контровой свет оставит чёткий профиль и линию плеч."]
      - id: him-6
        art: him-6
        title: У опоры
        text: >-
          Обопрись руками о стену выше головы, наклонив торс. Вид сзади или
          сбоку.
        tips: ["Свет боковой: спина уходит в тень."]
      - id: him-7
        art: him-7
        title: После душа
        text: >-
          Полотенце на бёдрах, сидя на краю ванны, голова опущена, руки на
          коленях.
        tips: ["Холодный белый свет, мокрые волосы."]
      - id: him-8
        art: him-8
        title: Взгляд
        text: >-
          Ляг на живот, приподнимись на локтях, смотри в камеру.
        tips: ["Мягкий свет от окна.", "Плечи скрывают всё лишнее."]
      - id: him-9
        art: him-9
        title: Асимметрия
        text: >-
          Сядь боком на стул, закинув ногу на ногу, рука свободно лежит на
          бедре.
        tips: ["Тёплый точечный свет."]
      - id: him-10
        art: him-10
        title: Текстура
        text: >-
          Только торс в профиль, руки скрещены на груди, лицо вне кадра.
        tips: ["Очень контрастный свет."]

  - id: edit
    number: 5
    title: Обработка и безопасность
    lead: >-
      Последняя ступень. Сначала доводим кадр, потом решаем, где он живёт, и
      только потом отправляем.
    items:
      - id: bw
        art: edit-bw
        title: Чёрно-белое и тени
        text: >-
          Чёрно-белое убирает цветовые пятна и покраснения, всё внимание
          уходит на формы. Уведи ползунок «Тени» влево: в темноте прячется
          всё лишнее.
        tips:
          - Добавь 10-15% зерна для эффекта плёнки.
          - Слегка затемни края виньеткой, чтобы собрать внимание в центре.
      - id: privacy
        art: edit-privacy
        title: Прежде чем нажать «отправить»
        text: >-
          Лицо в кадре – отдельное решение. Оставляй его только там, где
          приватность канала не вызывает ни одного сомнения. Красота тела
          скажет сама за себя.
        tips:
          - "Убери из кадра то, что опознаёт место: документы, вид из окна, наклейки на технике."
          - Договоритесь заранее, где эти снимки живут и кто их удаляет.

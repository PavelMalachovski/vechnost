# Мастер-класс по ню: гайд по чувственным снимкам.
#
# Это не про фотографию, а про то, чтобы посмотреть на себя как на
# произведение искусства. Две категории с позами помечены nsfw и уходят за
# подтверждение возраста; свет, камера, обработка и безопасность открыты,
# потому что это ремесло, а не откровенность.
#
# Длинных тире в файле нет.
categories:
  - id: light
    title: Свет и тень
    items:
      - "«Боковой драматизм». Поставь лампу или встань боком к окну ровно под 90° к источнику. Одна сторона тела уходит в глубокую тень: это максимально подчёркивает рельеф, изгиб талии и линию бедра."
      - "«Ангельский контур». Источник света строго сзади, направлен тебе в спину. Вокруг тела появляется тонкий сияющий ободок, само тело остаётся в тени. Лучший способ скрыть детали и оставить безупречный силуэт."
      - "«Мягкий закат». Накрой настольную лампу тонкой тканью тёплого оттенка: бежевой, персиковой или розовой. Кожа становится бархатистой и ровной, кадр получается нежным и домашним."
      - "«Полосы желания». Встань так, чтобы свет падал через жалюзи, спинку стула или крупное кружево. Ритмичный рисунок теней превращает тело в арт-объект."
  - id: camera
    title: Камера
    items:
      - "Экспозиция вниз. Нажми на экран в самом светлом месте кадра и потяни «солнышко» вниз. Чуть приглушённый свет добавляет глубины и прячет лишнее в тенях."
      - "Ручной фокус. Не доверяй автоматике: тапни по той части тела, которую хочешь выделить. Ключица, изгиб бедра, линия шеи."
      - "Высота и таймер. Телефон на уровне пупка или чуть ниже, это визуально удлиняет тело. Таймер на 10 секунд, чтобы успеть расслабиться и войти в образ. Фон пустой: однотонная стена или кровать без лишних вещей."
  - id: edit
    title: Обработка
    items:
      - "Чёрно-белое. Убирает цветовые пятна и покраснения, всё внимание уходит на формы и линии."
      - "Тени вниз. Уведи ползунок «Тени» влево: в темноте прячется всё лишнее и остаётся только манящее."
      - "Зерно 10–15%. Эффект плёночного кадра, который заодно визуально разглаживает кожу."
      - "Виньетка и тепло. Слегка затемни края, чтобы собрать внимание в центре, и уведи баланс белого в тёплый для уюта."
  - id: her
    title: "Для неё: грация и искушение"
    nsfw: true
    items:
      - "«Утренняя нега». Сядь на край кровати боком к зеркалу. Спина прямая, одну ногу вытяни, вторую согни и обхвати руками, прижимая к груди. Свет сбоку, чтобы одна сторона осталась в тени."
      - "«Линия горизонта». Ляг на бок, опираясь на локоть. Нижнюю ногу вытяни, верхнюю согни и положи перед собой. Получится красивый S-образный изгиб от талии к бедру. Свет сзади сверху."
      - "«Взгляд нимфы». Встань спиной к камере, слегка поверни голову. Руки подними вверх, будто забираешь волосы в хвост. Свет фронтальный, от окна на лицо."
      - "«В объятиях ткани». Завернись в белую простыню, оставив одно плечо открытым. Сядь на пол, обхватив колени. Свет мягкий рассеянный."
      - "«Силуэт у окна». Встань боком к окну, ноги чуть расставлены, одна на носочке. Веди руки вдоль тела. Свет строго сзади: останется только контур."
      - "«Текучесть». Ляг на спину, подними руки за голову. Ноги согни в коленях и наклони в одну сторону. Свет сверху, акцент на вытянутом торсе."
      - "«Прикосновение». Кадр от подбородка до бёдер. Одна рука на ключице, вторая прикрывает грудь: руки создают геометрию. Свет боковой, резкий."
      - "«Поза лотоса». Сядь по-турецки, наклонись вперёд и положи голову на скрещенные руки. Свет сзади. Компактная поза, которая подчёркивает мягкость плеч."
      - "«В тени». Встань так, чтобы полосы света от жалюзи падали на тело. Руки на талии. Световой рисунок делает всю работу за тебя."
      - "«Вдохновение». Сядь на стул верхом, спиной к камере. Руки на спинке, голова опущена. Свет боковой, акцент на лопатках и линии плеч."
  - id: him
    title: "Для него: сила и магнетизм"
    nsfw: true
    items:
      - "«Статика». Встань спиной к камере, ноги на ширине плеч, руки сцепи за головой. Резкий боковой свет вытянет V-образный силуэт и рельеф лопаток."
      - "«Мыслитель». Сядь на пол, прижавшись спиной к стене. Одну ногу вытяни, вторую согни, локоть на колено, ладонь к подбородку. Свет сверху даст тени под скулами."
      - "«Контраст». Стоя, в расстёгнутых джинсах, руки заведены за спину. Свет сбоку, акцент на линии косых мышц живота и крае ткани."
      - "«В движении». Встань прямо, подними руки вверх, потягиваясь, живот подтянут. Свет фронтальный рассеянный."
      - "«Тень героя». Встань боком к источнику света, руки свободно. Контровой свет оставит чёткий профиль, широкие плечи и подбородок."
      - "«У опоры». Обопрись руками о стену выше головы, наклонив торс. Вид сзади или сбоку, свет боковой: напряжённые руки, спина уходит в тень."
      - "«После душа». Полотенце на бёдрах, сидя на краю ванны, голова опущена, руки на коленях. Холодный белый свет, мокрые волосы."
      - "«Взгляд». Ляг на живот, приподнимись на локтях, смотри в камеру. Мягкий свет от окна: плечи скрывают всё лишнее."
      - "«Асимметрия». Сядь боком на стул, закинув ногу на ногу, рука свободно лежит на бедре. Тёплый точечный свет."
      - "«Текстура». Только торс в профиль, руки скрещены на груди, лицо вне кадра. Очень контрастный свет на мышцах груди и плеча."
  - id: safety
    title: Безопасность
    items:
      - "Лицо в кадре – отдельное решение. Не включай его, если не уверен в приватности канала на все сто. Красота тела скажет сама за себя."
      - "Уберите из кадра то, что опознаёт место: документы, номера, узнаваемый вид из окна, наклейки на технике."
      - "Договоритесь заранее, где эти снимки живут и кто их удаляет. Это ваш личный архив, а не переписка."

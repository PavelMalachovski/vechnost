items:
  - title: >-
      Письмо «Спасибо за защиту»: напишите письмо своему страху или
      внутреннему критику
    why: >-
      Мы привыкли бороться с комплексами, но они возникли как механизм
      защиты, чтобы уберечь нас от опасностей.
    result: >-
      Снижение внутреннего напряжения. Вы признаёте роль страха, но
      забираете у него штурвал.
  - title: >-
      Свидание в тишине: 2 часа наедине с собой без телефона и музыки
    why: >-
      Понять, какие мысли приходят, когда внешний шум утихает.
    result: >-
      Навык слышать свои истинные потребности, а не навязанные извне.
  - title: >-
      Аудит окружения: выпишите свой круг общения и отметьте, кто вас
      наполняет, а кто истощает
    why: >-
      Часто мы общаемся по привычке с токсичными людьми, не умея отказаться.
    result: >-
      Трезвое понимание своих контактов и того, куда уходит ресурс.
  - title: >-
      Зеркальная практика: 5 минут смотрите себе в глаза и честно замечайте
      свою красоту
    why: >-
      Мы часто смотрим на себя, чтобы найти изъян. Здесь задача – найти
      красивое.
    result: >-
      Принятие своей внешности без оценок, тёплый контакт с собой.
  - title: >-
      День «Хочу»: выходной, где каждое действие выбирается через вопрос
      «чего я сейчас хочу?»
    why: >-
      Проработка привычки жить через «надо» и разрешение себе хотеть.
    result: >-
      Возврат контакта со своими желаниями и радостью жизни.
  - title: >-
      Карта личных границ: список ситуаций, которые для вас неприемлемы в
      отношениях
    why: >-
      Чтобы не раствориться в будущем партнёре.
    result: >-
      Чёткое понимание своих «нет», что гарантирует безопасность в будущем.
  - title: >-
      Соло-выход в свет: поход в красивое место в одиночку
    why: >-
      Чтобы перестать ждать кого-то, чтобы начать жить красиво.
    result: >-
      Уверенность, что ваша радость не зависит от наличия спутника.
  - title: >-
      Выгрузка тревог: 15–20 минут свободного письма без остановки и цензуры
    why: >-
      Мысли в голове становятся кашей, а на бумаге сразу видно, что имеет
      смысл, а что – придумки ума.
    result: >-
      Ощущение облегчения, как после генеральной уборки в голове.
  - title: >-
      Коннект с телом: найдите зоны, к которым есть претензии, и
      поблагодарите их за работу
    why: >-
      Перевод внимания с красоты на функциональность и жизнь.
    result: >-
      Снижение телесной тревоги, принятие своей физической формы.
  - title: >-
      Письмо из будущего: напишите себе послание от лица себя через 20 лет
    why: >-
      Помогает сменить масштаб и понять, что текущие проблемы временны.
    result: >-
      Спокойный взгляд на текущий этап и поддержка себя.
  - title: >-
      Бережное «нет»: откажитесь от одного дела, которое вы делаете из
      чувства долга
    why: >-
      Тренировка навыка защиты своего времени и границ.
    result: >-
      Высвобождение энергии для действительно важных вещей.
  - title: >-
      Безопасное место: визуализация пространства, где вам никто не может
      навредить
    why: >-
      Создание психологического убежища, куда можно уйти во время стресса.
    result: >-
      Повышение эмоциональной устойчивости.
  - title: >-
      Подарок внутреннему ребёнку: купите себе то, что очень хотелось в
      детстве
    why: >-
      Закрытие старых дефицитов внимания и умение исполнять свои желания.
    result: >-
      Чувство глубокого удовлетворения и подпитка ресурса.
  - title: >-
      Дневник побед: напишите список достижений, включая ментальные
    why: >-
      Обучение мозга замечать свои сильные стороны.
    result: >-
      Рост здоровой самооценки и признание собственной важности.
  - title: >-
      День без оценок: постарайтесь не критиковать себя за ошибки в течение
      дня
    why: >-
      Снижение уровня внутреннего перфекционизма.
    result: >-
      Состояние внутреннего покоя и самопринятия.
  - title: >-
      Текстовое самоинтервью: «Кто я, если убрать мою работу, деньги, роли и
      статус?»
    why: >-
      Поиск своей подлинной сути.
    result: >-
      Ощущение самодостаточности и самоидентичность.
  - title: >-
      Дар самому себе: купите себе цветы или вещь, которую обычно ждёшь в
      подарок от других
    why: >-
      Демонстрация себе, что вы достойны любви и внимания просто так.
    result: >-
      Укрепление роли заботливого взрослого по отношению к себе.
  - title: >-
      Письмо непрощения: выпишите обиду на человека, не пытаясь его
      оправдать
    why: >-
      Чтобы легализовать свою злость и дать ей выйти.
    result: >-
      Очищение эмоционального фона и выход из роли жертвы.
  - title: >-
      Список «Я уважаю себя за…»: назовите качества характера, которые вы в
      себе уважаете
    why: >-
      Смещение фокуса с достижений на личностные смыслы.
    result: >-
      Формирование внутреннего достоинства.
  - title: >-
      Экстатик: двигайтесь под музыку с закрытыми глазами, не оценивая свои
      движения
    why: >-
      Сброс телесных зажимов и контакт с телом.
    result: >-
      Чувство свободы, прилив сил, быстрая перезагрузка.
  - title: >-
      Ритуал очищения пространства: выбросьте вещи, которые тянут в прошлое
    why: >-
      Освобождение физического и ментального места для нового.
    result: >-
      Лёгкость, готовность к переменам, признание нового этапа.
  - title: >-
      День осознанного питания: фокус на вкусе, запахе и текстуре еды без
      гаджетов
    why: >-
      Возврат в момент «здесь и сейчас» через ощущения.
    result: >-
      Ощущение полноты жизни в простых вещах и яркость восприятия.
  - title: >-
      Личная миссия: сформулируйте свой принцип жизни и совершите
      подтверждающее действие в тот же день
    why: >-
      Соединение смыслов с реальностью.
    result: >-
      Ощущение важности своего присутствия в мире.
  - title: >-
      Практика «Облака»: представьте свои мысли как облака и просто
      смотрите, как они проплывают
    why: >-
      Учит не вовлекаться в тревожные мысли.
    result: >-
      Навык отстранённого наблюдателя, спокойствие в стрессе.
  - title: >-
      Обещание и подарок: дайте себе обещание на неделю и по его выполнении
      купите себе желанное
    why: >-
      Формирование доверия к самому себе и нужной привычки.
    result: >-
      Вы понимаете, что на вас можно положиться.

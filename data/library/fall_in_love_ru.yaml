categories:
  - id: all
    title: 36 вопросов, чтобы влюбиться
    items:
      - Какую первую важную для себя деталь ты отметил(а) во мне?
      - Помнишь ли ты своё первое впечатление обо мне и первые слова, которые ты мне сказал(а)?
      - Какое слово или фраза, сказанная мной в первую встречу, потрясла тебя?
      - В какой момент на нашем первом свидании ты понял(а), что хочешь продолжения?
      - Если бы ты мог(ла) остановить время в один миг нашей первой встречи, какой бы это был момент?
      - Какая песня, аромат или вещь до сих пор напоминает тебе о начале наших отношений?
      - Что в моём поведении при первой встрече показалось тебе самым загадочным или притягательным?
      - Помнишь ли ты своё самое первое «да», которое ты сказал(а) мне, дав себе разрешение довериться?
      - Если бы наше первое свидание было кадром из фильма, тебе бы хотелось пересмотреть этот момент?
      - Какое сообщение от меня в начале нашего общения ты перечитывал(а) несколько раз?
      - Какой жест или взгляд с моей стороны дал тебе понять, что я тобой заинтересован(а)?
      - Что ты чувствовал(а) в ту секунду, когда наше первое свидание подошло к концу?
      - Какая моя привычка, о которой мало кто знает, кажется тебе самой милой или особенной?
      - Что в моём взгляде и поведении меняется, когда я смотрю на тебя? Ты замечаешь это?
      - Если бы ты мог(ла) запечатлеть меня на холсте, в каком настроении и позе ты бы меня изобразил(а)?
      - Какое моё прикосновение заставляет тебя замирать в предвкушении?
      - Какую черту моего характера ты открыл(а) со временем, и она начала тебя восхищать?
      - Какое качество моего характера ты считаешь самым ценным и светлым?
      - Если бы ты мог(ла) прочитать мои мысли прямо сейчас, что одно ты бы хотел(а) там обнаружить?
      - Чему ты всегда искренне улыбаешься, находясь рядом со мной?
      - Какую деталь в моём образе сегодня ты заметил(а) первой, но ещё не успел(а) озвучить?
      - Если бы мы сейчас танцевали в полной тишине, какую дистанцию между нами ты бы выбрал(а)?
      - Какое моё слово или интонация действуют на тебя как успокоительное?
      - Что в моём поведении и жестах заставляет тебя чувствовать себя по-настоящему особенным(ой)?
      - Какую черту моей личности ты считаешь самой притягательной для себя?
      - Если бы мы сидели в переполненном зале, как бы ты без слов дал(а) мне понять, что думаешь обо мне?
      - Какое место в нашем городе кажется тебе самым подходящим для поцелуя?
      - Что ты чувствуешь, когда я неожиданно беру тебя за руку или кладу голову тебе на плечо?
      - Если бы ты мог(ла) прожить ещё один раз момент из нашего прошлого, что бы это было?
      - Какую мечту ты бы хотел(а) разделить со мной больше всего?
      - О чём ты мечтаешь, когда смотришь на звёзды или на огонь, находясь рядом со мной?
      - Какое обещание ты бы хотел(а) получить от меня прямо сейчас?
      - Если бы мы могли прожить один день где угодно в мире, где бы мы оказались?
      - Какие фразы пробуждают в тебе скрытые фантазии обо мне?
      - Какое маленькое безумство ты бы хотел(а) совершить вместе со мной?
      - Если бы нашу любовь можно было описать путешествием или страной, что бы это было?

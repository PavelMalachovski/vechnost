categories:
  - id: all
    title: 36 вопросов, чтобы влюбиться
    items:
      - Какая деталь во мне первой показалась тебе важной?
      - Помнишь ли ты своё первое впечатление обо мне и свои первые слова в мой адрес?
      - Какое слово или фраза, сказанная мной в первую встречу, потрясла тебя?
      - В какой момент нашего первого свидания тебе стало ясно, что ты хочешь продолжения?
      - Если бы можно было остановить время в один миг нашей первой встречи, какой бы это был момент?
      - Какая песня, аромат или вещь до сих пор напоминает тебе о начале наших отношений?
      - Что в моём поведении при первой встрече показалось тебе самым загадочным или притягательным?
      - Помнишь ли ты своё самое первое «да» мне – то, в котором было разрешение себе довериться?
      - Если бы наше первое свидание было кадром из фильма, тебе бы хотелось пересмотреть этот момент?
      - Какое моё сообщение в начале нашего общения тебе хотелось перечитывать?
      - Какой мой жест или взгляд выдал тебе мой интерес?
      - Что ты чувствуешь, вспоминая ту секунду, когда наше первое свидание подошло к концу?
      - Какая моя привычка, о которой мало кто знает, кажется тебе самой милой или особенной?
      - Что в моём взгляде и поведении меняется, когда я смотрю на тебя? Ты замечаешь это?
      - "Каким получился бы мой портрет на твоём холсте: в каком настроении и в какой позе?"
      - Какое моё прикосновение заставляет тебя замирать в предвкушении?
      - Какая черта моего характера открылась тебе со временем и начала восхищать?
      - Какое качество моего характера ты считаешь самым ценным и светлым?
      - Если бы мои мысли можно было прочитать прямо сейчас, что одно ты хочешь там найти?
      - Чему ты всегда искренне улыбаешься, находясь рядом со мной?
      - Какая деталь в моём сегодняшнем образе бросилась тебе в глаза, но осталась невысказанной?
      - Если бы мы сейчас танцевали в полной тишине, какая дистанция между нами тебе нужна?
      - Какое моё слово или интонация действуют на тебя как успокоительное?
      - Что в моём поведении и жестах даёт тебе ощущение, что ты для меня особенный человек?
      - Какую черту моей личности ты считаешь самой притягательной для себя?
      - Если бы мы сидели в переполненном зале, как без слов дать мне понять, что ты думаешь обо мне?
      - Какое место в нашем городе кажется тебе самым подходящим для поцелуя?
      - Что ты чувствуешь, когда я неожиданно беру тебя за руку или кладу голову тебе на плечо?
      - Какой момент из нашего прошлого ты хочешь прожить ещё раз?
      - Какую мечту тебе больше всего хочется разделить со мной?
      - О чём ты мечтаешь, когда смотришь на звёзды или на огонь, находясь рядом со мной?
      - Какое обещание тебе хочется получить от меня прямо сейчас?
      - Если бы мы могли прожить один день где угодно в мире, где бы мы оказались?
      - Какие фразы пробуждают в тебе скрытые фантазии обо мне?
      - На какое маленькое безумство тебе хочется решиться вместе со мной?
      - Если бы нашу любовь можно было описать путешествием или страной, что бы это было?

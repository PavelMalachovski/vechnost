    - Ваш совместный ребёнок застал вас с партнёром во время секса. Какие будут
      твои действия? Как вы объясните эту ситуацию ребёнку?
    - Смог(ла) бы ты рассказать мне об измене или о чём-то, что меня точно ранит, и я буду на тебя злиться, а возможно и закончу отношения?
    - Если бы был выбор (купить, подарить или сделать что-то только для своей мамы или только для меня), кого ты выберешь?
    - Ты взял(а) ноутбук партнёра, чтобы посмотреть фотографии, но случайно нашел(а)
      целую папку с видео, где он(она) снимает себя во время мастурбации. Какая
      будет твоя реакция и какие будут дальнейшие действия?
    - Ты случайно услышал(а), как партнёр обсуждает все ваши интимные подробности
      с друзьями, начиная от размеров, звуков, которые ты издаёшь в постели,
      того, как ты раздеваешься, каждой родинки на теле, и до того, как ты кончаешь.
      Какова будет твоя реакция?
    - 'Ты узнаёшь, что партнёр ведёт виртуальный роман: переписывается с девушкой/парнем
      с другого континента и никогда не встречался(ась) с ним/ней лично. Они занимаются
      сексом по телефону и ничего больше. Какие будут твои действия? Считаешь
      ли ты это изменой?'
    - Если ты узнаешь, что твоя партнёрша совершила преступление. Расскажешь ли ты об этом? Объясни свою позицию.
    - Как в твоей семье выстраивается иерархия между детьми, партнёром, родителями, друзьями, близкими родственниками? Кто на каком месте, если 1 – самый важный, а остальные по убыванию?
    - Вы с партнёршей любите друг друга. И она говорит тебе, что едет в
      командировку, но вскоре ты узнаешь, что это отпуск с друзьями и они воспользовались
      услугами проституток. Твоя реакция?
    - Если вы уже долго в браке и в один момент партнёрша приходит и говорит, что она поняла, что её больше привлекают люди своего пола. Она говорит, что не хочет терять ваши отношения и любит тебя, как очень родного человека. Но хочет также удовлетворять свои желания в любви и близости с людьми, которые её привлекают. Как ты отреагируешь? Захочешь развода или сможешь смириться со свободными отношениями?
    - Если к твоему партнеру(ев) пристают в безлюдном месте. Ты понимаешь, что
      силы неравны, но у тебя ещё есть шанс обезопасить себя. Твои действия?
    - Если твоя партнёрша внезапно признается, что зависима от наркотиков в критической стадии. Твои действия?
    - У вас прекрасные отношения. Один из партнеров едет в отпуск с друзьями.
      И ты узнаешь, что все остальные из этой компании изменяли своим партнерам
      в этой поездке, он(а) клянется, что не делал(а) это. Поверишь ему(ей) или
      словам и свидетельствам других?
    - Если партнёршу обвиняют в преступлении. Она говорит, что этого не делала, но
      все факты указывают на это. Поверишь больше ей или предположительно верным
      доказательствам?
    - Если ты узнаешь, что у партнёрши есть хобби фотографироваться голой, фотограф
      противоположного пола. Она говорит, что у них ничего нет. Поверишь в это?
      Сможешь ли принять?
    - Если ты узнаешь, что твоя партнёрша подверглась сексуальному насилию во время ваших отношений. Но она не смогла рассказать тебе сразу. Твоя реакция?
    - Если партнёрша после нескольких лет отношений признается, что бросила своего ребенка. Детдом или оставила до/после рождения. Твоя реакция?
    - Партнёрша внезапно после нескольких лет счастливых отношений признается,
      что все еще любит предыдущего партнера. Но и тебя любит тоже. Твоя реакция?
    - Если бы ты мог(ла) сделать что угодно, зная, что тебя за это не осудят (даже нарушить закон), что бы ты сделал(а)?
    - Если ты нарушил(а) обещание, ты всегда извиняешься или делаешь вид, что ничего не было?
    - 'Что бы ты сделал(а), если бы нужно было выбрать: обмануть меня, но защитить себя, или сказать правду, зная, что мне она не понравится?'
    - Есть ли кто-то, кого ты в жизни ненавидишь?

  Provocation:
    questions:
    - 'You’re in a situation: a fire, you can only save one person. Your mother, your partner, or your child? Who would you choose? Why?'
    - If someone offered you money — enough to wipe out every problem you have and keep you comfortable for life — but you had to leave me and never come back, would you take it?
    - You have a family. You’ve been together for 10 years. You have several kids, a dog, and a big house. You’re happy in the relationship—a harmonious couple that easily handles daily life. But suddenly, you feel an uncontrollable passion for a colleague at work. You could sleep with them and satisfy your “hunger,” and your partner would never know. Would you do it? Why?
    - 'Your partner fully supports you financially; you have no money problems. You’re in a great relationship: you travel, spend all your free time together, plan kids, or already have them. But you find out your partner installed a hidden camera in your bedroom and recorded you during sex, then sold the footage with your face blurred. That’s how they’ve been making money. What would you do?'
    - 'You’ve been together for a long time. Everything’s good, you’re happy. But suddenly, your partner changes dramatically: they gain a lot of weight, lose a lot of weight, get a face tattoo, etc. How would you react? Are you ready to accept your partner in any form?'
    - If your mother, or whoever you look up to most, didn’t like me, would you fight for us?
    - You find out your partner cheated on you with someone of their gender. What’s your reaction?
    - Your partner keeps a personal diary where they write their most passionate sexual fantasies about a specific person from the past, a colleague, a friend, etc. You accidentally find it. What’s your reaction?
    - What do you know about me that could hurt me or be used against me?
    - If the police picked me up, what do you think it would be for?
    - You’re in a happy marriage with kids, but you notice money disappearing from the family budget. Then you find out your partner is regularly gambling at a casino and losing large sums. They don’t plan to stop. What would you do? Would you accept it or end the relationship despite the love, harmony, and kids?
    - When do you feel like the odd one out next to me?
    - Your shared child catches you and your partner during sex. What would you do? How would you explain it to the child?
    - Could you tell me about cheating, or about anything that would truly hurt me, knowing I’d be angry with you and might even end the relationship?
    - If you had to choose — buy, give, or do something only for your mother or only for me — who would you pick?
    - You took your partner’s laptop to look at photos but accidentally found a folder with videos of them masturbating. What’s your reaction, and what would you do next?
    - You overhear your partner discussing all your intimate details with friends—from size, sounds you make in bed, how you undress, every mole on your body, to how you orgasm. What’s your reaction?
    - You find out your partner is having a virtual affair—texting with someone from another continent, never meeting in person. They have phone sex and nothing more. What would you do? Do you consider it cheating?
    - If you find out your partner committed a crime, would you report it? Explain your stance.
    - How is the hierarchy arranged in your family between children, partner, parents, friends, and close relatives? Who sits where, if 1 is the most important and the rest go down from there?
    - You and your partner love each other. They tell you they’re going on a business trip, but you find out it was a vacation with friends, and they used prostitutes. What’s your reaction?
    - If you’re long married and your partner suddenly says they’ve realized they’re more attracted to people of their own gender, but they don’t want to lose the relationship and love you as a dear person while wanting to fulfill their desires with others, how would you react? Would you want a divorce or accept an open relationship?
    - If someone harasses your partner in a deserted place and you realize the odds are against you, but you still have a chance to protect yourself, what would you do?
    - If your partner suddenly admits they’re critically addicted to drugs, what would you do?
    - You have a great relationship. One partner goes on vacation with friends. You learn everyone else in the group cheated on their partners during the trip, but your partner swears they didn’t. Would you believe them or the words and evidence of others?
    - If your partner is accused of a crime and says they didn’t do it, but all evidence points to them, would you believe them or the seemingly valid evidence?
    - If you find out your partner has a hobby of nude photography with a photographer of the opposite sex, and they say there’s nothing between them, would you believe it? Could you accept it?
    - If you learn your partner was sexually assaulted during your relationship but couldn’t tell you right away, what’s your reaction?
    - If your partner, after years of a happy relationship, admits they abandoned their child—in an orphanage or before/after birth—what’s your reaction?
    - If your partner, after years of a happy relationship, admits they still love their ex but also love you, what’s your reaction?
    - If you could do absolutely anything knowing no one would judge you for it, even break the law, what would you do?
    - When you break a promise, do you always apologise, or do you act like it never happened?
    - If you had to choose between lying to me to protect yourself and telling me a truth you know I won’t like, which would you do?
    - Is there anyone in your life you truly hate?

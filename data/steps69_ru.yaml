# Территория искушения 18+: 69 ступеней.
#
# Порталы объявлены здесь и только здесь: клетка-стрела и клетка-змея несут
# поле `to`, а steps69.py собирает из них таблицы LADDERS и SNAKES. Держать
# связи внутри клеток, а не отдельным списком, значит, что переписать клетку
# и забыть про её переход невозможно.
#
# Длинных тире в файле нет: карточка набирается крупно на узкую меру.
title: "Территория искушения"
subtitle: "69 ступеней"
age: "18+"

blocks:
  - id: awakening
    title: "Пробуждение"
    subtitle: "Вуаль нежности"
    first: 1
    last: 15
  - id: exploration
    title: "Исследование"
    subtitle: "Ритмы сближения"
    first: 16
    last: 35
  - id: temptation
    title: "Искушение"
    subtitle: "Огонь и власть"
    first: 36
    last: 55
  - id: samadhi
    title: "Самадхи"
    subtitle: "Растворение в вечности"
    first: 56
    last: 69

system:
  ladder: "Искушение ведёт вас глубже..."
  snake: "Слишком быстро. Вернитесь к истокам."
  joker: "Джокер. Карты не знали, что так бывает."
  milestone: "Скажите друг другу одну вещь, которая возбуждает вас прямо сейчас. Одну. Вслух."
  secret_locked: "Секрет. Держи палец на карте, чтобы прочитать."
  waiting: "Ход партнёра. Смотри."
  finished: "Игра окончена. Кубик больше не бросают."

# Что видит партнёр, пока секретное задание читает не он. У каждой секретной
# клетки своя строка: задание уникально для каждого игрока, и тот, кто ждёт,
# должен получить не пустой экран, а свою половину игры.
finale:
  title: "Самадхи"
  intro: "Теперь забудьте об игре. Есть только ваше удовольствие. Выберите, как вы дойдёте до конца."
  choices:
    - id: sync
      title: "Синхронный взрыв"
      text: >-
        Лицом к лицу, глаза в глаза. Двигайтесь в одном ритме и говорите вслух,
        насколько близко каждый из вас. Задача одна: поймать общий момент и
        отпустить себя одновременно. Не останавливайтесь, пока оба не вскрикнете.
    - id: taking_turns
      title: "По очереди"
      text: >-
        Сначала один полностью отдаёт, второй полностью принимает. Никакой
        взаимности в эту минуту: тот, кто принимает, не делает ничего, только
        чувствует. Потом меняетесь. Каждый доводит другого до конца так, как
        тот попросит вслух.
  outro: "Вы прошли этот путь. Ваша близость стала на 69 ступеней крепче. Повторим?"

# Задания Джокера. Их нет на основной карте: Джокер выдаёт то, чего пара не
# могла увидеть, проходя поле по порядку. Три набора по этапам игры, плюс
# правило темпа в steps69.py, которое умеет замедлить слишком быструю пару
# нежным заданием из первого набора.
jokers:
  tender:
    - id: j_silence
      title: "Тихий плен"
      text: >-
        Следующие три хода запрещены слова. Только полувздохи, взгляды и
        руки. Всё, что захочется сказать, придётся показать.
    - id: j_three_places
      title: "Три места"
      text: >-
        Назови три части тела партнёра, которые хочешь поцеловать прямо
        сейчас. Потом поцелуй каждую так долго, чтобы он забыл про счёт.
    - id: j_feet
      title: "Пять минут внизу"
      text: >-
        Массаж стоп с маслом, пять минут по таймеру. Медленно, с нажимом,
        от пятки к пальцам. Смотри в глаза, а не на руки.
    - id: j_slow_hands
      title: "Сладкая пытка"
      text: >-
        Найди три точки на теле, которые сегодня ещё не получали внимания.
        Подари каждой ровно минуту. Ни секундой меньше.
    - id: j_blind_texture
      title: "Пять фактур"
      text: >-
        Один закрывает глаза. Второй касается его пятью разными фактурами:
        волосами, губами, кончиком носа, подушечками пальцев и выдохом.
        Угадывать вслух не обязательно, вздрагивать обязательно.
  drive:
    - id: j_swap_power
      title: "Смена ролей"
      text: >-
        Тот, кто обычно ведомый, забирает власть на пятнадцать минут.
        Второй не спорит и не помогает. Только подчиняется и смотрит.
    - id: j_object
      title: "Искушение предметом"
      text: >-
        Любой предмет в комнате становится продолжением твоих рук: ткань,
        лёд, помада, ремень. Три минуты им, и ни разу ладонью.
    - id: j_mirror_sounds
      title: "Эхо"
      text: >-
        Попробуй повторить звуки, которые издаёт партнёр, когда ему хорошо.
        Пусть он оценит точность вслух и покажет, где ты ошибся.
    - id: j_lipstick
      title: "След"
      text: >-
        Помадой оставь след в самом неожиданном месте на теле партнёра.
        Он не смотрит, пока ты не закончишь.
    - id: j_narrate
      title: "Комментатор"
      text: >-
        Пять минут ты только описываешь вслух, что делаешь и что видишь.
        Руки работают, голос низкий, ни одной паузы.
  ecstasy:
    - id: j_edge_once
      title: "На краю"
      text: >-
        Доведи партнёра до самой грани и остановись. Смотри в глаза, пока
        он не попросит продолжения вслух. Только тогда продолжай.
    - id: j_hands_behind
      title: "Руки за спиной"
      text: >-
        Твои руки за спиной. Партнёр ласкает себя сам, а ты шёпотом
        описываешь, как это выглядит. Ни одного прикосновения.
    - id: j_hundred
      title: "Сто"
      text: >-
        Сто движений в максимальном темпе, вслух со счётом. На сотом
        замрите оба и не двигайтесь двадцать секунд.
    - id: j_best_moment
      title: "Признание"
      text: >-
        Скажи вслух, в какой момент за сегодня тебе было лучше всего. Точное
        место на теле, точное движение. Партнёр повторит это прямо сейчас и
        не остановится, пока ты не попросишь.
    - id: j_dirty_line
      title: "Та самая фраза"
      text: >-
        Скажи партнёру на ухо самое откровенное предложение, которое ты
        когда-либо боялся озвучить. Целиком, без смягчений.

cells:
  # ---------------- Блок 1: Пробуждение (1-15) ----------------
  - id: 1
    kind: start
    title: "Сердечный резонанс"
    text: >-
      Положи ладонь на обнажённое сердце партнёра. Закрой глаза. Подстройте
      вдохи под ритм ударов друг друга и держите две минуты, пока не
      покажется, что дышите одним телом.
  - id: 2
    kind: step
    title: "Линии желания"
    text: >-
      Кончиками пальцев, почти не касаясь, очерти контуры лица, губ и
      ключиц. Взгляд томный, следящий за каждым движением твоей руки.
  - id: 3
    kind: step
    title: "Дыхание атласа"
    text: >-
      Приблизь губы к пульсирующей вене на шее. Не касайся. Просто согревай
      её жарким дыханием, пока партнёр не вздрогнет от ожидания.
  - id: 4
    kind: ladder
    to: 18
    title: "Электрический разряд"
    text: >-
      Ваше притяжение опасно для этой спокойной зоны. Здесь вам делать
      нечего.
  - id: 5
    kind: secret
    title: "Линия челюсти"
    text: "Секретное задание. Читает только тот, чей ход."
    secret: >-
      Медленно проведи влажным кончиком языка по линии челюсти от уха до
      подбородка. Задержись у губ и не целуй. Прошепчи: «Я чувствую, как ты
      меня хочешь».
    partner: "Закрой глаза и запрокинь голову. Дальше не твоя забота."
  - id: 6
    kind: step
    title: "Магия дистанции"
    text: >-
      Переместитесь на диван. Сядьте так близко, чтобы чувствовать жар кожи,
      но не соприкасаться. Смотрите друг другу в зрачки, пока воздух между
      вами не станет густым.
  - id: 7
    kind: step
    title: "Обожание изъянов"
    text: >-
      Найди место, которое партнёр считает своей слабостью. Покрой его серией
      бесконечно долгих влажных поцелуев. Взгляд снизу вверх, полный
      восхищения.
  - id: 8
    kind: step
    title: "Плетение пальцев"
    text: >-
      Сплетите ладони. Медленно сжимай и разжимай пальцы партнёра в ритме
      своего пульса. Это ваш негласный договор о том, что будет дальше.
  - id: 9
    kind: joker
    title: "Джокер"
    text: "Карта не из колоды. Что выпадет, зависит от того, как вы идёте."
  - id: 10
    kind: step
    title: "Зеркальный соблазн"
    text: >-
      У зеркала. Обними партнёра сзади и начни ласкать плечи, не отрывая
      взгляда от его глаз в отражении. Медленно, тягуче.
  - id: 11
    kind: step
    title: "Сенсорная тайна"
    text: >-
      Один закрывает глаза. Второй касается его пятью разными способами:
      волосами, губами, кончиком носа, подушечками пальцев и лёгким выдохом.
  - id: 12
    kind: step
    title: "Бархатный путь"
    text: >-
      Поцелуи внутренней стороны бёдер. Темп: один поцелуй в три секунды.
      Каждый следующий на миллиметр ближе к запретной зоне.
  - id: 13
    kind: snake
    to: 2
    title: "Нежная пауза"
    text: "Огонь слишком силён для этой ступени. Вернитесь к истокам."
  - id: 14
    kind: secret
    title: "Только губы"
    text: "Секретное задание. Читает только тот, чей ход."
    secret: >-
      Используй только губы и зубы, чтобы избавить партнёра от одной детали
      одежды. Глаза в глаза. Медленно, дразняще.
    partner: "Стой смирно и держи руки за спиной. Помогать нельзя."
  - id: 15
    kind: step
    title: "Разоблачение"
    text: >-
      Снимите бельё. Никакой спешки. Изучай взглядом каждое изменение кожи
      партнёра, будто видишь это впервые в жизни.

  # ---------------- Блок 2: Исследование (16-35) ----------------
  - id: 16
    kind: step
    title: "Объятия изумруда"
    text: >-
      Поза «ложка», лёжа на боку. Темп медленный, вкрадчивый. Рука ласкает
      грудь или живот партнёра, дыхание в затылок, тяжёлое и влажное.
  - id: 17
    kind: step
    title: "Мерцающий лёд"
    text: >-
      Очерти кубиком льда контуры тела. Сразу после холода согревай это место
      горячим языком. Взгляд следит за каждой каплей воды.
  - id: 18
    kind: step
    title: "Эротическая соната"
    text: >-
      Медленный стриптиз под одну песню. Не отрывай взгляда от глаз партнёра
      ни на секунду, пока ткань скользит по твоей коже.
  - id: 19
    kind: step
    title: "Шёлковый позвоночник"
    text: >-
      Дорожка из поцелуев от копчика до затылка. Темп пульсирующий. При
      каждом касании задерживайся, вдыхая аромат кожи.
  - id: 20
    kind: step
    title: "Хмельной поцелуй"
    text: >-
      Глоток вина или сока. Передай его через глубокий поцелуй. Языки
      переплетаются медленно, пробуя вкус друг друга.
  - id: 21
    kind: step
    title: "Танец лотоса"
    text: >-
      Сидя лицом к лицу, ноги обхватывают партнёра. Темп минимальный, почти
      неподвижный. Главное здесь ваши взгляды и руки, блуждающие по спинам.
  - id: 22
    kind: ladder
    to: 40
    title: "Глубокий резонанс"
    text: >-
      Вы сумели двигаться как единый организм. Такое не остаётся без
      награды.
  - id: 23
    kind: secret
    title: "Волосы"
    text: "Секретное задание. Читает только тот, чей ход."
    secret: >-
      Пощекочи интимные зоны партнёра своими волосами. Смотри, как его тело
      выгибается навстречу, и не ускоряйся, пока он не попросит.
    partner: "Лежи и не двигайся. Всё, что можно, это дышать."
  - id: 24
    kind: step
    title: "Алтарь страсти"
    text: >-
      На столе или комоде. Твоё лицо на уровне лица партнёра. Интенсивные
      поцелуи перемежаются с глубокими властными движениями.
  - id: 25
    kind: step
    title: "Жемчужная ракушка"
    text: >-
      Ноги партнёра прижаты к груди. Темп ритмичный, нарастающий. Взгляд
      направлен прямо в центр вашего удовольствия.
  - id: 26
    kind: secret
    title: "Лёд по контуру"
    text: "Секретное задание. Читает только тот, чей ход."
    secret: >-
      Возьми кубик льда и медленно обведи контуры сосков партнёра. Потом
      согрей то же место ртом. Чередуй, пока лёд не растает целиком.
    partner: "Тебе будет холодно. Потом очень тепло. Не открывай глаза."
  - id: 27
    kind: step
    title: "Шарфовый плен"
    text: >-
      Зафиксируй руки партнёра над головой шарфом или ремнём. Темп ласк
      непредсказуемый. Целуй там, где партнёр меньше всего ждёт в эту секунду.
  - id: 28
    kind: step
    title: "Властительница"
    text: >-
      Она сверху. Её взгляд сверху вниз, доминирующий. Темп то медленный и
      глубокий, то дразнящий и поверхностный.
  - id: 29
    kind: joker
    title: "Джокер"
    text: "Карта не из колоды. Что выпадет, зависит от того, как вы идёте."
  - id: 30
    kind: secret
    title: "Три минуты власти"
    text: "Секретное задание. Читает только тот, чей ход."
    secret: >-
      Завяжи партнёру глаза. У тебя есть три минуты, чтобы делать с ним всё,
      что угодно, кроме прямого контакта с гениталиями. Отсчитывай вслух
      последние десять секунд.
    partner: "Три минуты ты не видишь ничего и не решаешь ничего."
  - id: 31
    kind: step
    title: "Смена темпа"
    text: >-
      Десять стремительных яростных движений, потом десять таких медленных,
      будто вы движетесь в меду. Взгляд немигающий.
  - id: 32
    kind: step
    title: "Инстинкт"
    text: >-
      Сзади. Темп животный, уверенный. Твои руки на бёдрах партнёра сжимаются
      крепче с каждым движением.
  - id: 33
    kind: step
    title: "Масляное скольжение"
    text: >-
      Массаж всего тела с маслом. Каждое движение рук длинное, от лодыжек до
      плеч. Кожа должна гореть от трения.
  - id: 34
    kind: secret
    title: "Плечо"
    text: "Секретное задание. Читает только тот, чей ход."
    secret: >-
      Слегка прикуси плечо партнёра, одновременно ускоряя темп там, где
      сейчас сосредоточено всё тепло. Отпусти, только когда он выдохнет.
    partner: "Сейчас будет резко. Не сдерживай звук."
  - id: 35
    kind: snake
    to: 20
    title: "Возвращение к нежности"
    text: "Слишком горячо для этой глубины. Остыньте вместе."

  # ---------------- Блок 3: Искушение (36-55) ----------------
  - id: 36
    kind: step
    title: "Спасение у стены"
    text: >-
      Вертикально, у стены. Взгляд в упор, темп быстрый и сильный. Твои руки
      удерживают партнёра, не давая ему ни шанса отстраниться.
  - id: 37
    kind: step
    title: "Тихая покорность"
    text: >-
      Один ведёт, второй подчиняется. Ведущий выбирает темп и направление
      взглядов. Никаких слов, только приказы телом.
  - id: 38
    kind: step
    title: "Изумрудный угол"
    text: >-
      Одна нога партнёра на твоём плече. Темп глубокий, проникающий. Смотри,
      как меняется его лицо при каждом твоём движении.
  - id: 39
    kind: secret
    title: "Круг"
    text: "Секретное задание. Читает только тот, чей ход."
    secret: >-
      Возьми лёд в рот и ласкай партнёра языком по кругу, не выпуская его.
      Следи за тем, как сбивается дыхание, и подстраивай темп под него.
    partner: "Дыши глубже. Дальше будет сложно дышать ровно."
  - id: 40
    kind: step
    title: "Точка силы"
    text: >-
      Смена ролей. Теперь ты огонь, а партнёр твоё топливо. Меняй темп по
      своему желанию, глядя в глаза с вызовом.
  - id: 41
    kind: step
    title: "Предел открытости"
    text: >-
      На краю кровати, ноги партнёра разведены и подняты. Взгляд на всё тело
      целиком. Темп широкий, размашистый, уверенный.
  - id: 42
    kind: ladder
    to: 60
    title: "Предчувствие"
    text: "Вы на грани. Держаться дальше нет смысла."
  - id: 43
    kind: step
    title: "Изысканное ожидание"
    text: >-
      Ласкай всё, кроме самого интимного. Темп порхающий. Взгляд
      многообещающий, обещающий всё чуть позже.
  - id: 44
    kind: step
    title: "Шёпот воды"
    text: >-
      В душе или с мокрым полотенцем. Скольжение воды по коже добавляет темпу
      плавности. Взгляд сквозь капли.
  - id: 45
    kind: secret
    title: "Связанные руки"
    text: "Секретное задание. Читает только тот, чей ход."
    secret: >-
      Свяжи руки партнёра ремнём или шарфом. Дальше он может только смотреть
      на то, что ты делаешь, и говорить. Развяжи, когда сам решишь.
    partner: "Ты не будешь ничего решать. Скажи стоп-слово сейчас, на всякий случай."
  - id: 46
    kind: step
    title: "Загадка спины"
    text: >-
      Она спиной к нему, сверху. Темп волнообразный. Он ласкает её спину и
      ягодицы, впиваясь взглядом в изгибы.
  - id: 47
    kind: step
    title: "Пульс музыки"
    text: >-
      Включите что-нибудь с тяжёлым низом и двигайтесь телами точно под ритм.
      Темп четкий, гипнотический. Никаких лишних движений.
  - id: 48
    kind: secret
    title: "Смотри"
    text: "Секретное задание. Читает только тот, чей ход."
    secret: >-
      Остановись. Пусть партнёр сам доведёт себя до предела, а ты только
      смотри и не касайся. В последний момент перехвати инициативу.
    partner: "Сделай это сам. Он будет смотреть и не поможет."
  - id: 49
    kind: step
    title: "Переплетение"
    text: >-
      Перпендикулярно друг другу, ноги переплетены. Темп трущийся,
      дразнящий. Взгляд на профиль партнёра, на закушенные губы.
  - id: 50
    kind: joker
    title: "Джокер"
    text: "Карта не из колоды. Что выпадет, зависит от того, как вы идёте."
  - id: 51
    kind: step
    title: "Язык-соблазнитель"
    text: >-
      От пупка к бёдрам, медленными кругами, без единого прямого касания.
      Взгляд партнёра сверху на твою голову, на твои старания.
  - id: 52
    kind: step
    title: "Твёрдость земли"
    text: >-
      На полу, без подушек и одеял. Темп жёсткий, страстный. Минимум
      нежности, максимум первобытной тяги.
  - id: 53
    kind: step
    title: "Гравитация любви"
    text: >-
      На руках, прижав к себе, стоя или на коленях. Темп покачивающийся.
      Держи партнёра крепко, глядя прямо в глаза.
  - id: 54
    kind: secret
    title: "След на шее"
    text: "Секретное задание. Читает только тот, чей ход."
    secret: >-
      Оставь лёгкий след поцелуя на шее партнёра, там, где завтра его будет
      видно. Темп в этот момент должен замереть полностью.
    partner: "Завтра тебе будет что вспомнить в зеркале."
  - id: 55
    kind: snake
    to: 38
    title: "Ожидание экстаза"
    text: "Перегрев. Замедлитесь, чтобы прочувствовать момент."

  # ---------------- Блок 4: Самадхи (56-69) ----------------
  - id: 56
    kind: step
    title: "Баланс на грани"
    text: >-
      Темп нарастает до максимума, и стоп. Полная неподвижность, взгляд в
      упор, пока оба не задрожите от напряжения. Три повтора.
  - id: 57
    kind: step
    title: "Единство"
    text: >-
      Сплетение тел, руки и ноги переплетены полностью. Темп мелкий,
      дрожащий. Взгляд затуманенный, направленный внутрь себя и партнёра
      одновременно.
  - id: 58
    kind: secret
    title: "Шестьдесят девять"
    text: "Секретное задание. Читает только тот, чей ход."
    secret: >-
      Поза «69». Темп ласк языком синхронный: делай ровно то, что делают с
      тобой. Задача не довести до финала, только дразнить.
    partner: "Повторяй за ним в точности. Это и есть правило."
  - id: 59
    kind: step
    title: "Общее дыхание"
    text: >-
      Рот в рот. Вдыхай воздух, который выдыхает партнёр. Темп глубокий,
      мощный. Взглядов нет, только ощущения.
  - id: 60
    kind: step
    title: "Выбор пути"
    text: >-
      Короткая пауза. Выберите позу для финала вслух. Последний осознанный
      взгляд перед тем, как разум отключится.
  - id: 61
    kind: step
    title: "Вершина страсти"
    text: >-
      Подушка под бёдра, максимальный угол. Темп ускоряющийся,
      неотвратимый. Твои руки крепко держат бёдра партнёра.
  - id: 62
    kind: secret
    title: "Вслух"
    text: "Секретное задание. Читает только тот, чей ход."
    secret: >-
      Описывай вслух каждое своё ощущение, не останавливаясь ни на секунду.
      Голос хриплый, темп бешеный. Замолчать нельзя.
    partner: "Слушай и не отвечай. Просто слушай."
  - id: 63
    kind: step
    title: "Лавина чувств"
    text: >-
      Используй губы, руки и тело одновременно. Темп хаотичный и прекрасный.
      Ни одного повторяющегося движения.
  - id: 64
    kind: step
    title: "Классика наслаждения"
    text: >-
      Подушка под тазом, лицом к лицу. Взгляд глаза в глаза. Темп самый
      родной и глубокий из всех, что у вас были.
  - id: 65
    kind: ladder
    to: 68
    title: "Врата рая"
    text: "Остался один шаг. Не растягивайте его."
  - id: 66
    kind: secret
    title: "Имя"
    text: "Секретное задание. Читает только тот, чей ход."
    secret: >-
      В момент самого острого ощущения громко произнеси имя партнёра. Не
      стон, не слово. Имя, целиком.
    partner: "Сейчас ты услышишь своё имя. Запомни, как это звучало."
  - id: 67
    kind: step
    title: "Последняя сотня"
    text: >-
      Сто движений в максимальном темпе. Никакой жалости к простыням, только
      драйв. Считать вслух не обязательно, но можно.
  - id: 68
    kind: step
    title: "Преддверие"
    text: >-
      Техника края: доведите друг друга до грани и остановитесь. Три раза.
      На четвёртый уже не останавливайтесь.
  - id: 69
    kind: final
    title: "Самадхи"
    text: >-
      Клетка абсолютного наслаждения. Кубик больше не бросают, дальше вы сами.

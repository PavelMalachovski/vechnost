# Russian UI translations
welcome:
  # Новая структурированная приветственная страница
  greeting_title: "💎 VECHNOST"
  greeting_subtitle: "Когда слова заканчиваются - начинается VECHNOST. Не терапия, не тренинг - просто игра, после которой вы ближе, чем когда-либо."

  # Секции (как на скриншоте)
  section_connection_title: "💕 СВЯЗЬ"
  section_connection_text: "Одна игра - и то, чего не хватало, возможно, годами, приходит в вашу жизнь. Настоящая близость, искра и страсть. Вопросы VECHNOST раскрывают души, ломают барьеры привычных разговоров и создают то, ради чего всё начиналось - связь, которую чувствуешь душой."

  section_intimacy_title: "🔥 БЛИЗОСТЬ"
  section_intimacy_text: "Сложно говорить о желаниях, о чувствах, страхах? VECHNOST - это безопасное пространство, где можно быть собой. Без неловкости, табу и навязаных ролей. Здесь вы сможете открыться, услышать и быть услышанными. Фантазии, тайные мысли, смех и нежность - всё будет в VECHNOST."

  section_themes_title: "🎭 4 КОЛОДЫ"
  section_themes_text: "Каждая из них — ключ к новому уровню ваших отношений:\n• Знакомство — идеально для первых встреч и игр с симпатией и флиртом.\n• Для пар — чтобы вернуть глубину, интерес и тепло, создать настоящую близость.\n• Секс — для откровений, желаний и действий, которые сближают и разжигают настоящую страсть.\n• Провокации — для тех, кто хочет встряхнуть привычные разговоры и испытать новые эмоции."

  section_best_title: "🌟 ИСКУССТВО БЛИЗОСТИ"
  section_best_text: "VECHNOST — не просто игра. Это ритуал соединения. Здесь вы заглядываете в сердце друг друга, узнаёте, что скрыто за привычными словами, и позволяете отношениям раскрыться по-новому. Каждый вопрос - как маленькое приключение, где страсть, честность и доверие сплетаются в нечто большее. Позвольте себе почувствовать настоящую близость."

  # Кнопки
  button_start: "ВОЙТИ В VECHNOST ←"
  button_webapp: "🎮 ИГРАТЬ В ПРИЛОЖЕНИИ"
  button_library: "📚 БИБЛИОТЕКА"
  button_inside: "ЧТО ТЕБЯ ЖДЁТ ВНУТРИ?"
  button_why: "ПОЧЕМУ ЭТО РАБОТАЕТ?"

  # Дополнительные экраны
  inside_title: "💌 ЧТО ВАС ЖДЁТ В VECHNOST?"
  inside_text: "📋 <b>Сотни вопросов и заданий</b>\n• От лёгких и забавных до смелых и глубоких.\n• Каждая карточка - возможность узнать друг друга заново.\n• Задания не только заставляют говорить, но и действовать - создавать живые эмоции.\n• Новые вопросы регулярно добавляются - VECHNOST действительно вечна.\n\n🎭 <b>Четыре направления для любых отношений</b>\n• Знакомство — лёгкий флирт и первые искры\n• Для пар — укрепление связи и взаимопонимания\n• Секс — пространство откровенности и страсти\n• Провокации — смелые темы, неожиданные открытия\n\n🔒 <b>Полная приватность</b>\nВаши ответы остаются только между вами.\nПолная свобода быть честными. Без фильтров и без ожиданий.\n\n💬 <b>Безопасное пространство для откровений</b>\nГоворите о том, что обычно остаётся в тени.\nПонимайте, чувствуйте, приближайтесь.\n\n✨ <b>Игра, которая растёт вместе с вами</b>\nВозвращайтесь к ней снова и снова.\nКаждый раз - новые эмоции, новые темы, новое «мы».\nПодходит как для тех, кто только строит связь, так и для тех, кто хочет вернуть огонь в долгие отношения."

  why_title: "💡 ПОЧЕМУ ЭТО РАБОТАЕТ?"
  why_text: "✅ <b>Продуманная структура</b>\nВопросы выстроены так, чтобы мягко вести от лёгкости к глубине.\nБез давления. Без дискомфорта. Только естественное сближение.\n\n✅ <b>Вы выбираете темп</b>\nНачните с лёгкого флирта — и переходите к темам, где открываются настоящие чувства.\n\n✅ <b>Без обязательств — только желание быть ближе</b>\nПросто выбирайте то, что откликается именно вам.\n\n✅ <b>Подходит для любых пар</b>\n• Новые пары — смогут узнать друг друга глубже, быстрее и честнее\n• Долгие отношения — вернут эмоции, лёгкость и страсть\n• Пары в кризисе — создадут новые мосты там, где раньше были стены\n\n💬 <b>Разговоры, которые меняют отношения</b>\nКаждый вопрос — это не просто тема. Это дверь в мир доверия и близости.\nVECHNOST помогает не только говорить, но слышать.\nНе просто быть рядом, но и чувствовать друг друга"
  button_back: "← Назад"

  # Сообщение после оплаты
  enter_title: "💫 ВОЙТИ В VECHNOST"
  enter_text: "Позвольте себе роскошь быть ближе.\nСделайте шаг к искренности, страсти и настоящему взаимопониманию.\nVECHNOST — не просто игра, это инвестиция в ваши отношения, которая возвращает любовь.\nПотому что настоящая любовь не появляется случайно.\nЕё создают шаг за шагом. В игре, где сердца открываются сами."

  # Старая версия (на случай, если используется где-то еще)
  welcome_message: "💕 Добро пожаловать в VECHNOST\n\nИгра для пар, созданная, чтобы:\n• Узнать друг друга по-настоящему\n• Выйти за рамки обыденности\n• Открыть новые грани себя и партнёра\n\nВыберите колоду — и откройте свой мир близости:\n\n✨ Знакомство — лёгкость и флирт\n♥️ Для пар — глубина и тепло\n❤️‍🔥 Провокации — неожиданное и чувственное\n🔥 Секс — смелость, доверие, страсть"


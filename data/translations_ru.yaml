  # someone who knows their own. Say so, and that /delete_me erases
  # everything.
  feature_privacy_desc: "Партнёр не видит ваших ответов в тесте: только общий результат и вопросы, где вы ответили по-разному. Удалить всё о себе можно командой /delete_me"


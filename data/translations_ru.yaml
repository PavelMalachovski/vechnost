  step2: "2️⃣ Выберите уровень сложности"
  step3: "3️⃣ Отвечайте на вопросы по очереди, делайте практики, играйте для вдохновения"
  step4: "4️⃣ Обсуждайте ответы друг с другом"

  perfect_for: "💕 Идеально для:"

# Рассылка. Видит только админ из ADMIN_IDS, поэтому текст служебный.
privacy:
  ask: "🗑 Удалить все ваши данные из VECHNOST?\n\nИсчезнут профиль, доступ, настройки рассылки, а также комнаты, тесты совместимости и доски «69 ступеней», в которых вы участвуете. Запись у пары одна на двоих, поэтому у партнёра они пропадут тоже.\n\nОплаченный доступ не восстановится: покупку или сертификат придётся оформлять заново. Отменить это будет нельзя.\n\nЕсли у вас есть подписка в Tribute, отмените её там: удаление данных не останавливает списания."
  confirm_button: "🗑 Да, удалить всё"
  cancel_button: "Оставить"
  cancelled: "Ничего не удалено."
  done: "Готово. Ваши данные удалены. Если захотите вернуться – /start."
  nothing: "О вас ничего не записано."
  error: "Не получилось удалить данные. Попробуйте позже или напишите в поддержку."

broadcast:
  ask: "Пришлите сообщение для рассылки: текст, фото, видео, голосовое, кружок – что угодно.\nПокажу превью перед отправкой.\n\nОтмена – /cancel"
  preview: "⇧ Так это увидят получатели. Всего в базе: {total}.\n\nОтправляем?"
  send_button: "✅ Отправить всем"
  cancel_button: "❌ Отмена"
  cancelled: "Рассылка отменена."
  nothing_to_cancel: "Сейчас нечего отменять."
  started: "⏳ Рассылка запущена…"
  progress: "⏳ Рассылка идёт: {done} из {total}…"
  stale: "Превью устарело: бот перезапускался и черновик не сохранился. Пришлите сообщение заново – /broadcast"
  error: "Не получается прочитать список получателей. Рассылка не запущена, попробуйте позже."
  open_app_button: "Открыть VECHNOST"
  report_title: "✅ Рассылка завершена."
  report_total: "Всего в базе: {total}"
  report_sent: "Доставлено: {sent}"
  report_blocked: "Заблокировали бота или удалились: {blocked}"
  report_failed: "Не доставлено из-за ошибок: {failed}"
  report_ids: "ID с ошибкой: {ids}\nИм можно написать вручную."

invite:
  s69_title: "Вас зовут в игру «69 ступеней» 🔥"
  compat_title: "Вас зовут пройти тест совместимости 💞"
  coop_title: "Вас зовут сыграть в VECHNOST вдвоём 💜"
  hint: "Нажмите кнопку ниже, и приложение откроется сразу на нужном месте."
  s69_button: "🎲 Войти в игру"
  compat_button: "💞 Начать тест"
  coop_button: "🎴 Открыть колоду"

# «Уже пришли по вашим приглашениям» считает и ссылку ref_, и приглашения в
# игры: партнёр-новичок, севший в комнату, тест или «69» по ссылке, засчитан
# пригласившему (payments/partners.py), но скидки не получает.
referral:
  welcome: "Вас пригласили в VECHNOST, и вам полагается скидка {percent}% на полный доступ. Она уже применена: просто откройте оплату, когда будете готовы."
  welcome_no_discount: "Вас пригласили в VECHNOST. Добро пожаловать – выбирайте колоду и играйте вместе."
  invite: "Ваша ссылка-приглашение:\n{link}\n\nКто откроет бота по ней, получит скидку {percent}% на полный доступ.\nУже пришли по вашим приглашениям: {invited}"
  invite_no_discount: "Ваша ссылка-приглашение:\n{link}\n\nУже пришли по вашим приглашениям: {invited}"
  error: "Не получилось собрать ссылку. Попробуйте ещё раз чуть позже."

# Questions excluded from the daily card push (matched by exact RU text).
# Criteria: drugs, death, violence, crime, explicit sexual content,
# heavy infidelity scenarios - fine in the game, wrong as an unsolicited push.
# Editing the source question text removes it from this list automatically
# (it simply stops matching), so re-check after content edits.
exclude:
- Как ты относишься к “легким” наркотикам?
- Что должно было с тобой случиться, чтобы ты перестал(а) верить в то, во что когда-то верил(а) всем сердцем? Что внутри тебя умерло вместе с тем событием?
- Как ты реагируешь на отказ? Совершал(а) ли ты аморальные поступки, например, преследование или навязчивое поведение после расставания? Как ты сейчас к этому относишься?
- Нравится(лось) ли тебе, когда я отправляю интимные фото?
- Остался(ась) бы ты в отношениях, если бы партнёр оказался в инвалидном кресле? Смог(ла) бы ты прожить со мной жизнь, зная, что это не изменится?
- Чего ты боишься в измене? Что для тебя на самом деле измена — предательство тела или предательство души? Боишься ли ты, что тебя обманут, или боишься признать, что сам(а) мог(ла) бы перейти эту границу?
- Делал(а) ли ты когда-нибудь что-то, что было на грани измены в твоём понимании? Что тебя остановило?
- Испытывал ли ты когда-нибудь чувство к другой/другому в наших отношениях?
- Как мы сможем решить ситуацию, если в наших отношениях одному из нас понравится кто-то другой? Стоит ли это решать?
- Что бы ты сделал(а), если скрининг во время беременности покажет патологию плода?
- Простил(а) бы ты измену?
- Если во время родов придётся выбирать — спасать жизнь ребёнку или матери, кого бы ты выбрал(а)?
- Как мы сможем поддержать друг друга в случае смерти близкого человека? Как ты переживаешь такие моменты?
- Боишься ли ты смерти? Ты боишься смерти или боишься прожить жизнь так, будто тебя никогда и не было? Это страх конца или страх впустую потраченного времени?
- Что мы можем сделать друг для друга, чтобы подготовиться к смерти одного из нас? Что для тебя важно в такой ситуации? Что бы ты хотел(а) услышать от меня или сказать мне?
- Считаешь ли ты важным обсудить такие моменты, как завещание или медицинская страховка? Если бы ты оказался(ась) на аппарате жизнеобеспечения, ты бы хотел(а) его отключить или сохранить поддержание жизни?
- 'Ты оказался(ась) в ситуации: пожар, нужно спасти кого-то. Мать, партнера или вашего ребёнка? Кого ты выберешь? Почему?'
- Твой партнёр любит тебя так сильно, что даже плачет. Он готов сделать для тебя всё, но ему не хватает «разнообразия» в отношениях. Он/она хочет пригласить третьего/третью, которых ты знаешь. Какие будут твои действия? Что ты думаешь о свободных отношениях?
- У вас есть семья. Вы живёте вместе уже 10 лет. У вас несколько детей, собака и большой дом. Вы счастливы в отношениях — гармоничная пара, которая с лёгкостью справляется с бытом. Но неожиданно у вас возникает страсть к коллеге на работе, и ты не способен(а) это контролировать. Вы можете переспать с ним/ней и утолить свой "голод", при этом твой партнёр не узнает об этом. Сделаешь ли ты это? Почему?
- 'Твой партнёр полностью обеспечивает тебя, у вас нет никаких финансовых проблем. Вы в прекрасных отношениях: путешествуете, проводите всё свободное время вместе, планируете детей или уже их имеете. Но вдруг ты узнаёшь, что партнёр устанавливал скрытую камеру в вашей спальне и включал её во время секса. Затем он(а) продавал(а) эти записи с замазанным лицом. Таким образом, всё это время он(а) зарабатывал(а) деньги. Твои действия?'
- 'Вы вместе уже много лет: у вас совместные дети, налаженный быт, вы искренне любите и заботитесь друг о друге, понимаете друг друга с полуслова и живёте в идиллии. Но однажды ваш 16-летний ребёнок заболел, и ему потребовалось переливание крови. Оказалось, что никто из родителей не подходит. После дальнейших тестов выяснилось, что ты не отец. Ваш партнёр признаётся: «Однажды, много лет назад, на вечеринке, будучи пьяной, я оступилась. Это был единственный раз. Всё это время я искренне любила только тебя». Твои действия? Сможешь ли ты простить и попытаться сохранить семью, или это станет концом отношений? Если вопрос задаётся девушке — как бы ты призналась об этом? Что бы сказала? Пыталась бы сохранить семью или приняла бы неизбежный исход?'
- Ты узнаёшь, что твой партнёр изменил(а) тебе с человеком своего пола. Какова твоя реакция?
- Твой партнёр ведёт личный дневник, где он/она записывает все свои самые страстные сексуальные фантазии о другом человеке — конкретном из прошлого, коллеге, друге и так далее. Ты случайно находишь этот дневник. Какова твоя реакция?
- Ваш совместный ребёнок застал вас с партнёром во время секса. Какие будут твои действия? Как вы объясните эту ситуацию ребёнку?
- Ты переехал(а) к партнёру в другую страну, на другой континент. Ты полностью зависишь от партнёра финансово, сам(а) не работаешь и не знаешь местного языка. Вдруг ты случайно узнаёшь, что партнёр(ка) тебе изменяет. Какие будут твои дальнейшие действия? С одной стороны, тебя некуда идти, у тебя нет финансов и сбережений, ты полностью зависишь от партнёра. С другой стороны, он(она) изменяет вам и причиняет боль. Сможешь ли ты уйти и как поступишь в этой ситуации?
- Ты взял(а) ноутбук партнёра, чтобы посмотреть фотографии, но случайно нашел(а) целую папку с видео, где он(она) снимает себя во время мастурбации. Какая будет твоя реакция и какие будут дальнейшие действия?
- Ты случайно услышал(а), как партнёр обсуждает все ваши интимные подробности с друзьями — начиная от размеров, звуков, которые ты издаёшь в постели, того, как ты раздеваешься, каждой родинки на теле, и до того, как ты кончаешь. Какова будет твоя реакция?
- Если ты узнаешь, что твой партнер(ка) совершили преступление. Расскажешь ли ты об этом? Объясни свою позицию.
- Вы с партнером(кой) любите друг друга. И он(а) говорит тебе, что едет в командировку, но вскоре ты узнаешь, что это отпуск с друзьями и они воспользовались услугами проституток. Твоя реакция?
- Если вы уже долго в браке и в один момент партнер(ка) приходит и говорит, что он(а) поняла, что его(её) больше привлекают люди своего пола. Он(а) говорит, что не хочет терять ваши отношения и любит тебя, как очень родного человека. Но хочет также удовлетворять свои желания в любви и близости с людьми, которые его(её) привлекают. Как ты отреагируешь? Захочешь развода или сможешь смириться со свободными отношениями?
- Если к твоему партнеру(ев) пристают в безлюдном месте. Ты понимаешь, что силы неравны, но у тебя ещё есть шанс обезопасить себя. Твои действия?
- Если твой партнер(ка) внезапно признается, что зависим(а) от наркотиков в критической стадии. Твои действия?
- У вас прекрасные отношения. Один из партнеров едет в отпуск с друзьями. И ты узнаешь, что все остальные из этой компании изменяли своим партнерам в этой поездке, он(а) клянется, что не делал(а) это. Поверишь ему(ей) или словам и свидетельствам других?
- Если партнера(ку) обвиняют в преступлении. Он(а) говорит, что этого не делал(а), но все факты указывают на это. Поверишь больше ему(ей) или предположительно верным доказательствам?
- Если ты узнаешь, что у партнера(ки) есть хобби фотографироваться голым(ой), фотограф противоположного пола. Он(а) говорит, что у них ничего нет. Поверишь в это? Сможешь ли принять?
- Если ты узнаешь, что твой партнер(ка) подверглись сексуальному насилию во время ваших отношений. Но он(а) не смог(да) рассказать тебе сразу. Твоя реакция?
- Если партнер(ка) после нескольких лет отношений признается, что бросил(а) своего ребенка. Детдом или оставил(а) до/после рождения. Твоя реакция?

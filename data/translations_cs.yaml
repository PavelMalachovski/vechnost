# Czech UI translations
welcome:
  language_prompt: "Vyberte jazyk pro začátek hry"

  # Nová strukturovaná uvítací stránka
  greeting_title: "💎 VECHNOST"
  greeting_subtitle: "Když slova končí - začíná VECHNOST. Ne terapie, ne trénink - jen hra, po které jste blíž než kdy jindy."

  # Sekce (jako na screenshotu)
  section_connection_title: "💕 SPOJENÍ"
  section_connection_text: "Jedna hra - a to, co vám možná roky chybělo, přichází do vašeho života. Skutečná blízkost, jiskra a vášeň. Otázky VECHNOST odhalují duše, boří bariéry obvyklých rozhovorů a vytvářejí to, pro co to všechno začalo - spojení, které cítíte duší."

  section_intimacy_title: "🔥 INTIMITA"
  section_intimacy_text: "Je těžké mluvit o touhách, pocitech, straších? VECHNOST je bezpečný prostor, kde můžete být sami sebou. Bez trapnosti, tabu a vnucených rolí. Zde se můžete otevřít, slyšet a být slyšeni. Fantazie, tajné myšlenky, smích a něha - vše bude ve VECHNOST."

  section_themes_title: "🎭 4 BALÍČKY"
  section_themes_text: "Každý z nich je klíčem k nové úrovni vašeho vztahu:\n• Seznámení - ideální pro první setkání a hry s přitažlivostí a flirtováním.\n• Pro páry - pro navrácení hloubky, zájmu a tepla, vytvoření skutečné blízkosti.\n• Sex - pro odhalení, touhy a akce, které vás sbližují a zažehují skutečnou vášeň.\n• Provokace - pro ty, kteří chtějí otřást obvyklými rozhovory a zažít nové emoce."

  section_best_title: "🌟 UMĚNÍ BLÍZKOSTI"
  section_best_text: "VECHNOST není jen hra. Je to rituál spojení. Zde nahlížíte do srdcí druhého, objevujete, co se skrývá za obvyklými slovy, a dovolujete vztahu, aby se otevřel novými způsoby. Každá otázka je jako malé dobrodružství, kde se vášeň, upřímnost a důvěra proplétají v něco většího. Dovolte si pocítit skutečnou blízkost."

  # Tlačítka
  button_start: "VSTOUPIT DO VECHNOST ←"
  button_webapp: "🎮 HRÁT V APLIKACI"
  button_inside: "CO VÁS ČEKÁ UVNITŘ?"
  button_why: "PROČ TO FUNGUJE?"

  # Další obrazovky
  inside_title: "💌 CO VÁS ČEKÁ VE VECHNOST?"
  inside_text: "📋 <b>Stovky otázek a úkolů</b>\n• Od lehkých a zábavných po smělé a hluboké.\n• Každá karta je příležitost poznat se znovu.\n• Úkoly vás nejen donutí mluvit, ale i jednat - vytvářet živé emoce.\n• Nové otázky jsou pravidelně přidávány - VECHNOST je skutečně věčná.\n\n🎭 <b>Čtyři směry pro jakýkoli vztah</b>\n• Seznámení - lehký flirt a první jiskry\n• Pro páry - posílení spojení a porozumění\n• Sex - prostor pro upřímnost a vášeň\n• Provokace - smělá témata, nečekaná objevení\n\n🔒 <b>Úplné soukromí</b>\nVaše odpovědi zůstávají pouze mezi vámi.\nÚplná svoboda být upřímný. Bez filtrů a bez očekávání.\n\n💬 <b>Bezpečný prostor pro odhalení</b>\nMluvte o tom, co obvykle zůstává ve stínu.\nRozumějte, cítěte, přibližujte se.\n\n✨ <b>Hra, která s vámi roste</b>\nVracejte se k ní znovu a znovu.\nKaždýkrát - nové emoce, nová témata, nové \"my\".\nVhodné jak pro ty, kteří teprve budují spojení, tak pro ty, kteří chtějí znovu zažehnout oheň v dlouhodobých vztazích."

  why_title: "💡 PROČ TO FUNGUJE?"
  why_text: "✅ <b>Promyšlená struktura</b>\nOtázky jsou uspořádány tak, aby jemně vedly od lehkosti k hloubce.\nBez tlaku. Bez nepohodlí. Pouze přirozená blízkost.\n\n✅ <b>Vy si vyberete tempo</b>\nZačněte lehkým flirtem - a přejděte k tématům, kde se otevírají skutečné city.\n\n✅ <b>Bez závazků - pouze touha být blíž</b>\nJednoduše si vyberte to, co vás oslovuje.\n\n✅ <b>Funguje pro jakýkoli pár</b>\n• Nové páry - mohou se poznat hlouběji, rychleji a upřímněji\n• Dlouhodobé vztahy - navrátí emoce, lehkost a vášeň\n• Páry v krizi - vytvoří nové mosty tam, kde dříve byly stěny\n\n💬 <b>Rozhovory, které mění vztahy</b>\nKaždá otázka není jen téma. Je to dveře do světa důvěry a blízkosti.\nVECHNOST pomáhá nejen mluvit, ale i slyšet.\nNejen být blízko, ale i cítit druhého"
  button_back: "← Zpět"

  # Zpráva po platbě
  enter_title: "💫 VSTOUPIT DO VECHNOST"
  enter_text: "Dovolte si luxus být blíž.\nUdělejte krok k upřímnosti, vášni a skutečnému porozumění.\nVECHNOST není jen hra, je to investice do vašeho vztahu, která navrací lásku.\nProtože skutečná láska se neobjevuje náhodou.\nVytváří se krok za krokem. Ve hře, kde se srdce sama otevírají."

  # Stará verze (pro případ, že se používá jinde)
  welcome_message: "💕 Vítejte ve VECHNOST\n\nHra pro páry vytvořená k:\n• Skutečnému poznání sebe navzájem\n• Překročení hranic obyčejnosti\n• Objevení nových stránek sebe a partnera\n\nVyberte balíček - a otevřete svůj svět blízkosti:\n\n✨ Seznámení - lehkost a flirt\n♥️ Pro páry - hloubka a teplo\n❤️‍🔥 Provokace - nečekané a smyslné\n🔥 Sex - odvaha, důvěra, vášeň"


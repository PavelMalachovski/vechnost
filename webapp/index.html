        ${legs}${pose.armsBehind ? arms : ''}${neckLine}${torso}
        ${pose.armsBehind ? '' : arms}${pose.extraTop || ''}${artHead(j.head, pose.face, sex, pose.hairHalo)}

      head: [34, 50], neck: [42, 62], hip: [44, 86],
      elbowL: [30, 74], handL: [30, 92], elbowR: [52, 76], handR: [38, 94],
      kneeL: [30, 94], footL: [26, 117], kneeR: [36, 92], footR: [32, 117] } },
    // Лежит на животе, грудь поднята на локтях, взгляд прямо в камеру,
    // которая стоит перед ним на полу.
    'him-8': { sex: 'm', light: 'topleft', cam: [12, 78], sight: [30, 72],
      prop: 'floor', view: 'side', face: 'left', aim: [42, 82], spread: 16, j: {
      head: [34, 68], neck: [44, 80], hip: [86, 98],
      elbowL: [36, 100], handL: [24, 96], elbowR: [42, 102], handR: [30, 98],
      kneeL: [106, 102], footL: [112, 88], kneeR: [104, 106], footR: [110, 92] } },
    // Сидит на стуле боком, нога закинута на ногу, рука свободно на бедре.
    'him-9': { sex: 'm', light: 'right', cam: 'front', prop: 'chair',
      view: 'side', face: 'right', aim: [54, 62], toesR: [1, 0.35], j: {
      head: [50, 38], neck: [50, 52], hip: [50, 86],
      elbowL: [40, 68], handL: [40, 84], elbowR: [60, 66], handR: [64, 76],
      kneeL: [74, 88], footL: [80, 116], kneeR: [70, 78], footR: [86, 92] } },
    // Только торс в профиль, руки скрещены на груди, лицо вне кадра.
    'him-10': { crop: 'him', light: 'left', view: 'crop' }
  };

  // The props that make a pose legible: not abstract lines, but the thing
  // the caption names — a bed with a pillow, a chair with a back, a tub.
  function artProp(kind) {
    const floor = `<line class="art-prop" x1="6" y1="${ART_FLOOR}" x2="114" y2="${ART_FLOOR}"/>`;
    if (kind === 'floor') return floor;
    if (kind === 'rug') return `<ellipse class="art-prop" cx="60" cy="82" rx="54" ry="34"/>`;
    if (kind === 'bed') return floor +
      `<path class="art-prop" d="M8 96 H78 M12 96 V${ART_FLOOR} M74 96 V${ART_FLOOR} M10 96 V56"/>
       <rect class="art-propfill" x="8" y="90" width="70" height="7" rx="3.5"/>
       <rect class="art-propfill" x="12" y="80" width="16" height="8" rx="4"/>`;
    if (kind === 'wall') return floor +
      `<line class="art-prop" x1="17" y1="12" x2="17" y2="${ART_FLOOR}"/>
       <line class="art-prop" x1="17" y1="34" x2="10" y2="41"/>
       <line class="art-prop" x1="17" y1="64" x2="10" y2="71"/>
       <line class="art-prop" x1="17" y1="94" x2="10" y2="101"/>`;
    if (kind === 'chair') return floor +
      `<path class="art-prop" d="M40 90 H76 M42 90 V${ART_FLOOR} M74 90 V${ART_FLOOR} M40 90 L36 56 M36 56 H44"/>`;
    if (kind === 'chairBack') return floor +
      `<path class="art-prop" d="M40 92 H80 M44 92 V${ART_FLOOR} M76 92 V${ART_FLOOR}"/>`;
    // The chair's back, drawn in front of the figure: she sits astride, so
    // it stands between her and the camera and her hands rest on its bar.
    if (kind === 'chairBar') return `<path class="art-prop" style="opacity:.75"
       d="M42 58 H78 M42 58 V70 M78 58 V70 M46 92 L46 66 M74 92 L74 66"/>
       <rect class="art-propfill" x="42" y="56" width="36" height="6" rx="3"/>`;
    if (kind === 'bathRight') return floor +
      `<path class="art-prop" d="M52 90 Q52 112 68 112 H96 Q112 112 112 90 M46 90 H116"/>
       <line class="art-prop" x1="62" y1="112" x2="60" y2="${ART_FLOOR}"/>
       <line class="art-prop" x1="100" y1="112" x2="102" y2="${ART_FLOOR}"/>`;
    if (kind === 'window') return floor +
      `<rect class="art-glow" x="70" y="12" width="44" height="84"/>
       <path class="art-prop" d="M70 12 H114 M70 12 V96 M114 12 V96 M70 96 H114 M92 12 V96 M70 54 H114"/>`;
    if (kind === 'blinds') return floor +
      [18, 32, 46, 60, 74, 88].map(y =>
        `<rect class="art-stripe" x="16" y="${y}" width="92" height="5" rx="2.5"
           transform="rotate(4 60 ${y})"/>`).join('');
    return '';
  }

  // The two close-ups are bespoke drawings, not puppet poses: a cropped
  // torso built from joints kept reading as an arrow, because a frame that
  // cuts the head and legs leaves nothing to say which end is which. Drawn
  // outlines carry a chin, a chest and a waist, which settle it.
  function artCrop(which) {
    const frame = `<path class="art-cam" d="M16 30 V20 H28 M92 20 H104 V30 M104 108 V118 H92 M28 118 H16 V108"/>`;
    const cone = `<path class="art-cone" d="M14 34 L56 52 L44 84 Z"/>`;
    if (which === 'her') {
      // Front torso, the chin dipping into the top of the frame: one hand
      // on the collarbone, the other across the chest.
      return frame + cone +
        `<path class="art-torso" d="M52 24 Q52 32 46 36 Q34 42 33 52
           Q32 66 38 78 Q36 94 34 110 L86 110 Q84 94 82 78 Q88 66 87 52
           Q86 42 74 36 Q68 32 68 24 Z"/>
         <path class="art-skull" d="M52 21 Q60 30 68 21 L68 26 Q60 34 52 26 Z"/>
         <path class="art-hair" d="M50 21 Q41 28 40 38 L34 46 Q32 30 42 22 Z"/>
         <path class="art-hair" d="M70 21 Q79 28 80 38 L86 46 Q88 30 78 22 Z"/>
         <path class="art-seam" style="stroke-width:9.6" fill="none" d="M87 54 L83 66 L69 72"/>
         <polyline class="art-limb" style="stroke-width:7" points="87,54 83,66 69,72"/>
         <path class="art-seam" style="stroke-width:9.6" fill="none" d="M33 54 L38 44 L52 40"/>
         <polyline class="art-limb" style="stroke-width:7" points="33,54 38,44 52,40"/>
         <circle class="art-skull" cx="67" cy="73" r="3.2"/>
         <circle class="art-skull" cx="54" cy="41" r="3.2"/>`;
    }
    // His torso in profile: the chest curves forward on the right, the back
    // is one flat line on the left, and the half away from the lamp sits in
    // shadow - the very contrast the card is about.
    return frame + cone +
      `<path class="art-torso" d="M56 24 L52 38 Q44 42 42 54 Q40 70 46 82
         Q44 96 44 110 L82 110 Q84 92 80 76 Q88 60 82 44 Q78 36 74 26 Z"/>
       <path class="art-shadow" style="opacity:.4" d="M64 26 L74 26 Q78 36 82 44
         Q88 60 80 76 Q84 92 82 110 L64 110 Z"/>
       <path class="art-seam" style="stroke-width:10.6" fill="none" d="M42 56 L60 64 L80 58"/>
       <polyline class="art-limb" style="stroke-width:8" points="42,56 60,64 80,58"/>
       <path class="art-seam" style="stroke-width:10.6" fill="none" d="M80 70 L58 74 L44 66"/>
       <polyline class="art-limb" style="stroke-width:8" points="80,70 58,74 44,66"/>
       <circle class="art-skull" cx="80" cy="58" r="3.4"/>
       <circle class="art-skull" cx="44" cy="66" r="3.4"/>`;
  }

  // Jeans on him-3: a straight waistband on the hips, two trouser legs and
  // the open fly - the V below the waistband is the garment element the
  // whole pose depends on, so it is dark and unmistakable.
  function artJeans() {
    return `<path class="art-cloth" style="opacity:.55" d="M46 78 H74 L73 98 L71 116
        L61 116 L60 98 L59 116 L49 116 L47 98 Z"/>
      <path class="art-seam" style="stroke-width:1.6" d="M46 78 H74" fill="none"/>
      <path class="art-shadow" d="M56 78 L60 92 L64 78 Z"/>
      <path class="art-prop" d="M47 84 L52 88 M73 84 L68 88"/>`;
  }

  function artSvg(inner) {
    return `<svg class="guide-art" viewBox="0 0 ${ART_W} ${ART_H}" role="img" aria-hidden="true">${inner}</svg>`;
  }

  // Drawing plus caption. The caption is HTML, not SVG text: it inherits the
  // page's font and wraps, where an 8px <text> inside a 120-unit frame would
  // have to be measured by hand and would still clip on a narrow phone.
  function artFramed(inner, caption) {
    return '<div class="art-wrap">' + artSvg(inner) +
           (caption ? '<span class="art-cap">' + escapeHTML(caption) + '</span>' : '') +
           '</div>';
  }

  function artCaption(view, light, cam) {
    const parts = [];
    if (ART_VIEW_LABEL[view]) parts.push(ART_VIEW_LABEL[view]);
    if (ART_LIGHT_LABEL[light]) parts.push(ART_LIGHT_LABEL[light]);
    // A camera or a lamp at the viewer's own position has no glyph to draw —
    // it stands where you are standing — so it is named instead. Drawn, it
    // landed between the figure's feet and read as a third leg.
    if (cam === 'front') parts.push('камера напротив');
    return parts.join(' · ');
  }

  // The lighting schemes: the room seen from above, so "where the lamp
  // stands relative to you and the phone" is a plan a reader can walk. You
  // are the shoulders-and-head shape; the nose wedge says which way you
  // face; the phone is below, where the camera stands in every scheme.
  function artLightScheme(key) {
    // You, seen from above: a shoulder bar with the head offset toward the
    // camera and a wedge of a nose. The head sat dead-centre before and the
    // whole symbol read as an eye with an iris.
    const YOU_Y = 58, HEAD_Y = 66;
    const you = (dark) => `
       <ellipse class="${dark ? 'art-shadow' : 'art-torso'}" cx="60" cy="${YOU_Y}" rx="16" ry="7"
         ${dark ? 'style="opacity:.9"' : ''}/>
       <circle class="art-seam" style="stroke-width:2.2" fill="none" cx="60" cy="${HEAD_Y}" r="7.6"/>
       <circle class="${dark ? 'art-shadow' : 'art-skull'}" cx="60" cy="${HEAD_Y}" r="6.8"
         ${dark ? 'style="opacity:.95"' : ''}/>
       <path class="art-hair" d="M53.5 ${HEAD_Y - 3} A6.8 6.8 0 0 1 66.5 ${HEAD_Y - 3}
         A9 9 0 0 0 53.5 ${HEAD_Y - 3} Z"/>
       <path class="art-skull" d="M56 ${HEAD_Y + 6} L60 ${HEAD_Y + 11} L64 ${HEAD_Y + 6} Z"/>`;
    const phone = artCamera(60, 106, 60, HEAD_Y + 12);
    const lampAt = (x, y) => artLampAt([x, y]);
    if (key === 'light-side') {
      // Лампа ровно сбоку: одна половина тела освещена, вторая в тени.
      return artFramed(lampAt(16, 58) +
        `<path class="art-cone" d="M16 58 L44 46 L44 74 Z"/>` + you(false) +
        `<path class="art-shadow" d="M60 51 A16 7 0 0 1 60 65 Z"/>
         <path class="art-shadow" d="M60 ${HEAD_Y - 6.8} A6.8 6.8 0 0 1 60 ${HEAD_Y + 6.8} Z"/>`
        + phone,
        'схема сверху · лампа сбоку под 90°');
    }
    if (key === 'light-rim') {
      // Свет строго сзади: светится контур, само тело тёмное. Телефон чуть
      // в стороне от оси, как и советует подсказка.
      return artFramed(lampAt(60, 14) +
        `<path class="art-cone" d="M60 14 L40 50 L80 50 Z"/>` +
        `<path class="art-halo" d="M44 ${YOU_Y + 2} A16 8.4 0 0 1 76 ${YOU_Y + 2}"/>` +
        you(true) + artCamera(70, 106, 62, HEAD_Y + 10),
        'схема сверху · лампа строго сзади');
    }
    if (key === 'light-soft') {
      // Лампа накрыта тканью: свет становится рассеянным мягким пятном,
      // которое дотягивается до тела.
      return artFramed(
        `<circle class="art-diffuse" cx="24" cy="24" r="20"/>` + lampAt(24, 24) +
        `<path fill="#F4C9A2" opacity=".65" d="M8 16 Q24 4 40 16 L42 28
           Q38 34 34 31 Q30 36 26 32 Q22 37 18 32 Q13 35 10 30 Z"/>
         <path class="art-cone" style="opacity:.15" d="M24 24 L76 46 L48 84 Z"/>` +
        you(false) + phone,
        'схема сверху · лампа накрыта тканью');
    }
    if (key === 'light-stripes') {
      // Между лампой и тобой жалюзи: свет доходит до тела полосами, и
      // полосы лежат на самом теле, а не позади него.
      return artFramed(lampAt(14, 58) +
        `<path class="art-cone" style="opacity:.14" d="M14 58 L30 38 L30 78 Z"/>
         <path class="art-prop" d="M30 32 V86 M34 32 V86 M38 32 V86 M42 32 V86"/>` +
        [44, 52, 68, 76].map(y =>
          `<rect class="art-stripe" x="44" y="${y}" width="18" height="3.4" rx="1.7"/>`).join('') +
        you(false) +
        [53, 59, 65, 71].map(y =>
          `<rect class="art-stripe" style="opacity:.55" x="46" y="${y}"
             width="28" height="3.4" rx="1.7"/>`).join('') +
        phone,
        'схема сверху · свет через жалюзи');
    }
    return '';
  }

  // The camera and editing cards. The first is a scene; the rest are the
  // phone's own screen, because the instruction is a thing you do on the
  // screen, not a way to stand.
  function artCameraScheme(key) {
    const stand = artFigure({ sex: 'm', view: 'side', face: 'left',
      toesL: [-1, 0.2], toesR: [-1, 0.2], j: {
      head: [58, 24], neck: [59, 39], hip: [60, 78],
      elbowL: [50, 56], handL: [47, 74], elbowR: [68, 56], handR: [70, 74],
      kneeL: [57, 97], footL: [54, 117], kneeR: [65, 97], footR: [66, 117] } });
    const screen = `<rect class="art-cam" x="34" y="14" width="52" height="100" rx="7"/>
       <line class="art-cam" x1="52" y1="20" x2="68" y2="20"/>`;
    const miniBody = `<g style="opacity:.75">
       <circle class="art-skull" cx="52" cy="44" r="5"/>
       <path class="art-torso" d="M46 50 Q44 60 46 70 L58 70 Q60 60 58 50 Z"/>
       <polyline class="art-limb" style="stroke-width:4" points="47,52 42,62 44,72"/>
       <polyline class="art-limb" style="stroke-width:4" points="57,52 62,62 60,72"/>
       <polyline class="art-limb" style="stroke-width:4.4" points="48,70 47,84 46,98"/>
       <polyline class="art-limb" style="stroke-width:4.4" points="56,70 57,84 58,98"/></g>`;
    if (key === 'camera-height') {
      // Телефон на уровне пупка, объектив смотрит горизонтально; рядом
      // отметка таймера. Точка на теле - куда именно приходится уровень.
      return artFramed(artProp('floor') + stand +
        `<line class="art-sight" x1="24" y1="64" x2="54" y2="64"/>
         <circle cx="55" cy="64" r="2.4" fill="#9FEFC4"/>` +
        artCamera(18, 64) +
        `<g class="art-cam"><circle cx="18" cy="30" r="7"/>
           <path d="M18 26 V30 L21 32"/></g>
         <text class="art-note" x="30" y="34">10 с</text>`,
        'телефон на уровне пупка, таймер 10 секунд');
    }
    if (key === 'camera-exposure') {
      // Экран телефона: тап (пунктирный квадрат) у солнышка, стрелка тянет
      // его вниз, и нижняя половина кадра уже темнеет - результат жеста.
      return artFramed(screen +
        `<path class="art-shade" style="opacity:.32" d="M35 70 H85 V113 H35 Z"/>` +
        miniBody +
        `<rect class="art-focus" x="66" y="38" width="16" height="16" rx="3"/>
         <g class="art-lamp"><circle cx="74" cy="46" r="4"/>
           <line x1="74" y1="38" x2="74" y2="41"/><line x1="74" y1="51" x2="74" y2="54"/>
           <line x1="66" y1="46" x2="69" y2="46"/><line x1="79" y1="46" x2="82" y2="46"/></g>
         <line class="art-sight" x1="74" y1="56" x2="74" y2="94"/>
         <path class="art-cam" d="M70 88 L74 96 L78 88"/>`,
        'нажми на экран и потяни солнышко вниз');
    }
    if (key === 'camera-focus') {
      // Экран телефона: рамка фокуса на ключице, палец касается её угла.
      return artFramed(screen + miniBody +
        `<path class="art-cam" d="M42 48 V44 H46 M58 44 H62 V48 M62 60 V64 H58 M46 64 H42 V60"/>
         <circle class="art-focus" cx="52" cy="54" r="7"/>
         <path class="art-seam" style="stroke-width:8" fill="none" d="M62 63 L70 76 L74 92"/>
         <path class="art-limb" style="stroke-width:6" d="M62 63 L70 76 L74 92"/>
         <circle class="art-skull" cx="62" cy="63" r="3"/>`,
        'тап по месту, которое главное в кадре');
    }
    if (key === 'edit-bw') {
      // Один и тот же кадр дважды: слева как снято (тёплый), справа - ч/б,
      // тени глубже, плёночное зерно, и ползунок теней уведён влево.
      const grain = [[66, 34], [96, 40], [74, 62], [100, 74], [68, 92], [88, 98],
        [80, 30], [102, 56]].map(g =>
        `<circle cx="${g[0]}" cy="${g[1]}" r="0.9" fill="#fff" opacity=".5"/>`).join('');
      return artFramed(
        `<rect class="art-prop" x="14" y="24" width="92" height="80" rx="6"/>
         <line class="art-prop" x1="60" y1="24" x2="60" y2="104"/>
         <g style="color:#F2A9BC">
           <circle class="art-skull" cx="38" cy="48" r="6"/>
           <path class="art-torso" d="M31 56 Q29 70 32 84 L45 84 Q47 70 45 56 Z"/></g>
         <path class="art-shade" d="M60 24 H106 V104 H60 Z"/>
         <g>
           <circle class="art-skull" cx="84" cy="48" r="6"/>
           <path class="art-torso" d="M77 56 Q75 70 78 84 L91 84 Q93 70 91 56 Z"/>
           <path class="art-shadow" d="M84 42 A6 6 0 0 1 84 54 Z
             M84 56 Q86 70 85 84 L91 84 Q93 70 91 56 Z"/></g>
         ${grain}
         <line class="art-cam" x1="66" y1="110" x2="100" y2="110" style="opacity:.7"/>
         <circle cx="72" cy="110" r="2.6" fill="#9FEFC4"/>
         <text class="art-note" x="24" y="114">цвет</text>
         <text class="art-note" x="66" y="122">тени влево</text>`,
        'справа: ч/б, тени глубже, зерно 10-15%');
    }
    if (key === 'edit-privacy') {
      // Кадр начинается ниже подбородка: голова за рамкой, в кадре только
      // тело. Крестик стоит на лице, а не на углу рамки.
      return artFramed(
        `<g style="opacity:.35">
           <circle class="art-skull" cx="60" cy="24" r="9"/>
           <path class="art-cam" d="M53 17 L67 31 M67 17 L53 31"/>
         </g>
         <rect class="art-prop" x="26" y="40" width="68" height="76" rx="6"/>
         <path class="art-torso" d="M52 40 L48 52 Q42 58 44 74 Q42 92 48 106 L72 106
           Q78 92 76 74 Q78 58 72 52 L68 40 Z"/>`,
        'лицо в кадр не попадает, тело скажет само');
    }
    return '';
  }

  // The one entry point: a key in, a drawing out, '' when nothing matches so
  // a new content key shows as a blank slot rather than breaking the page.
  function guideArt(key) {
    if (!key) return '';
    const pose = ART_POSES[key];
    if (pose && pose.crop) {
      return artFramed(artCrop(pose.crop) + artLamp(pose.light, 60, 66),
                       artCaption('crop', pose.light));
    }
    if (pose) {
      const aim = pose.aim || pose.j.hip || pose.j.neck || [60, 64];
      const cam = Array.isArray(pose.cam)
        ? artCamera(pose.cam[0], pose.cam[1],
                    (pose.sight || aim)[0], (pose.sight || aim)[1])
        : '';
      // `lampAt` puts the source somewhere the named directions cannot — a
      // window pane, a spot behind a profile's back. The caption still
      // carries the direction word; the glyph just stands where the light
      // actually is in this particular room.
      let light = '';
      if (pose.lampAt) {
        light = artConeFrom(pose.lampAt, aim, pose.spread) +
                (pose.noLamp ? '' : artLampAt(pose.lampAt));
      } else {
        light = artCone(pose.light, aim[0], aim[1]) +
                artLamp(pose.light, aim[0], aim[1]);
      }
      return artFramed(
        artProp(pose.prop) + light +
        artFigure(pose) + (pose.jeans ? artJeans() : '') +
        (pose.propFront ? artProp(pose.propFront) : '') + cam,
        artCaption(pose.view, pose.light, pose.cam));
    }
    if (key.indexOf('light-') === 0) return artLightScheme(key);
    return artCameraScheme(key);
  }

  /* ---------------- 69 ступеней ---------------- */
  // Reuses coopFetch: the same auth headers, the same guest-id fallback, the
  // same error shape. Its own state, because a board is not a deck.
  //
  // Each partner has their own piece and walks their own board; the game
  // ends when both are standing on 69. The server owns the dice and the
  // positions, so this file only ever draws what it was told.
  const G = {
    code: null,      // the game being played
    st: null,        // last state from the server
    board: null,     // the map, fetched once per game
    byId: null,      // cell metadata by number, for drawing
    timer: null,     // poll handle
    rolling: false,  // guards a double tap on the dice
    settling: null,  // portal animation timer
    piece: 'hearts', // the suit picked on the entry screen
    opened: null,    // the cell whose secret is already open, so it stays open
    invite: null     // the link that puts the partner on this board
  };

  // The four suits the deck is printed with. Characters, not emoji: the board
  // is a card game, and an emoji picker on it looked like a chat.
  const S69_SUITS = {
    hearts:   { glyph: '♥', red: true },
    spades:   { glyph: '♠', red: false },
    clubs:    { glyph: '♣', red: false },
    diamonds: { glyph: '♦', red: true }
  };
  const S69_COLS = 6;

  function s69Error(e) {
    if (e.status === 402) { showS69Paywall(); return; }
    // coopFetch keeps the server's `detail`, and one status covers several
    // different situations: a 409 on join can mean "full" or "this game is
    // played on one phone", a 403 can mean "not your turn" or "not a player
    // at all". A stranger with a stale link used to be told it was not
    // their turn.
    const d = (e.detail || '');
    if (e.status === 409) {
      if (d.indexOf('one phone') >= 0) { toast(T().s69SoloJoin); return; }
      if (d.indexOf('joined') >= 0) { toast(T().s69NoPartner); return; }
      if (d.indexOf('over') >= 0 || d.indexOf('dice') >= 0) { toast(T().s69Over); return; }
      toast(T().s69Full); return;
    }
    if (e.status === 404 || e.status === 410) { toast(T().s69Gone); return; }
    if (e.status === 403) {
      toast(d.indexOf('player') >= 0 ? T().s69NotPlayer : T().s69NotYourTurn);
      return;
    }
    toast(statusMessage(e));
  }

  function showS69Paywall() {
    $('paywallText').textContent = T().s69Paywall +
      (ACCESS.discount_percent ? '\n\n' + fmt(T().paywallReferral, { percent: ACCESS.discount_percent }) : '');
    $('paywallBuy').textContent = T().paywallBuy + (ACCESS.price ? ' – ' + ACCESS.price : '');
    $('paywallBuy').style.display = ACCESS.payment_url ? '' : 'none';
    $('paywall').classList.add('show');
  }

  // A happy buzz on a ladder, a sad double one on a snake, and a buzz when a
  // secret or a Joker turns up.
  function s69Haptic(kind) {
    if (kind === 'ladder') { haptic('ok'); return; }
    if (kind === 'snake') { haptic('heavy'); setTimeout(() => haptic('heavy'), 150); return; }
    if (kind === 'secret' || kind === 'joker') haptic('medium');
  }

  /* ---- entry ---- */

  function renderS69Suits(taken) {
    const box = $('s69Suits');
    box.innerHTML = '';
    Object.keys(S69_SUITS).forEach(id => {
      const suit = S69_SUITS[id];
      const b = document.createElement('button');
      b.className = 's69-suit' + (suit.red ? ' red' : '') + (G.piece === id ? ' on' : '');
      b.textContent = suit.glyph;
      b.setAttribute('aria-label', T().s69Suit[id]);
      if (taken && taken.indexOf(id) !== -1) b.disabled = true;
      b.onclick = () => { haptic('light'); G.piece = id; renderS69Suits(taken); };
      box.appendChild(b);
    });
  }

  async function openS69() {
    haptic('light');
    G.piece = store.get('s69Piece', 'hearts');
    renderS69Suits(null);
    show('s69');
    s69OfferResume();
  }

  // A game in play is offered back, with the way to abandon it beside the way
  // to continue it. Leaving the screen never ended a game, but without both
  // buttons there was no way to tell — and no way to start a fresh board
  // without the old one being handed back on the next visit.
  async function s69OfferResume() {
    $('btnS69Resume').style.display = 'none';
    $('btnS69Restart').style.display = 'none';
    try {
      const st = await coopFetch('/api/steps69/mine');
      $('btnS69Resume').textContent =
        T().s69Resume + ' · ' + fmt(T().s69ResumeHint, { n: st.you.position });
      $('btnS69Resume').style.display = '';
      $('btnS69Resume').onclick = () => {
        G.code = st.code; G.invite = st.invite_url || null; enterS69();
      };

      $('btnS69Restart').textContent = T().s69Restart;
      $('btnS69Restart').style.display = '';
      $('btnS69Restart').onclick = async () => {
        // Telegram's native confirm where it exists: clients that suppress
        // window.confirm made this button do nothing at all.
        if (!await compatConfirm(T().s69RestartConfirm)) return;
        haptic('medium');
        try { await coopFetch('/api/steps69/' + st.code, { method: 'DELETE' }); }
        catch (e) {
          // Already gone is the outcome we wanted; anything else means the
          // game still exists, and saying «Игра удалена» would be a lie
          // the returning Resume button immediately exposes.
          if (e.status !== 404 && e.status !== 410) { s69Error(e); return; }
        }
        store.set('s69Code', null);
        toast(T().s69Deleted);
        s69OfferResume();
      };
    } catch (e) {
      // 404 is the common case: no game in play. Any other failure must not
      // masquerade as "no game" — hiding both buttons on a network hiccup
      // sent a pair mid-game off to start a second board.
      if (e.status !== 404 && e.status !== 410) toast(statusMessage(e));
    }
  }

  async function s69Create(mode) {
    haptic('light');
    store.set('s69Piece', G.piece);
    $('loader').classList.add('show');
    try {
      const st = await coopFetch('/api/steps69', {
        method: 'POST', json: { mode: mode, piece: G.piece }
      });
      G.code = st.code; G.st = st; G.invite = st.invite_url || null;
      store.set('s69Code', st.code);
      if (mode === 'solo') { enterS69(); return; }
      showInviteLink($('s69Code'), G.invite);
      $('s69Waiting').textContent = T().s69Waiting;
      show('s69Invite');
      startS69Poll(st2 => {
        if (!st2.started) return;
        stopS69Poll();
        haptic('ok');
        toast(fmt(T().s69Joined, { name: st2.partner.name || '' }));
        enterS69();
      });
    } catch (e) { s69Error(e); } finally { $('loader').classList.remove('show'); }
  }

  // Reached only through an invite link, so no suit is named: whoever
  // followed the link never saw the picker, and the server deals them
  // whichever suit the creator is not wearing.
  async function s69Join(code) {
    haptic('light');
    $('loader').classList.add('show');
    try {
      const st = await coopFetch('/api/steps69/' + code + '/join', {
        method: 'POST', json: {}
      });
      G.code = st.code; G.st = st; G.invite = st.invite_url || null;
      G.piece = st.you.piece || G.piece;
      store.set('s69Code', st.code);
      store.set('s69Piece', G.piece);
      enterS69();
    } catch (e) { s69Error(e); }
    finally { $('loader').classList.remove('show'); }
  }

  /* ---- the board ---- */

  async function enterS69() {
    $('loader').classList.add('show');
    try {
      G.board = await coopFetch('/api/steps69/' + G.code + '/board');
      G.byId = {};
      G.board.cells.forEach(c => { G.byId[c.id] = c; });
      G.st = await coopFetch('/api/steps69/' + G.code);
      G.invite = G.st.invite_url || G.invite;
      G.opened = null;
      $('s69BoardTitle').textContent = T().s69Title;
      buildS69Map();
      renderS69(G.st, true);
      show('s69Board');
      startS69Poll(onS69State);
    } catch (e) { s69Error(e); show('s69'); } finally { $('loader').classList.remove('show'); }
  }

  function leaveS69() {
    stopS69Poll();
    if (G.settling) { clearTimeout(G.settling); G.settling = null; }
    G.code = null; G.st = null; G.board = null; G.byId = null; G.opened = null;
    G.invite = null;
    $('s69Finale').classList.remove('show');
    $('s69Done').classList.remove('show');
    $('s69CellInfo').classList.remove('show');
    show('home');
  }

  function stopS69Poll() { if (G.timer) { clearInterval(G.timer); G.timer = null; } }

  function startS69Poll(onState) {
    stopS69Poll();
    let busy = false;  // one request in flight; see startCoopPoll
    G.timer = setInterval(async () => {
      if (!G.code || busy) return;
      busy = true;
      try { onState(await coopFetch('/api/steps69/' + G.code)); }
      catch (e) {
        if (e.status === 404 || e.status === 410) { stopS69Poll(); toast(T().s69Gone); leaveS69(); }
      } finally { busy = false; }
    }, 2200);
  }

  function onS69State(st) {
    // A poll must not stomp on the portal animation the roll started: the
    // server already reports the final square, so repainting here would
    // teleport the piece past the flight the partner is watching.
    if (G.settling) { G.st = st; return; }
    const moved = !G.st || st.you.rolls !== G.st.you.rolls
                        || st.partner.rolls !== G.st.partner.rolls;
    renderS69(st, moved);
  }

  function renderS69(st, animate) {
    const prev = G.st;
    G.st = st;

    // A new cell is a new secret: forget which one was open.
    if (!prev || prev.you.position !== st.you.position) G.opened = null;

    if (animate && st.last && st.last.event) flyS69Piece(st.last);
    else paintS69Map();

    renderS69Turn(st);
    renderS69Cell(st);

    if (animate && st.last && st.last.seat === st.you.seat) {
      const kind = st.you.cell.kind;
      if (kind === 'secret' || kind === 'joker') s69Haptic(kind);
    }
    if (st.both_home && !st.finished) showS69Finale(st);
    if (st.finished && (!prev || !prev.finished)) showS69Done(st);
  }

  /* ---- the map ---- */

  function s69Slots() {
    const slots = [];
    for (let r = 0; r * S69_COLS < G.board.size; r++) {
      const row = [];
      for (let c = 0; c < S69_COLS; c++) {
        const id = r * S69_COLS + c + 1;
        row.push(id <= G.board.size ? id : null);
      }
      if (r % 2 === 1) row.reverse();
      slots.push.apply(slots, row);
    }
    return slots;
  }

  function s69BlockOf(id) {
    const block = (G.board.blocks || []).filter(b => id >= b.first && id <= b.last)[0];
    return block ? block.id : '';
  }

  // The mark in a cell's corner: a drawn triangle pointing where the portal
  // throws you, with the destination beside it. No emoji on the board.
  function s69MarkHTML(cell) {
    if (cell.kind === 'ladder' || cell.kind === 'snake') {
      return '<span class="s69-mark"><i></i>' + cell.to + '</span>';
    }
    if (cell.kind === 'joker') return '<span class="s69-mark">?</span>';
    if (cell.kind === 'secret') return '<span class="s69-mark">◆</span>';
    return '';
  }

  function buildS69Map() {
    const box = $('s69Map');
    box.innerHTML = '';
    s69Slots().forEach(id => {
      const el = document.createElement('div');
      if (id === null) { el.style.visibility = 'hidden'; box.appendChild(el); return; }
      const c = G.byId[id];
      el.className = 's69-cell k-' + c.kind + ' b-' + s69BlockOf(id) +
                     (c.milestone ? ' milestone' : '');
      el.dataset.id = String(id);
      el.innerHTML = (c.kind === 'final' ? '69' : String(id)) + s69MarkHTML(c);
      el.title = c.title;
      // The board is the printed game: any cell opens its own action.
      el.onclick = () => showS69CellInfo(id);
      box.appendChild(el);
    });
  }

  // What a tapped square does: its title, its action text, and for the
  // special kinds what the mechanic is. The board payload carries no deal —
  // no secret, no partner line, no Joker task — so nothing shown here can
  // spoil what a player will be dealt on it.
  function showS69CellInfo(id) {
    const c = G.byId && G.byId[id];
    if (!c) return;
    haptic('light');
    const block = (G.board.blocks || []).filter(b => id >= b.first && id <= b.last)[0];
    $('s69InfoMeta').textContent = fmt(T().s69InfoCell, { n: id }) +
      (block ? ' · ' + block.title : '');
    $('s69InfoTitle').textContent = c.title || '';

    const kind = $('s69InfoKind');
    if (c.kind === 'ladder') kind.textContent = T().s69Ladder + ' · ' + fmt(T().s69InfoUp, { n: c.to });
    else if (c.kind === 'snake') kind.textContent = T().s69Snake + ' · ' + fmt(T().s69InfoDown, { n: c.to });
    else if (c.kind === 'joker') kind.textContent = T().s69InfoJoker;
    else if (c.kind === 'secret') kind.textContent = T().s69InfoSecret;
    else kind.textContent = '';
    kind.style.display = kind.textContent ? '' : 'none';

    $('s69InfoText').textContent = c.text || '';
    $('s69InfoText').style.display = c.text ? '' : 'none';

    const note = $('s69InfoNote');
    note.textContent = c.milestone && G.board.system && G.board.system.milestone
      ? G.board.system.milestone : '';
    note.style.display = note.textContent ? '' : 'none';

    $('s69InfoClose').textContent = T().s69InfoClose;
    $('s69CellInfo').classList.add('show');
  }

  function s69MapCell(id) { return $('s69Map').querySelector('[data-id="' + id + '"]'); }

  function s69PieceHTML(player, mine) {
    const suit = S69_SUITS[player.piece] || S69_SUITS.spades;
    return '<span class="s69-piece seat-' + player.seat + (suit.red ? ' red' : '') +
           (mine ? ' mine' : '') + '">' + suit.glyph + '</span>';
  }

  // `overrideMine` puts the player's own piece on a square other than the one
  // the state reports, which is how the portal flight shows it landing before
  // it is thrown on.
  function paintS69Map(overrideMine) {
    const st = G.st;
    if (!st) return;
    const mineAt = overrideMine != null ? overrideMine : st.you.position;
    const theirsAt = st.partner.position;
    // Behind *both* pieces, not behind the leading one: a cell only one
    // player has walked past is still ahead of the other, and dimming it
    // told them their own road was already finished.
    const behind = Math.min(mineAt, theirsAt);

    $('s69Map').querySelectorAll('.s69-cell').forEach(el => {
      const id = Number(el.dataset.id);
      el.querySelectorAll('.s69-piece').forEach(p => p.remove());
      el.classList.toggle('here', id === mineAt);
      el.classList.toggle('passed', id < behind);
      el.classList.remove('flying');
      let pieces = '';
      if (id === mineAt) pieces += s69PieceHTML(st.you, true);
      if (id === theirsAt) pieces += s69PieceHTML(st.partner, false);
      if (pieces) el.insertAdjacentHTML('beforeend', pieces);
    });

    const here = s69MapCell(mineAt);
    if (here && here.scrollIntoView) {
      try { here.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
    }
  }

  // A portal fires with a visible flight and a system line, never as a piece
  // that was simply somewhere else the next time you looked.
  function flyS69Piece(last) {
    const mine = last.seat === G.st.you.seat;
    paintS69Map(mine ? last.landed : undefined);
    const el = s69MapCell(last.landed);
    if (el) el.classList.add('flying');
    s69Haptic(last.event);
    toast((last.event === 'ladder' ? T().s69Ladder : T().s69Snake) + ': ' +
          (G.board.system[last.event] || ''));
    if (G.settling) clearTimeout(G.settling);
    G.settling = setTimeout(() => { G.settling = null; paintS69Map(); }, 620);
  }

  /* ---- the current cell ---- */

  function renderS69Turn(st) {
    // Settled first and unconditionally: this used to sit after three early
    // returns, so a solo game never re-enabled the dice after its first roll.
    $('s69Dice').disabled = !st.your_turn || G.rolling;

    const chip = $('s69TurnChip');
    if (st.finished) { chip.textContent = T().s69Done; chip.className = 'chip'; return; }
    if (st.both_home) { chip.textContent = T().s69BothHome; chip.className = 'chip on'; return; }
    if (st.mode === 'solo') {
      chip.textContent = T().s69Seat[st.turn === 0 ? 'creator' : 'guest'];
      chip.className = 'chip on';
      return;
    }
    if (!st.started) { chip.textContent = T().s69Waiting; chip.className = 'chip'; return; }
    if (st.you.home) { chip.textContent = T().s69YouAreHome; chip.className = 'chip'; return; }
    chip.textContent = st.your_turn
      ? T().s69YourTurn
      : fmt(T().s69PartnerTurn, { name: st.turn_name || '' });
    chip.className = 'chip' + (st.your_turn ? ' on' : '');
  }

  function renderS69Cell(st) {
    const c = st.you.cell;
    // The card carries the task and nothing about the machinery: the cell
    // number, the kind and the "read this only if it is your turn" notice
    // were scaffolding, and they crowded out the one thing worth reading.
    const parts = ['<div class="s69-title">' + escapeHTML(c.title || '') + '</div>'];

    if (c.kind === 'joker' && c.joker) {
      parts.push('<div class="s69-text">' + escapeHTML(c.joker.title) + '</div>');
      parts.push('<div class="s69-note">' + escapeHTML(c.joker.text) + '</div>');
    } else if (c.text && c.kind !== 'secret') {
      parts.push('<div class="s69-text">' + escapeHTML(c.text) + '</div>');
    }

    // «Скрытое пламя». The server sends exactly one of these two, so whichever
    // arrived is the one this phone may read.
    const hidden = c.secret || c.partner;
    if (c.kind === 'secret' && hidden) {
      const open = G.opened === st.you.position;
      parts.push(
        '<div class="s69-spoiler' + (open ? ' open' : '') + '" id="s69Spoiler">' +
          '<div class="veil">' + escapeHTML(hidden) + '</div>' +
          '<span class="hint">' + escapeHTML(T().s69Reveal) + '</span>' +
        '</div>');
    }

    if (c.milestone && c.milestone_text) {
      parts.push('<div class="s69-note"><b>' + escapeHTML(T().s69Milestone) + '</b>' +
                 escapeHTML(c.milestone_text) + '</div>');
    }

    if (st.last && st.last.event && st.last.seat === st.you.seat) {
      parts.push('<div class="s69-note ' + (st.last.event === 'ladder' ? 'up' : 'down') + '">' +
                 escapeHTML(st.last.message || '') + '</div>');
    }

    // Where the partner is standing, and their half of a secret they are on.
    if (st.mode !== 'solo' && st.partner.name) {
      const suit = S69_SUITS[st.partner.piece] || S69_SUITS.spades;
      let line = '<div class="s69-partner"><b>' + suit.glyph + ' ' +
                 escapeHTML(st.partner.name) + '</b> · ' +
                 fmt(T().s69OnCell, { n: st.partner.position });
      if (st.partner.cell.partner) {
        line += '<br>' + escapeHTML(st.partner.cell.partner);
      }
      parts.push(line + '</div>');
    }

    $('s69Cell').innerHTML = parts.join('');

    const spoiler = $('s69Spoiler');
    if (spoiler) {
      // Opens on a tap and stays open: it closed again on the second tap,
      // which meant re-opening it in the middle of doing what it said.
      spoiler.onclick = () => {
        if (spoiler.classList.contains('open')) return;
        spoiler.classList.add('open');
        G.opened = st.you.position;
        haptic('light');
      };
    }

    const dice = $('s69Dice');
    const roll = st.last && st.last.seat === st.you.seat ? st.last.roll : null;
    dice.innerHTML = '<span class="s69-die">' + (roll || '·') + '</span>' +
                     '<span>' + escapeHTML(T().s69Roll) + '</span>';
    dice.style.display = st.you.home ? 'none' : '';
  }

  /* ---- rolling ---- */

  async function s69Roll() {
    if (G.rolling || !G.st) return;
    if (!G.st.your_turn) { haptic('light'); toast(T().s69NotYourTurn); return; }
    G.rolling = true;
    const dice = $('s69Dice');
    dice.classList.add('rolling');
    dice.disabled = true;
    haptic('medium');
    try {
      renderS69(await coopFetch('/api/steps69/' + G.code + '/roll', { method: 'POST' }), true);
    } catch (e) { s69Error(e); } finally {
      G.rolling = false;
      dice.classList.remove('rolling');
      if (G.st) renderS69Turn(G.st);
    }
  }

  /* ---- the finale ---- */

  function showS69Finale(st) {
    if (!st.finale) return;
    // Every poll tick lands here while the pair read the finale. Rebuilding
    // the open overlay each time reset its scroll and could swallow a tap
    // whose down and up straddled the rebuild — "I chose and nothing
    // happened". Once shown, it stays as built.
    if ($('s69Finale').classList.contains('show')) return;
    $('s69FinaleTitle').textContent = st.finale.title;
    $('s69FinaleIntro').textContent = st.finale.intro;
    const box = $('s69FinaleChoices');
    box.innerHTML = '';
    st.finale.choices.forEach(choice => {
      const wrap = document.createElement('div');
      const b = document.createElement('button');
      b.className = 'btn btn-play';
      b.textContent = choice.title;
      b.onclick = () => s69ChooseFinale(choice.id);
      wrap.appendChild(b);
      const text = document.createElement('p');
      text.className = 's69-choice-text';
      text.textContent = choice.text;
      wrap.appendChild(text);
      box.appendChild(wrap);
    });
    $('s69Finale').classList.add('show');
  }

  async function s69ChooseFinale(id) {
    haptic('ok');
    try {
      const st = await coopFetch('/api/steps69/' + G.code + '/finale', {
        method: 'POST', json: { choice: id }
      });
      $('s69Finale').classList.remove('show');
      renderS69(st, false);
    } catch (e) {
      if (e.status === 409) {
        // Two different 409s: the partner already fixed the finale (the
        // next poll opens it as chosen), or a piece is somehow not home.
        const detail = (e.detail || '').indexOf('already') >= 0
          ? T().s69FinaleTaken : T().s69FinaleWait;
        toast(detail);
        $('s69Finale').classList.remove('show');
      }
      else s69Error(e);
    }
  }

  function showS69Done(st) {
    stopS69Poll();
    $('s69Finale').classList.remove('show');
    const choice = ((st.finale && st.finale.choices) || [])
      .filter(c => c.id === st.finale_choice)[0];
    $('s69DoneTitle').textContent = T().s69Done;
    $('s69DoneText').textContent = (choice ? choice.text + '\n\n' : '') +
      ((st.finale && st.finale.outro) || T().s69Again);
    $('s69DoneAgain').textContent = T().s69Again;
    $('s69DoneHome').textContent = T().s69ToHome;
    $('s69Done').classList.add('show');
    confetti();
    haptic('ok');
  }

  /* ---- wiring ---- */

  $('btnS69').onclick = openS69;
  $('s69Back').onclick = () => show('home');
  $('s69InviteBack').onclick = () => { stopS69Poll(); G.code = null; show('s69'); };
  $('s69BoardBack').onclick = leaveS69;
  $('btnS69Duo').onclick = () => s69Create('duo');
  $('btnS69Solo').onclick = () => s69Create('solo');
  $('s69Dice').onclick = s69Roll;
  $('s69MapToggle').onclick = () => {
    haptic('light');
    const folded = $('s69Map').classList.toggle('folded');
    $('s69MapHint').style.display = folded ? 'none' : '';
  };
  $('s69InfoClose').onclick = () => $('s69CellInfo').classList.remove('show');
  // A tap beside the card closes it too; a scroll inside it does not.
  $('s69CellInfo').onclick = (e) => {
    if (e.target === $('s69CellInfo')) $('s69CellInfo').classList.remove('show');
  };
  $('btnS69Share').onclick = () => shareInvite(G.invite, T().s69InviteMsg);
  $('btnS69Copy').onclick = () => copyInvite(G.invite);
  $('s69DoneAgain').onclick = () => { $('s69Done').classList.remove('show'); leaveS69(); openS69(); };
  $('s69DoneHome').onclick = leaveS69;

  /* ---------------- boot ---------------- */
  $('btnPlay').onclick = async () => {
    haptic('light');
    if (!DATA) await loadData();
    if (!DATA) return;
    renderThemes();
    show('themes');
  };
  $('backHome').onclick = () => { COOP.creating = false; show('home'); };
  $('backThemes').onclick = () => show('themes');

  applyI18n();
  // Preload content in background for instant start
  loadData();
  renderHomeModules();

  /* ---------------- arriving through a link ---------------- */
  // Two shapes reach us, and both end up here:
  //
  //  * `t.me/<bot>/<app>?startapp=s69_XXXXXX` opens this page directly and
  //    Telegram hands the payload over as `start_param` (and, on some
  //    clients, as `tgWebAppStartParam` in the URL).
  //  * `t.me/<bot>?start=s69_XXXXXX` opens the chat instead; the bot answers
  //    with a button pointing at `?screen=steps69&code=XXXXXX`.
  //
  // Same destination either way, so the partner never types anything.
  const INVITE_SCREENS = { s69: 'steps69', cmp: 'compat', duo: 'coop' };

  function bootTarget() {
    try {
      const q = new URLSearchParams(location.search);
      const param = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param)
                    || q.get('tgWebAppStartParam');
      if (param && param.indexOf('_') > 0) {
        const kind = param.slice(0, param.indexOf('_'));
        const code = param.slice(param.indexOf('_') + 1).trim().toUpperCase();
        // 6 to 16: codes are minted at 16 now, and the short ones live on
        // in links already sent.
        if (INVITE_SCREENS[kind] && code.length >= 6 && code.length <= 16) {
          return { screen: INVITE_SCREENS[kind], code: code };
        }
        // A recognised kind with a mangled code: the partner tapped a
        // truncated or mistyped link. Landing them silently on the home
        // screen told them nothing; say the link is broken. An unknown
        // kind stays silent on purpose - it may be someone else's payload.
        if (INVITE_SCREENS[kind]) return { broken: true };
      }
      const screen = q.get('screen');
      if (screen) {
        const code = (q.get('code') || '').trim().toUpperCase();
        return { screen: screen, code: (code.length >= 6 && code.length <= 16) ? code : null };
      }
    } catch (e) {}
    return null;
  }

  async function boot() {
    const target = bootTarget();
    if (!target) return;
    if (target.broken) { toast(T().inviteBroken); return; }
    if (target.screen === 'library') { openLibrary(); return; }

    if (target.screen === 'steps69') {
      if (!target.code) { openS69(); return; }
      show('s69');
      await s69Join(target.code);
      return;
    }
    if (target.screen === 'compat') {
      if (!target.code) { show('compat'); return; }
      show('compat');
      await compatJoin(target.code);
      return;
    }
    if (target.screen === 'coop') {
      if (!target.code) { show('coop'); return; }
      show('coop');
      await joinCoopRoom(target.code);
      return;
    }
  }

  boot();
})();
</script>

  const THEME_ORDER = ['Acquaintance', 'For Couples', 'Sex', 'Provocation'];

  // The card face each deck is printed on, same mapping the bot reads from
  // assets/backgrounds.yml. What identifies a face differs per deck: the two
  // levelled decks by level, Sex by content type, Provocation by nothing —
  // so each entry says which, rather than the lookup guessing.
  const CARD_ART = {
    'Acquaintance': { by: 'level', faces: { 1: 'acq/acq_1.png', 2: 'acq/acq_2.png', 3: 'acq/acq_3.png' } },
    'For Couples':  { by: 'level', faces: { 1: 'couples/couples_1.png', 2: 'couples/couples_2.png', 3: 'couples/couples_3.png' } },
    // S.type is 'questions' / 'tasks' — the same words rooms.py serves.
    'Sex':          { by: 'type',  faces: { questions: 'sex/questions.png', tasks: 'sex/tasks.png' } },
    'Provocation':  { by: 'deck',  faces: { deck: 'prov/prov.png' } }
  };

  // The Library has one face of its own — no levels, no content types, so no
  // lookup. Same PNG the bot composites the daily push onto.
  const LIBRARY_ART = '/assets/backgrounds/library.png';

  // Returns the URL of the printed face, or null when nothing matches. Null
  // leaves --art unset, so the card renders as a blank pink rectangle with no
  // corner marks: wrong in a way you can see, rather than quietly wearing some
  // other deck's face.
  function cardArt(theme, level, type) {
    const deck = CARD_ART[theme];
    if (!deck) { console.warn('vechnost: no card art for theme', theme); return null; }
    const key = deck.by === 'level' ? level : deck.by === 'type' ? type : 'deck';
    const file = deck.faces[key];
    if (!file) { console.warn('vechnost: no card art for', theme, deck.by, key); return null; }
    return '/assets/backgrounds/' + file;
  }

  /* ---------------- state ---------------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem('vech.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('vech.' + k, JSON.stringify(v)); } catch (e) {} }
  };

  // The Mini App is Russian-only; the server still accepts (and coerces
  // unknown values to) a lang query param, so this stays a constant rather
  // than a widened surface.
  const lang = 'ru';
  let DATA = null;          // themes payload from API
  let S = {                 // current game selection
    theme: null, level: null, type: 'questions',
    order: [], idx: 0, shuffled: false
  };
  let deckDirty = false;    // guards double-swipes during animation
  // Which deck is on the stage, as a number that only ever goes up. flyOut's
  // 300ms timer belongs to the deck that launched it, and the "did they leave?"
  // check inside it asks the *screen element* — which cannot tell two decks
  // apart when they share one: every Library deck is #libDeck, and solo and
  // couple mode are both #deck. Leaving one Library deck for another inside the
  // animation stepped the new deck by one; coop → home → a solo deck inside it
  // ran coopAdvanceAfterFly against a room that no longer existed and left a
  // blank stage with deckDirty stuck on. Every entry point stamps a new
  // generation; the timer stands down if it has moved.
  let deckGen = 0;

  const $ = (id) => document.getElementById(id);
  const T = () => I18N;

  /* ---------------- i18n render ---------------- */
  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (T()[key]) el.textContent = T()[key];
    });
    $('modeQ').textContent = '❓ ' + T().questions;
    $('modeT').textContent = '📝 ' + T().tasks;
  }

  /* ---------------- navigation ---------------- */
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    $(id).classList.add('active');
    try {
      if (tg && tg.BackButton) {
        if (id === 'home') tg.BackButton.hide(); else tg.BackButton.show();
      }
    } catch (e) {}
  }
  if (tg && tg.BackButton) {
    try {
      tg.BackButton.onClick(() => {
        if ($('deck').classList.contains('active')) leaveDeck();
        else if ($('invite').classList.contains('active')) $('inviteBack').click();
        else if ($('coop').classList.contains('active')) show('home');
        else if ($('levels').classList.contains('active')) show('themes');
        else if ($('themes').classList.contains('active')) { COOP.creating = false; show('home'); }
        else if ($('libDeck').classList.contains('active')) libDeckLeave();
        else if ($('libraryDetail').classList.contains('active')) show('library');
        else if ($('library').classList.contains('active')) show('home');
        else if ($('compatResult').classList.contains('active')) show('compat');
        else if ($('compatQuiz').classList.contains('active')) { stopCompatPoll(); show('compat'); }
        else if ($('compatInvite').classList.contains('active')) { stopCompatPoll(); CT.code = null; show('compat'); }
        else if ($('compat').classList.contains('active')) show('home');
        else if ($('s69Board').classList.contains('active')) leaveS69();
        else if ($('s69Invite').classList.contains('active')) $('s69InviteBack').click();
        else if ($('s69').classList.contains('active')) show('home');
      });
    } catch (e) {}
  }

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove('show'), 1700);
  }

  /* ---------------- data ---------------- */
  let ACCESS = { paid: true };
  let BOT_URL = null;

  const fmt = (tpl, vars) => tpl.replace(/\{(\w+)\}/g, (_, k) => vars[k] != null ? vars[k] : '');

  function showPaywall(freeCount, totalCount) {
    $('paywallText').textContent = fmt(T().paywallText, { free: freeCount, total: totalCount });
    $('paywallBuy').textContent = T().paywallBuy + (ACCESS.price ? ' – ' + ACCESS.price : '');
    $('paywallBuy').style.display = ACCESS.payment_url ? '' : 'none';
    $('paywall').classList.add('show');
  }

  $('paywallBuy').onclick = () => {
    const url = ACCESS.payment_url;
    if (!url) return;
    haptic('light');
    try {
      if (tg && url.startsWith('https://t.me')) tg.openTelegramLink(url);
      else if (tg) tg.openLink(url);
      else window.open(url, '_blank');
    } catch (e) { window.open(url, '_blank'); }
  };
  $('paywallClose').onclick = () => { $('paywall').classList.remove('show'); };

  async function loadData() {
    $('loader').classList.add('show');
    try {
      const headers = {};
      if (tg && tg.initData) headers['Authorization'] = 'tma ' + tg.initData;
      const res = await fetch('/api/questions?lang=' + lang, { cache: 'no-cache', headers });
      if (!res.ok) throw new Error('http ' + res.status);
      const json = await res.json();
      DATA = json.themes;
      ACCESS = json.access || { paid: true };
      BOT_URL = json.bot_url || null;
    } catch (e) {
      DATA = null;
      toast(T().loadError);
    } finally {
      $('loader').classList.remove('show');
    }
  }

  function deckSize(src, type) {
    const total = src[type + '_total'];
    return total != null ? total : (src[type] || []).length;
  }

  function themeCounts(themeKey) {
    const th = DATA[themeKey];
    if (!th) return 0;
    let n = 0;
    if (th.levels) Object.values(th.levels).forEach(l => n += deckSize(l, 'questions') + deckSize(l, 'tasks'));
    else n = deckSize(th, 'questions') + deckSize(th, 'tasks');
    return n;
  }

  /* ---------------- themes screen ---------------- */
  function renderThemes() {
    const box = $('themeList');
    box.innerHTML = '';
    THEME_ORDER.forEach(key => {
      if (!DATA || !DATA[key]) return;
      const meta = T().themes[key];
      const btn = document.createElement('button');
      btn.className = 'theme-card ' + meta.grad;
      btn.innerHTML =
        '<span class="t-name">' + meta.name + '</span>' +
        '<span class="t-desc">' + meta.desc + '</span>' +
        '<span class="t-emoji">' + meta.emoji + '</span>' +
        '<span class="t-count">' + themeCounts(key) + '</span>';
      btn.onclick = () => { haptic('light'); pickTheme(key); };
      box.appendChild(btn);
    });
  }

  // One overlay, two callers: the Sex deck and a spicy Library category.
  // The copy is swapped per caller so it always describes what it is gating.
  function showNsfw(kind) {
    $('nsfwText').textContent = kind === 'library' ? T().nsfwLibText : T().nsfwText;
    $('nsfw').classList.add('show');
  }

  function pickTheme(key) {
    S.theme = key;
    const th = DATA[key];
    if (th.nsfw && !store.get('nsfwOk', false)) {
      showNsfw('deck');
      return;
    }
    afterNsfw();
  }

  function afterNsfw() {
    const th = DATA[S.theme];
    if (th.levels) {
      renderLevels();
      show('levels');
    } else if (COOP.creating) {
      createCoopRoom(null);
    } else {
      S.level = null;
      S.type = th.questions ? 'questions' : 'tasks';
      enterDeck();
    }
  }

  $('nsfwYes').onclick = () => {
    store.set('nsfwOk', true);
    $('nsfw').classList.remove('show');
    haptic('ok');
    if (LIB_NSFW_PENDING) {
      const pending = LIB_NSFW_PENDING;
      LIB_NSFW_PENDING = null;
      openLibModule(pending.module, pending.category);
      return;
    }
    afterNsfw();
  };
  $('nsfwNo').onclick = () => {
    LIB_NSFW_PENDING = null;
    $('nsfw').classList.remove('show');
  };

  /* ---------------- levels screen ---------------- */
  function renderLevels() {
    const meta = T().themes[S.theme];
    $('levelsTitle').textContent = meta.emoji + ' ' + meta.name;
    const box = $('levelList');
    box.innerHTML = '';
    Object.keys(DATA[S.theme].levels).sort().forEach(lv => {
      const src = DATA[S.theme].levels[lv];
      const count = deckSize(src, 'questions');
      const freeN = (src.questions || []).length;
      const countLabel = (!ACCESS.paid && freeN < count)
        ? fmt(T().freeCount, { free: freeN, total: count })
        : count;
      const btn = document.createElement('button');
      btn.className = 'level-card';
      btn.innerHTML =
        '<span class="level-num">' + lv + '</span>' +
        '<span class="level-info"><b>' + T().level + ' ' + lv + '</b>' +
        '<span>' + (T().levelDesc[lv] || '') + ' · ' + countLabel + '</span></span>';
      btn.onclick = () => {
        haptic('light');
        if (COOP.creating) { createCoopRoom(lv); return; }
        S.level = lv;
        enterDeck();
      };
      box.appendChild(btn);
    });
  }

  /* ---------------- deck ---------------- */
  function deckItems() {
    const th = DATA[S.theme];
    const src = S.level ? th.levels[S.level] : th;
    return src[S.type] || [];
  }

  function deckKey() {
    return [lang, S.theme, S.level || 0, S.type].join('|');
  }

  function initOrder(forceReset) {
    const items = deckItems();
    const saved = store.get('deck.' + deckKey(), null);
    if (!forceReset && saved && Array.isArray(saved.order) && saved.order.length === items.length) {
      S.order = saved.order; S.idx = Math.min(saved.idx, items.length - 1); S.shuffled = !!saved.shuffled;
      if (S.idx > 0) toast(T().resumed);
    } else {
      S.order = items.map((_, i) => i);
      S.idx = 0; S.shuffled = false;
    }
  }

  function persistDeck() {
    store.set('deck.' + deckKey(), { order: S.order, idx: S.idx, shuffled: S.shuffled });
  }

  function enterDeck(forceReset) {
    deckGen++;                                   // a new deck owns the stage
    drag.onAdvance = null; drag.onBack = null;   // the Library's, if we came from it
    COOP.active = false;
    $('turnChip').style.display = 'none';
    $('btnShuffle').style.display = '';
    $('btnPrev').style.display = '';
    initOrder(forceReset);
    const meta = T().themes[S.theme];
    $('deckTitle').textContent = meta.emoji + ' ' + meta.name + (S.level ? ' · ' + T().level + ' ' + S.level : '');
    const th = DATA[S.theme];
    const hasBoth = !!(S.level ? (th.levels[S.level].questions && th.levels[S.level].tasks) : (th.questions && th.tasks));
    $('modeRow').style.display = hasBoth ? 'flex' : 'none';
    $('modeQ').classList.toggle('on', S.type === 'questions');
    $('modeT').classList.toggle('on', S.type === 'tasks');
    show('deck');
    renderStage(true);
  }

  function leaveDeck() {
    if (COOP.active) { leaveCoop(); return; }
    persistDeck();
    if (DATA[S.theme].levels) show('levels'); else show('themes');
  }

  $('modeQ').onclick = () => switchType('questions');
  $('modeT').onclick = () => switchType('tasks');
  function switchType(t) {
    if (S.type === t) return;
    persistDeck();
    S.type = t;
    haptic('light');
    enterDeck();
  }

  function updateProgress() {
    const total = S.order.length;
    const cur = Math.min(S.idx + 1, total);
    $('progressFill').style.width = (total ? (cur / total) * 100 : 0) + '%';
    $('progressNum').textContent = cur + ' / ' + total;
    $('btnPrev').disabled = S.idx <= 0;
  }

  function cardHTML(text, number, total) {
    const art = cardArt(S.theme, S.level, S.type);
    const style = art ? ' style="--art:url(' + art + ')"' : '';
    return (
      '<div class="flipper">' +
        '<div class="face front"' + style + '>' +
          '<div class="q-zone"><div class="q-text">' + escapeHTML(text) + '</div></div>' +
          '<div class="card-footer">' + T().cardWord + ' ' + number + ' / ' + total + '</div>' +
        '</div>' +
        '<div class="face back"></div>' +
      '</div>'
    );
  }

  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ---------------- long card text ---------------- */
  // A long question scrolls inside .q-zone; these mark which end is actually
  // cut so the CSS fades that end and only that end. Deliberately global
  // rather than wired into renderStage: the game deck, couple mode and
  // anything else built from cardHTML all get it without knowing about it.
  function markZoneEdges(z) {
    const slack = z.scrollHeight - z.clientHeight;
    z.classList.toggle('cut-top', z.scrollTop > 1);
    z.classList.toggle('cut-bottom', slack > 1 && z.scrollTop < slack - 1);
  }
  function refreshZoneEdges() { document.querySelectorAll('.q-zone').forEach(markZoneEdges); }
  // scroll doesn't bubble, so listen in the capture phase.
  document.addEventListener('scroll', e => {
    if (e.target instanceof Element && e.target.classList.contains('q-zone')) markZoneEdges(e.target);
  }, true);
  // New cards arrive as innerHTML; the swapped-in font and a rotation both
  // change how much of the question fits.
  new MutationObserver(refreshZoneEdges).observe(document.body, { childList: true, subtree: true });
  window.addEventListener('resize', refreshZoneEdges);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refreshZoneEdges);

  /* ---------------- stage ---------------- */
  // A card arrives face down and turns over. Shared by every deck, because
  // an animation tuned in one place and not the other is how two decks stop
  // feeling like the same object.
  function flipUp(card) {
    const flipper = card.querySelector('.flipper');
    flipper.classList.add('faced');              // back side up
    requestAnimationFrame(() => setTimeout(() => {
      flipper.classList.remove('faced');         // flip to reveal
      haptic('light');
    }, 260));
  }

  // Lays out a deck's stage: the next card peeking from beneath, the current
  // one on top, swipe attached. `htmlAt(index, number, total)` is the only
  // thing that differs between the game deck and the Library's — everything
  // about how a card sits on the stage is here, once. Returns the top card,
  // or null when there is nothing to show.
  function buildStage(stage, htmlAt, count, idx, withFlip) {
    stage.innerHTML = '';
    if (!count) return null;

    // under-card (next in deck), peeking from beneath
    if (idx + 1 < count) {
      const under = document.createElement('div');
      under.className = 'card under';
      under.style.transform = 'translateY(14px) scale(.94)';
      under.style.opacity = '.7';
      under.innerHTML = htmlAt(idx + 1, idx + 2, count);
      stage.appendChild(under);
    }

    // top card
    const top = document.createElement('div');
    top.className = 'card top';
    top.innerHTML = htmlAt(idx, idx + 1, count);
    stage.appendChild(top);

    if (withFlip) flipUp(top);
    attachSwipe(top);
    deckDirty = false;
    return top;
  }

  function renderStage(withFlip) {
    const items = deckItems();
    const top = buildStage($('stage'),
      (i, number, total) => cardHTML(items[S.order[i]], number, total),
      S.order.length, S.idx, withFlip);
    if (!top) return;
    updateProgress();
  }

  /* ---------------- swipe physics ---------------- */
  // Single global drag state: window listeners are registered once,
  // renderStage only points `drag.card` at the current top card.
  // onAdvance/onBack are how a non-game deck borrows the physics: set, they
  // replace flyOut's game transitions entirely. Null for the game and couple
  // mode, and cleared on the way into both.
  const drag = { card: null, x0: 0, y0: 0, dx: 0, dy: 0, active: false, axis: null,
                 onAdvance: null, onBack: null };

  function attachSwipe(card) {
    drag.card = card;
    card.addEventListener('touchstart', dragStart, { passive: true });
    card.addEventListener('touchmove', dragMove, { passive: true });
    card.addEventListener('touchend', dragEnd);
    card.addEventListener('mousedown', dragStart);
  }

  function dragStart(e) {
    if (deckDirty || !drag.card) return;
    // The turn gate is couple mode's, not the swipe engine's: a Library deck
    // borrowing the physics is never turn-based.
    if (!drag.onAdvance && COOP.active && (!C.st || !C.st.your_turn)) return;
    drag.active = true;
    const p = e.touches ? e.touches[0] : e;
    drag.x0 = p.clientX; drag.y0 = p.clientY; drag.dx = 0; drag.dy = 0;
    drag.axis = null;               // undecided until the gesture commits
    drag.card.style.transition = 'none';
  }
  function dragMove(e) {
    if (!drag.active || !drag.card) return;
    const p = e.touches ? e.touches[0] : e;
    drag.dx = p.clientX - drag.x0; drag.dy = p.clientY - drag.y0;

    // Decide once, at 8px of travel, whether this gesture belongs to the
    // card or to the text scrolling inside it. Without this, reading a long
    // question by scrolling drags the card halfway off the stage.
    if (!drag.axis) {
      if (Math.abs(drag.dx) < 8 && Math.abs(drag.dy) < 8) return;
      drag.axis = Math.abs(drag.dx) > Math.abs(drag.dy) ? 'x' : 'y';
    }
    if (drag.axis === 'y') return;

    drag.card.style.transform =
      'translate(' + drag.dx + 'px,' + (drag.dy * .35) + 'px) rotate(' + (drag.dx * .055) + 'deg)';
  }
  function dragEnd() {
    if (!drag.active || !drag.card) return;
    // A vertical gesture was the text scrolling, not a swipe: leave the card
    // where it is and do not step the deck.
    if (drag.axis === 'y') { drag.active = false; drag.axis = null; return; }
    drag.active = false;
    // Right = next card, left = previous. A left swipe on the first card
    // snaps back; couple mode is turn-based, so left never goes back there.
    // A deck that installed its own callbacks (the Library) is asked about
    // its own position — S.idx is the game's, and would let a swipe off
    // either end of the Library fly the card away to nothing: there is no
    // finishDeck() on that side to put something back on the stage.
    const borrowed = !!drag.onAdvance;
    const canGoBack = borrowed ? LS.idx > 0 : (!COOP.active && S.idx > 0);
    const canGoOn = borrowed ? LS.idx < LS.items.length - 1 : true;
    if (drag.dx > 84 && canGoOn) {
      flyOut(drag.card, 1);
    } else if (drag.dx < -84 && canGoBack) {
      flyOut(drag.card, -1);
    } else {
      drag.card.style.transition = 'transform .3s cubic-bezier(.2,.9,.3,1.2)';
      drag.card.style.transform = '';
    }
    drag.dx = 0; drag.dy = 0; drag.axis = null;
  }
  window.addEventListener('mousemove', dragMove);
  window.addEventListener('mouseup', dragEnd);

  function flyOut(card, dir) {
    if (deckDirty) return;
    deckDirty = true;
    haptic('medium');
    // Who owns this flight is decided now, not in 300ms. The card stays in
    // the air long enough for the user to tap back out of the deck, and
    // everything below used to be read after that: paging the Library and
    // leaving immediately stepped the *game's* saved position, and could put
    // the game's "done" overlay up over the Library.
    const onAdvance = drag.onAdvance, onBack = drag.onBack;
    const wasCoop = COOP.active;
    const screen = document.querySelector('.screen.active');
    const gen = deckGen;
    card.style.transition = 'transform .38s cubic-bezier(.5,.05,.9,.4), opacity .38s';
    card.style.transform = 'translate(' + (dir * (window.innerWidth * 1.1)) + 'px,' + (-40 + Math.random() * 120) + 'px) rotate(' + dir * 24 + 'deg)';
    card.style.opacity = '0';
    setTimeout(() => {
      // A different deck took the stage while this card was in the air. It
      // has its own position and has already cleared deckDirty for its own
      // card, so touch nothing at all — not even the guard.
      if (gen !== deckGen) return;
      // Left the deck mid-flight: nobody is looking at that stage any more,
      // and stepping a deck now would step whichever one they left for.
      if (!screen || !screen.classList.contains('active')) { deckDirty = false; return; }
      // A deck that installed its own transitions (the Library) takes it from
      // here. deckDirty is cleared by buildStage, which this branch never
      // reaches — leave it set and the second swipe is swallowed.
      if (onAdvance) {
        deckDirty = false;
        (dir > 0 ? onAdvance : onBack)();
        return;
      }
      if (wasCoop) {
        coopAdvanceAfterFly();  // couple mode is always forward, server-driven
        return;
      }
      if (dir < 0) {
        // Left swipe: step back to the previous card (guarded by the caller).
        S.idx -= 1;
        persistDeck();
        renderStage(true);
      } else if (S.idx + 1 >= S.order.length) {
        finishDeck();
      } else {
        S.idx += 1;
        persistDeck();
        renderStage(true);
      }
    }, 300);
  }

  $('btnNext').onclick = () => {
    if (COOP.active && (!C.st || !C.st.your_turn)) {
      haptic('light');
      toast(T().notYourTurn);
      return;
    }
    const top = document.querySelector('#stage .card.top');
    if (top) flyOut(top, 1);
  };
  $('btnPrev').onclick = () => {
    if (S.idx <= 0 || deckDirty) return;
    S.idx -= 1;
    persistDeck();
    haptic('light');
    renderStage(true);
  };
  $('btnShuffle').onclick = () => {
    if (deckDirty) return;
    haptic('medium');
    if (!S.shuffled) {
      // Fisher–Yates over the remaining cards, keep the current one on top
      const rest = S.order.slice(S.idx);
      for (let i = rest.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [rest[i], rest[j]] = [rest[j], rest[i]];
      }
      S.order = S.order.slice(0, S.idx).concat(rest);
      S.shuffled = true;
      toast('🔀 ' + T().shuffled);
    } else {
      const cur = S.order[S.idx];
      S.order = deckItems().map((_, i) => i);
      S.idx = S.order.indexOf(cur);
      S.shuffled = false;
      toast(T().ordered);
    }
    persistDeck();
    renderStage(false);
  };
  $('deckBack').onclick = leaveDeck;

  /* ---------------- share ---------------- */
  async function shareCard() {
    if (deckDirty) return;
    let theme, level, type, idx, cardText;
    if (COOP.active) {
      if (!C.st) return;
      theme = C.st.theme; level = C.st.level || 0; type = C.st.type;
      idx = C.st.card_index; cardText = C.st.card_text;
    } else {
      const items = deckItems();
      if (!items.length) return;
      theme = S.theme; level = S.level || 0; type = S.type;
      idx = S.order[S.idx]; cardText = items[idx];
    }
    haptic('light');
    const params = new URLSearchParams({
      theme: theme, idx: idx, level: level, type: type, lang: lang
    });
    $('loader').classList.add('show');
    try {
      const headers = {};
      if (tg && tg.initData) headers['Authorization'] = 'tma ' + tg.initData;
      const res = await fetch('/api/card?' + params, { headers });
      if (!res.ok) throw new Error('http ' + res.status);
      const blob = await res.blob();
      const file = new File([blob], 'vechnost-card.jpg', { type: 'image/jpeg' });
      const shareText = T().shareText + (BOT_URL ? '\n' + BOT_URL : '');
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text: shareText });
        haptic('ok');
      } else if (tg && BOT_URL) {
        const text = cardText + '\n\n' + shareText;
        tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(BOT_URL) + '&text=' + encodeURIComponent(text));
      } else {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'vechnost-card.jpg';
        a.click();
        URL.revokeObjectURL(a.href);
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return; // user closed the share sheet
      toast(T().shareError);
    } finally {
      $('loader').classList.remove('show');
    }
  }
  $('btnShare').onclick = shareCard;

  /* ---------------- finish ---------------- */
  function deckTotalFull() {
    const th = DATA[S.theme];
    const src = S.level ? th.levels[S.level] : th;
    return deckSize(src, S.type);
  }

  function finishDeck() {
    haptic('ok');
    S.idx = S.order.length - 1;
    persistDeck();
    const freeN = S.order.length;
    const full = deckTotalFull();
    if (!ACCESS.paid && full > freeN) {
      showPaywall(freeN, full);
      return;
    }
    document.querySelector('#done p').textContent = T().doneText;
    $('done').classList.add('show');
    confetti();
  }
  function confetti() {
    const colors = ['#E86BB5', '#C4256E', '#8E7CF3', '#F98D68', '#FFD9EF'];
    for (let i = 0; i < 60; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
      c.style.animationDelay = (Math.random() * .6) + 's';
      c.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
      document.getElementById('shell').appendChild(c);
      setTimeout(() => c.remove(), 4200);
    }
  }
  $('btnAgain').onclick = () => {
    $('done').classList.remove('show');
    if (COOP.active) { leaveCoop(); return; }
    enterDeck(true);
  };
  $('btnToThemes').onclick = () => {
    $('done').classList.remove('show');
    if (COOP.active) { leaveCoop(); return; }
    show('themes');
  };

  /* ---------------- coop (couple mode) ---------------- */
  const COOP = { creating: false, active: false };
  const C = { code: null, st: null, timer: null };

  let guestId = store.get('guestId', null);
  if (!guestId) {
    guestId = Math.random().toString(36).slice(2, 12);
    store.set('guestId', guestId);
  }

  function coopHeaders(json) {
    const h = { 'X-Guest-Id': guestId };
    if (tg && tg.initData) h['Authorization'] = 'tma ' + tg.initData;
    if (json) h['Content-Type'] = 'application/json';
    return h;
  }

  async function coopFetch(path, opts) {
    opts = opts || {};
    const res = await fetch(path + (path.includes('?') ? '&' : '?') + 'lang=' + lang, {
      method: opts.method || 'GET',
      headers: coopHeaders(!!opts.json),
      body: opts.json ? JSON.stringify(opts.json) : undefined
    });
    if (!res.ok) { const e = new Error('http ' + res.status); e.status = res.status; throw e; }
    return res.json();
  }

  function coopError(e) {
    if (e.status === 409) toast(T().coopFull);
    else if (e.status === 404 || e.status === 410) toast(T().coopGone);
    else toast(T().loadError);
  }

  function stopCoopPoll() {
    if (C.timer) { clearInterval(C.timer); C.timer = null; }
  }

  function startCoopPoll(onState) {
    stopCoopPoll();
    C.timer = setInterval(async () => {
      if (!C.code) return;
      try {
        const st = await coopFetch('/api/rooms/' + C.code);
        onState(st);
      } catch (e) {
        if (e.status === 404 || e.status === 410) {
          stopCoopPoll();
          toast(T().coopGone);
          leaveCoop();
        }
      }
    }, 2500);
  }

  async function createCoopRoom(level) {
    COOP.creating = false;
    $('loader').classList.add('show');
    try {
      const st = await coopFetch('/api/rooms', {
        method: 'POST',
        json: { theme: S.theme, level: level, type: 'questions' }
      });
      C.code = st.code; C.st = st;
      $('inviteCode').textContent = st.code;
      $('inviteWaiting').textContent = T().inviteWaiting;
      show('invite');
      startCoopPoll(st2 => {
        C.st = st2;
        if (st2.started) {
          stopCoopPoll();
          haptic('ok');
          toast(fmt(T().partnerJoined, { name: st2.players.guest || '' }));
          enterCoopDeck();
        }
      });
    } catch (e) {
      coopError(e);
    } finally {
      $('loader').classList.remove('show');
    }
  }

  async function joinCoopRoom() {
    const code = ($('coopCodeInput').value || '').trim().toUpperCase();
    if (code.length < 4) return;
    haptic('light');
    $('loader').classList.add('show');
    try {
      const st = await coopFetch('/api/rooms/' + code + '/join', { method: 'POST' });
      C.code = st.code; C.st = st;
      enterCoopDeck();
    } catch (e) {
      coopError(e);
    } finally {
      $('loader').classList.remove('show');
    }
  }

  function coopThemeMeta() {
    return T().themes[C.st.theme] || { name: C.st.theme, emoji: '👥' };
  }

  function enterCoopDeck() {
    deckGen++;                                   // a new deck owns the stage
    drag.onAdvance = null; drag.onBack = null;   // the Library's, if we came from it
    COOP.active = true;
    // cardHTML picks the printed face from all three of these, and the room
    // is the only thing that knows which deck the pair is actually playing.
    // Copying only the theme left level and type at whatever a previous solo
    // deck happened to set, so the pair got the wrong card.
    S.theme = C.st.theme;
    S.level = C.st.level || null;
    S.type = C.st.type;
    const meta = coopThemeMeta();
    $('deckTitle').textContent = '👥 ' + meta.name + (C.st.level ? ' · ' + T().level + ' ' + C.st.level : '');
    $('modeRow').style.display = 'none';
    $('btnShuffle').style.display = 'none';
    $('btnPrev').style.display = 'none';
    show('deck');
    renderCoopStage(true);
    startCoopPoll(st => {
      const prevIdx = C.st ? C.st.idx : -1;
      const wasFinished = C.st ? C.st.finished : false;
      C.st = st;
      if (st.finished && !wasFinished) { coopFinish(); return; }
      if (st.idx !== prevIdx) {
        coopFlyTop(() => renderCoopStage(true));
      } else {
        updateCoopHud();
      }
    });
  }

  function coopFlyTop(cb) {
    const top = document.querySelector('#stage .card.top');
    if (!top) { cb(); return; }
    top.style.transition = 'transform .38s cubic-bezier(.5,.05,.9,.4), opacity .38s';
    top.style.transform = 'translate(' + window.innerWidth * 1.1 + 'px,-30px) rotate(20deg)';
    top.style.opacity = '0';
    setTimeout(cb, 300);
  }

  async function coopAdvanceAfterFly() {
    try {
      const st = await coopFetch('/api/rooms/' + C.code + '/advance', { method: 'POST' });
      C.st = st;
      haptic('medium');
      if (st.finished) { coopFinish(); return; }
      renderCoopStage(true);
    } catch (e) {
      // Turn was probably taken by a race; resync.
      try { C.st = await coopFetch('/api/rooms/' + C.code); } catch (e2) {}
      renderCoopStage(false);
      if (e.status === 403) toast(T().notYourTurn);
      else coopError(e);
    }
  }

  function updateCoopHud() {
    if (!C.st) return;
    const total = C.st.total || 1;
    $('progressFill').style.width = ((C.st.idx + 1) / total) * 100 + '%';
    $('progressNum').textContent = (C.st.idx + 1) + ' / ' + total;
    const chip = $('turnChipText');
    $('turnChip').style.display = 'flex';
    if (!C.st.started) {
      chip.textContent = T().inviteWaiting;
      chip.className = 'chip';
    } else if (C.st.your_turn) {
      chip.textContent = T().yourTurn;
      chip.className = 'chip turn-you';
    } else {
      chip.textContent = fmt(T().partnerTurn, { name: C.st.turn_name || '…' });
      chip.className = 'chip';
    }
  }

  // Not buildStage: couple mode has no under-card to draw. The room sends one
  // card at a time and the next one does not exist client-side until the
  // server says whose turn it is. It shares the flip, which is the part worth
  // keeping in step.
  function renderCoopStage(withFlip) {
    const stage = $('stage');
    stage.innerHTML = '';
    if (!C.st || !C.st.total) return;
    const top = document.createElement('div');
    top.className = 'card top';
    top.innerHTML = cardHTML(C.st.card_text, C.st.idx + 1, C.st.total);
    stage.appendChild(top);
    if (withFlip) flipUp(top);
    attachSwipe(top);
    updateCoopHud();
    deckDirty = false;
  }

  function coopFinish() {
    stopCoopPoll();
    haptic('ok');
    document.querySelector('#done p').textContent = T().coopDoneText;
    $('done').classList.add('show');
    confetti();
  }

  function leaveCoop() {
    stopCoopPoll();
    COOP.active = false;
    COOP.creating = false;
    C.code = null; C.st = null;
    $('turnChip').style.display = 'none';
    $('btnShuffle').style.display = '';
    $('btnPrev').style.display = '';
    show('home');
  }

  $('btnCoop').onclick = () => { haptic('light'); $('coopCodeInput').value = ''; show('coop'); };
  $('coopBack').onclick = () => show('home');
  $('btnCoopJoin').onclick = joinCoopRoom;
  $('coopCodeInput').addEventListener('keydown', e => { if (e.key === 'Enter') joinCoopRoom(); });
  $('btnCoopCreate').onclick = async () => {
    haptic('light');
    if (!DATA) await loadData();
    if (!DATA) return;
    COOP.creating = true;
    renderThemes();
    show('themes');
  };
  $('inviteBack').onclick = () => { stopCoopPoll(); C.code = null; C.st = null; show('coop'); };
  $('btnInviteShare').onclick = () => {
    if (!C.code) return;
    haptic('light');
    const text = fmt(T().coopInviteMsg, { bot: BOT_URL || 'VECHNOST', code: C.code });
    const url = 'https://t.me/share/url?url=' + encodeURIComponent(BOT_URL || '') + '&text=' + encodeURIComponent(text);
    try {
      if (tg) tg.openTelegramLink(url); else window.open(url, '_blank');
    } catch (e) { window.open(url, '_blank'); }
  };

  /* ---------------- library ---------------- */
  let LIB_NSFW_PENDING = null;   // {module, category} to open after the 18+ overlay

  // The 18+ flag is device-scoped and shared with the Sex deck, so it is only
  // ever sent — and only ever asked for — when the user reaches for something
  // explicit. Everything else in a module stays open without it.
  const libNsfwParam = () => store.get('nsfwOk', false) ? '&nsfw=1' : '';

  async function libFetch(path) {
    const headers = {};
    if (tg && tg.initData) headers['Authorization'] = 'tma ' + tg.initData;
    const res = await fetch(path, { cache: 'no-cache', headers });
    if (!res.ok) throw new Error('http ' + res.status);
    return res.json();
  }

  async function openLibrary() {
    show('library');
    $('loader').classList.add('show');
    try {
      const data = await libFetch('/api/library?lang=' + lang + libNsfwParam());
      const box = $('libraryList');
      box.innerHTML = data.modules.map(m => `
        <button class="theme-card lib-mod" data-module="${m.id}">
          <span class="t-emoji">${m.emoji}</span>
          <span class="t-name">${escapeHTML(m.title)}</span>
          <span class="t-desc">${m.count}${m.locked ? ' · 🔒' : ''}</span>
        </button>`).join('');
      box.querySelectorAll('[data-module]').forEach(btn => {
        btn.onclick = () => openLibModule(btn.dataset.module);
      });
    } catch (e) {
      toast(T().libLoadError);
    } finally {
      $('loader').classList.remove('show');
    }
  }

  async function openLibModule(id, openCategory) {
    $('loader').classList.add('show');
    try {
      const data = await libFetch(`/api/library/${id}?lang=${lang}${libNsfwParam()}`);
      const title = data.emoji + ' ' + data.title;

      // A daily or practice module is one deck and nothing else — no category
      // screen to stop at on the way in, or back out to.
      const items = libItems(data);
      if (items) { libDeckOpen(items, title, openLibrary); return; }

      // Nor is a `list` module that only has one category: the screen below
      // would be a single button between the module and its deck. Open the
      // deck, and hand it a `back` that skips the screen nobody saw. Guarded
      // on nsfw_withheld, because a withheld category is a second row — the
      // choice is real again, and the user needs the screen to reach it.
      const cats = data.categories || [];
      if (cats.length === 1 && !(data.nsfw_withheld || []).length) {
        openLibCategory(data, id, cats[0].id, openLibrary);
        return;
      }

      $('libDetailTitle').textContent = title;
      $('libDetailBody').innerHTML = renderLibCategories(data);
      const buy = $('libBuy');
      if (buy) buy.onclick = () => { haptic('light'); $('paywallBuy').click(); };
      $('libDetailBody').querySelectorAll('[data-cat]').forEach(row => {
        row.onclick = () => { haptic('light'); openLibCategory(data, id, row.dataset.cat); };
      });
      $('libDetailBody').querySelectorAll('[data-nsfw-cat]').forEach(row => {
        row.onclick = () => {
          haptic('light');
          LIB_NSFW_PENDING = { module: id, category: row.dataset.nsfwCat };
          showNsfw('library');
        };
      });
      show('libraryDetail');
      // The 18+ path lands back here naming the category it was refused. The
      // server is sending it now, so open it rather than making the user find
      // it again. The category screen stays underneath as the way back.
      if (openCategory) openLibCategory(data, id, openCategory);
    } catch (e) {
      toast(T().libLoadError);
    } finally {
      $('loader').classList.remove('show');
    }
  }

  // The category screen of a `list` module: a button per category into its
  // deck, the 18+ ones by title only, and the purchase prompt if the server
  // truncated what it sent.
  function renderLibCategories(data) {
    const visible = data.categories.map(c => `
      <button class="lib-cat lib-cat-open" data-cat="${escapeHTML(c.id)}">
        ${escapeHTML(c.title)} · ${c.items.length}${c.items.length < c.total ? '/' + c.total : ''}
      </button>`).join('');
    // Categories the server withheld for want of an 18+ confirmation: shown by
    // title only, and tapping one raises the overlay.
    const withheld = (data.nsfw_withheld || []).map(c => `
      <button class="lib-cat lib-cat-nsfw" data-nsfw-cat="${escapeHTML(c.id)}">
        🔞 ${escapeHTML(c.title)} · ${c.total}
      </button>`).join('');
    return visible + withheld + libLockedFooter(data);
  }

  // `back` overrides where the deck's back arrow goes. The single-category
  // fast path passes openLibrary, because returning to openLibModule would
  // re-run the fast path and trap the user in the deck.
  function openLibCategory(data, id, catId, back) {
    const cat = (data.categories || []).find(c => c.id === catId);
    if (!cat || !cat.items.length) return;
    const items = cat.items.map((t, i) => ({
      text: escapeHTML(t), footer: (i + 1) + ' / ' + cat.items.length
    }));
    const lock = libLockCard(cat.items.length, cat.total);
    if (lock) items.push(lock);
    // Back goes to the category screen, never to this same category — passing
    // catId here would re-open the deck the user just left.
    libDeckOpen(items, cat.title, back || (() => openLibModule(id)));
  }

  function libLockedFooter(data) {
    if (!data.locked) return '';
    const note = fmt(T().libFreeNote, { free: data.free_count, total: data.total });
    // Same rule as showPaywall: no payment link, no button that does nothing.
    if (!ACCESS.payment_url) return `<div class="lib-locked"><p>${note}</p></div>`;
    const price = ACCESS.price ? ' – ' + ACCESS.price : '';
    return `<div class="lib-locked">
      <p>${note}</p>
      <button class="btn btn-play" id="libBuy">${T().libLocked}${price}</button>
    </div>`;
  }

  /* ---------------- library deck ---------------- */
  // The Library reuses the game's swipe physics but keeps its own state: the
  // two decks are never on screen at once, and sharing S would mean a Library
  // card could resume into the middle of a game deck.
  const LS = { items: [], idx: 0, count: 0, back: null };

  // `item.text` is HTML: the builders below escape the content once and then
  // add their own markup, so escaping again here would print the tags. Every
  // string that reaches `text` must have gone through escapeHTML already.
  function libCardHTML(item, number, total) {
    return (
      '<div class="flipper">' +
        '<div class="face front" style="--art:url(' + LIBRARY_ART + ')">' +
          '<div class="q-zone"><div class="q-text">' + item.text + '</div></div>' +
          '<div class="card-footer">' + escapeHTML(item.footer || (number + ' / ' + total)) + '</div>' +
        '</div>' +
        '<div class="face back"></div>' +
      '</div>'
    );
  }

  // The card text for each module type. Everything is escaped here, once.
  // A `list` module returns null: it goes through its categories first.
  function libItems(data) {
    if (data.type === 'daily') {
      return [{ text: escapeHTML(data.question),
                footer: fmt(T().libDayOf, { day: data.day }) }];
    }
    if (data.type === 'practice') {
      const items = data.items.map((p, i) => ({
        text: '<b>' + escapeHTML(p.title) + '</b><br><br>' +
              '<span class="q-sub"><b>' + escapeHTML(T().libWhy) + ':</b> ' + escapeHTML(p.why) + '</span><br>' +
              '<span class="q-sub"><b>' + escapeHTML(T().libResult) + ':</b> ' + escapeHTML(p.result) + '</span>',
        footer: (i + 1) + ' / ' + data.items.length
      }));
      const lock = libLockCard(data.items.length, data.total);
      if (lock) items.push(lock);
      return items;
    }
    return null;
  }

  // The last card of a deck the server truncated. A locked `list` module also
  // says so on its category screen, but a practice module has no category
  // screen — and either way the end of the deck is where the truncation is
  // felt, so that is where the prompt belongs.
  function libLockCard(shown, total) {
    if (!(shown < total)) return null;
    const note = escapeHTML(fmt(T().libFreeNote, { free: shown, total: total }));
    // Same rule as showPaywall: no payment link, no button that does nothing.
    const cta = ACCESS.payment_url
      ? '<button class="btn btn-play q-lock">' +
        escapeHTML(T().libLocked + (ACCESS.price ? ' – ' + ACCESS.price : '')) + '</button>'
      : '';
    // A dash, not a position: this card is not the deck's Nth item, and
    // repeating the last content card's number reads as a rendering fault.
    return { text: '<b>🔒</b><br><br>' + note + cta, footer: '–', lock: true };
  }

  function renderLibStage(withFlip) {
    const top = buildStage($('libStage'),
      (i, number, total) => libCardHTML(LS.items[i], number, total),
      LS.items.length, LS.idx, withFlip);
    if (!top) return;
    // Only the top card's button: the under card carries a copy of the same
    // markup, and .card.under is pointer-events:none so it cannot be tapped.
    top.querySelectorAll('.q-lock').forEach(b => {
      b.onclick = () => { haptic('light'); $('paywallBuy').click(); };
    });
    // The lock card is not content: the progress counts what there is to read.
    const cur = Math.min(LS.idx + 1, LS.count);
    $('libProgressFill').style.width = (LS.count ? (cur / LS.count) * 100 : 0) + '%';
    $('libProgressNum').textContent = cur + ' / ' + LS.count;
    $('libPrev').disabled = LS.idx <= 0;
    $('libNext').disabled = LS.idx >= LS.items.length - 1;
  }

  function libNext() { if (LS.idx < LS.items.length - 1) { LS.idx++; renderLibStage(true); } }
  function libPrev() { if (LS.idx > 0) { LS.idx--; renderLibStage(true); } }

  function libDeckOpen(items, title, back) {
    deckGen++;                // a new deck owns the stage, same #libDeck or not
    LS.items = items;
    LS.idx = 0;
    LS.count = items.filter(i => !i.lock).length;
    LS.back = back;
    $('libDeckTitle').textContent = title;
    // The swipe engine belongs to whoever is on screen; these send it here.
    drag.onAdvance = libNext;
    drag.onBack = libPrev;
    deckDirty = false;
    show('libDeck');
    renderLibStage(true);
  }

  function libDeckLeave() {
    drag.onAdvance = null; drag.onBack = null;
    (LS.back || openLibrary)();
  }

  $('libPrev').onclick = () => { if (!deckDirty) libPrev(); };
  $('libNext').onclick = () => {
    const top = document.querySelector('#libStage .card.top');
    if (top && LS.idx < LS.items.length - 1) flyOut(top, 1);
  };
  $('libDeckBack').onclick = libDeckLeave;

  $('btnLibrary').onclick = () => { haptic('light'); openLibrary(); };
  $('libBackHome').onclick = () => show('home');
  // Re-fetch rather than just show: an 18+ confirmation taken inside a module
  // changes the counts on the index, and the two screens must agree.
  $('libBack').onclick = () => openLibrary();

  /* ---------------- compatibility test ---------------- */
  // `pending` is an answer POST in flight; `resultCode` is the test whose
  // result is currently on the result screen, which /mine may set to a
  // different code than the one being played.
  const CT = { code: null, st: null, timer: null, questions: null, idx: 0,
               pending: false, resultCode: null };

  function stopCompatPoll() {
    if (CT.timer) { clearInterval(CT.timer); CT.timer = null; }
  }

  function startCompatPoll() {
    stopCompatPoll();
    CT.timer = setInterval(async () => {
      if (!CT.code) return;
      try {
        const st = await coopFetch('/api/compat/' + CT.code);
        CT.st = st;
        onCompatState(st);
      } catch (e) {
        if (e.status === 404) { stopCompatPoll(); toast(T().coopGone); show('compat'); }
      }
    }, 2500);
  }

  function onCompatState(st) {
    if (st.finished) { stopCompatPoll(); loadCompatResult(CT.code); return; }
    if ($('compatInvite').classList.contains('active') && st.started) { enterCompatQuiz(); return; }
    if ($('compatQuiz').classList.contains('active')) {
      $('compatPartnerProgress').textContent =
        fmt(T().compatWaitingPartner, { n: st.partner_answered, total: st.total });
    }
  }

  async function loadCompatQuestions() {
    if (CT.questions) return CT.questions;
    const data = await coopFetch('/api/compat/questions');
    CT.questions = [];
    data.spheres.forEach(s => s.questions.forEach(q =>
      CT.questions.push({ sphere: s.title, text: q })));
    CT.scale = data.scale;
    return CT.questions;
  }

  // The first question the caller has *not* answered. The test is meant to be
  // taken over hours or days, so re-entering must not restart all 40.
  // `answered_indices` is the caller's own; the server never sends the
  // partner's.
  function compatResumeIndex(st) {
    const done = new Set(st.answered_indices || []);
    for (let i = 0; i < st.total; i++) if (!done.has(i)) return i;
    return st.total;
  }

  function adoptCompatState(st) {
    CT.code = st.code;
    CT.st = st;
    CT.pending = false;
    CT.idx = compatResumeIndex(st);
    // Remembered so the intro screen can offer the code back: without it a
    // creator who closes the app mid-quiz has no way to name their own test.
    store.set('compatCode', st.code);
    $('compatCodeInput').value = st.code;
  }

  async function compatCreate() {
    $('loader').classList.add('show');
    try {
      const st = await coopFetch('/api/compat', { method: 'POST', json: {} });
      adoptCompatState(st);
      $('compatCode').textContent = st.code;
      $('compatWaiting').textContent = T().inviteWaiting;
      show('compatInvite');
      startCompatPoll();
    } catch (e) {
      if (e.status === 402) toast(T().compatPaywall); else toast(T().loadError);
    } finally { $('loader').classList.remove('show'); }
  }

  async function compatJoin(code) {
    $('loader').classList.add('show');
    try {
      const st = await coopFetch('/api/compat/' + code + '/join', { method: 'POST', json: {} });
      adoptCompatState(st);
      startCompatPoll();
      if (st.finished) { loadCompatResult(st.code); return; }
      // The creator re-opening their own test before the partner has joined
      // belongs on the invite screen, not in a quiz they cannot answer yet.
      if (!st.started) {
        $('compatCode').textContent = st.code;
        $('compatWaiting').textContent = T().inviteWaiting;
        show('compatInvite');
        return;
      }
      if (CT.idx > 0 && CT.idx < st.total) toast(fmt(T().compatResume, { n: CT.idx + 1 }));
      enterCompatQuiz();
    } catch (e) {
      if (e.status === 409) toast(T().coopFull);
      else if (e.status === 404) toast(T().coopGone);
      else toast(T().loadError);
    } finally { $('loader').classList.remove('show'); }
  }

  async function enterCompatQuiz() {
    await loadCompatQuestions();
    show('compatQuiz');
    renderCompatQuestion();
  }

  function renderCompatQuestion() {
    const total = CT.questions.length;
    if (CT.idx >= total) {
      $('compatQuestion').innerHTML = '<p class="compat-q">' + escapeHTML(T().compatDone) + '</p>';
      $('compatScale').innerHTML = '';
      return;
    }
    const q = CT.questions[CT.idx];
    $('compatSphereTitle').textContent = q.sphere;
    $('compatProgress').style.width = (CT.idx / total * 100) + '%';
    $('compatProgressNum').textContent = (CT.idx + 1) + ' / ' + total;
    $('compatQuestion').innerHTML = '<p class="compat-q">' + escapeHTML(q.text) + '</p>';
    $('compatScale').innerHTML = CT.scale.map((label, i) =>
      `<button class="btn btn-second compat-opt" data-value="${i + 1}">${escapeHTML(label)}</button>`
    ).join('');
    $('compatScale').querySelectorAll('.compat-opt').forEach(btn => {
      btn.onclick = () => submitCompatAnswer(parseInt(btn.dataset.value, 10));
    });
    setCompatScaleEnabled(!CT.pending);
  }

  function setCompatScaleEnabled(on) {
    $('compatScale').querySelectorAll('.compat-opt').forEach(btn => { btn.disabled = !on; });
  }

  async function submitCompatAnswer(value) {
    // One answer in flight at a time. Each POST is a read-modify-write of the
    // whole 40-slot array server-side, so overlapping them is how an answer
    // goes missing and the couple sits at 39/40 with no way to find it.
    if (CT.pending) return;
    haptic('light');
    const index = CT.idx;
    CT.pending = true;
    CT.idx += 1;
    renderCompatQuestion();  // next question up front; its buttons stay dead
    try {
      const st = await coopFetch('/api/compat/' + CT.code + '/answer', {
        method: 'POST', json: { index, value }
      });
      CT.st = st;
      CT.pending = false;
      if (st.finished) { stopCompatPoll(); loadCompatResult(CT.code); return; }
      setCompatScaleEnabled(true);
    } catch (e) {
      CT.pending = false;
      // Completed under us, or the partner has not joined yet; the poll or
      // the result screen will catch up. Re-enable so the screen is not stuck.
      if (e.status === 409) { setCompatScaleEnabled(true); return; }
      CT.idx = index;
      renderCompatQuestion();
      toast(T().loadError);
    }
  }

  async function loadCompatResult(code) {
    $('loader').classList.add('show');
    try {
      const data = await coopFetch('/api/compat/' + code + '/result');
      showCompatResult(data, code);
    } catch (e) {
      toast(T().loadError);
    } finally { $('loader').classList.remove('show'); }
  }

  function showCompatResult(result, code) {
    CT.resultCode = code;
    $('compatResultBody').innerHTML = renderCompatResult(result);
    $('compatDeleteBtn').onclick = () => compatDelete(code);
    show('compatResult');
  }

  // Telegram's native confirm where it exists, the browser's otherwise.
  function compatConfirm(message) {
    return new Promise(resolve => {
      try {
        if (tg && tg.showConfirm) { tg.showConfirm(message, ok => resolve(!!ok)); return; }
      } catch (e) {}
      resolve(window.confirm(message));
    });
  }

  async function compatDelete(code) {
    if (!await compatConfirm(T().compatDeleteConfirm)) return;
    $('loader').classList.add('show');
    try {
      await coopFetch('/api/compat/' + code, { method: 'DELETE' });
      stopCompatPoll();
      if (store.get('compatCode', null) === code) store.set('compatCode', null);
      if (CT.code === code) { CT.code = null; CT.st = null; CT.idx = 0; }
      CT.resultCode = null;
      $('compatCodeInput').value = '';
      toast(T().compatDeleted);
      show('compat');
    } catch (e) {
      toast(e.status === 404 ? T().coopGone : T().loadError);
    } finally { $('loader').classList.remove('show'); }
  }

  const COMPAT_ZONE_LABEL = () => ({
    strength: T().compatZoneStrength,
    growth: T().compatZoneGrowth,
    crisis: T().compatZoneCrisis
  });

  function renderCompatResult(r) {
    const zoneLabel = COMPAT_ZONE_LABEL();
    const sphereCard = (s, extra) => `
      <div class="lib-card compat-${s.zone}">
        <div class="lib-card-title">${escapeHTML(s.title)} · ${escapeHTML(zoneLabel[s.zone])}</div>
        ${extra || ''}
        <div class="lib-card-line">${escapeHTML(s.verdict)}</div>
        ${s.divergent.length ? `<div class="lib-card-line">№ ${s.divergent.join(', ')}</div>` : ''}
      </div>`;

    const strengths = r.strengths.length
      ? r.strengths.map(s => sphereCard(s)).join('')
      : `<p class="lib-card-line">${escapeHTML(r.strengths_fallback)}</p>`;

    // No sphere qualifies for attention when the couple is strong across
    // the board — omit the whole block, heading included, rather than show
    // a heading over nothing.
    const attention = r.attention.length
      ? `<h3 class="compat-h">${escapeHTML(T().compatAttention)}</h3>
         ${r.attention.map(a => sphereCard(a.sphere, a.framing
           ? `<div class="lib-card-line"><i>${escapeHTML(a.framing)}</i></div>`
           : '')).join('')}`
      : '';

    // The recommendation text quotes divergent question numbers; with none
    // to quote it would read as "Обсудите вопросы №" with nothing after
    // the sign, so omit the line entirely instead.
    const recommendation = r.divergent_all.length
      ? `<div class="lib-card"><div class="lib-card-line">${escapeHTML(r.recommendation)}</div></div>`
      : '';

    // How the eight spheres split across the three zones, under the headline
    // percentage: one number says how close the couple is, this says how that
    // closeness is distributed. All three are listed even at zero — a missing
    // line would read as "not measured" rather than "none".
    const zoneCounts = ['strength', 'growth', 'crisis']
      .map(z => escapeHTML(zoneLabel[z]) + ': ' + r.spheres.filter(s => s.zone === z).length)
      .join(' · ');

    return `
      <div class="compat-percent">${r.percent}%</div>
      <p class="compat-zones">${zoneCounts}</p>
      <h3 class="compat-h">${escapeHTML(T().compatStrengths)}</h3>
      ${strengths}
      ${attention}
      ${recommendation}
      ${r.critical_blocks.map(b =>
        `<div class="lib-card compat-crisis"><div class="lib-card-line">${escapeHTML(b)}</div></div>`).join('')}
      <h3 class="compat-h">${escapeHTML(T().compatAll)}</h3>
      ${r.spheres.map(s => sphereCard(s)).join('')}
      <button class="btn btn-second compat-danger" id="compatDeleteBtn">${escapeHTML(T().compatDelete)}</button>`;
  }

  $('btnCompat').onclick = () => {
    haptic('light');
    // Offer the last test back so an interrupted run is one tap from resuming.
    const saved = store.get('compatCode', null);
    if (saved && !$('compatCodeInput').value) $('compatCodeInput').value = saved;
    show('compat');
  };
  $('compatBack').onclick = () => { stopCompatPoll(); show('home'); };
  $('compatInviteBack').onclick = () => { stopCompatPoll(); CT.code = null; show('compat'); };
  $('compatQuizBack').onclick = () => { stopCompatPoll(); show('compat'); };
  $('compatResultBack').onclick = () => show('compat');
  $('btnCompatCreate').onclick = compatCreate;
  $('btnCompatJoin').onclick = () => {
    const code = ($('compatCodeInput').value || '').trim().toUpperCase();
    if (code.length === 6) compatJoin(code);
  };
  $('compatCodeInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnCompatJoin').click(); });
  $('btnCompatMine').onclick = async () => {
    try {
      const data = await coopFetch('/api/compat/mine');
      showCompatResult(data.result, data.code);
    } catch (e) {
      toast(e.status === 404 ? T().compatNoResult : T().loadError);
    }
  };
  $('btnCompatShare').onclick = () => {
    // Its own message, not coopInviteMsg: that one sends the partner to
    // «Играть вдвоём», where the code hits /api/rooms and 404s. Both features
    // draw six-character codes from the same alphabet, so the wrong door
    // fails confusingly rather than obviously.
    const msg = fmt(T().compatInviteMsg, { bot: BOT_URL || 'VECHNOST', code: CT.code });
    try {
      if (tg) tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(msg));
      else navigator.clipboard.writeText(msg);
      haptic('light');
    } catch (e) { toast(T().shareError); }
  };

  /* ---------------- 69 ступеней ---------------- */
  // Reuses coopFetch: the same auth headers, the same guest-id fallback, the
  // same error shape. Its own state, because a board is not a deck.
  const G = {
    code: null,      // the game being played
    st: null,        // last state from the server
    board: null,     // the map, fetched once per game
    timer: null,     // poll handle
    seen: 0,         // highest reaction seq already animated
    rolling: false,  // guards a double tap on the dice
    settling: null   // portal animation timer
  };

  const S69_REACTIONS = ['🔥', '❤️', '💦', '😈', '👏'];
  const S69_COLS = 6;

  function s69Error(e) {
    if (e.status === 402) { showS69Paywall(); return; }
    if (e.status === 409) { toast(T().s69Full); return; }
    if (e.status === 404 || e.status === 410) { toast(T().s69Gone); return; }
    if (e.status === 403) { toast(T().s69NotYourTurn); return; }
    toast(T().loadError);
  }

  function showS69Paywall() {
    $('paywallText').textContent = T().s69Paywall;
    $('paywallBuy').textContent = T().paywallBuy + (ACCESS.price ? ' – ' + ACCESS.price : '');
    $('paywallBuy').style.display = ACCESS.payment_url ? '' : 'none';
    $('paywall').classList.add('show');
  }

  // The brief asks for a happy buzz on a ladder and a sad double one on a
  // snake, and for a buzz when a secret turns up.
  function s69Haptic(kind) {
    if (kind === 'ladder') { haptic('ok'); return; }
    if (kind === 'snake') { haptic('heavy'); setTimeout(() => haptic('heavy'), 150); return; }
    if (kind === 'secret' || kind === 'joker') haptic('medium');
  }

  /* ---- entry ---- */

  async function openS69() {
    haptic('light');
    const saved = store.get('s69Code', null);
    if (saved && !$('s69CodeInput').value) $('s69CodeInput').value = saved;
    show('s69');
    // Offer the game in play back, so a pair who stopped on cell 45 are one
    // tap from cell 45 rather than from cell 1.
    $('btnS69Resume').style.display = 'none';
    try {
      const st = await coopFetch('/api/steps69/mine');
      $('btnS69Resume').textContent =
        T().s69Resume + ' · ' + fmt(T().s69ResumeHint, { n: st.position });
      $('btnS69Resume').style.display = '';
      $('btnS69Resume').onclick = () => { G.code = st.code; enterS69(); };
    } catch (e) { /* no game in play, which is the common case */ }
  }

  async function s69Create(mode) {
    haptic('light');
    $('loader').classList.add('show');
    try {
      const st = await coopFetch('/api/steps69', { method: 'POST', json: { mode: mode } });
      G.code = st.code; G.st = st;
      store.set('s69Code', st.code);
      if (mode === 'solo') { enterS69(); return; }
      $('s69Code').textContent = st.code;
      $('s69Waiting').textContent = T().s69Waiting;
      show('s69Invite');
      startS69Poll(st2 => {
        if (!st2.started) return;
        stopS69Poll();
        haptic('ok');
        toast(fmt(T().s69Joined, { name: st2.players.guest || '' }));
        enterS69();
      });
    } catch (e) { s69Error(e); } finally { $('loader').classList.remove('show'); }
  }

  async function s69Join(code) {
    haptic('light');
    $('loader').classList.add('show');
    try {
      const st = await coopFetch('/api/steps69/' + code + '/join', { method: 'POST' });
      G.code = st.code; G.st = st;
      store.set('s69Code', st.code);
      enterS69();
    } catch (e) {
      if (e.status === 409) toast(T().s69SoloJoin);
      else s69Error(e);
    } finally { $('loader').classList.remove('show'); }
  }

  /* ---- the board ---- */

  async function enterS69() {
    $('loader').classList.add('show');
    try {
      G.board = await coopFetch('/api/steps69/' + G.code + '/board');
      G.st = await coopFetch('/api/steps69/' + G.code);
      G.seen = (G.st.reactions || []).reduce((m, r) => Math.max(m, r.seq), 0);
      $('s69BoardTitle').textContent = T().s69Title;
      buildS69Map();
      renderS69Reactions();
      renderS69Music();
      renderS69(G.st, true);
      show('s69Board');
      startS69Poll(onS69State);
    } catch (e) { s69Error(e); show('s69'); } finally { $('loader').classList.remove('show'); }
  }

  function leaveS69() {
    stopS69Poll();
    if (G.settling) { clearTimeout(G.settling); G.settling = null; }
    musicStop();
    G.code = null; G.st = null; G.board = null;
    $('s69Finale').classList.remove('show');
    $('s69Done').classList.remove('show');
    show('home');
  }

  function stopS69Poll() { if (G.timer) { clearInterval(G.timer); G.timer = null; } }

  function startS69Poll(onState) {
    stopS69Poll();
    G.timer = setInterval(async () => {
      if (!G.code) return;
      try { onState(await coopFetch('/api/steps69/' + G.code)); }
      catch (e) {
        if (e.status === 404 || e.status === 410) { stopS69Poll(); toast(T().s69Gone); leaveS69(); }
      }
    }, 2200);
  }

  function onS69State(st) {
    // A poll must not stomp on the portal animation the roll started: the
    // server already reports the final square, so repainting here would
    // teleport the piece past the flight the partner is watching.
    if (G.settling) { G.st = st; return; }
    const moved = !G.st || st.turns !== G.st.turns;
    renderS69(st, moved);
  }

  function renderS69(st, animate) {
    const prev = G.st;
    G.st = st;
    playS69Reactions(st);

    if (animate && st.last && st.last.event) flyS69Piece(st.last, st.position);
    else paintS69Map(st.position);

    renderS69Turn(st);
    renderS69Cell(st);

    if (animate && st.cell && (st.cell.kind === 'secret' || st.cell.kind === 'joker')) {
      s69Haptic(st.cell.kind);
    }
    if (st.position >= 69 && !st.finished) showS69Finale(st);
    if (st.finished && (!prev || !prev.finished)) showS69Done(st);
  }

  /* ---- the map ---- */

  // A serpentine, running downward: cells 1-6 left to right, 7-12 right to
  // left, and so on. Downward rather than upward on purpose, both because a
  // phone scrolls that way and because the board's own line is «Искушение
  // ведёт вас глубже».
  function s69Slots() {
    const slots = [];
    for (let r = 0; r * S69_COLS < G.board.size; r++) {
      const row = [];
      for (let c = 0; c < S69_COLS; c++) {
        const id = r * S69_COLS + c + 1;
        row.push(id <= G.board.size ? id : null);
      }
      if (r % 2 === 1) row.reverse();
      slots.push.apply(slots, row);
    }
    return slots;
  }

  const S69_MARK = { ladder: '↑', snake: '↓', joker: '?', secret: '✦', final: '69' };

  function buildS69Map() {
    const box = $('s69Map');
    box.innerHTML = '';
    const byId = {};
    G.board.cells.forEach(c => { byId[c.id] = c; });

    s69Slots().forEach(id => {
      const el = document.createElement('div');
      if (id === null) { el.style.visibility = 'hidden'; box.appendChild(el); return; }
      const c = byId[id];
      el.className = 's69-cell k-' + c.kind + (c.milestone ? ' milestone' : '');
      el.dataset.id = String(id);
      el.textContent = c.kind === 'final' ? '' : String(id);
      const mark = S69_MARK[c.kind];
      if (mark) {
        const m = document.createElement('span');
        m.className = 'mark';
        m.textContent = mark;
        el.appendChild(m);
      }
      el.title = c.title;
      box.appendChild(el);
    });
  }

  function s69MapCell(id) { return $('s69Map').querySelector('[data-id="' + id + '"]'); }

  function paintS69Map(position) {
    $('s69Map').querySelectorAll('.s69-cell').forEach(el => {
      const id = Number(el.dataset.id);
      el.classList.toggle('here', id === position);
      el.classList.toggle('passed', id < position);
      el.classList.remove('flying');
    });
    const here = s69MapCell(position);
    if (here && here.scrollIntoView) {
      try { here.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) {}
    }
  }

  // The brief: a portal fires with a visible flight and a system line, never
  // as a piece that was simply somewhere else the next time you looked.
  function flyS69Piece(last, finalPosition) {
    paintS69Map(last.landed);
    const el = s69MapCell(last.landed);
    if (el) el.classList.add('flying');
    s69Haptic(last.event);
    toast((last.event === 'ladder' ? '🏹 ' : '🐍 ') +
          (G.board.system[last.event] || last.message || ''));
    if (G.settling) clearTimeout(G.settling);
    G.settling = setTimeout(() => {
      G.settling = null;
      paintS69Map(finalPosition);
    }, 620);
  }

  /* ---- the current cell ---- */

  function renderS69Turn(st) {
    // The dice is settled first and unconditionally. It used to be set at
    // the bottom, after three early returns, so a solo game (which takes the
    // second one) never re-enabled the button after its first roll and the
    // whole game locked up on cell 2.
    $('s69Dice').disabled = !st.your_turn || G.rolling;

    const chip = $('s69TurnChip');
    if (st.finished) { chip.textContent = T().s69Done; chip.className = 'chip'; return; }
    if (st.mode === 'solo') {
      // One phone: nobody is waiting on anybody, so the chip says whose go
      // it is rather than whether you may press anything.
      chip.textContent = '🎲 ' + T().s69Seat[st.turn === 0 ? 'creator' : 'guest'];
      chip.className = 'chip on';
      return;
    }
    if (!st.started) { chip.textContent = T().s69Waiting; chip.className = 'chip'; return; }
    chip.textContent = st.your_turn
      ? T().s69YourTurn
      : fmt(T().s69PartnerTurn, { name: st.turn_name || '' });
    chip.className = 'chip' + (st.your_turn ? ' on' : '');
  }

  function renderS69Cell(st) {
    const c = st.cell || {};
    const parts = [
      '<div class="s69-kind">' + escapeHTML(fmt(T().s69Cell, { n: st.position })) + '</div>',
      '<div class="s69-title">' + escapeHTML(c.title || '') + '</div>'
    ];
    if (c.text) parts.push('<div class="s69-text">' + escapeHTML(c.text) + '</div>');

    if (c.kind === 'joker' && c.joker) {
      parts.push('<div class="s69-note"><b>' + escapeHTML(c.joker.title) + '</b><br>' +
                 escapeHTML(c.joker.text) + '</div>');
    }

    // «Скрытое пламя»: blurred until tapped. The server sends exactly one of
    // these two, so whichever arrived is the one this phone may read.
    const hidden = c.secret || c.partner;
    if (c.kind === 'secret' && hidden) {
      parts.push(
        '<div class="s69-spoiler" id="s69Spoiler">' +
          (c.partner ? '<div class="s69-kind">' + escapeHTML(T().s69PartnerSecret) + '</div>' : '') +
          '<div class="veil">' + escapeHTML(hidden) + '</div>' +
          '<span class="hint">' + escapeHTML(T().s69Reveal) + '</span>' +
        '</div>');
    }

    if (c.milestone && c.milestone_text) {
      parts.push('<div class="s69-note"><b>' + escapeHTML(T().s69Milestone) + '</b><br>' +
                 escapeHTML(c.milestone_text) + '</div>');
    }

    if (st.last && st.last.event) {
      parts.push('<div class="s69-note ' + (st.last.event === 'ladder' ? 'up' : 'down') + '">' +
                 escapeHTML(st.last.event === 'ladder' ? T().s69Ladder : T().s69Snake) +
                 ': ' + escapeHTML(st.last.message || '') + '</div>');
    }

    $('s69Cell').innerHTML = parts.join('');

    const spoiler = $('s69Spoiler');
    if (spoiler) {
      spoiler.onclick = () => {
        const open = spoiler.classList.toggle('open');
        spoiler.querySelector('.hint').textContent = open ? T().s69Revealed : T().s69Reveal;
        haptic('light');
      };
    }

    const dice = $('s69Dice');
    dice.innerHTML = '<span class="pip">🎲</span><span>' + escapeHTML(T().s69Roll) + '</span>';
    dice.style.display = st.position >= 69 ? 'none' : '';
  }

  /* ---- rolling ---- */

  async function s69Roll() {
    if (G.rolling || !G.st) return;
    if (!G.st.your_turn) { haptic('light'); toast(T().s69NotYourTurn); return; }
    G.rolling = true;
    const dice = $('s69Dice');
    dice.classList.add('rolling');
    dice.disabled = true;
    haptic('medium');
    try {
      const st = await coopFetch('/api/steps69/' + G.code + '/roll', { method: 'POST' });
      renderS69(st, true);
    } catch (e) { s69Error(e); } finally {
      G.rolling = false;
      dice.classList.remove('rolling');
      if (G.st) renderS69Turn(G.st);
    }
  }

  /* ---- reactions ---- */

  function renderS69Reactions() {
    const box = $('s69Reacts');
    box.innerHTML = '';
    S69_REACTIONS.forEach(emoji => {
      const b = document.createElement('button');
      b.className = 's69-react';
      b.textContent = emoji;
      b.onclick = () => s69React(emoji);
      box.appendChild(b);
    });
  }

  async function s69React(emoji) {
    if (!G.code) return;
    haptic('light');
    floatS69(emoji);
    try {
      const st = await coopFetch('/api/steps69/' + G.code + '/react', {
        method: 'POST', json: { emoji: emoji }
      });
      // Our own reaction is already on screen; record it as seen so the next
      // poll does not play it back at us.
      G.seen = (st.reactions || []).reduce((m, r) => Math.max(m, r.seq), G.seen);
      G.st = st;
    } catch (e) { /* a lost emoji is not worth a toast */ }
  }

  function playS69Reactions(st) {
    const mine = st.your_role;
    (st.reactions || []).forEach(r => {
      if (r.seq <= G.seen) return;
      G.seen = r.seq;
      if (r.by === mine) return;   // already shown when it was sent
      floatS69(r.emoji);
      haptic('light');
    });
  }

  function floatS69(emoji) {
    const el = document.createElement('div');
    el.className = 's69-float';
    el.textContent = emoji;
    $('shell').appendChild(el);
    setTimeout(() => el.remove(), 1600);
  }

  /* ---- the finale ---- */

  function showS69Finale(st) {
    const f = st.cell && st.cell.finale;
    if (!f) return;
    $('s69FinaleTitle').textContent = f.title;
    $('s69FinaleIntro').textContent = f.intro;
    const box = $('s69FinaleChoices');
    box.innerHTML = '';
    f.choices.forEach(choice => {
      const wrap = document.createElement('div');
      const b = document.createElement('button');
      b.className = 'btn btn-play';
      b.textContent = choice.title;
      b.onclick = () => s69ChooseFinale(choice.id);
      wrap.appendChild(b);
      const p = document.createElement('p');
      p.className = 's69-choice-text';
      p.textContent = choice.text;
      wrap.appendChild(p);
      box.appendChild(wrap);
    });
    $('s69Finale').classList.add('show');
  }

  async function s69ChooseFinale(id) {
    haptic('ok');
    try {
      const st = await coopFetch('/api/steps69/' + G.code + '/finale', {
        method: 'POST', json: { choice: id }
      });
      $('s69Finale').classList.remove('show');
      renderS69(st, false);
    } catch (e) {
      if (e.status === 409) { toast(T().s69FinaleWait); $('s69Finale').classList.remove('show'); }
      else s69Error(e);
    }
  }

  function showS69Done(st) {
    stopS69Poll();
    $('s69Finale').classList.remove('show');
    const choice = ((st.cell && st.cell.finale && st.cell.finale.choices) || [])
      .filter(c => c.id === st.finale_choice)[0];
    $('s69DoneTitle').textContent = T().s69Done;
    $('s69DoneText').textContent = (choice ? choice.text + '\n\n' : '') +
      ((st.cell && st.cell.finale && st.cell.finale.outro) || T().s69Again);
    $('s69DoneAgain').textContent = T().s69Again;
    $('s69DoneHome').textContent = T().s69ToHome;
    $('s69Done').classList.add('show');
    confetti();
    haptic('ok');
  }

  /* ---- music ----
     Synthesised beds, not tracks: the app ships no audio files, and a
     WebAudio drone costs nothing, works offline and cannot 404. Swap these
     for licensed stems when there are any; the control surface stays. */
  const MUSIC = {
    ctx: null, nodes: [], timer: null, preset: null,
    presets: {
      romantic: { root: 110, tempo: 0,   cutoff: 720, gain: .045 },
      house:    { root: 82,  tempo: 122, cutoff: 900, gain: .045 },
      techno:   { root: 65,  tempo: 132, cutoff: 520, gain: .05  }
    }
  };

  function musicStop() {
    if (MUSIC.timer) { clearInterval(MUSIC.timer); MUSIC.timer = null; }
    MUSIC.nodes.forEach(n => { try { if (n.stop) n.stop(); n.disconnect(); } catch (e) {} });
    MUSIC.nodes = [];
    MUSIC.preset = null;
    renderS69Music();
  }

  function musicPlay(name) {
    musicStop();
    const p = MUSIC.presets[name];
    if (!p) return;
    try {
      MUSIC.ctx = MUSIC.ctx || new (window.AudioContext || window.webkitAudioContext)();
      const ctx = MUSIC.ctx;
      if (ctx.state === 'suspended') ctx.resume();

      const out = ctx.createGain(); out.gain.value = p.gain; out.connect(ctx.destination);
      const filter = ctx.createBiquadFilter();
      filter.type = 'lowpass'; filter.frequency.value = p.cutoff; filter.connect(out);
      [[p.root, 'sawtooth', -6], [p.root * 1.5, 'triangle', 5]].forEach(spec => {
        const o = ctx.createOscillator();
        o.type = spec[1]; o.frequency.value = spec[0]; o.detune.value = spec[2];
        o.connect(filter); o.start();
        MUSIC.nodes.push(o);
      });
      MUSIC.nodes.push(filter, out);

      if (p.tempo) {
        MUSIC.timer = setInterval(() => {
          const t = ctx.currentTime;
          const kick = ctx.createOscillator(), g = ctx.createGain();
          kick.frequency.setValueAtTime(115, t);
          kick.frequency.exponentialRampToValueAtTime(45, t + .12);
          g.gain.setValueAtTime(p.gain * 2.5, t);
          g.gain.exponentialRampToValueAtTime(.0001, t + .2);
          kick.connect(g); g.connect(ctx.destination);
          kick.start(t); kick.stop(t + .22);
        }, 60000 / p.tempo);
      }
      MUSIC.preset = name;
    } catch (e) { MUSIC.preset = null; }
    store.set('s69Music', MUSIC.preset);
    renderS69Music();
  }

  function renderS69Music() {
    const box = $('s69MusicRow');
    if (!box) return;
    const options = [
      ['', T().s69MusicOff],
      ['romantic', T().s69MusicRomantic],
      ['house', T().s69MusicHouse],
      ['techno', T().s69MusicTechno]
    ];
    box.innerHTML = '';
    options.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'chip' + ((MUSIC.preset || '') === opt[0] ? ' on' : '');
      b.textContent = opt[1];
      b.onclick = () => { haptic('light'); opt[0] ? musicPlay(opt[0]) : musicStop(); };
      box.appendChild(b);
    });
  }

  /* ---- wiring ---- */

  $('btnS69').onclick = openS69;
  $('s69Back').onclick = () => show('home');
  $('s69InviteBack').onclick = () => { stopS69Poll(); G.code = null; show('s69'); };
  $('s69BoardBack').onclick = leaveS69;
  $('btnS69Duo').onclick = () => s69Create('duo');
  $('btnS69Solo').onclick = () => s69Create('solo');
  $('btnS69Join').onclick = () => {
    const code = ($('s69CodeInput').value || '').trim().toUpperCase();
    if (code.length === 6) s69Join(code);
  };
  $('s69CodeInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') $('btnS69Join').click();
  });
  $('s69Dice').onclick = s69Roll;
  $('s69MapToggle').onclick = () => { haptic('light'); $('s69Map').classList.toggle('folded'); };
  $('btnS69Share').onclick = () => {
    // Its own message: all three features draw six-character codes from one
    // alphabet, so a code entered at the wrong door fails confusingly.
    const msg = fmt(T().s69InviteMsg, { bot: BOT_URL || 'VECHNOST', code: G.code });
    try {
      if (tg) tg.openTelegramLink('https://t.me/share/url?url=' + encodeURIComponent(msg));
      else navigator.clipboard.writeText(msg);
      haptic('light');
    } catch (e) { toast(T().shareError); }
  };
  $('s69DoneAgain').onclick = () => { $('s69Done').classList.remove('show'); leaveS69(); openS69(); };
  $('s69DoneHome').onclick = leaveS69;

  /* ---------------- boot ---------------- */
  $('btnPlay').onclick = async () => {
    haptic('light');
    if (!DATA) await loadData();
    if (!DATA) return;
    renderThemes();
    show('themes');
  };
  $('backHome').onclick = () => { COOP.creating = false; show('home'); };
  $('backThemes').onclick = () => show('themes');

  applyI18n();
  // Preload content in background for instant start
  loadData();
  // The bot's "Библиотека" button opens the app at ?screen=library.
  try {
    const screen = new URLSearchParams(location.search).get('screen');
    if (screen === 'library') openLibrary();
    else if (screen === 'steps69') openS69();
  } catch (e) {}
})();
</script>
</body>
</html>

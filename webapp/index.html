<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vechnost – игра для близости</title>
<link rel="preload" href="fonts/inter-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/lora-400.woff2" as="font" type="font/woff2" crossorigin>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* The brand's two faces on the page, the same the bot composites onto its
     cards: Inter for text, Lora for the wordmark. Each is one woff2 cut to
     what the app sets - Cyrillic, printable ASCII and the punctuation of
     Russian typography - by scripts/fetch_webapp_fonts.py, from the two
     Google subsets the page used to load per face (audit D-41). An arrow, a
     suit or an emoji falls through to the phone's own font, as it always
     did. The faces the first screen sets are preloaded in <head>, with the
     same URL and crossorigin: a font is fetched in CORS mode, and a preload
     without it is a second download of the same file. */
  @font-face { font-family: 'Inter'; src: url('fonts/inter-400.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Inter'; src: url('fonts/inter-600.woff2') format('woff2');
    font-weight: 600; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Inter'; src: url('fonts/inter-700.woff2') format('woff2');
    font-weight: 700; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Lora'; src: url('fonts/lora-400.woff2') format('woff2');
    font-weight: 400; font-style: normal; font-display: swap; }

  /* Design tokens (docs/AUDIT_2026-09.md, section 4). The first step of a
     migration: every value here is one the page already uses, and nothing
     reads a token yet except through the old names aliased at the end of
     the block, so adding it changed no pixel. New rules take tokens; old
     literals move over a step at a time, each step checked by comparing
     screenshots. */
  :root {
    /* 1. Palette: the only place a colour is spelled. */
    --c-aubergine-950: #14020D;   /* overlay scrim */
    --c-aubergine-900: #1C0414;   /* the shell, Telegram's header, the frame under a picture */
    --c-aubergine-700: #47102F;   /* the glow at the top of the shell */
    --c-ink:           #350027;   /* card text = renderer.TEXT_COLOR */
    --c-plum-800:      #4A073A;   /* the card back = generate_card_assets.DARK */
    --c-plum-600:      #7A1147;   /* end of the call-to-action gradient */
    --c-plum-500:      #6E1040;
    --c-plum-400:      #7A3F64;   /* card footer = renderer.FOOTER_COLOR */
    --c-rose-600:      #C4256E;   /* the brand rose */
    --c-rose-400:      #E86BB5;   /* accent: rings, progress, selection */
    --c-rose-300:      #FF89B8;   /* red suits on the dark shell */
    --c-rose-100:      #FFD9EF;   /* the logo's highlight, links */
    --c-blush-100:     #FBE9F4;   /* text on the dark shell */
    --c-blush-50:      #FFE5FA;   /* the printed card's ground = generate_card_assets.PALE */
    --c-violet-500:    #7F2BFF;   /* the second accent, «69 ступеней» only */
    --c-magenta-500:   #E100C7;
    --c-mint-300:      #9FEFC4;   /* success, the camera */
    --c-amber-300:     #FFD96E;   /* the Joker, light, growth, Cupid's arrows */
    --c-lilac-200:     #CFC0FF;   /* secrets */
    --c-red-300:       #FF7896;   /* crisis, danger, the serpents' tongues */
    --c-emerald-500:   #1E9E78;   /* the serpents on the board */
    --c-emerald-900:   #06382B;   /* their scales and outline */

    /* 2. Roles. */
    --bg-app:          var(--c-aubergine-900);
    /* The glow rises out of the app's darkest aubergine, which is also the
       colour Telegram's header is painted: it used to start at its brightest
       right under the header, and the two met in a seam across the top of
       every screen (audit D-24). */
    --bg-app-glow:     linear-gradient(var(--c-aubergine-900), transparent 40px),
                       radial-gradient(120% 90% at 50% 0%, var(--c-aubergine-700) 0%, var(--c-aubergine-900) 62%);
    --bg-scrim:        rgb(20 2 13 / .88);
    --surface-1:       rgb(255 255 255 / .05);   /* panels */
    --surface-2:       rgb(255 255 255 / .08);   /* buttons, chips, tiles */
    --surface-3:       rgb(255 255 255 / .12);   /* tracks, active grounds */
    --surface-toast:   #2E1827;
    --border-1:        rgb(255 255 255 / .13);
    --border-2:        rgb(255 255 255 / .2);
    --text-1:          var(--c-blush-100);
    --text-2:          rgb(251 233 244 / .62);   /* 6.7:1 on the shell */
    --text-3:          rgb(251 233 244 / .5);    /* 14px and up only */
    --text-on-card:    var(--c-ink);
    --text-on-card-2:  rgb(53 0 39 / .62);
    --text-on-accent:  #fff;
    --card-ground:     var(--c-blush-50);
    --accent:          var(--c-rose-400);
    --accent-soft:     rgb(232 107 181 / .28);
    --accent-line:     rgb(232 107 181 / .8);
    --grad-cta:        linear-gradient(135deg, var(--c-rose-600), var(--c-plum-600));
    --grad-alt:        linear-gradient(135deg, var(--c-violet-500), var(--c-magenta-500));
    --ok:              var(--c-mint-300);
    --warn:            var(--c-amber-300);
    --danger:          var(--c-red-300);
    --danger-line:     rgb(255 120 150 / .45);
    --secret:          var(--c-lilac-200);

    /* 3. Type. Eleven pixels is the floor. */
    --font-text: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-logo: 'Lora', serif;
    --fs-2xs: 11px;
    --fs-xs: 12px;
    --fs-sm: 13px;
    --fs-md: 14px;
    --fs-base: 15px;
    --fs-lg: 17px;
    --fs-xl: 20px;
    --fs-2xl: 22px;
    --fs-3xl: 26px;
    --fs-display: 56px;
    /* --fs-card, the card text, is declared on .card: it is a fraction of
       the card's width, and a var() in a custom property resolves where the
       property is declared, so on :root there is no width to read. */
    --fw-regular: 400; --fw-semibold: 600; --fw-bold: 700;
    --lh-tight: 1.2; --lh-snug: 1.35; --lh-normal: 1.5; --lh-relaxed: 1.6;
    --ls-caps: .06em; --ls-logo: .14em;

    /* 4. Space, on a 4px step. */
    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-5: 20px; --space-6: 24px; --space-8: 32px; --space-10: 40px;
    --gutter: 16px;
    --screen-x: 18px;   /* the screen's side margin; the scrollers bleed across it */
    --tap-min: 44px;
    --btn-h: 52px; --btn-h-sm: 44px; --btn-pad-x: 20px;
    --card-max-w: 420px;

    /* 5. Radii. */
    --r-xs: 6px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 22px;
    --r-card: 26px; --r-pill: 999px;

    /* 6. Shadows. */
    --shadow-1: 0 2px 6px rgb(0 0 0 / .5);
    --shadow-2: 0 8px 24px rgb(0 0 0 / .4);
    --shadow-card: 0 18px 44px rgb(0 0 0 / .5);
    --glow-accent: 0 8px 22px rgb(196 37 110 / .42);
    --ring-accent: 0 0 0 2px rgb(232 107 181 / .6);
    --inset-hi: inset 0 1px 0 rgb(255 255 255 / .22);
    --focus-ring: 0 0 0 2px var(--c-aubergine-900), 0 0 0 4px var(--accent);

    /* 7. Motion. */
    --dur-1: 120ms; --dur-2: 200ms; --dur-3: 300ms; --dur-4: 450ms; --dur-5: 600ms;
    --ease-std: cubic-bezier(.2, .7, .25, 1);
    --ease-in: cubic-bezier(.5, .05, .9, .4);
    --ease-back: cubic-bezier(.2, .9, .3, 1.2);
    --ease-emph: cubic-bezier(.3, .9, .3, 1);

    /* 8. Layers. */
    --z-raised: 2; --z-piece: 3; --z-overlay: 30; --z-confetti: 31; --z-toast: 40; --z-loader: 50;

    /* 9. Safe area: the notch, and Telegram's own controls from Bot API 8.0.
       The device's inset comes from the browser or from Telegram, whichever
       knows it; Telegram's controls sit inside it, so their inset adds on
       (audit D-24: the page took the larger of the notch and the controls,
       which in full screen put the title under Telegram's buttons).
       Telegram's script keeps every --tg-* inset current as they change. */
    --safe-top: calc(max(env(safe-area-inset-top, 0px), var(--tg-safe-area-inset-top, 0px))
      + var(--tg-content-safe-area-inset-top, 0px));
    --safe-bottom: calc(max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px))
      + var(--tg-content-safe-area-inset-bottom, 0px));

    /* The names the rules below were written against, now aliases. */
    --ink: var(--c-ink);
    --card-bg: var(--card-ground);
    --text-on-dark: var(--text-1);
    --muted-on-dark: var(--text-2);
    --radius-card: var(--r-card);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: var(--font-text);
    background: #1C0414;
    color: var(--text-on-dark);
    user-select: none;
    -webkit-user-select: none;
    /* No lone word on a paragraph's last line (audit D-31); where a browser
       does not know the value, lines break as before. */
    text-wrap: pretty;
  }

  #shell {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: var(--bg-app-glow);
    transition: background .6s ease;
  }

  /* ---------- screens ---------- */
  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    padding: calc(var(--safe-top) + 14px) var(--screen-x) calc(var(--safe-bottom) + 18px);
    opacity: 0; pointer-events: none;
    transform: translateY(12px);
    transition: opacity .28s ease, transform .28s ease;
  }
  .screen.active { opacity: 1; pointer-events: auto; transform: none; }

  /* ---------- panes that scroll ---------- */
  /* Everything here is a list that can outgrow the phone: the menu, the deck
     and level lists, and the panels behind the two-partner codes. Two things
     went wrong without this rule. There was nowhere to scroll to, so the tail
     of a long list was simply unreachable; and `justify-content: center`,
     which is how these were centred, distributes negative free space as well
     as positive, so the head of the list was pushed above the scroll origin
     where not even a scrollbar could reach it. Auto margins on the ends
     centre a short list exactly the same way and collapse to 0 the moment
     the free space goes negative, which is what a scroller needs.

     overflow-x is named on purpose: leaving it `visible` next to a scrolling
     y axis makes it compute to `auto`, and a menu that pans sideways by the
     odd sub-pixel is worse than one that clips it.

     overscroll-behavior keeps the rubber band off Telegram's own sheet;
     tg.disableVerticalSwipes() below is the other half of that. */
  #home, #themeList, #levelList, .coop-box {
    flex: 1 1 auto; min-height: 0;
    overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch; touch-action: pan-y;
    scrollbar-width: none;
  }
  /* That clip ran down both sides of a list 18px in from the phone's edge,
     and a full-width button's glow ended there in two straight lines («Создать
     игру», «Начать тест»; audit D-27). So a list inside a screen reaches out
     to the edges and takes its content back in: the clip is where the phone
     ends. #home is a screen itself and already reaches them. Left and right
     rather than margin-inline, which older iPhones' WebViews do not know. */
  #themeList, #levelList, .coop-box {
    margin-left: calc(-1 * var(--screen-x)); margin-right: calc(-1 * var(--screen-x));
    padding-left: var(--screen-x); padding-right: var(--screen-x);
  }
  #home::-webkit-scrollbar, #themeList::-webkit-scrollbar,
  #levelList::-webkit-scrollbar, .coop-box::-webkit-scrollbar { display: none; }
  #home > *, #themeList > *, #levelList > *, .coop-box > * { flex-shrink: 0; }
  /* The home screen and a door (a room, the test, the board: a few lines and
     one thing to press) sit in the middle of the phone. A list starts at the
     top, under its title, like the Library's (audit D-28): the themes and the
     levels were centred and the Library was not, so the same kind of screen
     started its first row in two different places. */
  #home > :first-child, .coop-box > :first-child { margin-top: auto; }
  #home > :last-child, .coop-box > :last-child { margin-bottom: auto; }

  /* ---------- home ---------- */
  #home { align-items: center; text-align: center; gap: 10px; }
  .logo {
    font-family: var(--font-logo);
    /* 52px is the wordmark's size, but at .14em of tracking it sets 345px
       wide, which is more than a 375px phone has left after the screen's
       padding: the final T was being cut off. Below a ~400px viewport the
       size follows the width instead; above it nothing moves. */
    font-size: min(52px, 13vw); letter-spacing: .14em; font-weight: 400;
    background: linear-gradient(180deg, #FFD9EF 20%, #E86BB5 90%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-transform: uppercase;
  }
  .logo .heart { color: #E86BB5; -webkit-text-fill-color: #E86BB5; }
  .tagline { font-size: 15px; color: var(--muted-on-dark); max-width: 260px; line-height: 1.45; }

  /* Four real decks, overlapped like a hand of cards. The 72x108 tile is the
     2:3 of the hand-drawn art in assets/deck_art (600x900), which is what it
     shows, not of the printed card: that is 4:5, the 1080x1350 face
     scripts/generate_card_assets.py draws from the same art. So the art lands
     here unsquashed, and the fan is a narrower shape than the card it
     advertises. */
  .deck-fan { display: flex; justify-content: center; margin: 20px 0 4px; height: 108px; }
  .deck-fan i {
    /* The overlap used to be -14px, which hid a third of each card. That was
       fine while the only mark was a corner one, and clipped the centre pip
       of every card but the top one. -7px still reads as a hand of cards and
       leaves all four suits whole. */
    display: block; width: 72px; height: 108px; margin: 0 -7px;
    border-radius: 8px;
    /* Two layers: the suit's own emblem over the deck card it belongs to.
       The card art carries its mark in the corner, which is about six pixels
       at this size and reads as a smudge – four cards that look blank. So
       each also gets a centre pip, the way an Ace does. The emblems are
       square tiles cut from one box by scripts/generate_card_assets.py, so
       this percentage sizes all four alike rather than one suit at a time:
       58% of 72px puts the mark itself at about 30px. */
    background-size: 58% auto, cover;
    background-position: center, center;
    background-repeat: no-repeat, no-repeat;
    box-shadow: 0 8px 20px rgba(0,0,0,.45);
    animation: fan-float 3.2s ease-in-out infinite;
  }
  .deck-fan i:nth-child(1) { transform: rotate(-12deg); }
  .deck-fan i:nth-child(2) { transform: rotate(-4deg);  animation-delay: .4s; }
  .deck-fan i:nth-child(3) { transform: rotate(4deg);   animation-delay: .8s; }
  .deck-fan i:nth-child(4) { transform: rotate(12deg);  animation-delay: 1.2s; }
  @keyframes fan-float { 0%,100% { translate: 0 0; } 50% { translate: 0 -7px; } }

  /* Someone who asked their phone for less motion gets it: no floating fan,
     no tumbling die, no card flights, no confetti (see confetti()). Motion
     that carries meaning - a card leaving, the board moving - still ends in
     the same place, only without the travel (audit D-13). What script
     starts, this block cannot reach: the confetti and a piece's ride on an
     arrow or a serpent (flyS69Piece) ask REDUCED_MOTION themselves. */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: .01ms !important;
      scroll-behavior: auto !important;
    }
    /* Not once, either. Under the rule above each card still floated for
       .01ms after its delay (.4s to 1.2s), and a card with its float still
       pending is drawn differently from one at rest: the first picture of
       the visual tour came out one way or the other by when it was taken. */
    .deck-fan i { animation: none; }
  }

  .btn {
    border: 0; cursor: pointer; font: inherit;
    border-radius: 16px; font-weight: 600;
    transition: transform .12s ease, filter .12s ease, opacity .2s;
  }
  .btn:active { transform: scale(.96); }

  .btn-play {
    margin-top: 26px; padding: 16px 64px; font-size: 18px; color: #fff;
    background: linear-gradient(135deg, #C4256E, #7A1147);
    box-shadow: 0 10px 30px rgba(196, 37, 110, .45), inset 0 1px 0 rgba(255,255,255,.25);
  }

  .btn-second {
    margin-top: 12px; padding: 13px 40px; font-size: 15px; font-weight: 600;
    color: var(--text-on-dark);
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
  }

  /* ---------- coop ---------- */
  /* The Library modules on the home screen: the same button as the ones
     above them, so the menu reads as one list rather than two. */
  #homeModules { display: flex; flex-direction: column; width: 100%; }
  #homeModules .home-mod { margin-top: 12px; }

  .coop-box { display: flex; flex-direction: column; gap: 12px; }
  /* The default for a paragraph in a box, and only a default: a paragraph
     with a class of its own (.s69-intro, .s69-age, .waiting-dots) is written
     as p.class so that it wins. They were plain classes, (0,1,0) against this
     rule's (0,1,1), and lost all three: the 18+ line was set at 14px in grey
     instead of its own small pink (audit D-26). */
  .coop-box p { font-size: 14px; color: var(--muted-on-dark); text-align: center; line-height: 1.5; }
  /* The invite itself. It replaced a six-character code typed at one of
     three doors that take codes from the same alphabet — a code entered at
     the wrong door failed confusingly, and a partner who mistyped one
     character was simply refused. A link cannot be entered at the wrong
     door, and there is nothing to type.

     It is shown, not hidden behind the share button: someone whose Telegram
     share sheet misbehaves can read it, copy it and paste it anywhere. Long,
     so it wraps and breaks anywhere rather than pushing the screen sideways. */
  .invite-link {
    font-size: 14px; line-height: 1.5; text-align: center;
    color: #FFD9EF; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.14); border-radius: 14px;
    padding: 12px 14px; margin: 6px 0 2px;
    overflow-wrap: anywhere; word-break: break-all; user-select: all;
  }
  p.waiting-dots { text-align: center; font-size: 13.5px; color: var(--muted-on-dark); }

  #turnChip { display: flex; justify-content: center; margin-bottom: 8px; }
  #turnChip .chip { cursor: default; }
  #turnChip .chip.turn-you {
    color: #fff; background: rgba(232,107,181,.28); border-color: rgba(232,107,181,.8);
  }
  /* The partner's turn, said before the tap (audit D-20): the main button is
     dimmed while the chip names whose turn it is, and a tap or a swipe
     anyway shakes the card and flashes the chip instead of a toast in a
     corner. */
  #btnNext[aria-disabled="true"] { opacity: .4; filter: saturate(.4); }
  .card.wobble { animation: wobble .42s ease; }
  @keyframes wobble {
    0%, 100% { translate: 0 0; }
    20% { translate: -8px 0; } 40% { translate: 7px 0; }
    60% { translate: -4px 0; } 80% { translate: 2px 0; }
  }
  #turnChip .chip.pulse { animation: chip-pulse .7s ease; }
  @keyframes chip-pulse {
    0% { box-shadow: 0 0 0 0 rgba(232,107,181,.7); color: #fff; }
    100% { box-shadow: 0 0 0 12px rgba(232,107,181,0); }
  }
  @media (prefers-reduced-motion: reduce) { .card.wobble { animation: none; } }

  .chip {
    padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
    color: var(--muted-on-dark); background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12); cursor: pointer;
    transition: color .15s ease, background-color .15s ease, border-color .15s ease;
  }
  .chip.on { color: #fff; background: rgba(232,107,181,.28); border-color: rgba(232,107,181,.8); }
  /* A chip you can press is a button, and a button is at least a thumb. */
  button.chip { min-height: var(--tap-min); }

  /* ---------- headers ---------- */
  .top {
    display: flex; align-items: center; gap: 10px; min-height: 40px; margin-bottom: 6px;
  }
  .top .title { font-size: 17px; font-weight: 700; letter-spacing: .02em; flex: 1; text-align: center; }
  .icon-btn {
    width: var(--tap-min); height: var(--tap-min); border-radius: 13px; border: 0; cursor: pointer;
    display: grid; place-items: center; font-size: 17px; color: #fff;
    background: rgba(255,255,255,.09);
    transition: transform .12s ease, background .15s;
  }
  .icon-btn:active { transform: scale(.92); }
  /* A drawn icon takes the button's colour, like a letter would. */
  .icon-btn svg {
    width: 20px; height: 20px; fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .icon-btn[disabled] { opacity: .35; pointer-events: none; }
  /* One Back, not two (audit D-25). Inside Telegram the header already has
     its own Back, and it does exactly what this button does - the handler
     clicks it - so the page's copy is kept for its place in the layout but
     not shown. Outside Telegram (a plain browser) it is the only way back. */
  html.tg-back .top .icon-btn.back { visibility: hidden; }
  .top-spacer { width: var(--tap-min); flex: none; }

  /* ---------- themes ---------- */
  #themeList { display: flex; flex-direction: column; gap: 14px; }
  .theme-card {
    position: relative; overflow: hidden;
    border-radius: 22px; padding: 20px 22px; min-height: 96px;
    display: flex; flex-direction: column; justify-content: center; gap: 4px;
    cursor: pointer; border: 0; text-align: left; font: inherit; color: #fff;
    box-shadow: 0 8px 26px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.22);
    transition: transform .14s ease;
  }
  .theme-card:active { transform: scale(.97); }
  /* The emoji is positioned out of flow against the right edge, so the text
     has to reserve room for it by hand: 16px of offset plus its ~48px box.
     Without this, "36 вопросов, чтобы влюбиться" wraps straight under it. */
  .theme-card .t-name { font-size: 20px; font-weight: var(--fw-bold); letter-spacing: .01em; padding-right: 56px; }
  .theme-card .t-desc { font-size: 13px; line-height: 1.35; padding-right: 56px; }
  .theme-card .t-emoji {
    position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
    font-size: 40px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.3));
  }
  .theme-card .t-count {
    position: absolute; right: 18px; bottom: 10px; font-size: 11px; font-weight: 600;
  }
  /* Text on a tile has to read on every part of its gradient (audit D-11):
     white went down to 1.65:1 on the light end of «Знакомство» and «Для
     пар», so those two carry the printed cards' ink instead (5.4:1 at the
     worst stop), and «Провокация» ends a shade darker so white holds 4.5:1
     where the card count sits. No opacity on tile text: it only ever took
     contrast away. */
  .g-acq     { background: linear-gradient(135deg, #8E7CF3 0%, #C86DD7 55%, #F3A0D6 100%); color: var(--ink); }
  .g-couples { background: linear-gradient(135deg, #F35D8A 0%, #F98D68 100%); color: var(--ink); }
  .g-sex     { background: linear-gradient(135deg, #6E1040 0%, #C4256E 100%); }
  .g-prov    { background: linear-gradient(135deg, #7F2BFF 0%, #C900B3 100%); }

  /* ---------- levels ---------- */
  #levelList { display: flex; flex-direction: column; gap: 14px; }
  .level-card {
    border-radius: 22px; padding: 22px; border: 0; cursor: pointer; font: inherit; color: #fff;
    display: flex; align-items: center; gap: 16px; text-align: left;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.12);
    transition: transform .14s ease;
  }
  .level-card:active { transform: scale(.97); }
  .level-num {
    width: 52px; height: 52px; border-radius: 16px; flex: none;
    display: grid; place-items: center; font-size: 22px; font-weight: var(--fw-bold);
    background: linear-gradient(135deg, #C4256E, #7A1147);
    box-shadow: 0 6px 18px rgba(196,37,110,.4);
  }
  .level-info b { display: block; font-size: 17px; margin-bottom: 3px; }
  .level-info span { font-size: 13px; color: var(--muted-on-dark); line-height: 1.35; }

  /* ---------- library ---------- */
  #libraryList { display: flex; flex-direction: column; gap: 12px; flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #libDetailBody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  /* Its rows keep 10px apart, but the first starts where every list does,
     under the title (audit D-28), not 10px lower. */
  #libDetailBody > :first-child { margin-top: 0; }
  .theme-card.lib-mod { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); }
  .lib-card{background:rgba(255,255,255,.05);border-radius:16px;padding:14px 16px;margin:10px 0}
  .lib-card-title{font-weight:700;margin-bottom:6px}
  .lib-card-line{font-size:14px;opacity:.85;margin-top:4px}
  .lib-cat{background:rgba(255,255,255,.05);border-radius:16px;padding:12px 16px;margin:10px 0}
  /* A category is a button into its deck now, not a <details> full of text. */
  .lib-cat-open{display:block;width:100%;text-align:left;font:inherit;font-weight:700;
    color:inherit;border:1px solid rgba(255,255,255,.12);cursor:pointer}
  .lib-cat-nsfw{display:block;width:100%;text-align:left;font:inherit;font-weight:700;
    color:inherit;border:1px dashed rgba(255,255,255,.18);cursor:pointer}
  .lib-locked{text-align:center;padding:20px;opacity:.9}
  /* The secondary lines of a practice card: "why" and "outcome" sit under the
     title, small enough that the three read as one card. */
  .q-sub{font-size:.82em;font-weight:var(--fw-regular);opacity:.85}
  /* The last card of a truncated deck: the note and the way out of it. */
  .q-lock{display:block;margin:14px auto 0;padding:11px 22px;font-size:14px}

  /* ---------- compatibility test ---------- */
  .compat-q{font-size:20px;line-height:1.5}
  /* A scale, not five identical buttons (audit D-21): one joined column,
     each step with as many bars lit as it is strong, and the answer given
     marked, so a partner who comes back to a question sees what they said. */
  .compat-scale{display:flex;flex-direction:column;border-radius:16px;overflow:hidden;
    border:1px solid rgba(255,255,255,.14);margin:8px 0}
  .compat-opt{display:flex;align-items:center;gap:14px;width:100%;min-height:var(--tap-min);
    padding:12px 16px;border:0;border-top:1px solid rgba(255,255,255,.09);
    background:rgba(255,255,255,.05);color:var(--text-on-dark);font:inherit;font-size:15px;
    font-weight:600;text-align:left;cursor:pointer;transition:background .15s ease}
  .compat-opt:first-child{border-top:0}
  .compat-opt:active{background:rgba(255,255,255,.12)}
  .compat-opt.on{background:rgba(232,107,181,.3);color:#fff}
  .compat-bars{display:flex;gap:3px;flex:none}
  .compat-bars i{width:5px;height:16px;border-radius:2px;background:rgba(255,255,255,.18)}
  .compat-bars i.lit{background:#E86BB5}
  .compat-opt.on .compat-bars i.lit{background:#fff}
  .compat-hint{text-align:center;font-size:13px;color:var(--muted-on-dark);margin:2px 0 0}
  .compat-prev{display:block;margin:6px auto 0;padding:10px 18px;min-height:var(--tap-min);
    background:none;border:0;color:var(--muted-on-dark);font:inherit;font-size:14px;cursor:pointer}
  /* An answer is in flight: the next question is already on screen, but its
     buttons stay dead until the previous POST lands, so a fast tapper cannot
     put several read-modify-writes of the answer array in flight at once. */
  .compat-opt[disabled],.compat-prev[disabled]{opacity:.35;pointer-events:none}
  .compat-percent{font-size:56px;font-weight:700;text-align:center;margin:20px 0 6px}
  .compat-zones{text-align:center;font-size:13px;opacity:.75;margin:0 0 6px;line-height:1.7}
  .compat-danger{margin-top:26px;width:100%}
  .compat-h{margin:22px 0 8px;font-size:15px;opacity:.7;text-transform:uppercase;letter-spacing:.06em}
  .compat-strength{border-left:3px solid rgba(120,220,160,.7)}
  .compat-growth{border-left:3px solid rgba(255,200,120,.7)}
  .compat-crisis{border-left:3px solid rgba(255,120,150,.8)}
  /* A divergent question under a verdict: the number is the button, the
     text opens on a tap. <details> is the whole widget, so it works with
     no script and stays open while the couple talks. */
  .compat-qs{margin-top:8px}
  .compat-qi{margin-top:6px;border-radius:10px;background:rgba(255,255,255,.06)}
  .compat-qi summary{padding:8px 12px;font-size:13.5px;font-weight:700;cursor:pointer;
    list-style:none;display:flex;align-items:center;gap:8px;min-height:var(--tap-min)}
  .compat-qi summary::-webkit-details-marker{display:none}
  .compat-qi summary::before{content:'+';opacity:.7}
  .compat-qi[open] summary::before{content:'–'}
  .compat-qi p{margin:0;padding:0 12px 10px;font-size:14px;line-height:1.5;opacity:.9}
  #compatScale{padding:0 16px}
  /* The question scrolls; the scale under it does not move. A five-line
     question used to push the answer buttons off the bottom of the phone,
     and there was nothing to scroll — the screen itself does not. */
  #compatQuestion{
    padding:0 16px; flex:1 1 auto; min-height:0;
    display:grid; place-items:center;
    overflow-y:auto; overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch; touch-action:pan-y; scrollbar-width:none;
  }
  #compatQuestion::-webkit-scrollbar{display:none}
  #compatResultBody{flex:1;overflow-y:auto;padding:0 16px 32px}

  /* ---------- deck ---------- */
  #deck, #libDeck { padding-left: 14px; padding-right: 14px; }
  .progress-wrap { display: flex; align-items: center; gap: 12px; margin: 2px 4px 10px; }
  .progress-track {
    flex: 1; height: 5px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 0%; border-radius: 99px;
    background: linear-gradient(90deg, #E86BB5, #C4256E);
    transition: width .3s ease;
  }
  .progress-num { font-size: 13px; font-weight: 700; color: var(--muted-on-dark); min-width: 58px; text-align: right; }

  .mode-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 8px; }

  /* pan-y, not none. `none` blocks the browser's horizontal panning — which
     is what protects the card swipe — but it also cancels the vertical pan
     that scrolls a long question inside .q-zone. Chromium stops intersecting
     touch-action at the nested scroller, so .q-zone's own pan-y would win
     there; WebKit is not worth betting the iOS build on.

     What pan-y costs is version-gated, so do not read this as "it costs
     nothing". Nothing above the stage scrolls vertically (html/body are
     overflow:hidden), but the other half of the protection —
     tg.disableVerticalSwipes() below — is a no-op before Bot API 7.7, and
     Telegram logs exactly that ("Changing swipes behavior is not supported in
     version 6.0") on the clients we actually see. On such a client a vertical
     drag on a long card can still reach Telegram's own swipe-to-collapse and
     pull the Mini App down instead of scrolling the question. That is the
     trade pan-y buys, deliberately: unreadable long cards on every client
     against a collapse gesture on old ones. Widening touch-action further
     would give back the horizontal block that protects the card swipe, and
     the Telegram-side guarantee is not there to catch it. */
  #stage { flex: 1; position: relative; perspective: 1300px; margin: 4px 0 10px; touch-action: pan-y; container-type: size; }
  /* The Library deck stands on the same stage — identical declarations, kept
     as its own rule rather than a comma group because the tests read the
     `#stage {` block by name and compare the two. */
  #libStage { flex: 1; position: relative; perspective: 1300px; margin: 4px 0 10px; touch-action: pan-y; container-type: size; }

  /* The card keeps one shape, 340:470, at every size: as wide as the stage
     allows, as tall as that makes it, and never past --card-max-w. It used
     to be the stage's own box capped at 340x470, so on a short phone it
     turned nearly square while the text band inside kept its 103px
     margins: on 320x568 the band was 210x147 and 255 of the 310 cards
     had to be scrolled to be read (audit D-04).

     The stage is the size container (container-type on #stage and
     #libStage), not the card: containment on an element in the 3D flip
     is a risk nothing here needs to take. --card-w is inherited as the
     expression and resolved where it is used, so every length on the
     card's faces below is a fraction of the one width - the art is
     stretched 100% 100% onto the face, so a fraction of the width is
     the same fraction of the art at every size. */
  .card {
    --card-w: min(100cqw, 100cqh * 340 / 470, var(--card-max-w));
    --fs-card: clamp(17px, calc(var(--card-w) * 22 / 340), 22px);
    position: absolute; inset: 0; margin: auto;
    width: var(--card-w);
    height: calc(var(--card-w) * 470 / 340);
    border-radius: var(--radius-card);
    transform-style: preserve-3d;
    will-change: transform;
  }
  .card .face {
    position: absolute; inset: 0; border-radius: var(--radius-card);
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* The face IS the printed card: the same PNG the bot composites onto, so
     the Mini App and the photos the bot sends are the same object. Only the
     text and the footer are drawn on top.

     background-size is 100% 100%, not cover: the face is the bot's own
     1080x1350 card, drawn by scripts/generate_card_assets.py from the 600x900
     art with each mark where a plain resize would put it (and at the art's
     proportions, which a resize did not keep – audit D-18). Nothing is
     cropped either side, so every fraction of the face is the same fraction
     of this box and the padding below can be read off renderer.py's
     TEXT_AREA_* constants rather than guessed around a crop. Measured: the
     text band sits at 0.219 from the top and 0.219 from the bottom of the
     face, against the renderer's central 56% — 0.22 to 0.78.

     The *box* is not the card's shape, though. 340x470 is 1:1.38 where the
     printed card is 4:5, so the face is drawn about 11% taller here than
     in the photo the same user gets in chat. Deliberate, and reviewed side by
     side against a bot-rendered JPEG — at this size it reads as the same
     card. Do not "fix" it by switching to cover: that would crop the corner
     marks and break the fractions above. */
  .card .front {
    background-color: var(--card-bg);
    background-image: var(--art);
    background-size: 100% 100%;
    background-repeat: no-repeat;
    box-shadow: 0 18px 44px rgba(0,0,0,.5);
    /* The printed V+suit marks occupy the top 21.3% and the bottom 21.4% of
       the art; renderer.py keeps its text inside the central 56% x 76%.
       These are those fractions of the card: 103px and 41px of a 340x470
       one, as they were when that was its only size. */
    padding: calc(var(--card-w) * 103 / 340) calc(var(--card-w) * 41 / 340);
  }
  /* The back of the card is decoration, and it must never be touchable.
     `backface-visibility: hidden` hides it from the eye but not from the
     compositor's touch hit test: both faces are clip layers (`.face` is
     `overflow: hidden`), the back is later in the DOM, so a finger in the
     middle of a card was landing on the back — behind which there is no
     scroller — and a long question could not be scrolled at all. Note that
     `elementFromPoint` disagrees and returns `.q-text`, so this is invisible
     to any check made from script; it takes a real touch to see it.

     pointer-events: none passes the touch through to the front, which is
     where the scrolling text and the swipe both live. */
  .card .back {
    transform: rotateY(180deg);
    background: #4A0A38 url('/assets/backgrounds/card_back.png') no-repeat;
    background-size: 100% 100%;
    box-shadow: 0 18px 44px rgba(0,0,0,.5);
    pointer-events: none;
  }

  /* The text area scrolls on its own. A long question keeps its readable
     size instead of shrinking and still overrunning the footer, and it can
     never reach the printed corner marks — the band is the same one
     renderer.py types into, and .q-zone clips to it.

     The grid stays: a single auto row stretches to the band when the text
     fits (so short questions still sit centred) and grows to the text when
     it doesn't, which leaves the first line at scrollTop 0 instead of
     stranded above it the way align-items:center on a flex box would.

     A cut edge is faded so a clipped line reads as "there's more" rather
     than as a rendering fault — but only an edge that really hides
     something. A permanent fade dims the first line of an unscrolled card
     and the last line at the end of the scroll, which is the fault it was
     meant to prevent. markZoneEdges() sets cut-top/cut-bottom.

     The fade is painted on the face, not masked onto the scroller. It used
     to be a mask-image on .q-zone, taken off when long cards would not
     scroll under a finger. The back face taking the touch was the cause
     (see .card .back), not the mask: neither engine drops a masked
     scroller from its hit test today (audit H-02). The overlay with
     pointer-events:none costs nothing and leaves the scroller alone. */
  .q-zone {
    flex: 1; display: grid; place-items: center;
    overflow-y: auto; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch; touch-action: pan-y;
    scrollbar-width: none;
  }
  .q-zone::-webkit-scrollbar { display: none; }
  /* Inset to the text band .front already reserves, so the fade sits exactly
     over the scroller without covering the printed corner marks. */
  .card .front::before,
  .card .front::after {
    content: ''; position: absolute;
    left: calc(var(--card-w) * 41 / 340); right: calc(var(--card-w) * 41 / 340); height: 18px;
    pointer-events: none; opacity: 0; transition: opacity .16s ease; z-index: 2;
  }
  .card .front::before {
    top: calc(var(--card-w) * 103 / 340);
    background: linear-gradient(to bottom, var(--card-bg), rgba(253,235,247,0));
  }
  .card .front::after {
    bottom: calc(var(--card-w) * 103 / 340);
    background: linear-gradient(to top, var(--card-bg), rgba(253,235,247,0));
  }
  .card .front.cut-top::before { opacity: 1; }
  .card .front.cut-bottom::after { opacity: 1; }
  /* 22px on the 340px card, as before; 17px at the floor on the smallest
     phones, and never above 22px: a large phone gets room, not bigger
     letters. */
  .q-text {
    color: var(--ink); text-align: center; font-weight: 600;
    font-size: var(--fs-card); line-height: 1.42; letter-spacing: .002em;
    overflow-wrap: anywhere;
  }
  /* Level with the bottom-right mark but centred, well clear of it — the
     same place renderer.py puts it, ~11% up from the bottom edge. */
  .card-footer {
    position: absolute; left: 0; right: 0; bottom: calc(var(--card-w) * 40 / 340);
    text-align: center; font-size: 12px; font-weight: 600; color: #7A3F64; letter-spacing: .06em;
  }

  /* Inert: it is a preview of the card a swipe would bring, and it sticks
     out 14px below the top one — enough to catch a tap meant for something
     else. Beneath lies the next card, and the one before it only while the
     top card is dragged right, back to it (dragMove sets `reveal-prev`). */
  .card.under { transition: transform .3s ease, opacity .3s ease; pointer-events: none; }
  .card.under.prev, .reveal-prev > .card.under.next { visibility: hidden; }
  .reveal-prev > .card.under.prev { visibility: visible; }

  .flipper { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.7,.25,1); }
  .flipper.faced { transform: rotateY(180deg); }

  .hint { text-align: center; font-size: 12.5px; color: var(--muted-on-dark); margin-bottom: 8px; }

  /* Back and forward in fixed columns, forward in the middle of three: a
     deck that has no back leaves its slot empty rather than closing up
     (audit D-29) - the room hides it - and the forward button used to
     slide sideways. The third column stays empty, a button's width that
     keeps forward centred under the card; it held a share button, and a
     card is no longer saved or sent out of the app. */
  .deck-controls {
    display: grid; grid-template-columns: 58px 72px 58px;
    justify-content: center; align-items: center; gap: 14px;
  }
  .deck-controls .ctrl { grid-row: 1; grid-column: 1; }
  .deck-controls .ctrl.main { grid-column: 2; }
  /* A deck of one card, the question of the day, has nowhere to go: no
     gauge, no hint, no buttons that could only ever be disabled. */
  .one-card .progress-wrap, .one-card .hint, .one-card .deck-controls { display: none; }
  .ctrl {
    width: 58px; height: 58px; border-radius: 50%; border: 0; cursor: pointer;
    display: grid; place-items: center; font-size: 21px; color: #fff;
    background: rgba(255,255,255,.09); border: 1px solid rgba(255,255,255,.13);
    transition: transform .12s ease;
  }
  .ctrl:active { transform: scale(.9); }
  .ctrl.main {
    width: 72px; height: 72px; font-size: 26px;
    background: linear-gradient(135deg, #C4256E, #7A1147);
    box-shadow: 0 10px 26px rgba(196,37,110,.45);
    border: 0;
  }
  .ctrl[disabled] { opacity: .35; pointer-events: none; }

  /* ---------- overlays ---------- */
  /* Centred by auto margins rather than by justify-content, and scrollable,
     for the same reason the panes above are: `center` distributes negative
     free space too, so an overlay taller than the phone pushed its own head
     above the scroll origin and left the button under it unreachable. The
     69 finale is two choices with a paragraph each, and it was exactly that
     tall. */
  .overlay {
    position: absolute; inset: 0; z-index: 30;
    display: none; align-items: center; flex-direction: column;
    padding: 30px 26px calc(var(--safe-bottom) + 30px);
    background: rgba(20, 2, 13, .88); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    text-align: center;
    overflow-y: auto; overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch; touch-action: pan-y; scrollbar-width: none;
  }
  .overlay::-webkit-scrollbar { display: none; }
  .overlay > * { flex-shrink: 0; }
  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  .overlay.show { display: flex; }
  /* A keyboard user sees where the focus is; a finger or a mouse does not
     (:focus-visible), so no screen a tap reaches changes. An open layer
     takes the focus itself rather than its first button (see
     trackLayerFocus), and a layer is not a control, so it wears no ring. */
  :focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .overlay:focus, .overlay:focus-visible { outline: none; box-shadow: none; }
  .overlay h2 { font-size: 24px; margin-bottom: 10px; }
  /* pre-line: a text built from two sentences with a blank line between
     them (the paywall's referral line, the «69» finale) used to arrive as
     one run-on paragraph, because HTML collapses the line breaks. */
  .overlay p { font-size: 15px; color: var(--muted-on-dark); line-height: 1.5; max-width: 300px; margin-bottom: 24px; white-space: pre-line; }
  .overlay .btn-play { margin-top: 0; padding: 15px 44px; font-size: 16px; }
  /* Everywhere, not only in overlays: «Начать заново» on the «69 ступеней»
     entry is a .btn-ghost outside one, and rendered as the browser's grey
     default button - in the middle of the paid section a returning player
     sees on almost every visit. */
  .btn-ghost,
  .overlay .btn-ghost {
    margin-top: 12px; padding: 13px 34px; font-size: 15px; color: var(--text-on-dark);
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
  }
  .big-emoji { font-size: 58px; margin-bottom: 14px; }

  /* confetti */
  .confetti { position: absolute; top: -12px; width: 9px; height: 15px; opacity: .95; z-index: 31; pointer-events: none;
    animation: fall linear forwards; }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: .7; }
  }

  /* ---- guide (мастер-класс) ---- */
  /* A document, not a deck. The whole thing is read top to bottom with the
     drawing beside the words it describes, because a reader who has to swipe
     to compare step 2 with step 3 loses the thread of what to do next. */
  #guideBody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 28px; }
  #guideBody::-webkit-scrollbar { display: none; }
  .guide-intro { font-size: 14.5px; line-height: 1.6; color: var(--muted-on-dark); margin-bottom: 22px; }
  .guide-step { margin-bottom: 26px; }
  .guide-step-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .guide-num {
    flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%;
    background: linear-gradient(135deg,#7F2BFF,#E100C7); color: #fff;
    font-size: 13px; font-weight: var(--fw-bold); display: grid; place-items: center;
    align-self: center;
  }
  .guide-step-title { font-size: 19px; font-weight: var(--fw-bold); }
  .guide-lead { font-size: 13.5px; line-height: 1.55; color: var(--muted-on-dark); margin: 0 0 12px 36px; }

  .guide-item {
    display: grid; grid-template-columns: 136px 1fr; gap: 12px;
    background: rgba(255,255,255,.05); border-radius: 16px;
    padding: 14px; margin-bottom: 10px;
  }
  .art-wrap { align-self: start; display: flex; flex-direction: column; gap: 4px; }
  /* A photograph in the frame the drawings had, 120 by 130, with rounded
     corners like a print. Until it arrives it holds its place (the
     skeleton shimmer below); the phone's controls on four of the pictures
     are drawn over it in the same frame. */
  .art-photo {
    position: relative; aspect-ratio: 12 / 13; overflow: hidden;
    border-radius: var(--r-sm); background: var(--c-aubergine-900);
  }
  .guide-art {
    display: block; width: 100%; height: 100%; object-fit: cover;
    opacity: 0; transition: opacity var(--dur-3) var(--ease-std);
  }
  .art-photo.ready .guide-art { opacity: 1; }
  .art-over { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  /* What the drawing names in words: the view, and where the light stands.
     A picture shows a body turned away and a body in profile nearly alike
     at 136px, so the caption says it outright. */
  .art-cap {
    font-size: 12px; line-height: 1.3; text-align: center;
    color: var(--muted-on-dark); opacity: .85;
  }
  .art-lamp, .art-cam, .art-focus {
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }
  .art-lamp { stroke: #FFD96E; stroke-width: 1.8; }
  .art-cam  { stroke: #9FEFC4; stroke-width: 1.8; }
  .art-focus { stroke: #9FEFC4; stroke-width: 1.6; stroke-dasharray: 3 3; }
  .art-sight { stroke: #9FEFC4; stroke-width: 1.2; stroke-dasharray: 3 4; fill: none; opacity: .8; }
  .art-dot { fill: #9FEFC4; }
  /* The editing card: where the colour ends and the black and white begins. */
  .art-cut { stroke: #fff; stroke-width: 1.2; opacity: .85; }
  .art-knob { fill: #fff; opacity: .9; }
  /* The crop that leaves the face out: what is outside the frame dims. */
  .art-dim { fill: var(--c-aubergine-900); opacity: .72; }
  /* 10 units of a 120-unit picture: 11.3px in the 136px column, larger
     where the picture stands above the words (audit D-12). Light, with a
     dark edge, because it lies on a photograph. */
  .art-note {
    fill: #fff; opacity: .92; font-size: 10px; font-weight: 600;
    paint-order: stroke; stroke: var(--c-aubergine-900); stroke-width: 2.4px; stroke-opacity: .7;
  }

  /* Under 361px the drawing's column left the words about 110px
     (audit D-23): there the drawing sits above them instead, a little
     larger, and the words get the card's full width. */
  @media (max-width: 360px) {
    .guide-item { grid-template-columns: 1fr; }
    .art-wrap { width: 100%; max-width: 184px; justify-self: center; }
  }

  .guide-item-title { font-size: 16px; font-weight: 700; margin-bottom: 5px; }
  .guide-item-text { font-size: 14px; line-height: 1.5; }
  /* The tips run under both columns: they are how to pull the pose off, and
     belong to the picture and the words together. */
  .guide-tips { grid-column: 1 / -1; margin: 4px 0 0; padding-left: 18px; }
  .guide-tips li { font-size: 13px; line-height: 1.5; color: var(--muted-on-dark); margin-top: 4px; }
  .guide-locked, .guide-nsfw {
    text-align: center; padding: 18px; border-radius: 16px; margin-bottom: 10px;
    background: rgba(255,255,255,.05); font-size: 14px; line-height: 1.5;
  }
  /* A <button>, so it needs its colour and face said: without them it drew
     in the browser's black Arial on the dark page, 1.19:1, and it is the
     only way into the two steps behind the 18+ gate. */
  .guide-nsfw {
    border: 1px dashed rgba(255,255,255,.2); display: block; width: 100%;
    font-family: inherit; font-weight: 600; color: var(--text-on-dark); cursor: pointer;
  }

  /* ---- 69 ступеней ---- */
  /* The board climbs from the bottom, nine squares a row, the way the Lila
     board it is drawn after does: 1-9 left to right along the bottom, 10-18
     back again, up to «Самадхи», a plaque across the rest of the top row.
     A ladder is a Cupid's arrow from the square you land on to the one it
     carries you to; a snake is a serpent with its head on the square you
     land on and its tail on the one it drops you to. Both are drawn over
     the squares (.s69-art), a lotus glows under them (.s69-lotus), and the
     numbers and the pieces sit on top of both.

     No emoji anywhere on it. A square says what it is with colour, a drawn
     mark and the suit of whoever is standing on it — the same four suits
     the deck is printed with. */
  #s69Board { padding-left: 12px; padding-right: 12px; }
  p.s69-intro { font-size: 14px; color: var(--muted-on-dark); line-height: 1.55; text-align: center; }
  p.s69-age { font-size: 12.5px; color: rgba(255,150,190,.85); text-align: center; margin-top: 10px; }

  /* The whole board at once, never a scroller: as wide as the screen, and
     no taller than leaves the card and the dice their room (the dice is the
     one button that has to be pressable). The grid's nine columns and eight
     rows are S69_COLS and the rows 69 squares take. */
  .s69-map {
    position: relative; isolation: isolate; flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(9, minmax(0, 1fr));
    grid-template-rows: repeat(8, minmax(0, 1fr));
    aspect-ratio: 9 / 8;
    width: min(100%, calc(42vh * 9 / 8));
    margin: 4px auto 10px;
    border-radius: var(--r-md); overflow: hidden;
    background: radial-gradient(90% 80% at 50% 55%, var(--c-plum-800) 0%, var(--c-aubergine-900) 100%);
    box-shadow: 0 0 0 1px var(--border-1), var(--shadow-2);
  }
  .s69-map.folded { display: none; }
  .s69-lotus, .s69-art {
    position: absolute; inset: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: visible;
  }
  .s69-art { z-index: var(--z-raised); }

  /* A square is a picture, not a button: what it does reaches only the
     piece that stands on it. Each block of the board has its own ground, so
     the four stages read as colour before a single word is read. */
  .s69-cell {
    position: relative; min-width: 0; min-height: 0;
    box-shadow: inset 0 0 0 .5px rgb(255 255 255 / .16);
    color: var(--text-1);
  }
  .s69-cell.b-awakening   { background: linear-gradient(150deg, rgb(142 124 243 / .3), rgb(200 109 215 / .16)); }
  .s69-cell.b-exploration { background: linear-gradient(150deg, rgb(243 93 138 / .28), rgb(249 141 104 / .14)); }
  .s69-cell.b-temptation  { background: linear-gradient(150deg, rgb(196 37 110 / .34), rgb(110 16 64 / .26)); }
  .s69-cell.b-samadhi     { background: linear-gradient(150deg, rgb(127 43 255 / .34), rgb(225 0 199 / .2)); }
  .s69-cell.passed { background: rgb(20 2 13 / .5); }
  .s69-cell.passed .s69-num { color: var(--text-2); }
  .s69-cell.here { box-shadow: inset 0 0 0 2px var(--accent), inset 0 0 12px rgb(232 107 181 / .55); }

  .s69-num, .s69-mark {
    position: absolute; z-index: var(--z-piece);
    font-size: var(--fs-2xs); font-weight: var(--fw-bold); line-height: 1;
    text-shadow: 0 1px 2px var(--c-aubergine-950), 0 0 3px var(--c-aubergine-950);
  }
  .s69-num { top: 2px; left: 3px; }
  .s69-mark { bottom: 2px; right: 3px; }
  .k-joker .s69-mark { color: var(--c-amber-300); }
  .k-secret .s69-mark { color: var(--secret); }
  .s69-cell.milestone::after {
    content: ''; position: absolute; bottom: 2px; left: 50%; translate: -50% 0;
    width: 10px; height: 2px; border-radius: 2px; background: rgb(255 255 255 / .45);
  }

  /* The last square is a plaque across the rest of the top row. */
  .s69-cell.k-final {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    background: linear-gradient(135deg, var(--c-plum-800), var(--c-plum-600));
    box-shadow: inset 0 0 0 1px rgb(255 217 110 / .55), inset 0 0 18px rgb(255 217 110 / .25);
  }
  .s69-cell.k-final .s69-num { position: static; font-size: var(--fs-sm); }
  .s69-goal {
    position: relative; z-index: var(--z-piece); font-family: var(--font-logo);
    font-size: var(--fs-md); letter-spacing: var(--ls-caps); color: var(--c-amber-300);
    text-shadow: 0 1px 2px var(--c-aubergine-950);
  }

  /* The drawings. A Cupid's arrow: a golden shaft, blush fletching, a heart
     for a head. A serpent of temptation: emerald, gold diamonds down its
     back, gold eyes and a forked tongue. */
  .s69-shaft { fill: url(#s69Shaft); }
  .s69-shaft-tail { stop-color: var(--c-blush-100); }
  .s69-shaft-tip { stop-color: var(--c-amber-300); }
  .s69-feather { fill: var(--c-rose-100); stroke: var(--c-rose-400); stroke-width: .8; }
  .s69-heart { fill: var(--c-rose-600); stroke: var(--c-rose-100); stroke-width: 1.4; stroke-linejoin: round; }
  .s69-arrow { filter: drop-shadow(0 0 3px rgb(255 217 110 / .65)) drop-shadow(0 1px 1px rgb(20 2 13 / .8)); }
  .s69-body, .s69-skull { fill: var(--c-emerald-500); stroke: var(--c-emerald-900); stroke-width: 1.2; stroke-linejoin: round; }
  .s69-diamonds { fill: var(--c-amber-300); stroke: var(--c-emerald-900); stroke-width: .8; opacity: .9; }
  .s69-crown { fill: var(--c-amber-300); opacity: .9; }
  .s69-eye { fill: var(--c-amber-300); }
  .s69-pupil { stroke: var(--c-aubergine-950); stroke-width: 1.3; stroke-linecap: round; }
  .s69-tongue { fill: none; stroke: var(--c-red-300); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .s69-snake { filter: drop-shadow(0 1px 2px rgb(20 2 13 / .85)); }
  /* The portal a piece is riding lights up for the ride. */
  .s69-arrow.live, .s69-snake.live { filter: drop-shadow(0 0 6px var(--c-amber-300)); }

  .s69-petal { fill: url(#s69Petal); stroke: var(--c-rose-100); stroke-opacity: .35; stroke-width: 1.5; opacity: .5; }
  .s69-petal.back { opacity: .3; }
  .s69-petal-root { stop-color: var(--c-violet-500); }
  .s69-petal-tip { stop-color: var(--c-rose-300); }
  .s69-glow-in { stop-color: var(--c-rose-400); stop-opacity: .35; }
  .s69-glow-out { stop-color: var(--c-rose-400); stop-opacity: 0; }

  /* A piece is the suit its player chose, standing in the middle of its
     square over the drawings; two on one square stand side by side, seat 0
     on the left. In flight it leaves its square for the map itself. */
  .s69-piece {
    position: absolute; left: 50%; top: 55%; translate: -50% -50%; z-index: 4;
    width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
    font-size: var(--fs-2xs); line-height: 1; font-weight: var(--fw-bold);
    background: var(--c-blush-50); color: var(--c-ink);
    box-shadow: var(--shadow-1);
  }
  .s69-piece.red { color: var(--c-rose-600); }
  .s69-piece.mine { outline: 2px solid var(--accent); }
  .duo .s69-piece.seat-0 { left: calc(50% - 6px); }
  .duo .s69-piece.seat-1 { left: calc(50% + 6px); }
  .s69-piece.flight { z-index: 5; }

  /* The suit picker at the start of a game. */
  .s69-suits { display: flex; justify-content: center; gap: 10px; margin: 4px 0 2px; }
  .s69-suit {
    width: 54px; height: 54px; border-radius: 16px; font-size: 26px; line-height: 1;
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.14);
    color: var(--text-on-dark); cursor: pointer; display: grid; place-items: center;
  }
  .s69-suit.red { color: #FF89B8; }
  .s69-suit.on { background: rgba(232,107,181,.28); border-color: rgba(232,107,181,.9); }
  .s69-suit[disabled] { opacity: .25; pointer-events: none; }
  /* The finales show the two pieces that made it, as the picker drew them
     (audit D-39: fire and fireworks were emoji on a board that has none). */
  .s69-pair { display: flex; justify-content: center; gap: 12px; margin-bottom: 16px; }
  .s69-pair span {
    width: 64px; height: 64px; border-radius: 18px; font-size: 32px; line-height: 1;
    display: grid; place-items: center; color: var(--text-on-dark);
    background: rgba(232,107,181,.16); border: 1px solid rgba(232,107,181,.55);
  }
  .s69-pair span.red { color: #FF89B8; }

  .s69-card {
    background: var(--card-bg); color: var(--ink); border-radius: var(--radius-card);
    padding: 18px 18px 16px;
    /* flex-basis 0 with a floor, so the card shrinks to whatever is left
       rather than pushing the dice off the bottom of the screen. */
    flex: 1 1 0; min-height: 96px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex; flex-direction: column; gap: 10px;
  }
  .s69-card::-webkit-scrollbar { display: none; }
  .s69-title { font-size: 22px; font-weight: var(--fw-bold); line-height: 1.2; }
  .s69-text { font-size: 15.5px; line-height: 1.55; }
  .s69-note {
    margin-top: 4px; padding: 10px 12px; border-radius: 12px; font-size: 13.5px;
    line-height: 1.45; background: rgba(53,0,39,.07);
  }
  .s69-note.up   { background: rgba(60,170,110,.14); }
  .s69-note.down { background: rgba(220,60,100,.12); }
  .s69-note b { display: block; margin-bottom: 3px; }
  /* Where the partner's piece is standing, under the player's own card. */
  .s69-partner {
    font-size: 13px; line-height: 1.5; color: rgba(53,0,39,.62);
    border-top: 1px solid rgba(53,0,39,.12); padding-top: 10px; margin-top: 2px;
  }
  .s69-partner b { color: var(--ink); }

  /* «Скрытое пламя»: blurred until tapped, and then it stays open. Closing
     again mid-task would make a player re-open it with wet hands. */
  .s69-spoiler { position: relative; margin-top: 4px; cursor: pointer; }
  .s69-spoiler .veil {
    filter: blur(9px); transition: filter .45s ease; font-size: 15.5px; line-height: 1.55;
    user-select: none; -webkit-user-select: none;
  }
  .s69-spoiler.open .veil { filter: blur(0); user-select: auto; -webkit-user-select: auto; }
  /* The card is light, and the global .hint is a light colour for a dark
     page: the one instruction on a secret square measured 1.01:1. */
  .s69-spoiler .hint {
    display: block; text-align: center; font-size: 12px; color: var(--ink); opacity: .6; margin-top: 8px;
  }
  .s69-spoiler.open .hint { display: none; }

  .s69-turn { display: flex; justify-content: center; margin-bottom: 8px; flex: 0 0 auto; }
  .s69-dice { flex: 0 0 auto; }
  .s69-dice {
    width: 100%; margin-top: 10px; border: 0; border-radius: 18px; padding: 16px;
    font: inherit; font-size: 17px; font-weight: var(--fw-bold); color: #fff; cursor: pointer;
    background: linear-gradient(135deg, #7F2BFF 0%, #E100C7 100%);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .s69-dice:active { transform: scale(.97); }
  .s69-dice[disabled] { opacity: .3; pointer-events: none; }
  /* The die face, drawn from the number the server rolled rather than an
     emoji, so it can show what actually came up. */
  .s69-die {
    width: 26px; height: 26px; border-radius: 6px; background: #fff; color: #350027;
    display: grid; place-items: center; font-size: 15px; font-weight: var(--fw-bold);
  }
  .s69-dice.rolling .s69-die { animation: s69-tumble .45s linear infinite; }
  @keyframes s69-tumble { to { transform: rotate(360deg); } }

  .s69-finale { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
  .s69-finale .btn { margin-top: 0; }
  .s69-choice-text { font-size: 14px; line-height: 1.55; color: var(--muted-on-dark); margin-bottom: 18px; }

  /* The paywall says what the payment opens, as a list, so it reads the same
     at every door: the end of the free cards, a room, the test, the board,
     the Library and the masterclass. */
  #paywall .pay-lead { margin-bottom: 14px; }
  #paywall .pay-includes { margin-bottom: 8px; color: var(--text-on-dark); font-weight: 600; }
  #paywall .pay-list {
    list-style: none; padding: 0; margin: 0 0 14px; max-width: 300px; width: 100%;
    text-align: left; font-size: 15px; line-height: 1.45; color: var(--text-on-dark);
  }
  #paywall .pay-list li { position: relative; padding: 3px 0 3px 22px; }
  #paywall .pay-list li::before { content: '♥'; position: absolute; left: 2px; color: #E86BB5; }
  #paywall .pay-promise { margin-bottom: 14px; }
  #paywall .pay-referral { margin-bottom: 18px; color: var(--text-on-dark); }
  #giftSheet .gift-text { margin-bottom: 14px; }
  #giftSheet .gift-price { margin-bottom: 14px; color: var(--text-on-dark); font-weight: 600; }
  #giftSheet .gift-note { margin-bottom: 18px; }

  /* Wraps inside the screen and is opaque. It used to be one nowrap line on
     translucent glass: an error such as «Нет связи с сервером…» ran off
     both edges at 390px, and over a light card white-on-glass was 1.15:1 -
     unreadable exactly when something had gone wrong. */
  #toast {
    position: absolute; left: 50%; bottom: calc(var(--safe-bottom) + 110px); transform: translateX(-50%) translateY(16px);
    width: max-content; max-width: calc(100% - 32px); box-sizing: border-box;
    background: #2E1827; border: 1px solid rgba(255,255,255,.14);
    color: #fff; font-size: 13.5px; font-weight: 600; line-height: 1.35; text-align: center;
    padding: 10px 18px; border-radius: 18px; opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s; z-index: 40; white-space: normal;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  #loader { position: absolute; inset: 0; display: none; place-items: center; z-index: 50; background: rgba(20,2,13,.6); }
  #loader.show { display: grid; }
  .spinner { width: 42px; height: 42px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: #E86BB5; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- waiting, loading, destroying (audit D-38) ---------- */
  /* Waiting for the partner is a live state, not a sentence: a dot breathes
     in front of the words, on the invite screens and in the turn chip.
     Under reduced motion the rule at the top stops it, lit. */
  .waiting:not(:empty)::before {
    content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    margin-right: 8px; vertical-align: .1em; background: var(--accent);
    animation: waiting-breath 1.6s ease-in-out infinite;
  }
  @keyframes waiting-breath {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .3; transform: scale(.6); }
  }
  /* What is on its way holds its place: rows of the size of what will come,
     shimmering, so the home screen does not jump when its last two buttons
     arrive and the Practices list is not an empty screen under a spinner. */
  #homeModules .skeleton, #libraryList .skeleton, .art-photo.skeleton {
    pointer-events: none; border-color: transparent; box-shadow: none;
    background: linear-gradient(100deg, var(--surface-1) 35%, var(--surface-3) 50%, var(--surface-1) 65%);
    background-size: 300% 100%;
    animation: skeleton-shimmer 1.4s linear infinite;
  }
  @keyframes skeleton-shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  /* A button that destroys what two people share - the test's answers, a
     game's progress - looks like it: the danger colour on a quiet ground,
     never the fill of the way forward. */
  .btn.btn-danger { color: var(--danger); background: transparent; border: 1px solid var(--danger-line); }
  /* A button whose answer is on its way says so, and takes no second tap
     meanwhile (busyWhile). */
  .btn.busy { pointer-events: none; opacity: .75; }
  .btn.busy::after {
    content: ''; display: inline-block; width: 12px; height: 12px; margin-left: 10px;
    vertical-align: -1px; border-radius: 50%;
    border: 2px solid var(--surface-3); border-top-color: var(--accent);
    animation: spin .8s linear infinite;
  }
</style>
</head>
<body>
<div id="shell">

  <!-- HOME -->
  <section class="screen active" id="home">
    <h1 class="logo">Vechnost</h1>
    <div class="tagline" data-i18n="tagline"></div>
    <!-- Each card is its deck's real art with its own suit as the centre
         pip: ♥ Знакомство, ♠ Для пар, ♣ Секс, ♦ Провокации. -->
    <div class="deck-fan">
      <i style="background-image:url(/assets/suits/hearts.png),url(/assets/deck_art/acq/acq_1.png)"></i>
      <i style="background-image:url(/assets/suits/spades.png),url(/assets/deck_art/couples/couples_1.png)"></i>
      <i style="background-image:url(/assets/suits/clubs.png),url(/assets/deck_art/sex/sex.png)"></i>
      <i style="background-image:url(/assets/suits/diamonds.png),url(/assets/deck_art/prov/prov.png)"></i>
    </div>
    <button class="btn btn-play" id="btnPlay" data-i18n="play"></button>
    <button class="btn btn-second" id="btnCoop" data-i18n="coopBtn"></button>
    <button class="btn btn-second" id="btnCompat" data-i18n="compatBtn"></button>
    <button class="btn btn-second" id="btnS69" data-i18n="s69Btn"></button>
    <!-- Two rows, not six. The five reading modules sit one tap deeper
         behind «Практики», because the home screen is where a couple decide
         what to do tonight and five titles of prose drowned the four things
         they came for. The masterclass stays on the surface: it is a course,
         not a list to browse. renderHomeModules() fills this in once
         /api/library answers, so a module added on the server still lands
         in the right place without another button written by hand. -->
    <div id="homeModules" aria-busy="true">
      <div class="btn btn-second home-mod skeleton" aria-hidden="true">&nbsp;</div>
      <div class="btn btn-second home-mod skeleton" aria-hidden="true">&nbsp;</div>
    </div>
    <!-- The gift button follows here while a gift is on offer, added and
         removed by setAccess rather than kept hidden: the column is centred
         by margin-bottom:auto on its :last-child, and a hidden last child
         took the centring with it. -->
  </section>

  <!-- COOP entry -->
  <section class="screen" id="coop">
    <div class="top">
      <button class="icon-btn back" id="coopBack" aria-label="Назад">←</button>
      <h1 class="title" data-i18n="coopTitle"></h1>
      <div class="top-spacer"></div>
    </div>
    <div class="coop-box">
      <p data-i18n="coopIntro"></p>
      <button class="btn btn-play" id="btnCoopCreate" data-i18n="coopCreate" style="margin-top:0"></button>
    </div>
  </section>

  <!-- LIBRARY -->
  <section class="screen" id="library">
    <div class="top">
      <button class="icon-btn back" id="libBackHome" aria-label="Назад">←</button>
      <h1 class="title" data-i18n="libraryTitle"></h1>
      <div class="top-spacer"></div>
    </div>
    <div id="libraryList"></div>
  </section>

  <section class="screen" id="libraryDetail">
    <div class="top">
      <button class="icon-btn back" id="libBack" aria-label="Назад">←</button>
      <h1 class="title" id="libDetailTitle"></h1>
      <div class="top-spacer"></div>
    </div>
    <div id="libDetailBody"></div>
  </section>

  <!-- GUIDE: a module read as a document rather than swiped as a deck. -->
  <section class="screen" id="guide">

    try { tg.disableVerticalSwipes(); } catch (e) {}
    paintTelegram(tg);

  // Telegram's own chrome in the app's colour, read from its token: the
  // header, the background and, from Bot API 7.10, the bottom bar (audit
  // D-24). A client before 6.9 takes no colour for the header, only a theme
  // key, and threw on the hex - which also skipped the background after it.
  // Telegram's script repaints all three on a theme change and keeps the
  // --tg-* safe-area insets current, so the page listens for neither.
  function paintTelegram(tg) {
    const shell = getComputedStyle(document.documentElement)
      .getPropertyValue('--c-aubergine-900').trim();
    const since = (version) => {
      try { return tg.isVersionAtLeast(version); } catch (e) { return false; }
    };
    try { tg.setHeaderColor(since('6.9') ? shell : 'bg_color'); } catch (e) {}
    try { tg.setBackgroundColor(shell); } catch (e) {}
    if (since('7.10')) { try { tg.setBottomBarColor(shell); } catch (e) {} }
  }
  const haptic = (type) => {
    try {
      if (!tg || !tg.HapticFeedback) return;
      if (type === 'ok') tg.HapticFeedback.notificationOccurred('success');
      else tg.HapticFeedback.impactOccurred(type || 'light');

  // typography:start
  // Where a line may not break (audit D-31): a short word stays with the
  // word after it and a dash with the word before it, joined by a no-break
  // space. The same rule, pattern for pattern, as vechnost_bot/typography.py:
  // tests/test_typography.py runs the two on one list of lines. No
  // lookbehind: Telegram's WebView on older iPhones has none, and a pattern
  // with one would stop the whole script.
  const PREPOSITIONS = ['без', 'для', 'над', 'под', 'при', 'про', 'изо', 'обо', 'ото'];
  const SHORT_THEN_SPACE = /(^|[^A-Za-zА-Яа-яЁё0-9])([A-Za-zА-Яа-яЁё]{1,3}|[0-9]{1,3}) (?=\S)/g;
  const SPACE_THEN_DASH = / (?=[–—](?:\s|$))/g;
  function bindsNext(word) {
    return /^[0-9]+$/.test(word) || word.length <= 2 || PREPOSITIONS.includes(word.toLowerCase());
  }
  function bindShortWords(text) {
    text = String(text);
    // Twice: in «а и в доме» the match for «а» takes the space «и» needs
    // as its lead, so one pass binds every other short word.
    for (let pass = 0; pass < 2; pass++) {
      text = text.replace(SHORT_THEN_SPACE, (match, lead, word) =>
        lead + word + (bindsNext(word) ? '\u00a0' : ' '));
    }
    return text.replace(SPACE_THEN_DASH, '\u00a0');
  }
  // typography:end

  // Every string the app itself says, bound once here; what the server
  // sends is bound where it is put on screen (escapeHTML).
  (function bindCopy(node) {
    for (const key of Object.keys(node)) {
      if (typeof node[key] === 'string') node[key] = bindShortWords(node[key]);
      else if (node[key] && typeof node[key] === 'object') bindCopy(node[key]);
    }
  })(I18N);

  const THEME_ORDER = ['Acquaintance', 'For Couples', 'Sex', 'Provocation'];

  // The card face each deck is printed on, same mapping the bot reads from
  // assets/backgrounds.yml. What identifies a face differs per deck: the two
  // levelled decks by level, Sex by content type, Provocation by nothing —
  // so each entry says which, rather than the lookup guessing.
  const CARD_ART = {
    'Acquaintance': { by: 'level', faces: { 1: 'acq/acq_1.png', 2: 'acq/acq_2.png', 3: 'acq/acq_3.png' } },
    'For Couples':  { by: 'level', faces: { 1: 'couples/couples_1.png', 2: 'couples/couples_2.png', 3: 'couples/couples_3.png' } },
    // One face for its questions and its tasks: the art is one picture
    // (audit D-42), and by: 'type' can take two again the day it is not.
    'Sex':          { by: 'deck',  faces: { deck: 'sex/sex.png' } },
    'Provocation':  { by: 'deck',  faces: { deck: 'prov/prov.png' } }
  };

  // The Library has one face of its own — no levels, no content types, so no
  // lookup. Same PNG the bot composites the daily push onto.
  const LIBRARY_ART = '/assets/backgrounds/library.png';

  // Returns the URL of the printed face, or null when nothing matches. Null
  // leaves --art unset, so the card renders as a blank pink rectangle with no
  // corner marks: wrong in a way you can see, rather than quietly wearing some
  // other deck's face.
  function cardArt(theme, level, type) {
    const deck = CARD_ART[theme];
    if (!deck) { console.warn('vechnost: no card art for theme', theme); return null; }
    const key = deck.by === 'level' ? level : deck.by === 'type' ? type : 'deck';
    const file = deck.faces[key];
    if (!file) { console.warn('vechnost: no card art for', theme, deck.by, key); return null; }
    return '/assets/backgrounds/' + file;
  }

  /* ---------------- state ---------------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem('vech.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('vech.' + k, JSON.stringify(v)); } catch (e) {} }
  };

  // The Mini App is Russian-only; the server still accepts (and coerces
  // unknown values to) a lang query param, so this stays a constant rather
  // than a widened surface.
  const lang = 'ru';

    theme: null, level: null, type: 'questions',
    order: [], idx: 0, shuffled: false

  // Which deck is on the stage, as a number that only ever goes up. flyOut's
  // 300ms timer belongs to the deck that launched it, and the "did they leave?"
  // check inside it asks the *screen element* — which cannot tell two decks
  // apart when they share one: every Library deck is #libDeck, and solo and
  // couple mode are both #deck. Leaving one Library deck for another inside the
  // animation stepped the new deck by one; coop → home → a solo deck inside it
  // ran coopAdvanceAfterFly against a room that no longer existed and left a
  // blank stage with deckDirty stuck on. Every entry point stamps a new
  // generation; the timer stands down if it has moved.
  let deckGen = 0;

  const T = () => I18N;

  /* ---------------- i18n render ---------------- */
  function applyI18n() {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (T()[key]) el.textContent = T()[key];
    });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => {
      const key = el.getAttribute('data-i18n-aria');
      if (T()[key]) el.setAttribute('aria-label', T()[key]);
    });
    $('modeQ').textContent = '❓ ' + T().questions;
    $('modeT').textContent = '📝 ' + T().tasks;
  }

  /* ---------------- navigation ---------------- */
  function show(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    // A screen switch dismisses whatever overlay rode on the old screen:
    // the finished-deck banner, the paywall and the 18+ gate all used to
    // survive Back and sit over the home screen (leaveS69 already cleared
    // its own three — this is that rule, for every overlay, in one place).
    document.querySelectorAll('.overlay.show').forEach(o => o.classList.remove('show'));
    // The compat entry screen re-wires its resume offer on every visit,
    // whichever path led here: the button used to keep a stale closure and
    // 404 forever after a delete or a second test.
    if (id === 'compat') refreshCompatResume();
    // So does «69 ступеней»'s: back from the invite screen it used to offer
    // nothing, and a second board silently left the first one behind
    // (audit D-19).
    if (id === 's69') s69OfferResume();
    $(id).classList.add('active');
    syncBackButton();
  }
  function syncBackButton() {
    try {
      if (!tg || !tg.BackButton) return;
      const home = $('home').classList.contains('active');
      if (!home || document.querySelector('.overlay.show')) tg.BackButton.show();
      else tg.BackButton.hide();
    } catch (e) {}
  }
  // A layer takes the focus while it is open and gives it back when it
  // closes (audit D-14): a keyboard or a screen reader used to stay on the
  // button behind the layer, reading a screen nobody could see. The layer
  // takes it itself, not its first button: the first button of the 18+
  // question is «yes», and nothing should be chosen for anyone. Every
  // layer opens and closes by its `show` class, in a couple of dozen
  // places, so this watches the class rather than each of them.
  const layerOpener = new WeakMap();
  function trackLayerFocus(layer) {
    const open = layer.classList.contains('show');
    if (open && !layerOpener.has(layer)) {
      const from = document.activeElement;
      layerOpener.set(layer, from && from !== document.body ? from : null);
      try { layer.focus({ preventScroll: true }); } catch (e) {}
    } else if (!open && layerOpener.has(layer)) {
      const from = layerOpener.get(layer);
      layerOpener.delete(layer);
      const now = document.activeElement;
      // Back where it came from, if that is still on screen and the focus
      // has not moved on meanwhile, into another layer say.
      if (from && from.isConnected && from.offsetParent !== null &&
          (!now || now === document.body || now === layer || layer.contains(now))) {
        try { from.focus({ preventScroll: true }); } catch (e) {}
      }
    }
  }
  try {
    const layers = new MutationObserver((records) => {
      syncBackButton();
      records.forEach(record => trackLayerFocus(record.target));
    });
    document.querySelectorAll('.overlay').forEach(o =>
      layers.observe(o, { attributes: true, attributeFilter: ['class'] }));
  } catch (e) {}

  // The top layer closes the way its own «Назад» or «Закрыть» would
  // (`data-dismiss`). Telegram's Back and the Escape key both come here.
  function dismissTopLayer() {
    const layer = document.querySelector('.overlay.show');
    if (!layer) return false;
    const dismiss = layer.querySelector('[data-dismiss]');
    if (dismiss) dismiss.click(); else layer.classList.remove('show');
    return true;
  }

  // The keyboard, for Telegram Desktop and a browser (audit D-14): Escape
  // closes the top layer, Tab goes round inside an open one rather than
  // out behind it, and the arrows turn the cards of the deck and of a
  // Library deck, as the buttons under them do.
  const FOCUSABLE = 'button, [href], input, select, textarea, summary, [tabindex]:not([tabindex="-1"])';
  const ARROWS = { deck: ['btnPrev', 'btnNext'], libDeck: ['libPrev', 'libNext'] };
  document.addEventListener('keydown', (e) => {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    const layer = document.querySelector('.overlay.show');
    if (layer) {
      if (e.key === 'Escape') { e.preventDefault(); dismissTopLayer(); return; }
      if (e.key !== 'Tab') return;
      // Taken over whole, not only at the ends: WebKit leaves buttons out
      // of the Tab order unless a setting puts them in, and a layer's
      // buttons are all it has.
      e.preventDefault();
      const items = [...layer.querySelectorAll(FOCUSABLE)]
        .filter(el => !el.disabled && el.offsetParent !== null);
      if (!items.length) return;
      const at = items.indexOf(document.activeElement);

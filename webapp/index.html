      const next = at < 0 ? (e.shiftKey ? items.length - 1 : 0)
                          : (at + (e.shiftKey ? items.length - 1 : 1)) % items.length;
      items[next].focus();
      return;
    }
    if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable]')) return;
    const screen = document.querySelector('.screen.active');
    const pair = screen && ARROWS[screen.id];
    const id = pair && (e.key === 'ArrowLeft' ? pair[0] : e.key === 'ArrowRight' ? pair[1] : null);
    const button = id && $(id);
    if (!button || button.disabled || button.offsetParent === null) return;
    e.preventDefault();
    button.click();
  });

  // Telegram draws its own Back in the header (Bot API 6.1 and later), so
  // the page's «←» is hidden there (audit D-25); outside Telegram - platform
  // 'unknown', a plain browser - the page's own is the only one there is.
  try {
    if (tg && tg.BackButton && tg.platform && tg.platform !== 'unknown' &&
        (!tg.isVersionAtLeast || tg.isVersionAtLeast('6.1'))) {
      document.documentElement.classList.add('tg-back');
    }
  } catch (e) {}

  if (tg && tg.BackButton) {
    try {
      tg.BackButton.onClick(() => {
        // The top layer first. An open overlay is what Back closes, the way
        // its own «Назад» or «Закрыть» would (`data-dismiss`); the Android
        // gesture used to leave the screen under a paywall or an 18+
        // question instead (audit D-06).
        if (dismissTopLayer()) return;
        // Otherwise the screen's own back, the «←» in its header: one
        // behaviour for both, so hiding the page's copy inside Telegram
        // (audit D-25) cannot make the two drift apart.
        const back = document.querySelector('.screen.active .top .icon-btn.back');
        if (back) back.click();
      });
    } catch (e) {}
  }

  // 401, 429 and 5xx used to fall through to "check your connection", which
  // is a lie in all three cases and, worse, unreportable: a screenshot of it
  // says nothing about what the server actually refused.
  function statusMessage(e) {
    if (e.status === 401) return T().authExpired;
    if (e.status === 429) return T().tooMany;
    if (e.status >= 500) return T().serverError;
    // Neutral wording: this fallback fires on the dice, on an answer, on an
    // advance — «не удалось загрузить вопросы» was a lie everywhere but the
    // question loader, which reports T().loadError itself.
    if (!e.status) return T().netError;   // genuinely no reply: offline
    return T().netError + ' (' + e.status + ')';
  }

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    // Long enough to read: 1.7 s was a third of a 72-character error.
    t._h = setTimeout(() => t.classList.remove('show'),
                      Math.min(6000, Math.max(2500, 55 * String(msg).length)));
  }

  /* ---------------- network ---------------- */
  // Every request has a deadline. One that never returned used to leave
  // the full-screen loader up until the WebView gave up on its own, which
  // on a phone is a minute of an app that looks frozen.
  const REQUEST_TIMEOUT_MS = 10000;

  async function timedFetch(url, init) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), REQUEST_TIMEOUT_MS);
    try {
      return await fetch(url, Object.assign({ signal: ctl.signal }, init || {}));
    } finally {
      clearTimeout(timer);
    }
  }

  // An Error that carries the status, so a caller can tell a 401 from a
  // 429 from no network at all; statusMessage() does the wording. The
  // server says what went wrong in `detail`; keep it.
  async function httpError(res, path) {
    const e = new Error('http ' + res.status);
    e.status = res.status;
    try { e.detail = (await res.json()).detail; } catch (_) { e.detail = null; }
    console.error('API', res.status, path, e.detail || '');
    return e;
  }

  // One loop for the three two-partner screens. Chained timeouts rather
  // than an interval, so the pause can stretch: a 429 or a 5xx doubles it
  // up to POLL_MAX_MS and a good answer resets it. A 401 stops the loop
  // and says so: initData is signed for a day, and a tab left open
  // overnight outlived it while the screen read «Ждём партнёра…» and the
  // server was asked every two seconds, forever. 404 and 410 hand over to
  // the screen's own onGone: the room, test or board is no more. A
  // fetchState that returns null means "nothing to poll", and stops
  // quietly.
  const POLL_MAX_MS = 20000;

  function startPoll(state, every, fetchState, onState, onGone) {
    stopPoll(state);
    const run = { active: true, handle: null };
    state.timer = run;
    let delay = every;
    const tick = async () => {
      if (!run.active) return;
      try {
        const st = await fetchState();
        if (!run.active) return;
        if (st === null) { stopPoll(state); return; }
        delay = every;
        onState(st);
      } catch (e) {
        if (!run.active) return;
        if (e.status === 404 || e.status === 410) { stopPoll(state); onGone(); return; }
        if (e.status === 401) { stopPoll(state); toast(T().authExpired); return; }
        delay = Math.min(delay * 2, POLL_MAX_MS);
      }
      if (run.active) run.handle = setTimeout(tick, delay);
    };
    run.handle = setTimeout(tick, delay);
  }

  function stopPoll(state) {
    const run = state.timer;
    if (!run) return;
    run.active = false;
    if (run.handle) clearTimeout(run.handle);
    state.timer = null;
  }

  /* ---------------- data ---------------- */
  let ACCESS = { paid: true };
  // The one place the access payload lands, so what depends on it - the
  // gift button, for one - follows every refresh. The button exists only
  // while a gift is on offer: #home centres its column with
  // margin-bottom:auto on :last-child, which counts a hidden element too,
  // and a hidden button there sank the home screen to the bottom of every
  // tall phone (the visual check, 393x852 and 430x932).
  function setAccess(access) {
    ACCESS = access;
    let gift = $('btnGift');
    if (ACCESS.gift_url && !gift) {
      gift = document.createElement('button');
      gift.className = 'btn btn-ghost';
      gift.id = 'btnGift';
      gift.textContent = T().giftBtn;
      gift.onclick = () => showGift('home');
      $('home').appendChild(gift);
    } else if (!ACCESS.gift_url && gift) {
      gift.remove();
    }
  }
  const fmt = (tpl, vars) => tpl.replace(/\{(\w+)\}/g, (_, k) => vars[k] != null ? vars[k] : '');

  // One paywall for every door a payment opens: the end of the free cards,
  // a couple room's last free card, the test, the board, the Library and the
  // masterclass. It says what the payment opens - the same list the bot's
  // paywall sends - rather than only what was just refused, and the Library
  // and the masterclass no longer jump straight to the payment page past it.
  const PAYWALL_LEAD = {
    deck: 'paywallLeadDeck', room: 'paywallLeadRoom', compat: 'paywallLeadCompat',
    s69: 'paywallLeadS69', library: 'paywallLeadLibrary', guide: 'paywallLeadGuide',
  };
  let PAYWALL_CTX = null;     // which door the open paywall stands in
  let PAY_PENDING = false;    // «Открыть всё» was pressed: look for the payment

  function showPaywall(ctx, vars) {
    const t = T();
    PAYWALL_CTX = ctx;
    track('paywall_view', ctx);
    $('paywallTitle').textContent = (ctx === 'deck' || ctx === 'room') ? t.paywallTitle : t.paywallTitleFull;
    $('paywallLead').textContent = fmt(t[PAYWALL_LEAD[ctx]] || '', vars || {});
    $('paywallList').innerHTML = t.payItems.map(item => '<li>' + escapeHTML(item) + '</li>').join('');
    const referral = ACCESS.discount_percent ? fmt(t.paywallReferral, { percent: ACCESS.discount_percent }) : '';
    $('paywallReferral').textContent = referral;
    $('paywallReferral').style.display = referral ? '' : 'none';
    $('paywallBuy').textContent = t.paywallBuy + (ACCESS.price ? ' – ' + ACCESS.price : '');
    // No payment link, no button that does nothing - and nothing to refresh.
    $('paywallBuy').style.display = ACCESS.payment_url ? '' : 'none';
    $('paywallRefresh').style.display = ACCESS.payment_url ? '' : 'none';
    $('paywallGift').style.display = ACCESS.gift_url ? '' : 'none';
    $('paywall').classList.add('show');
  }

  function closePaywall() {
    $('paywall').classList.remove('show');
    PAYWALL_CTX = null;
  }

  // A Tribute page: a t.me link opens inside Telegram, anything else in the
  // browser Telegram opens.
  function openPayLink(url) {
    try {
      if (tg && url.startsWith('https://t.me')) tg.openTelegramLink(url);
      else if (tg) tg.openLink(url);
      else window.open(url, '_blank');
    } catch (e) { window.open(url, '_blank'); }
  }

  $('paywallBuy').onclick = () => {
    const url = ACCESS.payment_url;
    if (!url) return;
    haptic('light');
    PAY_PENDING = true;
    track('buy_click', PAYWALL_CTX);
    openPayLink(url);
  };
  $('paywallGift').onclick = () => { closePaywall(); showGift('paywall'); };
  $('paywallClose').onclick = closePaywall;
  $('paywallRefresh').onclick = () => { haptic('light'); refreshAccess(true); };

  // Access used to be read once, at launch: someone who paid and came back
  // stood at the same paywall until they closed the app and opened it again,
  // and a solo deck they reopened started over at card 1. Now the app asks
  // again - when it comes back into view after «Открыть всё», a few times,
  // because Tribute's webhook can land seconds after the person does, and
  // whenever «Уже оплатили?» is pressed - and carries on from where the
  // paywall stopped them.
  let REFRESHING = false;

  async function refreshAccess(manual) {
    if (REFRESHING) return ACCESS.paid;
    REFRESHING = true;
    if (manual) $('loader').classList.add('show');
    try {
      const headers = {};
      if (tg && tg.initData) headers['Authorization'] = 'tma ' + tg.initData;
      const res = await timedFetch('/api/questions?lang=' + lang, { cache: 'no-store', headers });
      if (!res.ok) throw await httpError(res, '/api/questions');
      const json = await res.json();
      const access = json.access || { paid: true };
      if (!access.paid) {
        setAccess(access);
        if (manual) toast(T().payNotYet);
        return false;
      }
      DATA = json.themes;
      setAccess(access);
      PAY_PENDING = false;
      const ctx = PAYWALL_CTX;
      closePaywall();
      haptic('ok');
      toast(T().payOpened);
      afterAccessOpened(ctx);
      return true;
    } catch (e) {
      if (manual) toast(e.status ? statusMessage(e) : T().loadError);
      return false;
    } finally {
      REFRESHING = false;
      if (manual) $('loader').classList.remove('show');
    }
  }

  // Back from the payment page: ask now, then again while the webhook may
  // still be on its way. Stops at the first answer that says paid.
  const PAY_RECHECK_MS = [0, 3000, 8000, 15000];
  let payRecheck = null;

  function recheckAfterPayment() {
    if (!PAY_PENDING || ACCESS.paid) return;
    if (payRecheck) clearTimeout(payRecheck);
    let step = 0;
    const next = async () => {
      payRecheck = null;
      if (!PAY_PENDING || ACCESS.paid) return;
      if (await refreshAccess(false)) return;
      step += 1;
      if (step < PAY_RECHECK_MS.length) payRecheck = setTimeout(next, PAY_RECHECK_MS[step] - PAY_RECHECK_MS[step - 1]);
    };
    payRecheck = setTimeout(next, PAY_RECHECK_MS[0]);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') recheckAfterPayment();
  });
  try { if (tg && tg.onEvent) tg.onEvent('activated', recheckAfterPayment); } catch (e) {}

  // Carry on from the paywall that stopped them.
  function afterAccessOpened(ctx) {
    if (COOP.active && C.code) {
      // The room hears of it on its next poll anyway; this is that poll, now.
      coopFetch('/api/rooms/' + C.code).then(onCoopState).catch(() => {});
      return;
    }
    if ($('deck').classList.contains('active') && S.theme && DATA && DATA[S.theme]) {
      const grown = growOrder(deckItems().length);
      if (grown && ctx === 'deck' && S.idx < S.order.length - 1) S.idx += 1;
      persistDeck();
      renderStage(true);
      return;
    }
    if (ctx === 'library' || ctx === 'guide') reopenLibModule();
  }

  // A deck saved on the free preview, reopened whole: the cards already dealt
  // keep their places and the rest follow - shuffled if the deck was.
  function growOrder(size) {
    if (!(S.order.length < size)) return false;
    const have = new Set(S.order);
    const rest = [];
    for (let i = 0; i < size; i++) if (!have.has(i)) rest.push(i);
    if (S.shuffled) {
      for (let i = rest.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [rest[i], rest[j]] = [rest[j], rest[i]];
      }
    }
    S.order = S.order.concat(rest);
    return true;
  }

  // One request at a time, shared: the preload at launch and a tap on
  // «Играть» while it is still on its way wait for the same answer.
  let dataRequest = null;

  function fetchData() {
    if (!dataRequest) {
      dataRequest = (async () => {
        try {
          const headers = {};
          if (tg && tg.initData) headers['Authorization'] = 'tma ' + tg.initData;
          const res = await timedFetch('/api/questions?lang=' + lang, { cache: 'no-cache', headers });
          if (!res.ok) throw await httpError(res, '/api/questions');
          const json = await res.json();
          DATA = json.themes;
          setAccess(json.access || { paid: true });
          return null;
        } catch (e) {
          DATA = null;
          return e;
        } finally {
          dataRequest = null;
        }
      })();
    }
    return dataRequest;
  }

  // The preload at launch is quiet: it used to put the full-screen loader
  // over the home screen on every launch, for content the home screen does
  // not show (audit D-16). Whoever actually waits for the content - a tap
  // on «Играть» - gets the loader and, if it fails, the reason.
  async function loadData(quiet) {
    if (!quiet) $('loader').classList.add('show');
    try {
      const error = await fetchData();
      if (error && !quiet) toast(error.status ? statusMessage(error) : T().loadError);
    } finally {
      if (!quiet) $('loader').classList.remove('show');
    }
  }

  function deckSize(src, type) {
    const total = src[type + '_total'];
    return total != null ? total : (src[type] || []).length;
  }

  function themeCounts(themeKey) {
    const th = DATA[themeKey];
    if (!th) return 0;
    let n = 0;
    if (th.levels) Object.values(th.levels).forEach(l => n += deckSize(l, 'questions') + deckSize(l, 'tasks'));
    else n = deckSize(th, 'questions') + deckSize(th, 'tasks');
    return n;
  }

  /* ---------------- themes screen ---------------- */
  function renderThemes() {
    const box = $('themeList');
    box.innerHTML = '';
    THEME_ORDER.forEach(key => {
      if (!DATA || !DATA[key]) return;
      const meta = T().themes[key];
      const btn = document.createElement('button');
      btn.className = 'theme-card ' + meta.grad;
      btn.innerHTML =
        '<span class="t-name">' + meta.name + '</span>' +
        '<span class="t-desc">' + meta.desc + '</span>' +
        '<span class="t-emoji">' + meta.emoji + '</span>' +
        '<span class="t-count">' + themeCounts(key) + '</span>';
      btn.onclick = () => { haptic('light'); pickTheme(key); };
      box.appendChild(btn);
    });
  }

  // One overlay, three callers: the Sex deck, a spicy Library category and
  // «69 ступеней». The copy is swapped per caller so it always describes what
  // it is gating.
  const NSFW_TEXT = { deck: 'nsfwText', library: 'nsfwLibText', s69: 'nsfwS69Text' };
  function showNsfw(kind) {
    $('nsfwText').textContent = T()[NSFW_TEXT[kind] || 'nsfwText'];
    $('nsfw').classList.add('show');
  }

  // What happens after the answer, when the question was asked on the way
  // somewhere other than a deck or the Library: into «69 ступеней», or into
  // a partner's 18+ room by their link. «Назад» there goes home - nobody is
  // seated anywhere until the answer is yes.
  let NSFW_NEXT = null;          // {yes, no}
  function nsfwGate(kind, next) {
    if (store.get('nsfwOk', false)) { next(); return; }
    NSFW_NEXT = { yes: next, no: () => show('home') };
    showNsfw(kind);
  }

  function pickTheme(key) {
    S.theme = key;
    const th = DATA[key];
    if (th.nsfw && !store.get('nsfwOk', false)) {
      showNsfw('deck');
      return;
    }
    afterNsfw();
  }

  function afterNsfw() {
    const th = DATA[S.theme];
    if (th.levels) {
      renderLevels();
      show('levels');
    } else if (COOP.creating) {
      createCoopRoom(null);
    } else {
      S.level = null;
      S.type = th.questions ? 'questions' : 'tasks';
      enterDeck();
    }
  }

  $('nsfwYes').onclick = () => {
    store.set('nsfwOk', true);
    $('nsfw').classList.remove('show');
    haptic('ok');
    if (NSFW_NEXT) {
      const next = NSFW_NEXT.yes;
      NSFW_NEXT = null;
      next();
      return;
    }
    if (LIB_NSFW_PENDING) {
      const pending = LIB_NSFW_PENDING;
      LIB_NSFW_PENDING = null;
      openLibModule(pending.module, pending.category);
      return;
    }
    afterNsfw();
  };
  $('nsfwNo').onclick = () => {
    LIB_NSFW_PENDING = null;
    $('nsfw').classList.remove('show');
    if (NSFW_NEXT) {
      const back = NSFW_NEXT.no;
      NSFW_NEXT = null;
      back();
    }
  };

  /* ---------------- levels screen ---------------- */
  function renderLevels() {
    const meta = T().themes[S.theme];
    $('levelsTitle').textContent = meta.emoji + ' ' + meta.name;
    const box = $('levelList');
    box.innerHTML = '';
    Object.keys(DATA[S.theme].levels).sort().forEach(lv => {
      const src = DATA[S.theme].levels[lv];
      const count = deckSize(src, 'questions');
      const freeN = (src.questions || []).length;
      const countLabel = (!ACCESS.paid && freeN < count)
        ? fmt(T().freeCount, { free: freeN, total: count })
        : count;
      const btn = document.createElement('button');
      btn.className = 'level-card';
      btn.innerHTML =
        '<span class="level-num">' + lv + '</span>' +
        '<span class="level-info"><b>' + T().level + ' ' + lv + '</b>' +
        '<span>' + (T().levelDesc[lv] || '') + ' · ' + countLabel + '</span></span>';
      btn.onclick = () => {
        haptic('light');
        if (COOP.creating) { createCoopRoom(lv); return; }
        S.level = lv;
        enterDeck();
      };
      box.appendChild(btn);
    });
  }

  /* ---------------- deck ---------------- */
  function deckItems() {
    const th = DATA[S.theme];
    const src = S.level ? th.levels[S.level] : th;
    return src[S.type] || [];
  }

  function deckKey() {
    return [lang, S.theme, S.level || 0, S.type].join('|');
  }

  function initOrder(forceReset) {
    const items = deckItems();
    const saved = store.get('deck.' + deckKey(), null);
    // A saved order no longer than the deck and naming only its cards is
    // resumed. A shorter one was saved on the free preview: after a payment
    // it grows to the whole deck rather than starting over at card 1.
    const valid = saved && Array.isArray(saved.order) && saved.order.length > 0 &&
      saved.order.length <= items.length &&
      saved.order.every(i => Number.isInteger(i) && i >= 0 && i < items.length);
    if (!forceReset && valid) {
      S.order = saved.order.slice(); S.shuffled = !!saved.shuffled;
      S.idx = Math.min(saved.idx, S.order.length - 1);
      growOrder(items.length);
      if (S.idx > 0) toast(T().resumed);
    } else {
      S.order = items.map((_, i) => i);
      S.idx = 0; S.shuffled = false;
    }
  }

  function persistDeck() {
    store.set('deck.' + deckKey(), { order: S.order, idx: S.idx, shuffled: S.shuffled });
  }

  function enterDeck(forceReset) {
    deckGen++;                                   // a new deck owns the stage
    track('deck_open', S.theme + ':' + (S.level || '') + ':' + S.type);
    drag.onAdvance = null; drag.onBack = null;   // the Library's, if we came from it
    COOP.active = false;
    $('turnChip').style.display = 'none';
    $('btnShuffle').style.visibility = '';
    $('btnPrev').style.display = '';
    initOrder(forceReset);
    const meta = T().themes[S.theme];
    $('deckTitle').textContent = meta.emoji + ' ' + meta.name + (S.level ? ' · ' + T().level + ' ' + S.level : '');
    const th = DATA[S.theme];
    const hasBoth = !!(S.level ? (th.levels[S.level].questions && th.levels[S.level].tasks) : (th.questions && th.tasks));
    $('modeRow').style.display = hasBoth ? 'flex' : 'none';
    $('modeQ').classList.toggle('on', S.type === 'questions');
    $('modeT').classList.toggle('on', S.type === 'tasks');
    show('deck');
    renderStage(true);
  }

  function leaveDeck() {
    if (COOP.active) { leaveCoop(); return; }
    persistDeck();
    if (DATA[S.theme].levels) show('levels'); else show('themes');
  }

  $('modeQ').onclick = () => switchType('questions');
  $('modeT').onclick = () => switchType('tasks');
  function switchType(t) {
    if (S.type === t) return;
    persistDeck();
    S.type = t;
    haptic('light');
    enterDeck();
  }

  // One counter to a deck, and it says what it counts: «Карта 3 из 20»
  // on the card itself (audit D-30). There used to be a second, «3 / 20»
  // beside the bar, repeating the card's own number without saying of
  // what. The bar is a gauge, and reads the card's words to a screen
  // reader.
  function cardOf(number, total) { return fmt(T().cardOf, { n: number, total: total }); }
  function showProgress(track, cur, total) {
    const bar = $(track);
    bar.firstElementChild.style.width = (total ? (cur / total) * 100 : 0) + '%';
    bar.setAttribute('aria-valuenow', String(cur));
    bar.setAttribute('aria-valuemax', String(total));
    bar.setAttribute('aria-valuetext', cardOf(cur, total));
  }

  function updateProgress() {
    const total = S.order.length;
    showProgress('progressTrack', Math.min(S.idx + 1, total), total);
    $('btnPrev').disabled = S.idx <= 0;
  }

  function cardHTML(text, number, total) {
    const art = cardArt(S.theme, S.level, S.type);
    const style = art ? ' style="--art:url(' + art + ')"' : '';
    return (
      '<div class="flipper">' +
        '<div class="face front"' + style + '>' +
          '<div class="q-zone"><div class="q-text">' + escapeHTML(text) + '</div></div>' +
          '<div class="card-footer">' + escapeHTML(cardOf(number, total)) + '</div>' +
        '</div>' +
        '<div class="face back"></div>' +
      '</div>'
    );
  }

  function escapeHTML(s) {
    // Coerced first: an optional field the server left out reached this as
    // undefined, and `undefined.replace` blanked the whole screen behind a
    // toast about the connection. Everything escaped here is put on screen
    // (the few ids it escapes have no spaces), so it is also where the
    // server's text gets its no-break spaces (audit D-31).
    return bindShortWords(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  /* ---------------- long card text ---------------- */
  // A long question scrolls inside .q-zone; these mark which end is actually
  // cut so the CSS fades that end and only that end. Deliberately global
  // rather than wired into renderStage: the game deck, couple mode and
  // anything else built from cardHTML all get it without knowing about it.
  function markZoneEdges(z) {
    const slack = z.scrollHeight - z.clientHeight;
    // The flags go on the face, not on the zone: the fade is painted there
    // precisely so the scroller stays hit-testable. See the CSS note.
    const face = z.parentElement;
    if (!face) return;
    face.classList.toggle('cut-top', z.scrollTop > 1);
    face.classList.toggle('cut-bottom', slack > 1 && z.scrollTop < slack - 1);
  }
  // The flags follow the text's geometry, not only the events that used to
  // move it: a font that arrives after the scroll, or a stage that settles
  // later, re-flows the text with no scroll, mutation or resize to say so,
  // and the fade stayed where the text had been. The WebKit screen tour
  // caught one frame with the fade and one without. So each zone, and the
  // text in it, is watched for size; a card thrown away is let go.
  const zoneWatch = typeof ResizeObserver === 'function'
    ? new ResizeObserver(entries => {
        for (const e of entries) {
          const z = e.target.closest('.q-zone');
          if (z) markZoneEdges(z);
        }
      })
    : null;
  const watchedZones = new Set();
  function refreshZoneEdges() {
    document.querySelectorAll('.q-zone').forEach(z => {
      markZoneEdges(z);
      if (zoneWatch && !watchedZones.has(z)) {
        watchedZones.add(z);
        zoneWatch.observe(z);
        if (z.firstElementChild) zoneWatch.observe(z.firstElementChild);
      }
    });
    for (const z of watchedZones) {
      if (z.isConnected) continue;
      watchedZones.delete(z);
      zoneWatch.unobserve(z);
      if (z.firstElementChild) zoneWatch.unobserve(z.firstElementChild);
    }
  }
  // scroll doesn't bubble, so listen in the capture phase.
  document.addEventListener('scroll', e => {
    if (e.target instanceof Element && e.target.classList.contains('q-zone')) markZoneEdges(e.target);
  }, true);
  // New cards arrive as innerHTML; the swapped-in font and a rotation both
  // change how much of the question fits.
  new MutationObserver(refreshZoneEdges).observe(document.body, { childList: true, subtree: true });
  window.addEventListener('resize', refreshZoneEdges);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(refreshZoneEdges);

  /* ---------------- stage ---------------- */
  // A card arrives face down and turns over. Shared by every deck, because
  // an animation tuned in one place and not the other is how two decks stop
  // feeling like the same object.
  function flipUp(card) {
    const flipper = card.querySelector('.flipper');
    flipper.classList.add('faced');              // back side up
    requestAnimationFrame(() => setTimeout(() => {
      flipper.classList.remove('faced');         // flip to reveal
      haptic('light');
    }, 260));
  }

  // Lays out a deck's stage: the next card peeking from beneath, the one
  // before it hidden there until a drag back shows it, the current one on
  // top, swipe attached. `htmlAt(index, number, total)` is the only thing
  // that differs between the game deck and the Library's — everything about
  // how a card sits on the stage is here, once. Returns the top card, or
  // null when there is nothing to show.
  function buildStage(stage, htmlAt, count, idx, withFlip) {
    stage.innerHTML = '';
    stage.classList.remove('reveal-prev');
    if (!count) return null;

    // under-cards, peeking from beneath: the next in the deck, and the one
    // before it, which a swipe right goes back to
    [[idx + 1, 'next'], [idx - 1, 'prev']].forEach(([i, which]) => {
      if (i < 0 || i >= count) return;
      const under = document.createElement('div');
      under.className = 'card under ' + which;
      under.style.transform = 'translateY(14px) scale(.94)';
      under.style.opacity = '.7';
      under.innerHTML = htmlAt(i, i + 1, count);
      stage.appendChild(under);
    });

    // top card
    const top = document.createElement('div');
    top.className = 'card top';
    top.innerHTML = htmlAt(idx, idx + 1, count);
    stage.appendChild(top);

    if (withFlip) flipUp(top);
    attachSwipe(top);
    deckDirty = false;
    return top;
  }

  function renderStage(withFlip) {
    const items = deckItems();
    const top = buildStage($('stage'),
      (i, number, total) => cardHTML(items[S.order[i]], number, total),
      S.order.length, S.idx, withFlip);
    if (!top) return;
    updateProgress();
  }

  /* ---------------- swipe physics ---------------- */
  // Single global drag state: window listeners are registered once,
  // renderStage only points `drag.card` at the current top card.
  // onAdvance/onBack are how a non-game deck borrows the physics: set, they
  // replace flyOut's game transitions entirely. Null for the game and couple
  // mode, and cleared on the way into both.
  const drag = { card: null, x0: 0, y0: 0, dx: 0, dy: 0, active: false, axis: null,
                 onAdvance: null, onBack: null };

  // Which ways the deck on screen can go. A deck that installed its own
  // callbacks (the Library) is asked about its own position — S.idx is the
  // game's, and would let a swipe off either end of the Library fly the card
  // away to nothing: there is no finishDeck() on that side to put something
  // back on the stage. A room only goes forward: the server turns its cards.
  function canGoOn() { return drag.onAdvance ? LS.idx < LS.items.length - 1 : true; }
  function canGoBack() { return drag.onAdvance ? LS.idx > 0 : (!COOP.active && S.idx > 0); }

  function attachSwipe(card) {
    drag.card = card;
    card.addEventListener('touchstart', dragStart, { passive: true });
    card.addEventListener('touchmove', dragMove, { passive: true });
    card.addEventListener('touchend', dragEnd);
    card.addEventListener('mousedown', dragStart);
  }

  function dragStart(e) {
    if (deckDirty || !drag.card) return;
    // The turn gate is couple mode's, not the swipe engine's: a Library deck
    // borrowing the physics is never turn-based. On the partner's turn the
    // gesture is still followed - scrolling the card's text is reading, and
    // reading is allowed - but a sideways one does not move the card: it is
    // refused where it happens (`refuseTurn`).
    drag.refused = !drag.onAdvance && COOP.active && (!C.st || !C.st.your_turn);
    drag.active = true;
    const p = e.touches ? e.touches[0] : e;
    drag.x0 = p.clientX; drag.y0 = p.clientY; drag.dx = 0; drag.dy = 0;
    drag.axis = null;               // undecided until the gesture commits
    drag.card.style.transition = 'none';
  }
  function dragMove(e) {
    if (!drag.active || !drag.card) return;
    const p = e.touches ? e.touches[0] : e;
    drag.dx = p.clientX - drag.x0; drag.dy = p.clientY - drag.y0;

    // Decide once, at 8px of travel, whether this gesture belongs to the
    // card or to the text scrolling inside it. Without this, reading a long
    // question by scrolling drags the card halfway off the stage.
    if (!drag.axis) {
      if (Math.abs(drag.dx) < 8 && Math.abs(drag.dy) < 8) return;
      drag.axis = Math.abs(drag.dx) > Math.abs(drag.dy) ? 'x' : 'y';
    }
    if (drag.axis === 'y') return;
    // The partner's turn: a sideways drag does not move the card.
    if (drag.refused) return;

    // Beneath the card lies the one this swipe would bring: the card before
    // it while the drag goes right and there is one to go back to.
    const stage = drag.card.parentElement;
    if (stage) stage.classList.toggle('reveal-prev', drag.dx > 0 && canGoBack());
    drag.card.style.transform =
      'translate(' + drag.dx + 'px,' + (drag.dy * .35) + 'px) rotate(' + (drag.dx * .055) + 'deg)';
  }
  function dragEnd() {
    if (!drag.active || !drag.card) return;
    // A vertical gesture was the text scrolling, not a swipe: leave the card
    // where it is and do not step the deck.
    if (drag.axis === 'y') { drag.active = false; drag.axis = null; return; }
    drag.active = false;
    if (drag.refused) {
      if (drag.axis === 'x' && Math.abs(drag.dx) > 30) refuseTurn();
      drag.dx = 0; drag.dy = 0; drag.axis = null; drag.refused = false;
      return;
    }
    // Left is «дальше» and right is back, as in every gallery a thumb
    // already knows. Right used to be next and left back, so a left swipe
    // meant for the next card showed the last one again (audit D-40); then
    // both ways went on, and nothing but the ↩ button went back. The card
    // leaves the way it was thrown.
    if (drag.dx < -84 && canGoOn()) {
      flyOut(drag.card, -1);
    } else if (drag.dx > 84 && canGoBack()) {
      flyOut(drag.card, 1);
    } else {
      if (drag.card.parentElement) drag.card.parentElement.classList.remove('reveal-prev');
      drag.card.style.transition = 'transform .3s cubic-bezier(.2,.9,.3,1.2)';
      drag.card.style.transform = '';
    }
    drag.dx = 0; drag.dy = 0; drag.axis = null;
  }
  window.addEventListener('mousemove', dragMove);
  window.addEventListener('mouseup', dragEnd);

  // Sends the top card off the stage the way it was thrown and steps the
  // deck that way: thrown left (dir -1) on to the next card, thrown right
  // (dir 1) back to the one before, which a drag right has already laid
  // beneath it. The ↩ button goes back without a flight (btnPrev, libPrev).
  function flyOut(card, dir) {
    if (deckDirty) return;
    deckDirty = true;
    haptic('medium');
    // Who owns this flight is decided now, not in 300ms. The card stays in
    // the air long enough for the user to tap back out of the deck, and
    // everything below used to be read after that: paging the Library and
    // leaving immediately stepped the *game's* saved position, and could put
    // the game's "done" overlay up over the Library.
    const back = dir > 0;
    const onStep = back ? drag.onBack : drag.onAdvance;
    const wasCoop = COOP.active;
    const screen = document.querySelector('.screen.active');
    const gen = deckGen;
    card.style.transition = 'transform .38s cubic-bezier(.5,.05,.9,.4), opacity .38s';
    card.style.transform = 'translate(' + (dir * (window.innerWidth * 1.1)) + 'px,' + (-40 + Math.random() * 120) + 'px) rotate(' + dir * 24 + 'deg)';
    card.style.opacity = '0';
    setTimeout(() => {
      // A different deck took the stage while this card was in the air. It
      // has its own position and has already cleared deckDirty for its own
      // card, so touch nothing at all — not even the guard.
      if (gen !== deckGen) return;
      // Left the deck mid-flight: nobody is looking at that stage any more,
      // and stepping a deck now would step whichever one they left for.
      if (!screen || !screen.classList.contains('active')) { deckDirty = false; return; }
      // A deck that installed its own transitions (the Library) takes it from
      // here. deckDirty is cleared by buildStage, which this branch never
      // reaches — leave it set and the second swipe is swallowed.
      if (onStep) {
        deckDirty = false;
        onStep();
        return;
      }
      if (wasCoop) {
        coopAdvanceAfterFly();  // couple mode is always forward (canGoBack), server-driven
        return;
      }
      if (back) {
        S.idx = Math.max(0, S.idx - 1);
        persistDeck();
        renderStage(true);
      } else if (S.idx + 1 >= S.order.length) {
        finishDeck();
      } else {
        S.idx += 1;
        persistDeck();
        renderStage(true);
      }
    }, 300);
  }

  $('btnNext').onclick = () => {
    if (COOP.active && (!C.st || !C.st.your_turn)) { refuseTurn(); return; }
    const top = document.querySelector('#stage .card.top');
    if (top) flyOut(top, -1);
  };
  $('btnPrev').onclick = () => {
    if (S.idx <= 0 || deckDirty) return;
    S.idx -= 1;
    persistDeck();
    haptic('light');
    renderStage(true);
  };
  $('btnShuffle').onclick = () => {
    if (deckDirty) return;
    haptic('medium');
    if (!S.shuffled) {
      // Fisher–Yates over the remaining cards, keep the current one on top
      const rest = S.order.slice(S.idx);
      for (let i = rest.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [rest[i], rest[j]] = [rest[j], rest[i]];
      }
      S.order = S.order.slice(0, S.idx).concat(rest);
      S.shuffled = true;
      toast('🔀 ' + T().shuffled);
    } else {
      const cur = S.order[S.idx];
      S.order = deckItems().map((_, i) => i);
      S.idx = S.order.indexOf(cur);
      S.shuffled = false;
      toast(T().ordered);
    }
    persistDeck();
    renderStage(false);
  };
  $('deckBack').onclick = leaveDeck;

  /* ---------------- finish ---------------- */
  function deckTotalFull() {
    const th = DATA[S.theme];
    const src = S.level ? th.levels[S.level] : th;
    return deckSize(src, S.type);
  }

  function finishDeck() {
    haptic('ok');
    S.idx = S.order.length - 1;
    persistDeck();
    const freeN = S.order.length;
    const full = deckTotalFull();
    if (!ACCESS.paid && full > freeN) {
      // Rebuild the stage before showing the paywall: the last free card
      // has already flown off, and returning without a render left an
      // empty stage with deckDirty stuck on — closing the paywall landed
      // on a frozen deck where nothing responded until the user left the
      // screen. Now the last free card comes back and stays swipeable.
      renderStage(false);
      showPaywall('deck', { free: freeN, total: full });
      return;
    }
    document.querySelector('#done p').textContent = T().doneText;
    $('done').classList.add('show');
    confetti();
  }
  const REDUCED_MOTION = (() => {
    try { return window.matchMedia('(prefers-reduced-motion: reduce)').matches; }
    catch (e) { return false; }
  })();

  function confetti() {
    if (REDUCED_MOTION) return;
    const colors = ['#E86BB5', '#C4256E', '#8E7CF3', '#F98D68', '#FFD9EF'];
    for (let i = 0; i < 60; i++) {
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random() * 100 + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.animationDuration = (1.6 + Math.random() * 1.8) + 's';
      c.style.animationDelay = (Math.random() * .6) + 's';
      c.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
      document.getElementById('shell').appendChild(c);
      setTimeout(() => c.remove(), 4200);
    }
  }
  $('btnAgain').onclick = () => {
    $('done').classList.remove('show');
    if (COOP.active) { leaveCoop(); return; }
    enterDeck(true);
  };
  $('btnToThemes').onclick = () => {
    $('done').classList.remove('show');
    if (COOP.active) { leaveCoop(); return; }
    show('themes');
  };

  /* ---------------- coop (couple mode) ---------------- */
  const COOP = { creating: false, active: false };
  const C = { code: null, st: null, timer: null, invite: null };

  /* ---------------- invites ---------------- */
  // All three two-partner features send a link now. The server composes it
  // (it is the only side that knows whether this deployment has a Mini App
  // short name, and so which of the two link shapes works), and this file
  // only ever shows, shares and copies what it was handed.
  //
  // Nothing here falls back to showing the six-character code: there is no
  // longer a field anywhere to type one into, so a code on screen would be
  // an instruction that cannot be followed.
  function showInviteLink(el, url) {
    el.textContent = url || T().inviteNoLink;
  }

  // Counts for /stats (vechnost_bot/analytics.py): an event name and one
  // token from a closed list, never text. Fire and forget - a count must
  // never hold up or break what it counts - and only with signed initData:
  // the server keeps nothing for a request Telegram does not vouch for.
  function track(name, detail, source) {
    try {
      if (!tg || !tg.initData) return;
      fetch('/api/events', {
        method: 'POST', keepalive: true,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'tma ' + tg.initData },
        body: JSON.stringify({ name: name, detail: detail || null, source: source || null })
      }).catch(() => {});
    } catch (e) {}
  }

  // Who is holding the app (POST /api/me): made known to the server at boot,
  // so a partner who only ever opens invites still has a row - their pair
  // and their invitation are recorded on it - and told back whether the bot
  // may write to them.
  let ME = null;
  async function loadMe() {
    try {
      if (!tg || !tg.initData) return;
      const res = await fetch('/api/me', {
        method: 'POST', headers: { 'Authorization': 'tma ' + tg.initData }
      });
      if (res.ok) ME = await res.json();
    } catch (e) {}
  }

  // Permission to message, asked where it is worth something: on a game with
  // a partner, once a month at most, and never of someone the bot can
  // already write to (they started it, or allowed it before). Without it the
  // bot cannot tell an invite's sender that the partner came, nor either of
  // them that the test's result is ready.
  const WRITE_ASK_EVERY = 30 * 24 * 3600 * 1000;
  // Whether Telegram can be asked at all (Bot API 6.9), and whether it is
  // worth asking: not of someone the bot can already write to.
  function writeAccessMissing() {
    try {
      if (!tg || typeof tg.requestWriteAccess !== 'function') return false;
      if (tg.isVersionAtLeast && !tg.isVersionAtLeast('6.9')) return false;
      const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
      return !!user && !user.allows_write_to_pm && !(ME && ME.can_write);
    } catch (e) { return false; }
  }
  function canAskToWrite() {
    try {
      if (!writeAccessMissing()) return false;
      const last = store.get('writeAskedAt', 0);
      return !last || Date.now() - last > WRITE_ASK_EVERY;
    } catch (e) { return false; }
  }

  // A gift, from the home screen or the paywall. The certificate arrives as
  // a message from the bot, so someone it cannot write to is asked first,
  // whatever the monthly ask above decided: a gift paid for and never
  // delivered is the worst way this can go.
  let GIFT_FROM = null;
  function showGift(from) {
    if (!ACCESS.gift_url) return;
    GIFT_FROM = from;
    track('gift_view', from);
    const price = ACCESS.gift_price ? fmt(T().giftPrice, { price: ACCESS.gift_price }) : '';
    $('giftPrice').textContent = price;
    $('giftPrice').style.display = price ? '' : 'none';
    $('giftNote').style.display = writeAccessMissing() ? '' : 'none';
    $('giftSheet').classList.add('show');
  }
  $('giftClose').onclick = () => $('giftSheet').classList.remove('show');
  $('giftBuy').onclick = () => {
    const url = ACCESS.gift_url;
    if (!url) return;
    haptic('light');
    track('gift_click', GIFT_FROM);
    const go = () => { $('giftSheet').classList.remove('show'); openPayLink(url); };
    if (!writeAccessMissing()) { go(); return; }
    try {
      tg.requestWriteAccess(granted => {
        track('write_access', granted ? 'granted' : 'declined');
        if (granted) { if (ME) ME.can_write = true; go(); }
        else toast(T().giftWriteDeclined);
      });
    } catch (e) { go(); }
  };
  // Call it once the screen it belongs to is showing: `show()` closes every
  // overlay, and one closed that way would count as asked.
  function askToWrite() {
    if (!canAskToWrite()) return;
    store.set('writeAskedAt', Date.now());
    $('writeAsk').classList.add('show');
  }
  $('writeAskYes').onclick = () => {
    $('writeAsk').classList.remove('show');
    try {
      tg.requestWriteAccess(granted => {
        track('write_access', granted ? 'granted' : 'declined');
        if (granted) {
          if (ME) ME.can_write = true;
          toast(T().writeAskDone);
        }
      });
    } catch (e) {}
  };
  $('writeAskNo').onclick = () => {
    $('writeAsk').classList.remove('show');
    track('write_access', 'declined');
  };

  // Which of the three an invite link opens, from its payload.
  function inviteKind(url) {
    const m = /(?:startapp|start)=(duo|cmp|s69)_/.exec(url || '');
    return m ? m[1] : null;
  }

  function shareInvite(url, message) {
    if (!url) { toast(T().inviteNoLink); return; }
    haptic('light');
    track('invite_share', inviteKind(url));
    // url and text are separate parameters: Telegram renders the link as a
    // tappable preview and the sentence as the message around it. Passing
    // the whole sentence as `url`, which is what this used to do, sent the
    // partner a line of text with no link in it on some clients.
    const share = 'https://t.me/share/url?url=' + encodeURIComponent(url) +
                  '&text=' + encodeURIComponent(message);
    try {
      if (tg) tg.openTelegramLink(share); else window.open(share, '_blank');
    } catch (e) { toast(T().shareError); }
  }

  function copyInvite(url) {
    if (!url) { toast(T().inviteNoLink); return; }
    haptic('light');
    track('invite_share', inviteKind(url));
    if (!navigator.clipboard) { toast(T().shareError); return; }
    // The promise is the answer: a WebView refuses the clipboard when the
    // document is not focused, and «Ссылка скопирована» used to show
    // before the refusal came back.
    navigator.clipboard.writeText(url).then(
      () => toast(T().inviteCopied),
      () => toast(T().shareError)
    );
  }

  let guestId = store.get('guestId', null);
  if (!guestId) {
    guestId = Math.random().toString(36).slice(2, 12);
    store.set('guestId', guestId);
  }

  function coopHeaders(json) {
    const h = { 'X-Guest-Id': guestId };
    if (tg && tg.initData) h['Authorization'] = 'tma ' + tg.initData;
    if (json) h['Content-Type'] = 'application/json';
    return h;
  }

  async function coopFetch(path, opts) {
    opts = opts || {};
    const res = await timedFetch(path + (path.includes('?') ? '&' : '?') + 'lang=' + lang, {
      method: opts.method || 'GET',
      headers: coopHeaders(!!opts.json),
      body: opts.json ? JSON.stringify(opts.json) : undefined
    });
    if (!res.ok) throw await httpError(res, path);
    return res.json();
  }

  function coopError(e) {
    if (e.status === 409) toast(T().coopFull);
    else if (e.status === 404 || e.status === 410) toast(T().coopGone);
    else toast(statusMessage(e));
  }

  function stopCoopPoll() { stopPoll(C); }

  function startCoopPoll(onState) {
    startPoll(
      C, 2500,
      () => (C.code ? coopFetch('/api/rooms/' + C.code) : null),
      onState,
      () => { toast(T().coopGone); leaveCoop(); }
    );
  }

  async function createCoopRoom(level) {
    COOP.creating = false;
    $('loader').classList.add('show');
    try {
      const st = await coopFetch('/api/rooms', {
        method: 'POST',
        json: { theme: S.theme, level: level, type: 'questions' }
      });
      C.code = st.code; C.st = st; C.invite = st.invite_url || null;
      showInviteLink($('inviteCode'), C.invite);
      $('inviteWaiting').textContent = T().inviteWaiting;
      show('invite');
      askToWrite();
      startCoopPoll(st2 => {
        C.st = st2;
        if (st2.started) {
          stopCoopPoll();
          haptic('ok');
          toast(fmt(T().partnerJoined, { name: st2.players.guest || '' }));
          enterCoopDeck();
        }
      });
    } catch (e) {
      coopError(e);
    } finally {
      $('loader').classList.remove('show');
    }
  }

  // Called by an invite link, never by a typed code: there is no code field
  // any more. Kept as its own function because boot() reaches for it too.
  async function joinCoopRoom(code) {
    if (!code) return;
    haptic('light');
    $('loader').classList.add('show');
    try {
      // `nsfw=1` once the 18+ question has been answered: an 18+ room keeps
      // its seat empty until then (403), so a partner who says no is never
      // seated, and the creator never plays on alone.
      const adult = store.get('nsfwOk', false) ? '?nsfw=1' : '';
      const st = await coopFetch('/api/rooms/' + code + '/join' + adult, { method: 'POST' });
      C.code = st.code; C.st = st;
      enterCoopDeck();
      askToWrite();
    } catch (e) {
      if (e.status === 403 && !store.get('nsfwOk', false)) {
        nsfwGate('deck', () => joinCoopRoom(code));
        return;
      }
      coopError(e);
    } finally {
      $('loader').classList.remove('show');
    }
  }

  function coopThemeMeta() {
    return T().themes[C.st.theme] || { name: C.st.theme, emoji: '👥' };
  }

  function enterCoopDeck() {
    deckGen++;                                   // a new deck owns the stage
    drag.onAdvance = null; drag.onBack = null;   // the Library's, if we came from it
    COOP.active = true;
    // cardHTML picks the printed face from all three of these, and the room
    // is the only thing that knows which deck the pair is actually playing.
    // Copying only the theme left level and type at whatever a previous solo
    // deck happened to set, so the pair got the wrong card.
    S.theme = C.st.theme;
    S.level = C.st.level || null;
    S.type = C.st.type;
    const meta = coopThemeMeta();
    $('deckTitle').textContent = '👥 ' + meta.name + (C.st.level ? ' · ' + T().level + ' ' + C.st.level : '');
    $('modeRow').style.display = 'none';
    // Hidden, but holding its place: the title stays centred between it
    // and the (Telegram-hidden) back button.
    $('btnShuffle').style.visibility = 'hidden';
    $('btnPrev').style.display = 'none';
    show('deck');
    renderCoopStage(true);
    startCoopPoll(onCoopState);
  }

  function onCoopState(st) {
    if (!COOP.active || !st || st.code !== C.code) return;
    const prevIdx = C.st ? C.st.idx : -1;
    const wasFinished = C.st ? C.st.finished : false;
    // A poll that left before our own /advance and lands after it
    // carries the deck as it was. Never step backwards: the fresh card
    // used to fly away to show the old one, then fly again a tick later.
    if (C.st && !st.finished && st.idx < prevIdx) return;
    C.st = st;
    if (st.finished && !wasFinished) { coopFinish(); return; }
    if (wasFinished && !st.finished) {
      // A payment - either partner's - dealt the rest of the deck in.
      if (PAYWALL_CTX === 'room') closePaywall();
      haptic('ok');
      toast(T().roomOpened);
    }
    if (st.idx !== prevIdx) {
      coopFlyTop(() => renderCoopStage(true));
    } else {
      updateCoopHud();
    }
  }

  function coopFlyTop(cb) {
    const top = document.querySelector('#stage .card.top');
    if (!top) { cb(); return; }
    top.style.transition = 'transform .38s cubic-bezier(.5,.05,.9,.4), opacity .38s';
    top.style.transform = 'translate(' + window.innerWidth * 1.1 + 'px,-30px) rotate(20deg)';
    top.style.opacity = '0';
    setTimeout(cb, 300);
  }

  async function coopAdvanceAfterFly() {
    try {
      const st = await coopFetch('/api/rooms/' + C.code + '/advance', { method: 'POST' });
      C.st = st;
      haptic('medium');
      if (st.finished) { coopFinish(); return; }
      renderCoopStage(true);
    } catch (e) {
      // Turn was probably taken by a race; resync.
      try { C.st = await coopFetch('/api/rooms/' + C.code); } catch (e2) {}
      renderCoopStage(false);
      if (e.status === 403) toast(T().notYourTurn);
      else coopError(e);
    }
  }

  // Not your turn: the card shakes where the eye already is, and the chip
  // that names whose turn it is flashes. The toast this replaced came after
  // the fact, in a corner, and said less than the chip already did.
  function refuseTurn() {
    haptic('light');
    const top = document.querySelector('#stage .card.top');
    const chip = $('turnChipText');
    [[top, 'wobble'], [chip, 'pulse']].forEach(([el, cls]) => {
      if (!el) return;
      el.classList.remove(cls);
      void el.offsetWidth;          // restart the animation on a second tap
      el.classList.add(cls);
      // The class means "flashing now", so it goes when the flash is over.
      el.addEventListener('animationend', () => el.classList.remove(cls), { once: true });
    });
  }

  function updateCoopHud() {
    if (!C.st) return;
    showProgress('progressTrack', C.st.idx + 1, C.st.total || 1);
    const chip = $('turnChipText');
    $('turnChip').style.display = 'flex';
    const yours = !!(C.st.started && C.st.your_turn);
    chip.classList.toggle('waiting', !C.st.started);
    if (!C.st.started) chip.textContent = T().inviteWaiting;
    else if (yours) chip.textContent = T().yourTurn;
    else chip.textContent = fmt(T().partnerTurn, { name: C.st.turn_name || '…' });
    // Toggled, never assigned: the room is polled every 2.5 s, and writing
    // className cut a refusal's `pulse` (refuseTurn) off mid-flash.
    chip.classList.toggle('turn-you', yours);
    $('btnNext').setAttribute('aria-disabled', String(!(C.st.started && C.st.your_turn)));
  }

  // Not buildStage: couple mode has no under-card to draw. The room sends one
  // card at a time and the next one does not exist client-side until the
  // server says whose turn it is. It shares the flip, which is the part worth
  // keeping in step.
  function renderCoopStage(withFlip) {
    const stage = $('stage');
    stage.innerHTML = '';
    if (!C.st || !C.st.total) return;
    const top = document.createElement('div');
    top.className = 'card top';
    top.innerHTML = cardHTML(C.st.card_text, C.st.idx + 1, C.st.total);
    stage.appendChild(top);
    if (withFlip) flipUp(top);
    attachSwipe(top);
    updateCoopHud();
    deckDirty = false;
  }

  function coopFinish() {
    if (C.st && C.st.trimmed) {
      // The end of the free cards, not of the deck. The poll keeps going:
      // whichever partner pays, the next poll deals the rest in for both,
      // and the pair carries on from the next card.
      haptic('light');
      showPaywall('room', { free: C.st.total, total: C.st.full_total });
      return;
    }
    stopCoopPoll();
    haptic('ok');
    document.querySelector('#done p').textContent = T().coopDoneText;
    $('done').classList.add('show');
    confetti();
  }

  function leaveCoop() {
    stopCoopPoll();
    COOP.active = false;
    COOP.creating = false;
    C.code = null; C.st = null;
    $('turnChip').style.display = 'none';
    $('btnNext').removeAttribute('aria-disabled');
    $('btnShuffle').style.visibility = '';
    $('btnPrev').style.display = '';
    show('home');
  }

  $('btnCoop').onclick = () => { haptic('light'); show('coop'); };
  $('coopBack').onclick = () => show('home');
  $('btnCoopCreate').onclick = async () => {
    haptic('light');
    if (!DATA) await loadData();
    if (!DATA) return;
    COOP.creating = true;
    renderThemes();
    show('themes');
  };
  $('inviteBack').onclick = () => { stopCoopPoll(); C.code = null; C.st = null; show('coop'); };
  $('btnInviteShare').onclick = () => shareInvite(C.invite, T().coopInviteMsg);
  $('btnInviteCopy').onclick = () => copyInvite(C.invite);

  /* ---------------- library ---------------- */
  let LIB_NSFW_PENDING = null;   // {module, category} to open after the 18+ overlay
  let LIB_OPEN = null;           // {module, category} on screen, to reopen after a payment

  // After a payment the module on screen is asked for again: the server
  // sends the whole of it now.
  function reopenLibModule() {
    const onScreen = ['libraryDetail', 'libDeck', 'guide'].some(id => $(id).classList.contains('active'));
    if (LIB_OPEN && onScreen) openLibModule(LIB_OPEN.module, LIB_OPEN.category);
  }
  // Where a module's back button goes. The modules are listed on the home
  // screen now, but the Library screen still exists and is still where the
  // daily push's deep link (?screen=library) lands, so a module can be
  // reached from either and has to return to the one it came from.
  let LIB_BACK_TO = 'home';

  // The 18+ flag is device-scoped and shared with the Sex deck, so it is only
  // ever sent — and only ever asked for — when the user reaches for something
  // explicit. Everything else in a module stays open without it.
  const libNsfwParam = () => store.get('nsfwOk', false) ? '&nsfw=1' : '';

  async function libFetch(path) {
    const headers = {};
    if (tg && tg.initData) headers['Authorization'] = 'tma ' + tg.initData;
    const res = await timedFetch(path, { cache: 'no-cache', headers });
    if (!res.ok) throw await httpError(res, path);
    return res.json();
  }

  // Which modules stand on the home screen in their own right. Everything
  // else lives one tap deeper, behind «Практики»: five titles of prose on
  // the first screen drowned out the four things a couple open the app to
  // do. The masterclass is here because it is a course to work through,
  // not a list to browse.
  const HOME_MODULES = ['nude_guide'];

  // The home screen's own copy of the module list, and the door to the rest
  // of them. The Practices screen is the Library screen renamed: a module's
  // back button still has to return to whichever of the two it came from,
  // which is what LIB_BACK_TO records.
  async function renderHomeModules() {
    const box = $('homeModules');
    if (!box) return;
    const practices = () =>
      `<button class="btn btn-second home-mod" id="btnPractices">${escapeHTML(T().practicesBtn)}</button>`;
    const wire = () => {
      const open = $('btnPractices');
      if (open) open.onclick = () => { haptic('light'); openLibrary(); };
      box.querySelectorAll('[data-module]').forEach(btn => {
        btn.onclick = () => { haptic('light'); LIB_BACK_TO = 'home'; openLibModule(btn.dataset.module); };
      });
    };
    try {
      const data = await libFetch('/api/library?lang=' + lang + libNsfwParam());
      const featured = data.modules.filter(m => HOME_MODULES.indexOf(m.id) !== -1);
      // The module's own emoji, the one «Практики» already shows it under.
      // Every other button on this screen carries one, so the masterclass
      // was the single unmarked row in the column.
      box.innerHTML = featured.map(m => `
        <button class="btn btn-second home-mod" data-module="${m.id}">
          ${escapeHTML(m.emoji)} ${escapeHTML(m.title)}${m.locked ? ' 🔒' : ''}
        </button>`).join('') + practices();
      wire();
    } catch (e) {
      // The rest of the home screen still works, and «Практики» opens a
      // screen that fetches for itself — so the door stays even when this
      // call failed. A missing row is not worth a toast on the first screen
      // a user ever sees.
      box.innerHTML = practices();
      wire();
    } finally {
      box.removeAttribute('aria-busy');
    }
  }

  // «Практики»: everything the home screen does not carry itself. Still the
  // #library screen, and still where the older daily pushes' ?screen=library
  // deep link lands.
  async function openLibrary() {
    show('library');
    const box = $('libraryList');
    // Rows the size of the modules until the modules come (audit D-38),
    // rather than the full-screen loader over an empty screen. A return
    // keeps the rows it has and swaps in the fresh ones when they arrive.
    if (!box.querySelector('[data-module]')) {
      box.innerHTML = '<div class="theme-card lib-mod skeleton" aria-hidden="true"></div>'.repeat(5);
    }
    box.setAttribute('aria-busy', 'true');
    try {
      const data = await libFetch('/api/library?lang=' + lang + libNsfwParam());
      data.modules = data.modules.filter(m => HOME_MODULES.indexOf(m.id) === -1);
      box.innerHTML = data.modules.map(m => `
        <button class="theme-card lib-mod" data-module="${m.id}">
          <span class="t-emoji">${m.emoji}</span>
          <span class="t-name">${escapeHTML(m.title)}</span>
          <span class="t-desc">${m.count}${m.locked ? ' · 🔒' : ''}</span>
        </button>`).join('');
      box.querySelectorAll('[data-module]').forEach(btn => {
        btn.onclick = () => { LIB_BACK_TO = 'library'; openLibModule(btn.dataset.module); };
      });
    } catch (e) {
      box.querySelectorAll('.skeleton').forEach(row => row.remove());
      toast(e.status ? statusMessage(e) : T().libLoadError);
    } finally {
      box.removeAttribute('aria-busy');
    }
  }

  async function openLibModule(id, openCategory) {
    LIB_OPEN = { module: id, category: openCategory || null };
    if (!openCategory) track('lib_open', id);
    $('loader').classList.add('show');
    try {
      const data = await libFetch(`/api/library/${id}?lang=${lang}${libNsfwParam()}`);
      const title = data.emoji + ' ' + data.title;

      // A guide is a document: it opens on its own screen and is read, not
      // swiped. Step by step, drawing beside the words, tips underneath.
      if (data.type === 'guide') { openGuide(data, title, id); return; }

      // A daily or practice module is one deck and nothing else — no category
      // screen to stop at on the way in, or back out to.
      const items = libItems(data);
      if (items) { libDeckOpen(items, title, openLibrary); return; }

      // Nor is a `list` module that only has one category: the screen below
      // would be a single button between the module and its deck. Open the
      // deck, and hand it a `back` that skips the screen nobody saw. Guarded
      // on nsfw_withheld, because a withheld category is a second row — the
      // choice is real again, and the user needs the screen to reach it.
      const cats = data.categories || [];
      if (cats.length === 1 && !(data.nsfw_withheld || []).length) {
        openLibCategory(data, id, cats[0].id, openLibrary);
        return;
      }

      $('libDetailTitle').textContent = title;
      $('libDetailBody').innerHTML = renderLibCategories(data);
      const buy = $('libBuy');
      if (buy) buy.onclick = () => { haptic('light'); showPaywall('library'); };
      $('libDetailBody').querySelectorAll('[data-cat]').forEach(row => {
        row.onclick = () => { haptic('light'); openLibCategory(data, id, row.dataset.cat); };
      });
      $('libDetailBody').querySelectorAll('[data-nsfw-cat]').forEach(row => {
        row.onclick = () => {
          haptic('light');
          LIB_NSFW_PENDING = { module: id, category: row.dataset.nsfwCat };
          showNsfw('library');
        };
      });
      show('libraryDetail');
      // The 18+ path lands back here naming the category it was refused. The
      // server is sending it now, so open it rather than making the user find
      // it again. The category screen stays underneath as the way back.
      if (openCategory) openLibCategory(data, id, openCategory);
    } catch (e) {
      toast(e.status ? statusMessage(e) : T().libLoadError);
    } finally {
      $('loader').classList.remove('show');
    }
  }

  // The category screen of a `list` module: a button per category into its
  // deck, the 18+ ones by title only, and the purchase prompt if the server
  // truncated what it sent.
  function renderLibCategories(data) {
    const visible = data.categories.map(c => `
      <button class="lib-cat lib-cat-open" data-cat="${escapeHTML(c.id)}">
        ${escapeHTML(c.title)} · ${c.items.length}${c.items.length < c.total ? '/' + c.total : ''}
      </button>`).join('');
    // Categories the server withheld for want of an 18+ confirmation: shown by
    // title only, and tapping one raises the overlay.
    const withheld = (data.nsfw_withheld || []).map(c => `
      <button class="lib-cat lib-cat-nsfw" data-nsfw-cat="${escapeHTML(c.id)}">
        🔞 ${escapeHTML(c.title)} · ${c.total}
      </button>`).join('');
    return visible + withheld + libLockedFooter(data);
  }

  // `back` overrides where the deck's back arrow goes. The single-category
  // fast path passes openLibrary, because returning to openLibModule would
  // re-run the fast path and trap the user in the deck.
  function openLibCategory(data, id, catId, back) {
    LIB_OPEN = { module: id, category: catId };
    const cat = (data.categories || []).find(c => c.id === catId);
    if (!cat || !cat.items.length) return;
    const items = cat.items.map((t, i) => ({
      text: escapeHTML(t), footer: cardOf(i + 1, cat.items.length)
    }));
    const lock = libLockCard(cat.items.length, cat.total);
    if (lock) items.push(lock);
    // Back goes to the category screen, never to this same category — passing
    // catId here would re-open the deck the user just left.
    libDeckOpen(items, cat.title, back || (() => openLibModule(id)));
  }

  function libLockedFooter(data) {
    if (!data.locked) return '';
    const note = fmt(T().libFreeNote, { free: data.free_count, total: data.total });
    // Same rule as showPaywall: no payment link, no button that does nothing.
    if (!ACCESS.payment_url) return `<div class="lib-locked"><p>${note}</p></div>`;
    const price = ACCESS.price ? ' – ' + ACCESS.price : '';
    return `<div class="lib-locked">
      <p>${note}</p>
      <button class="btn btn-play" id="libBuy">${T().libLocked}${price}</button>
    </div>`;
  }

  /* ---------------- library deck ---------------- */
  // The Library reuses the game's swipe physics but keeps its own state: the
  // two decks are never on screen at once, and sharing S would mean a Library
  // card could resume into the middle of a game deck.
  const LS = { items: [], idx: 0, count: 0, back: null };

  // `item.text` is HTML: the builders below escape the content once and then
  // add their own markup, so escaping again here would print the tags. Every
  // string that reaches `text` must have gone through escapeHTML already.
  function libCardHTML(item, number, total) {
    return (
      '<div class="flipper">' +
        '<div class="face front" style="--art:url(' + LIBRARY_ART + ')">' +
          '<div class="q-zone"><div class="q-text">' + item.text + '</div></div>' +
          '<div class="card-footer">' + escapeHTML(item.footer || cardOf(number, total)) + '</div>' +
        '</div>' +
        '<div class="face back"></div>' +
      '</div>'
    );
  }

  // The card text for each module type. Everything is escaped here, once.
  // A `list` module returns null: it goes through its categories first.
  function libItems(data) {
    if (data.type === 'daily') {
      return [{ text: escapeHTML(data.question),
                footer: fmt(T().libDayOf, { day: data.day }) }];
    }
    if (data.type === 'practice') {
      const items = data.items.map((p, i) => ({
        text: '<b>' + escapeHTML(p.title) + '</b><br><br>' +
              '<span class="q-sub"><b>' + escapeHTML(T().libWhy) + ':</b> ' + escapeHTML(p.why) + '</span><br>' +
              '<span class="q-sub"><b>' + escapeHTML(T().libResult) + ':</b> ' + escapeHTML(p.result) + '</span>',
        footer: cardOf(i + 1, data.items.length)
      }));
      const lock = libLockCard(data.items.length, data.total);
      if (lock) items.push(lock);
      return items;
    }
    return null;
  }

  // The last card of a deck the server truncated. A locked `list` module also
  // says so on its category screen, but a practice module has no category
  // screen — and either way the end of the deck is where the truncation is
  // felt, so that is where the prompt belongs.
  function libLockCard(shown, total) {
    if (!(shown < total)) return null;
    const note = escapeHTML(fmt(T().libFreeNote, { free: shown, total: total }));
    // Same rule as showPaywall: no payment link, no button that does nothing.
    const cta = ACCESS.payment_url
      ? '<button class="btn btn-play q-lock">' +
        escapeHTML(T().libLocked + (ACCESS.price ? ' – ' + ACCESS.price : '')) + '</button>'
      : '';
    // A dash, not a position: this card is not the deck's Nth item, and
    // repeating the last content card's number reads as a rendering fault.
    return { text: '<b>🔒</b><br><br>' + note + cta, footer: '–', lock: true };
  }

  function renderLibStage(withFlip) {
    const top = buildStage($('libStage'),
      (i, number, total) => libCardHTML(LS.items[i], number, total),
      LS.items.length, LS.idx, withFlip);
    if (!top) return;
    // Only the top card's button: the under card carries a copy of the same
    // markup, and .card.under is pointer-events:none so it cannot be tapped.
    top.querySelectorAll('.q-lock').forEach(b => {
      b.onclick = () => { haptic('light'); showPaywall('library'); };
    });
    // The lock card is not content: the progress counts what there is to read.
    showProgress('libProgressTrack', Math.min(LS.idx + 1, LS.count), LS.count);
    $('libDeck').classList.toggle('one-card', LS.items.length <= 1);
    $('libPrev').disabled = LS.idx <= 0;
    $('libNext').disabled = LS.idx >= LS.items.length - 1;
  }

  function libNext() { if (LS.idx < LS.items.length - 1) { LS.idx++; renderLibStage(true); } }
  function libPrev() { if (LS.idx > 0) { LS.idx--; renderLibStage(true); } }

  function libDeckOpen(items, title, back) {
    deckGen++;                // a new deck owns the stage, same #libDeck or not
    LS.items = items;
    LS.idx = 0;
    LS.count = items.filter(i => !i.lock).length;
    LS.back = back;
    $('libDeckTitle').textContent = title;
    // The swipe engine belongs to whoever is on screen; these send it here.
    drag.onAdvance = libNext;
    drag.onBack = libPrev;
    deckDirty = false;
    show('libDeck');
    renderLibStage(true);
  }

  function libDeckLeave() {
    drag.onAdvance = null; drag.onBack = null;
    (LS.back || openLibrary)();
  }

  $('libPrev').onclick = () => { if (!deckDirty) libPrev(); };
  $('libNext').onclick = () => {
    const top = document.querySelector('#libStage .card.top');
    if (top && LS.idx < LS.items.length - 1) flyOut(top, -1);
  };
  $('libDeckBack').onclick = libDeckLeave;

  $('libBackHome').onclick = () => show('home');
  // Re-fetch rather than just show: an 18+ confirmation taken inside a module
  // changes the counts on the index, and the two screens must agree.
  $('libBack').onclick = () => (LIB_BACK_TO === 'library' ? openLibrary() : show('home'));

  /* ---------------- compatibility test ---------------- */
  // `pending` is an answer POST in flight; `resultCode` is the test whose
  // result is currently on the result screen, which /mine may set to a
  // different code than the one being played.
  const CT = { code: null, st: null, timer: null, questions: null, idx: 0, invite: null, mine: {},
               pending: false, resultCode: null };

  function stopCompatPoll() { stopPoll(CT); }

  function startCompatPoll() {
    startPoll(
      CT, 2500,
      () => (CT.code ? coopFetch('/api/compat/' + CT.code) : null),
      st => { CT.st = st; onCompatState(st); },
      () => {
        // Deleted by the partner or swept: forget the code, or the entry
        // screen keeps offering a test that no longer exists.
        if (store.get('compatCode', null) === CT.code) store.set('compatCode', null);
        CT.code = null;
        toast(T().coopGone);
        show('compat');
      }
    );
  }

  function onCompatState(st) {
    if (st.finished) { stopCompatPoll(); loadCompatResult(CT.code); return; }
    if ($('compatInvite').classList.contains('active') && st.started) { enterCompatQuiz(); return; }
    if ($('compatQuiz').classList.contains('active')) {
      $('compatPartnerProgress').textContent =
        fmt(T().compatWaitingPartner, { n: st.partner_answered, total: st.total });
    }
  }

  async function loadCompatQuestions() {
    if (CT.questions) return CT.questions;
    const data = await coopFetch('/api/compat/questions');
    CT.questions = [];
    data.spheres.forEach(s => s.questions.forEach(q =>
      CT.questions.push({ sphere: s.title, text: q })));
    CT.scale = data.scale;
    return CT.questions;
  }

  // The first question the caller has *not* answered. The test is meant to be
  // taken over hours or days, so re-entering must not restart all 40.
  // `answered_indices` is the caller's own; the server never sends the
  // partner's.
  function compatResumeIndex(st) {
    const done = new Set(st.answered_indices || []);
    for (let i = 0; i < st.total; i++) if (!done.has(i)) return i;
    return st.total;
  }

  function adoptCompatState(st) {
    // The answers this phone gave, by question, for this test only: another
    // test starts with none marked.
    if (CT.code !== st.code) CT.mine = {};
    CT.code = st.code;
    CT.st = st;
    CT.invite = st.invite_url || null;
    CT.pending = false;
    CT.idx = compatResumeIndex(st);
    // Remembered so the intro screen can offer the test back: without it a
    // creator who closes the app mid-quiz has no way back into their own
    // test — there is no code field to type it into any more.
    store.set('compatCode', st.code);
  }

  async function compatCreate() {
    $('loader').classList.add('show');
    try {
      const st = await coopFetch('/api/compat', { method: 'POST', json: {} });
      adoptCompatState(st);
      showInviteLink($('compatCode'), CT.invite);
      $('compatWaiting').textContent = T().inviteWaiting;
      show('compatInvite');
      askToWrite();
      startCompatPoll();
    } catch (e) {
      if (e.status === 402) showPaywall('compat'); else toast(T().loadError);
    } finally { $('loader').classList.remove('show'); }
  }

  async function compatJoin(code) {
    $('loader').classList.add('show');
    try {
      const st = await coopFetch('/api/compat/' + code + '/join', { method: 'POST', json: {} });
      adoptCompatState(st);
      // A finished test never gets a poll: the poll used to be started
      // first, see `finished` on its next tick and force the result screen
      // a second time, yanking back a user who had already pressed back.
      if (st.finished) { loadCompatResult(st.code); return; }
      startCompatPoll();
      // The creator re-opening their own test before the partner has joined
      // belongs on the invite screen, not in a quiz they cannot answer yet.
      if (!st.started) {
        showInviteLink($('compatCode'), CT.invite);
        $('compatWaiting').textContent = T().inviteWaiting;
        show('compatInvite');
        return;
      }
      if (CT.idx > 0 && CT.idx < st.total) toast(fmt(T().compatResume, { n: CT.idx + 1 }));
      // After the quiz is on screen: a screen switch closes every overlay.
      await enterCompatQuiz();
      askToWrite();
    } catch (e) {
      if (e.status === 409) toast(T().coopFull);
      else if (e.status === 404) {
        // The partner deleted it, or retention swept it: stop offering the
        // dead code back on every visit to the entry screen.
        if (store.get('compatCode', null) === code) store.set('compatCode', null);
        refreshCompatResume();
        toast(T().coopGone);
      }
      else toast(statusMessage(e));
    } finally { $('loader').classList.remove('show'); }
  }

  async function enterCompatQuiz() {
    await loadCompatQuestions();
    show('compatQuiz');
    renderCompatQuestion();
  }

  function renderCompatQuestion() {
    const total = CT.questions.length;
    // Back one question, while the test is still being answered: the server
    // takes any index until both partners have finished (audit D-21).
    $('compatPrev').style.visibility = CT.idx > 0 ? 'visible' : 'hidden';
    $('compatPartnerProgress').classList.toggle('waiting', CT.idx >= total);
    if (CT.idx >= total) {
      $('compatQuestion').innerHTML = '<p class="compat-q">' + escapeHTML(T().compatDone) + '</p>';
      $('compatScale').innerHTML = '';
      setCompatScaleEnabled(!CT.pending);
      return;
    }
    const q = CT.questions[CT.idx];
    // What this phone sent this session; after a reload only *that* it was
    // answered is known (the server never sends values back, not even the
    // caller's own).
    const given = CT.mine[CT.idx];
    const answered = given || (CT.st && (CT.st.answered_indices || []).indexOf(CT.idx) >= 0);
    $('compatSphereTitle').textContent = q.sphere;
    $('compatProgress').style.width = (CT.idx / total * 100) + '%';
    $('compatProgressNum').textContent = fmt(T().compatQuestionOf, { n: CT.idx + 1, total: total });
    $('compatQuestion').innerHTML = '<p class="compat-q">' + escapeHTML(q.text) + '</p>' +
      (answered && !given ? '<p class="compat-hint">' + escapeHTML(T().compatAnswered) + '</p>' : '');
    $('compatScale').innerHTML = '<div class="compat-scale" role="radiogroup">' +
      CT.scale.map((label, i) => {
        const value = i + 1;
        const bars = [1, 2, 3, 4, 5].map(n => `<i${n <= value ? ' class="lit"' : ''}></i>`).join('');
        return `<button class="compat-opt${given === value ? ' on' : ''}" role="radio" ` +
          `aria-checked="${given === value}" data-value="${value}">` +
          `<span class="compat-bars" aria-hidden="true">${bars}</span>` +
          `<span>${escapeHTML(label)}</span></button>`;
      }).join('') + '</div>';
    $('compatScale').querySelectorAll('.compat-opt').forEach(btn => {
      btn.onclick = () => submitCompatAnswer(parseInt(btn.dataset.value, 10));
    });
    setCompatScaleEnabled(!CT.pending);
  }

  function setCompatScaleEnabled(on) {
    $('compatScale').querySelectorAll('.compat-opt').forEach(btn => { btn.disabled = !on; });
    $('compatPrev').disabled = !on;
  }

  $('compatPrev').onclick = () => {
    if (CT.pending || CT.idx <= 0) return;
    haptic('light');
    CT.idx -= 1;
    renderCompatQuestion();
  };

  async function submitCompatAnswer(value) {
    // One answer in flight at a time. Each POST is a read-modify-write of the
    // whole 40-slot array server-side, so overlapping them is how an answer
    // goes missing and the couple sits at 39/40 with no way to find it.
    if (CT.pending) return;
    haptic('light');
    const index = CT.idx;
    const before = CT.mine[index];
    CT.mine[index] = value;
    CT.pending = true;
    CT.idx += 1;
    renderCompatQuestion();  // next question up front; its buttons stay dead
    try {
      const st = await coopFetch('/api/compat/' + CT.code + '/answer', {
        method: 'POST', json: { index, value }
      });
      CT.st = st;
      CT.pending = false;
      if (st.finished) { stopCompatPoll(); loadCompatResult(CT.code); return; }
      setCompatScaleEnabled(true);
    } catch (e) {
      CT.pending = false;
      if (e.status === 409) {
        // Two different 409s. "Test is already complete": a retake finished
        // under us, so go read the result rather than answering into a
        // void — the poll used to be the only rescue, and it is not always
        // running. "Partner has not joined yet": step back and say so.
        if ((e.detail || '').indexOf('complete') >= 0) {
          stopCompatPoll();
          loadCompatResult(CT.code);
          return;
        }
        CT.mine[index] = before;
        CT.idx = index;
        renderCompatQuestion();
        setCompatScaleEnabled(true);
        toast(T().compatNotStarted);
        return;
      }
      CT.mine[index] = before;
      CT.idx = index;
      renderCompatQuestion();
      toast(statusMessage(e));
    }
  }

  async function loadCompatResult(code) {
    $('loader').classList.add('show');
    try {
      const data = await coopFetch('/api/compat/' + code + '/result');
      showCompatResult(data, code);
    } catch (e) {
      toast(T().loadError);
    } finally { $('loader').classList.remove('show'); }
  }

  function showCompatResult(result, code) {
    CT.resultCode = code;
    $('compatResultBody').innerHTML = renderCompatResult(result);
    $('compatDeleteBtn').onclick = () => compatDelete(code);
    show('compatResult');
  }

  // Telegram's native confirm where it exists, the browser's otherwise.
  function compatConfirm(message) {
    return new Promise(resolve => {
      try {
        if (tg && tg.showConfirm) { tg.showConfirm(message, ok => resolve(!!ok)); return; }
      } catch (e) {}
      resolve(window.confirm(message));
    });
  }

  async function compatDelete(code) {
    if (!await compatConfirm(T().compatDeleteConfirm)) return;
    $('loader').classList.add('show');
    try {
      await coopFetch('/api/compat/' + code, { method: 'DELETE' });
      stopCompatPoll();
      if (store.get('compatCode', null) === code) store.set('compatCode', null);

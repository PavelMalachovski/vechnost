      if (CT.code === code) { CT.code = null; CT.st = null; CT.idx = 0; CT.invite = null; }
      CT.resultCode = null;
      toast(T().compatDeleted);
      show('compat');
    } catch (e) {
      toast(e.status === 404 ? T().coopGone : T().loadError);
    } finally { $('loader').classList.remove('show'); }
  }

  const COMPAT_ZONE_LABEL = () => ({
    strength: T().compatZoneStrength,
    growth: T().compatZoneGrowth,
    crisis: T().compatZoneCrisis
  });

  // The question numbers a card quotes, each opening its text on a tap.
  // Texts arrive with the result (r.questions, keyed by global number) —
  // never any answer, the partner's or your own.
  function compatQuestionsHTML(numbers, texts) {
    if (!numbers.length) return '';
    return '<div class="compat-qs">' + numbers.map(n =>
      '<details class="compat-qi"><summary>' +
        escapeHTML(fmt(T().compatQuestionN, { n: n })) + '</summary>' +
        '<p>' + escapeHTML((texts && texts[n]) || '') + '</p>' +
      '</details>').join('') + '</div>';
  }

  function renderCompatResult(r) {
    const zoneLabel = COMPAT_ZONE_LABEL();
    const sphereCard = (s, extra) => `
      <div class="lib-card compat-${s.zone}">
        <div class="lib-card-title">${escapeHTML(s.title)} · ${escapeHTML(zoneLabel[s.zone])}</div>
        ${extra || ''}
        <div class="lib-card-line">${escapeHTML(s.verdict)}</div>
        ${compatQuestionsHTML(s.divergent, r.questions)}
      </div>`;

    const strengths = r.strengths.length
      ? r.strengths.map(s => sphereCard(s)).join('')
      : `<p class="lib-card-line">${escapeHTML(r.strengths_fallback)}</p>`;

    // «Обсудите вопросы»: the recommendation, and under it every divergent
    // question, opened by a tap. With nothing to discuss the whole section
    // goes, heading included — "Обсудите вопросы №" over nothing would
    // read as a rendering fault.
    const discuss = r.divergent_all.length
      ? `<h3 class="compat-h">${escapeHTML(T().compatDiscuss)}</h3>
         <div class="lib-card">
           <div class="lib-card-line">${escapeHTML(r.recommendation)}</div>
           ${compatQuestionsHTML(r.divergent_all, r.questions)}
         </div>`
      : '';

    // A sphere outside the strength zone may carry a framing line that
    // says *why* it needs the talk. It used to head its own «Требуют
    // разговора» block; now that every zone is a section of its own, the
    // framing rides on the sphere's card instead of repeating it.
    const framingOf = {};
    r.attention.forEach(a => { if (a.framing) framingOf[a.sphere.id] = a.framing; });
    const zoneCard = s => sphereCard(s, framingOf[s.id]
      ? `<div class="lib-card-line"><i>${escapeHTML(framingOf[s.id])}</i></div>`
      : '');

    // One section per zone, replacing the flat «По всем сферам» list: the
    // verdict of every sphere, grouped under the zone it landed in. A zone
    // nobody landed in is omitted, heading included, rather than shown as
    // a heading over nothing.
    const zoneSection = z => {
      const spheres = r.spheres.filter(s => s.zone === z);
      if (!spheres.length) return '';
      return `<h3 class="compat-h">${escapeHTML(zoneLabel[z])}</h3>` +
             spheres.map(zoneCard).join('');
    };
    let crisis = zoneSection('crisis');
    if (crisis) {
      crisis += r.critical_blocks.map(b =>
        `<div class="lib-card compat-crisis"><div class="lib-card-line">${escapeHTML(b)}</div></div>`).join('');
    }

    // How the eight spheres split across the three zones, under the headline
    // percentage: one number says how close the couple is, this says how that
    // closeness is distributed. All three are listed even at zero — a missing
    // line would read as "not measured" rather than "none".
    const zoneCounts = ['strength', 'growth', 'crisis']
      .map(z => escapeHTML(zoneLabel[z]) + ': ' + r.spheres.filter(s => s.zone === z).length)
      .join(' · ');

    // Section order is the product's, not alphabetical: the team spheres
    // open, the questions to discuss follow while attention is highest,
    // then the three zones from strong to critical.
    return `
      <div class="compat-percent">${r.percent}%</div>
      <p class="compat-zones">${zoneCounts}</p>
      <h3 class="compat-h">${escapeHTML(T().compatStrengths)}</h3>
      ${strengths}
      ${discuss}
      ${zoneSection('strength')}
      ${zoneSection('growth')}
      ${crisis}
      <button class="btn btn-second btn-danger compat-danger" id="compatDeleteBtn">${escapeHTML(T().compatDelete)}</button>`;
  }

  // Offer the last test back so an interrupted run is one tap from

  // the home button: the button used to keep a stale closure after a
  // delete or a second test and 404 forever. The click re-reads the store,

  async function busyWhile(button, work) {
    if (button.classList.contains('busy')) return;
    button.classList.add('busy');

      '<line class="art-sight" x1="63" y1="57" x2="63" y2="88"/>' +
      '<path class="art-cam" d="M59 82 L63 90 L67 82"/>',
    'camera-focus':

  // The one entry point: a key in, a frame out. The picture itself arrives
  // later (loadGuideArt), so the frame holds its place until it does. `rev`
  // is the picture's fingerprint from the server: it rides in the picture's
  // address, so a re-rendered picture is fetched again rather than taken
  // from what the browser kept of the old one.
  function guideArt(key, rev) {
    if (!key) return '';
    const over = ART_OVERLAYS[key]
      ? '<svg class="art-over" viewBox="0 0 120 130" aria-hidden="true">' + ART_OVERLAYS[key] + '</svg>'
      : '';
    const cap = ART_CAPTIONS[key];
    return '<div class="art-wrap">' +
             '<div class="art-photo skeleton" data-art="' + escapeHTML(key) + '"' +
               (rev ? ' data-rev="' + escapeHTML(rev) + '"' : '') + '>' +
               '<img class="guide-art" alt="" aria-hidden="true" decoding="async" width="540" height="585">' +
               over +
             '</div>' +
             (cap ? '<span class="art-cap">' + escapeHTML(cap) + '</span>' : '') +
           '</div>';
  }

  // The pictures are paid like the words, so they are fetched with the
  // reader's initData - an <img src> cannot send it - each when its card
  // comes near the screen, and kept for the rest of the session.
  const ART_CACHE = {};
  let artWatch = null;

  async function loadArt(slot, moduleId) {
    const id = moduleId + '/' + slot.dataset.art;
    try {
      if (!ART_CACHE[id]) {
        const headers = {};
        if (tg && tg.initData) headers['Authorization'] = 'tma ' + tg.initData;
        const path = '/api/library/' + moduleId + '/art/' + encodeURIComponent(slot.dataset.art) +
                     '?lang=' + lang + libNsfwParam() +
                     (slot.dataset.rev ? '&v=' + encodeURIComponent(slot.dataset.rev) : '');
        const res = await timedFetch(path, { headers });
        if (!res.ok) throw await httpError(res, path);
        ART_CACHE[id] = URL.createObjectURL(await res.blob());
      }
      const img = slot.querySelector('img');
      img.onload = () => { slot.classList.remove('skeleton'); slot.classList.add('ready'); };
      img.onerror = () => { slot.classList.remove('skeleton'); slot.classList.add('failed'); };
      img.src = ART_CACHE[id];
    } catch (e) {
      // A quiet frame rather than a broken picture: the words still teach.
      slot.classList.remove('skeleton');
      slot.classList.add('failed');
    }
  }

  function loadGuideArt(moduleId) {
    const slots = [...$('guideBody').querySelectorAll('.art-photo[data-art]')];
    if (artWatch) artWatch.disconnect();
    if (!('IntersectionObserver' in window)) { slots.forEach(slot => loadArt(slot, moduleId)); return; }
    artWatch = new IntersectionObserver(entries => entries.forEach(entry => {
      if (!entry.isIntersecting) return;
      artWatch.unobserve(entry.target);
      loadArt(entry.target, moduleId);
    }), { root: $('guideBody'), rootMargin: '600px 0px' });
    slots.forEach(slot => artWatch.observe(slot));
  }

  /* ---------------- 69 ступеней ---------------- */
  // Reuses coopFetch: the same auth headers, the same guest-id fallback, the
  // same error shape. Its own state, because a board is not a deck.
  //
  // Each partner has their own piece and walks their own board; the game
  // ends when both are standing on 69. The server owns the dice and the
  // positions, so this file only ever draws what it was told.
  const G = {
    code: null,      // the game being played
    st: null,        // last state from the server
    board: null,     // the map, fetched once per game
    byId: null,      // cell metadata by number, for drawing
    timer: null,     // poll handle
    rolling: false,  // guards a double tap on the dice
    settling: null,  // portal animation timer
    piece: 'hearts', // the suit picked on the entry screen
    opened: null,    // the cell whose secret is already open, so it stays open
    invite: null     // the link that puts the partner on this board
  };

  // The four suits the deck is printed with. Characters, not emoji: the board
  // is a card game, and an emoji picker on it looked like a chat.
  const S69_SUITS = {
    hearts:   { glyph: '♥', red: true },
    spades:   { glyph: '♠', red: false },
    clubs:    { glyph: '♣', red: false },
    diamonds: { glyph: '♦', red: true }
  };

  function s69Error(e) {
    if (e.status === 402) { showPaywall('s69'); return; }
    // coopFetch keeps the server's `detail`, and one status covers several
    // different situations: a 409 on join can mean "full" or "this game is
    // played on one phone", a 403 can mean "not your turn" or "not a player
    // at all". A stranger with a stale link used to be told it was not
    // their turn.
    const d = (e.detail || '');
    if (e.status === 409) {
      if (d.indexOf('one phone') >= 0) { toast(T().s69SoloJoin); return; }
      if (d.indexOf('joined') >= 0) { toast(T().s69NoPartner); return; }
      if (d.indexOf('over') >= 0 || d.indexOf('dice') >= 0) { toast(T().s69Over); return; }
      toast(T().s69Full); return;
    }
    if (e.status === 404 || e.status === 410) { toast(T().s69Gone); return; }
    if (e.status === 403) {
      toast(d.indexOf('player') >= 0 ? T().s69NotPlayer : T().s69NotYourTurn);
      return;
    }
    toast(statusMessage(e));
  }

  // A happy buzz on a ladder, a sad double one on a snake, and a buzz when a
  // secret or a Joker turns up.
  function s69Haptic(kind) {
    if (kind === 'ladder') { haptic('ok'); return; }
    if (kind === 'snake') { haptic('heavy'); setTimeout(() => haptic('heavy'), 150); return; }
    if (kind === 'secret' || kind === 'joker') haptic('medium');
  }

  /* ---- entry ---- */

  function renderS69Suits(taken) {
    const box = $('s69Suits');
    box.innerHTML = '';
    Object.keys(S69_SUITS).forEach(id => {
      const suit = S69_SUITS[id];
      const b = document.createElement('button');
      b.className = 's69-suit' + (suit.red ? ' red' : '') + (G.piece === id ? ' on' : '');
      b.textContent = suit.glyph;
      b.setAttribute('aria-label', T().s69Suit[id]);
      if (taken && taken.indexOf(id) !== -1) b.disabled = true;
      b.onclick = () => { haptic('light'); G.piece = id; renderS69Suits(taken); };
      box.appendChild(b);
    });
  }

  async function openS69() {
    haptic('light');
    G.piece = store.get('s69Piece', 'hearts');
    renderS69Suits(null);
    show('s69');   // which also asks for the game in play
  }

  // A game in play is offered back, with the way to abandon it beside the way
  // to continue it. Leaving the screen never ended a game, but without both
  // buttons there was no way to tell — and no way to start a fresh board
  // without the old one being handed back on the next visit.
  async function s69OfferResume() {
    $('btnS69Resume').style.display = 'none';
    $('btnS69Restart').style.display = 'none';
    try {
      const st = await coopFetch('/api/steps69/mine');
      if (!st) return;  // null, the common case: no game in play
      $('btnS69Resume').textContent =
        T().s69Resume + ' · ' + fmt(T().s69ResumeHint, { n: st.you.position });
      $('btnS69Resume').style.display = '';
      $('btnS69Resume').onclick = () => {
        G.code = st.code; G.invite = st.invite_url || null; enterS69();
      };

      $('btnS69Restart').textContent = T().s69Restart;
      $('btnS69Restart').style.display = '';
      $('btnS69Restart').onclick = async () => {
        // Telegram's native confirm where it exists: clients that suppress
        // window.confirm made this button do nothing at all.
        if (!await compatConfirm(T().s69RestartConfirm)) return;
        haptic('medium');
        try { await coopFetch('/api/steps69/' + st.code, { method: 'DELETE' }); }
        catch (e) {
          // Already gone is the outcome we wanted; anything else means the
          // game still exists, and saying «Игра удалена» would be a lie
          // the returning Resume button immediately exposes.
          if (e.status !== 404 && e.status !== 410) { s69Error(e); return; }
        }
        store.set('s69Code', null);
        toast(T().s69Deleted);
        s69OfferResume();
      };
    } catch (e) {
      // A failure must not masquerade as "no game": hiding both buttons on a
      // network hiccup sent a pair mid-game off to start a second board. A
      // 404 is the exception, and only because a server from before audit
      // D-37 said "no game" that way; a page open across a deploy may still
      // hear one.
      if (e.status !== 404 && e.status !== 410) toast(statusMessage(e));
    }
  }

  async function s69Create(mode) {
    haptic('light');
    store.set('s69Piece', G.piece);
    $('loader').classList.add('show');
    try {
      const st = await coopFetch('/api/steps69', {
        method: 'POST', json: { mode: mode, piece: G.piece }
      });
      G.code = st.code; G.st = st; G.invite = st.invite_url || null;
      store.set('s69Code', st.code);
      if (mode === 'solo') { enterS69(); return; }
      showInviteLink($('s69Code'), G.invite);
      $('s69Waiting').textContent = T().s69Waiting;
      show('s69Invite');
      askToWrite();
      startS69Poll(st2 => {
        if (!st2.started) return;
        stopS69Poll();
        haptic('ok');
        toast(fmt(T().s69Joined, { name: st2.partner.name || '' }));
        enterS69();
      });
    } catch (e) { s69Error(e); } finally { $('loader').classList.remove('show'); }
  }

  // Reached only through an invite link, so no suit is named: whoever
  // followed the link never saw the picker, and the server deals them
  // whichever suit the creator is not wearing.
  async function s69Join(code) {
    haptic('light');
    $('loader').classList.add('show');
    try {
      const st = await coopFetch('/api/steps69/' + code + '/join', {
        method: 'POST', json: {}
      });
      G.code = st.code; G.st = st; G.invite = st.invite_url || null;
      G.piece = st.you.piece || G.piece;
      store.set('s69Code', st.code);
      store.set('s69Piece', G.piece);
      // After the board is on screen: a screen switch closes every overlay.
      await enterS69();
      askToWrite();
    } catch (e) { s69Error(e); }
    finally { $('loader').classList.remove('show'); }
  }

  /* ---- the board ---- */

  async function enterS69() {
    $('loader').classList.add('show');
    try {
      G.board = await coopFetch('/api/steps69/' + G.code + '/board');
      G.byId = {};
      G.board.cells.forEach(c => { G.byId[c.id] = c; });
      G.st = await coopFetch('/api/steps69/' + G.code);
      G.invite = G.st.invite_url || G.invite;
      G.opened = null;
      $('s69BoardTitle').textContent = T().s69Title;
      buildS69Map();
      renderS69(G.st, true);
      show('s69Board');
      startS69Poll(onS69State);
    } catch (e) { s69Error(e); show('s69'); } finally { $('loader').classList.remove('show'); }
  }

  function leaveS69() {
    stopS69Poll();
    if (G.settling) { clearTimeout(G.settling); G.settling = null; }
    G.code = null; G.st = null; G.board = null; G.byId = null; G.opened = null;
    G.invite = null;
    $('s69Finale').classList.remove('show');
    $('s69Done').classList.remove('show');
    show('home');
  }

  function stopS69Poll() { stopPoll(G); }

  function startS69Poll(onState) {
    startPoll(
      G, 2200,
      () => (G.code ? coopFetch('/api/steps69/' + G.code) : null),
      onState,
      () => { toast(T().s69Gone); leaveS69(); }
    );
  }

  function onS69State(st) {
    // A poll that left before our own /roll and lands after it carries the
    // board as it was: the piece jumped back a square for a tick. Rolls
    // only ever go up within one game, so an answer with fewer is old.
    if (G.st && G.st.code === st.code && st.you && st.partner &&
        st.you.rolls + st.partner.rolls < G.st.you.rolls + G.st.partner.rolls) return;
    // A poll must not stomp on the portal animation the roll started: the
    // server already reports the final square, so repainting here would
    // teleport the piece past the flight the partner is watching.
    if (G.settling) { G.st = st; return; }
    const moved = !G.st || st.you.rolls !== G.st.you.rolls
                        || st.partner.rolls !== G.st.partner.rolls;
    renderS69(st, moved);
  }

  function renderS69(st, animate) {
    const prev = G.st;
    G.st = st;

    // A new cell is a new secret: forget which one was open.
    if (!prev || prev.you.position !== st.you.position) G.opened = null;

    if (animate && st.last && st.last.event) flyS69Piece(st.last);
    else paintS69Map();

    renderS69Turn(st);
    renderS69Cell(st);

    if (animate && st.last && st.last.seat === st.you.seat) {
      const kind = st.you.cell.kind;
      if (kind === 'secret' || kind === 'joker') s69Haptic(kind);
    }
    if (st.both_home && !st.finished) showS69Finale(st);
    if (st.finished && (!prev || !prev.finished)) showS69Done(st);
  }

  /* ---- the map ---- */

  // The board climbs from the bottom, nine squares a row, the way the Lila
  // board it is drawn after does: 1-9 left to right along the bottom, 10-18
  // back again, and so on up to the finale. Sixty-nine squares leave three
  // slots in the top row, and the last square takes them: «Самадхи» is a
  // plaque, not a square. S69_COLS and the CSS grid (.s69-map) agree.
  const S69_COLS = 9;
  const S69_UNIT = 100;   // one square, in the drawing's own units

  function s69Rows() { return Math.ceil(G.board.size / S69_COLS); }

  // Where a square sits: its column from the left, its row from the bottom,
  // and how many columns it spans.
  function s69Slot(id) {
    const row = Math.floor((id - 1) / S69_COLS);
    const step = (id - 1) % S69_COLS;
    const rightward = row % 2 === 0;
    let col = rightward ? step : S69_COLS - 1 - step;
    let span = 1;
    if (id === G.board.size) {
      span = rightward ? S69_COLS - col : col + 1;
      if (!rightward) col = 0;
    }
    return { row: row, col: col, span: span };
  }

  // The middle of a square in the drawing's units, y growing downward.
  function s69Point(id) {
    const s = s69Slot(id);
    return { x: (s.col + s.span / 2) * S69_UNIT, y: (s69Rows() - s.row - 0.5) * S69_UNIT };
  }

  function s69Num(v) { return Math.round(v * 10) / 10; }
  function s69Pts(list) { return list.map(p => s69Num(p[0]) + ' ' + s69Num(p[1])).join('L'); }

  // A heart whose tip is at (tip, 0) and points along +x: the head of a
  // Cupid's arrow. Drawn from a heart standing on its tip, turned a quarter.
  const S69_HEART = [
    [0, 0], [-0.14, -0.12], [-0.58, -0.4], [-0.58, -0.72],
    [-0.58, -0.96], [-0.38, -1.08], [-0.2, -1.02],
    [-0.09, -0.98], [0, -0.9], [0, -0.8],
    [0, -0.9], [0.09, -0.98], [0.2, -1.02],
    [0.38, -1.08], [0.58, -0.96], [0.58, -0.72],
    [0.58, -0.4], [0.14, -0.12], [0, 0]
  ];
  function s69HeartPath(tip, size) {
    const p = S69_HEART.map(h => s69Num(tip + size * h[1]) + ' ' + s69Num(-size * h[0]));
    let d = 'M' + p[0];
    for (let i = 1; i < p.length; i += 3) d += 'C' + p[i] + ' ' + p[i + 1] + ' ' + p[i + 2];
    return d + 'Z';
  }

  // A Cupid's arrow from a ladder square to the square it carries the piece
  // to: the fletching on the square you land on, the heart on the one you
  // reach. Drawn along +x and turned into place.
  function s69ArrowSVG(cell) {
    const a = s69Point(cell.id), b = s69Point(cell.to);
    const len = Math.hypot(b.x - a.x, b.y - a.y);
    const deg = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
    const tail = -26, tip = len + 6;
    let feathers = '';
    for (let i = 0; i < 3; i++) {
      const x = tail + 3 + i * 8;
      feathers += '<path class="s69-feather" d="M' + (x + 11) + ' -2L' + (x + 2) + ' -13L' +
                  (x - 6) + ' -13L' + (x + 2) + ' -2ZM' + (x + 11) + ' 2L' + (x + 2) + ' 13L' +
                  (x - 6) + ' 13L' + (x + 2) + ' 2Z"/>';
    }
    return '<g class="s69-arrow" data-from="' + cell.id + '" data-to="' + cell.to + '" transform="translate(' +
      s69Num(a.x) + ' ' + s69Num(a.y) + ') rotate(' + s69Num(deg) + ')">' +
      '<rect class="s69-shaft" x="' + tail + '" y="-2.6" width="' + s69Num(tip - 20 - tail) +
      '" height="5.2" rx="2.6"/>' + feathers +
      '<path class="s69-heart" d="' + s69HeartPath(tip, 27) + '"/></g>';
  }

  // The spine of a serpent, head to tail: a line from the snake square to
  // the square it drops the piece on, swung from side to side. The swings
  // come to nothing at both ends, so the head and the tail sit on their
  // squares.
  function s69Spine(from, to) {
    const h = s69Point(from), t = s69Point(to);
    const dx = t.x - h.x, dy = t.y - h.y, len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len;
    const halves = Math.max(2, Math.round(len / 85));
    const amp = Math.min(26, 14 + len / 25);
    const points = [];
    const n = 60;
    for (let i = 0; i <= n; i++) {
      const f = i / n, s = len * f;
      const off = amp * Math.sin(Math.PI * halves * f);
      points.push([h.x + ux * s - uy * off, h.y + uy * s + ux * off]);
    }
    return points;
  }

  // A serpent of temptation: its head on the snake square, its body winding
  // down to its tail on the square the piece slides to. The body tapers from
  // the neck to a point and wears a row of diamonds down its back.
  function s69SnakeSVG(cell) {
    const spine = s69Spine(cell.id, cell.to);
    const n = spine.length - 1;
    // The head is drawn over the first stretch of the spine, so the body
    // starts where the head ends and the head itself sits on the square.
    let neck = 1;
    while (neck < n - 4 && Math.hypot(spine[neck][0] - spine[0][0], spine[neck][1] - spine[0][1]) < 16) neck++;
    const left = [], right = [];
    let diamonds = '';
    for (let i = neck; i <= n; i++) {
      const p = spine[i], q = spine[Math.min(i + 1, n)], o = spine[i - 1];
      let tx = q[0] - o[0], ty = q[1] - o[1];
      const tl = Math.hypot(tx, ty) || 1;
      tx /= tl; ty /= tl;
      const w = 10 * Math.pow(1 - (i - neck) / (n - neck), 0.75) + 0.5;
      left.push([p[0] - ty * w, p[1] + tx * w]);
      right.push([p[0] + ty * w, p[1] - tx * w]);
      if ((i - neck) % 4 === 2 && w > 2.5) {
        const a = w * 0.9, b = w * 0.5;
        diamonds += 'M' + s69Pts([[p[0] - tx * a, p[1] - ty * a], [p[0] - ty * b, p[1] + tx * b],
                                  [p[0] + tx * a, p[1] + ty * a], [p[0] + ty * b, p[1] - tx * b]]) + 'Z';
      }
    }
    const body = 'M' + s69Pts(left) + 'L' + s69Pts(right.slice().reverse()) + 'Z';

    const p0 = spine[neck], p1 = spine[neck + 3];
    const deg = Math.atan2(p0[1] - p1[1], p0[0] - p1[0]) * 180 / Math.PI;
    const head =
      '<g transform="translate(' + s69Num(p0[0]) + ' ' + s69Num(p0[1]) + ') rotate(' + s69Num(deg) + ')">' +
      '<path class="s69-tongue" d="M30 0L40 0M40 0L46 -4.5M40 0L46 4.5"/>' +
      '<path class="s69-skull" d="M-4 -10C5 -16.5 19 -16.5 26.5 -8.5C31.5 -3.4 31.5 3.4 26.5 8.5' +
      'C19 16.5 5 16.5 -4 10Z"/>' +
      '<path class="s69-crown" d="M4 0L12 -5L20 0L12 5Z"/>' +
      '<ellipse class="s69-eye" cx="16" cy="-7.4" rx="3.8" ry="2.9"/>' +
      '<ellipse class="s69-eye" cx="16" cy="7.4" rx="3.8" ry="2.9"/>' +
      '<path class="s69-pupil" d="M14.6 -7.4L17.6 -7.4M14.6 7.4L17.6 7.4"/></g>';
    return '<g class="s69-snake" data-from="' + cell.id + '" data-to="' + cell.to + '">' +
      '<path class="s69-body" d="' + body + '"/>' +
      '<path class="s69-diamonds" d="' + diamonds + '"/>' + head + '</g>';
  }

  // A lotus under the squares, after the one on the Lila board: petals
  // fanning from one root, the back row taller than the front, and a glow
  // where it opens.
  function s69LotusSVG(w, h) {
    const root = [w / 2, h * 0.74];
    const petal = (deg, len, wide, cls) =>
      '<path class="' + cls + '" transform="translate(' + root[0] + ' ' + root[1] + ') rotate(' + deg +
      ')" d="M0 0C' + wide + ' ' + (-len * 0.28) + ' ' + (wide * 0.72) + ' ' + (-len * 0.78) + ' 0 ' +
      (-len) + 'C' + (-wide * 0.72) + ' ' + (-len * 0.78) + ' ' + (-wide) + ' ' + (-len * 0.28) + ' 0 0Z"/>';
    let petals = '';
    [[-66, 250, 64], [66, 250, 64], [-40, 330, 78], [40, 330, 78], [-14, 380, 84], [14, 380, 84]]
      .forEach(p => { petals += petal(p[0], p[1], p[2], 's69-petal back'); });
    [[-52, 230, 70], [52, 230, 70], [-26, 290, 82], [26, 290, 82], [0, 320, 88]]
      .forEach(p => { petals += petal(p[0], p[1], p[2], 's69-petal'); });
    return '<defs>' +
      '<radialGradient id="s69Glow"><stop offset="0" class="s69-glow-in"/><stop offset="1" class="s69-glow-out"/></radialGradient>' +
      '<linearGradient id="s69Petal" x1="0" y1="1" x2="0" y2="0"><stop offset="0" class="s69-petal-root"/>' +
      '<stop offset="1" class="s69-petal-tip"/></linearGradient></defs>' +
      '<ellipse cx="' + (w / 2) + '" cy="' + (h * 0.42) + '" rx="' + (w * 0.46) + '" ry="' + (h * 0.44) +
      '" fill="url(#s69Glow)"/>' + petals;
  }

  function s69BlockOf(id) {
    const block = (G.board.blocks || []).filter(b => id >= b.first && id <= b.last)[0];
    return block ? block.id : '';
  }

  // The mark in a square's corner: a Joker is a question, a secret a
  // diamond. Portals need none: their arrows and serpents are drawn.
  function s69MarkHTML(cell) {
    if (cell.kind === 'joker') return '<span class="s69-mark">?</span>';
    if (cell.kind === 'secret') return '<span class="s69-mark">◆</span>';
    return '';
  }

  // The map is a picture, not a row of buttons: a square says what it does
  // only to the piece that stands on it, so there is nothing to tap and
  // nothing ahead to read (the board payload carries no task either).
  function buildS69Map() {
    const box = $('s69Map');
    const w = S69_COLS * S69_UNIT, h = s69Rows() * S69_UNIT;
    const view = '0 0 ' + w + ' ' + h;
    let cells = '';
    G.board.cells.forEach(c => {
      const s = s69Slot(c.id);
      const place = 'grid-row:' + (s69Rows() - s.row) + ';grid-column:' + (s.col + 1) + ' / span ' + s.span;
      const label = c.kind === 'final'
        ? '<span class="s69-num">' + c.id + '</span><span class="s69-goal">' + escapeHTML(c.title || '') + '</span>'
        : '<span class="s69-num">' + c.id + '</span>' + s69MarkHTML(c);
      cells += '<div class="s69-cell k-' + c.kind + ' b-' + s69BlockOf(c.id) +
               (c.milestone ? ' milestone' : '') + '" data-id="' + c.id + '" style="' + place + '">' +
               label + '</div>';
    });
    let art = '';
    G.board.cells.forEach(c => {
      if (c.kind === 'ladder' && c.to) art += s69ArrowSVG(c);
    });
    G.board.cells.forEach(c => {
      if (c.kind === 'snake' && c.to) art += s69SnakeSVG(c);
    });
    box.innerHTML =
      '<svg class="s69-lotus" viewBox="' + view + '" aria-hidden="true" focusable="false">' +
        s69LotusSVG(w, h) + '</svg>' +
      cells +
      '<svg class="s69-art" viewBox="' + view + '" aria-hidden="true" focusable="false">' +
        '<defs><linearGradient id="s69Shaft"><stop offset="0" class="s69-shaft-tail"/>' +
        '<stop offset="1" class="s69-shaft-tip"/></linearGradient></defs>' + art + '</svg>';
  }

  function s69PieceHTML(player, mine) {
    const suit = S69_SUITS[player.piece] || S69_SUITS.spades;
    return '<span class="s69-piece seat-' + player.seat + (suit.red ? ' red' : '') +
           (mine ? ' mine' : '') + '">' + suit.glyph + '</span>';
  }

  // The two pieces in seat order, as the map sets them: seat 0 on the left.
  function s69PairHTML(st) {
    return [st.you, st.partner].sort((a, b) => a.seat - b.seat).map(player => {
      const suit = S69_SUITS[player.piece] || S69_SUITS.spades;
      return '<span' + (suit.red ? ' class="red"' : '') + '>' + suit.glyph + '</span>';
    }).join('');
  }

  // Whose turn it is, led by their suit: the board speaks in suits, and a
  // sparkle in front of «Ваш ход» was an emoji on it (audit D-39). The suit
  // is kept from a screen reader, which would read it as a word, and held
  // to the first word by a no-break space.
  function s69SayTurn(chip, st, seat, text) {
    const player = st.you.seat === seat ? st.you : st.partner;
    const suit = document.createElement('span');
    suit.setAttribute('aria-hidden', 'true');
    suit.textContent = (S69_SUITS[player.piece] || S69_SUITS.spades).glyph;
    chip.textContent = '';
    chip.appendChild(suit);
    chip.appendChild(document.createTextNode('\u00a0' + text));
  }

  // `moving` puts one piece on a square other than the one the state
  // reports, which is how a portal shows the piece landing before it is
  // carried on.
  function paintS69Map(moving) {
    const st = G.st;
    if (!st) return;
    const at = (player) => (moving && moving.seat === player.seat ? moving.at : player.position);
    const mineAt = at(st.you), theirsAt = at(st.partner);
    // Behind *both* pieces, not behind the leading one: a square only one
    // player has walked past is still ahead of the other.
    const behind = Math.min(mineAt, theirsAt);

    const map = $('s69Map');
    map.querySelectorAll('.s69-piece').forEach(p => p.remove());
    map.querySelectorAll('.s69-cell').forEach(el => {
      const id = Number(el.dataset.id);
      el.classList.toggle('here', id === mineAt);
      el.classList.toggle('passed', id < behind);
      el.classList.toggle('duo', id === mineAt && id === theirsAt);
      let pieces = '';
      if (id === mineAt) pieces += s69PieceHTML(st.you, true);
      if (id === theirsAt) pieces += s69PieceHTML(st.partner, false);
      if (pieces) el.insertAdjacentHTML('beforeend', pieces);
    });
    // The picture in words, for a screen reader: which suit stands where.
    map.setAttribute('aria-label', T().s69MapAria + ': ' +
      [st.you, st.partner].sort((a, b) => a.seat - b.seat).map(player =>
        (T().s69Suit[player.piece] || '') + ', ' + fmt(T().s69OnCell, { n: at(player) })).join('; '));
  }

  // What a portal carries a piece through, in the drawing's units: along
  // the arrow, or down the serpent from its head to its tail.
  function s69Route(cell) {
    if (cell.kind === 'snake') return s69Spine(cell.id, cell.to);
    const a = s69Point(cell.id), b = s69Point(cell.to);
    return [[a.x, a.y], [b.x, b.y]];
  }

  // A portal fires with a visible flight, never as a piece that was simply
  // somewhere else the next time you looked: the piece lands on the square,
  // rides the arrow up or slides down the serpent, and settles where the
  // server already put it. A phone that asked for less motion sees it land
  // and then settle, without the travel (audit D-13).
  function flyS69Piece(last) {
    paintS69Map({ seat: last.seat, at: last.landed });
    s69Haptic(last.event);
    toast((last.event === 'ladder' ? T().s69Ladder : T().s69Snake) + ': ' +
          (G.board.system[last.event] || ''));
    if (G.settling) clearTimeout(G.settling);

    // A roll can come before the last ride has settled (one phone, a quick
    // second throw): only the portal ridden now is lit.
    const map = $('s69Map');
    const unlight = () => map.querySelectorAll('.s69-art .live').forEach(el => el.classList.remove('live'));
    unlight();
    const art = map.querySelector('.s69-art [data-from="' + last.landed + '"]');
    if (art) art.classList.add('live');
    const cell = G.byId[last.landed];
    const piece = map.querySelector('.s69-cell[data-id="' + last.landed + '"] .s69-piece.seat-' + last.seat);
    let ms = 620;
    if (!REDUCED_MOTION && cell && cell.to && piece && piece.animate) {
      const w = S69_COLS * S69_UNIT, h = s69Rows() * S69_UNIT;
      const frames = s69Route(cell).map(pt => ({
        left: (pt[0] / w * 100).toFixed(2) + '%', top: (pt[1] / h * 100).toFixed(2) + '%'
      }));
      const ride = cell.kind === 'snake' ? 1300 : 900;
      piece.classList.add('flight');
      map.appendChild(piece);
      piece.animate(frames, { duration: ride, delay: 300, easing: 'ease-in-out', fill: 'both' });
      ms = 300 + ride;
    }
    G.settling = setTimeout(() => {
      G.settling = null;
      unlight();
      paintS69Map();
    }, ms + 40);
  }

  /* ---- the current cell ---- */

  function renderS69Turn(st) {
    // Settled first and unconditionally: this used to sit after three early
    // returns, so a solo game never re-enabled the dice after its first roll.
    $('s69Dice').disabled = !st.your_turn || G.rolling;

    const chip = $('s69TurnChip');
    if (st.finished) { chip.textContent = T().s69Done; chip.className = 'chip'; return; }
    if (st.both_home) { chip.textContent = T().s69BothHome; chip.className = 'chip on'; return; }
    if (st.mode === 'solo') {
      s69SayTurn(chip, st, st.turn, T().s69Seat[st.turn === 0 ? 'creator' : 'guest']);
      chip.className = 'chip on';
      return;
    }
    if (!st.started) { chip.textContent = T().s69Waiting; chip.className = 'chip waiting'; return; }
    if (st.you.home) { chip.textContent = T().s69YouAreHome; chip.className = 'chip waiting'; return; }
    s69SayTurn(chip, st, st.turn, st.your_turn
      ? T().s69YourTurn
      : fmt(T().s69PartnerTurn, { name: st.turn_name || '' }));
    chip.className = 'chip' + (st.your_turn ? ' on' : '');
  }

  function renderS69Cell(st) {
    const c = st.you.cell;
    // The card carries the task and nothing about the machinery: the cell
    // number, the kind and the "read this only if it is your turn" notice
    // were scaffolding, and they crowded out the one thing worth reading.
    const parts = ['<div class="s69-title">' + escapeHTML(c.title || '') + '</div>'];

    if (c.kind === 'joker' && c.joker) {
      parts.push('<div class="s69-text">' + escapeHTML(c.joker.title) + '</div>');
      parts.push('<div class="s69-note">' + escapeHTML(c.joker.text) + '</div>');
    } else if (c.text && c.kind !== 'secret') {
      parts.push('<div class="s69-text">' + escapeHTML(c.text) + '</div>');
    }

    // «Скрытое пламя». The server sends exactly one of these two, so whichever
    // arrived is the one this phone may read.
    const hidden = c.secret || c.partner;
    if (c.kind === 'secret' && hidden) {
      const open = G.opened === st.you.position;
      parts.push(
        '<div class="s69-spoiler' + (open ? ' open' : '') + '" id="s69Spoiler">' +
          '<div class="veil">' + escapeHTML(hidden) + '</div>' +
          '<span class="hint">' + escapeHTML(T().s69Reveal) + '</span>' +
        '</div>');
    }

    if (c.milestone && c.milestone_text) {
      parts.push('<div class="s69-note"><b>' + escapeHTML(T().s69Milestone) + '</b>' +
                 escapeHTML(c.milestone_text) + '</div>');
    }

    if (st.last && st.last.event && st.last.seat === st.you.seat) {
      parts.push('<div class="s69-note ' + (st.last.event === 'ladder' ? 'up' : 'down') + '">' +
                 escapeHTML(st.last.message || '') + '</div>');
    }

    // Where the partner is standing, and their half of a secret they are on.
    if (st.mode !== 'solo' && st.partner.name) {
      const suit = S69_SUITS[st.partner.piece] || S69_SUITS.spades;
      let line = '<div class="s69-partner"><b>' + suit.glyph + ' ' +
                 escapeHTML(st.partner.name) + '</b> · ' +
                 fmt(T().s69OnCell, { n: st.partner.position });
      if (st.partner.cell.partner) {
        line += '<br>' + escapeHTML(st.partner.cell.partner);
      }
      parts.push(line + '</div>');
    }

    $('s69Cell').innerHTML = parts.join('');

    const spoiler = $('s69Spoiler');
    if (spoiler) {
      // Opens on a tap and stays open: it closed again on the second tap,
      // which meant re-opening it in the middle of doing what it said.
      spoiler.onclick = () => {
        if (spoiler.classList.contains('open')) return;
        spoiler.classList.add('open');
        G.opened = st.you.position;
        haptic('light');
      };
    }

    const dice = $('s69Dice');
    const roll = st.last && st.last.seat === st.you.seat ? st.last.roll : null;
    dice.innerHTML = '<span class="s69-die">' + (roll || '·') + '</span>' +
                     '<span>' + escapeHTML(T().s69Roll) + '</span>';
    dice.style.display = st.you.home ? 'none' : '';
  }

  /* ---- rolling ---- */

  async function s69Roll() {
    if (G.rolling || !G.st) return;
    if (!G.st.your_turn) { haptic('light'); toast(T().s69NotYourTurn); return; }
    G.rolling = true;
    const dice = $('s69Dice');
    dice.classList.add('rolling');
    dice.disabled = true;
    haptic('medium');
    try {
      renderS69(await coopFetch('/api/steps69/' + G.code + '/roll', { method: 'POST' }), true);
    } catch (e) { s69Error(e); } finally {
      G.rolling = false;
      dice.classList.remove('rolling');
      if (G.st) renderS69Turn(G.st);
    }
  }

  /* ---- the finale ---- */

  function showS69Finale(st) {
    if (!st.finale) return;
    // Every poll tick lands here while the pair read the finale. Rebuilding
    // the open overlay each time reset its scroll and could swallow a tap
    // whose down and up straddled the rebuild — "I chose and nothing
    // happened". Once shown, it stays as built.
    if ($('s69Finale').classList.contains('show')) return;
    $('s69FinaleSuits').innerHTML = s69PairHTML(st);
    $('s69FinaleTitle').textContent = st.finale.title;
    $('s69FinaleIntro').textContent = st.finale.intro;
    const box = $('s69FinaleChoices');
    box.innerHTML = '';
    st.finale.choices.forEach(choice => {
      const wrap = document.createElement('div');
      const b = document.createElement('button');
      b.className = 'btn btn-play';
      b.textContent = choice.title;
      b.onclick = () => s69ChooseFinale(choice.id);
      wrap.appendChild(b);
      const text = document.createElement('p');
      text.className = 's69-choice-text';
      text.textContent = choice.text;
      wrap.appendChild(text);
      box.appendChild(wrap);
    });
    $('s69Finale').classList.add('show');
  }

  async function s69ChooseFinale(id) {
    haptic('ok');
    try {
      const st = await coopFetch('/api/steps69/' + G.code + '/finale', {
        method: 'POST', json: { choice: id }
      });
      $('s69Finale').classList.remove('show');
      renderS69(st, false);
    } catch (e) {
      if (e.status === 409) {
        // Two different 409s: the partner already fixed the finale (the
        // next poll opens it as chosen), or a piece is somehow not home.
        const detail = (e.detail || '').indexOf('already') >= 0
          ? T().s69FinaleTaken : T().s69FinaleWait;
        toast(detail);
        $('s69Finale').classList.remove('show');
      }
      else s69Error(e);
    }
  }

  function showS69Done(st) {
    stopS69Poll();
    $('s69Finale').classList.remove('show');
    const choice = ((st.finale && st.finale.choices) || [])
      .filter(c => c.id === st.finale_choice)[0];
    $('s69DoneSuits').innerHTML = s69PairHTML(st);
    $('s69DoneTitle').textContent = T().s69Done;
    $('s69DoneText').textContent = (choice ? choice.text + '\n\n' : '') +
      ((st.finale && st.finale.outro) || T().s69Again);
    $('s69DoneAgain').textContent = T().s69Again;
    $('s69DoneHome').textContent = T().s69ToHome;
    $('s69Done').classList.add('show');
    confetti();
    haptic('ok');
  }

  /* ---- wiring ---- */

  // 18+ before the first screen of the board, from the home button and from
  // an invite or a nudge link alike; «Назад» goes home without joining.
  $('btnS69').onclick = () => nsfwGate('s69', openS69);
  $('s69Back').onclick = () => show('home');
  $('s69InviteBack').onclick = () => { stopS69Poll(); G.code = null; show('s69'); };
  $('s69BoardBack').onclick = leaveS69;
  $('btnS69Duo').onclick = () => s69Create('duo');
  $('btnS69Solo').onclick = () => s69Create('solo');
  $('s69Dice').onclick = s69Roll;
  $('s69MapToggle').onclick = () => {
    haptic('light');
    const folded = $('s69Map').classList.toggle('folded');
    $('s69MapToggle').setAttribute('aria-expanded', String(!folded));
  };
  $('btnS69Share').onclick = () => shareInvite(G.invite, T().s69InviteMsg);
  $('btnS69Copy').onclick = () => copyInvite(G.invite);
  $('s69DoneAgain').onclick = () => { $('s69Done').classList.remove('show'); leaveS69(); openS69(); };
  $('s69DoneHome').onclick = leaveS69;

  /* ---------------- boot ---------------- */
  $('btnPlay').onclick = async () => {
    haptic('light');
    if (!DATA) await loadData();
    if (!DATA) return;
    renderThemes();
    show('themes');
  };
  $('backHome').onclick = () => { COOP.creating = false; show('home'); };
  $('backThemes').onclick = () => show('themes');

  applyI18n();
  // Preload content in the background for an instant start, without a word.
  loadData(true);
  renderHomeModules();

  /* ---------------- arriving through a link ---------------- */
  // Two shapes reach us, and both end up here:
  //
  //  * `t.me/<bot>/<app>?startapp=s69_XXXXXX` opens this page directly and
  //    Telegram hands the payload over as `start_param` (and, on some
  //    clients, as `tgWebAppStartParam` in the URL).
  //  * `t.me/<bot>?start=s69_XXXXXX` opens the chat instead; the bot answers
  //    with a button pointing at `?screen=steps69&code=XXXXXX`.
  //
  // Same destination either way, so the partner never types anything.
  const INVITE_SCREENS = { s69: 'steps69', cmp: 'compat', duo: 'coop' };

  function bootTarget() {
    try {
      const q = new URLSearchParams(location.search);
      const param = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param)
                    || q.get('tgWebAppStartParam');
      if (param && param.indexOf('_') > 0) {
        const kind = param.slice(0, param.indexOf('_'));
        const code = param.slice(param.indexOf('_') + 1).trim().toUpperCase();
        // 6 to 16: codes are minted at 16 now, and the short ones live on
        // in links already sent.
        if (INVITE_SCREENS[kind] && code.length >= 6 && code.length <= 16) {
          return { screen: INVITE_SCREENS[kind], code: code };
        }
        // A recognised kind with a mangled code: the partner tapped a
        // truncated or mistyped link. Landing them silently on the home
        // screen told them nothing; say the link is broken. An unknown
        // kind stays silent on purpose - it may be someone else's payload.
        if (INVITE_SCREENS[kind]) return { broken: true };
      }
      const screen = q.get('screen');
      if (screen) {
        const code = (q.get('code') || '').trim().toUpperCase();
        return { screen: screen, code: (code.length >= 6 && code.length <= 16) ? code : null };
      }
    } catch (e) {}
    return null;
  }

  // The channel this launch came by: a `src_<tag>` link, an invite, or a
  // button the bot sent (a push, a nudge). Nothing otherwise.
  function arrivalSource() {
    try {
      const q = new URLSearchParams(location.search);
      const param = (tg && tg.initDataUnsafe && tg.initDataUnsafe.start_param)
                    || q.get('tgWebAppStartParam') || '';
      if (/^src_/i.test(param)) return param.slice(4);
      if (INVITE_SCREENS[param.split('_')[0]]) return 'invite';
      if (q.get('screen')) return q.get('code') ? 'invite' : 'push';
    } catch (e) {}
    return null;
  }

  async function boot() {
    track('app_open', null, arrivalSource());
    loadMe();
    const target = bootTarget();
    if (!target) return;
    if (target.broken) { toast(T().inviteBroken); return; }
    if (target.screen === 'library') { openLibrary(); return; }

    if (target.screen === 'steps69') {
      if (!target.code) { nsfwGate('s69', openS69); return; }
      nsfwGate('s69', () => { show('s69'); s69Join(target.code); });
      return;
    }
    if (target.screen === 'compat') {
      if (!target.code) { show('compat'); return; }
      show('compat');
      await compatJoin(target.code);
      return;
    }
    if (target.screen === 'coop') {
      if (!target.code) { show('coop'); return; }
      show('coop');
      await joinCoopRoom(target.code);
      return;
    }
  }

  boot();
})();
</script>
</body>
</html>

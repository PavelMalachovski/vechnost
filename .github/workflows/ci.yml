name: CI

# `master` is the only long-lived branch. This used to say `main, develop`,
# neither of which exists in this repository, so CI had never run on a single
# push or pull request.
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run ruff
      run: ruff check .

    - name: Type-check the domain layer
      run: ./scripts/typecheck.sh

    - name: Type-check everything else (informational)
      continue-on-error: true
      run: python -m mypy vechnost_bot

  test:
    runs-on: ubuntu-latest

    # The suite's storage tests talk to a real Redis. Without one they do not
    # skip - the hybrid storage spends its auto-start retry budget on every
    # call, which took a single test file from half a second to three minutes.
    services:
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run tests
      env:
        REDIS_URL: redis://localhost:6379/0
      run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t vechnost-bot:ci .

    - name: Test Docker image
      run: |
        # Test that the image builds and can start (without actual bot token)
        docker run --rm vechnost-bot:ci python -c "import vechnost_bot; print('Import successful')"

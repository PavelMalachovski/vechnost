name: CI

# The default branch here is `master`. This used to say `main, develop`, which
# exist in no clone of this repository — so nothing ever ran, on any pull
# request or any push, and every merge went in unchecked.
#
# Railway's "Wait for CI" holds a deploy of master until every workflow that
# ran on the commit has finished, and skips the deploy if one failed. So what
# runs on `push` here is the gate between a merge and production: keep it
# green, and keep it deterministic. docs/CI_CD.md has the whole pipeline.
on:
  push:
    branches: [ master ]
  pull_request:
  # Every job but one installs requirements.lock, so the nightly run checks
  # the same commit against the same versions - and the `upstream` job
  # installs today's PyPI unpinned, to hear about a release like SQLAlchemy
  # 2.1 (greenlet moved behind an extra, a fresh install stopped importing)
  # before a lock update has to absorb it.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-dev.lock

    # Exactly the versions production runs (requirements.lock, which this
    # file extends), every file checked against its hash; `pip check` fails
    # if pyproject.toml asks for something the lock does not satisfy.
    - name: Install dependencies from the lock
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes --no-deps -r requirements-dev.lock
        pip install --no-deps .
        pip check

    - name: Run ruff
      run: ruff check .

    # Strict, and blocking, on the modules that can hold the line today: the
    # domain layer and the loaders around it. See scripts/typecheck.sh for
    # what is on the list and why. A wholly advisory mypy gates on nothing,
    # and new domain code should not be allowed to arrive untyped.
    - name: Type-check the domain layer
      run: ./scripts/typecheck.sh

    # The rest is not blocking yet: the codebase has a few hundred missing
    # annotations, and fixing those is its own piece of work rather than
    # something to smuggle into whatever PR happens to turn CI on. The output
    # is here so the size of that job stays visible.
    - name: Run mypy (advisory)
      continue-on-error: true
      run: python -m mypy vechnost_bot

    # Advisory for the same reason: a new advisory against a dependency
    # should be seen the day it is published, not block an unrelated PR.
    - name: Audit dependencies for known vulnerabilities (advisory)
      continue-on-error: true
      run: |
        pip install pip-audit
        pip-audit --progress-spinner off

    # Code nothing calls. [tool.vulture] in pyproject.toml lists what a
    # framework calls by name; anything else it prints is a question for the
    # PR: delete it, or say what uses it there.
    - name: Dead code (advisory)
      continue-on-error: true
      run: |
        pip install vulture
        vulture

    # A dependency nothing imports is an install that can break a build, and
    # an import nothing declares works only while something else pulls it in.
    - name: Dependencies against imports (advisory)
      continue-on-error: true
      run: |
        pip install deptry
        deptry .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The Redis suite is a real integration test against a real server.
    # Without one it skips itself (see tests/conftest.py), which is right on a
    # laptop and wrong here — in CI it should actually run.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-dev.lock

    # Exactly the versions production runs (requirements.lock, which this
    # file extends), every file checked against its hash; `pip check` fails
    # if pyproject.toml asks for something the lock does not satisfy.
    - name: Install dependencies from the lock
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes --no-deps -r requirements-dev.lock
        pip install --no-deps .
        pip check

    # Runs across every core: `-n auto --dist load` is in pyproject's addopts.
    # No environment to set up — conftest supplies a fake bot token, and
    # nothing here talks to Telegram. This includes the in-process two-user
    # suite (tests/e2e) with a short fuzz; the long runs are in e2e.yml.
    - name: Run tests
      run: pytest -q

  # The build production actually gets: Railway builds this repository's
  # Dockerfile, which installs requirements.lock and starts run_webhook. So
  # this builds that image, imports every module inside it, serves the web
  # process from it and smokes it. The test job cannot see a break here: it
  # installs the dev extras too, which can drag in what the runtime forgot to
  # declare, and it runs on the runner's Python rather than the image's.
  install-smoke:
    name: Fresh install, the way Railway builds it
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build the production image
      run: docker build -t vechnost:ci .

    # Every module, not just the package: the break that motivated this job
    # lived in `vechnost_bot.payments`, which `import vechnost_bot` never
    # touches, and parts of the bot import it lazily inside handlers.
    - name: Import every module inside the image
      run: |
        docker run -i --rm -e TELEGRAM_BOT_TOKEN=1234567890:TEST_TOKEN_FOR_UNIT_TESTS vechnost:ci python - <<'PY'
        import importlib, pkgutil
        import vechnost_bot
        names = [m.name for m in pkgutil.walk_packages(vechnost_bot.__path__, "vechnost_bot.")]
        for name in names:
            importlib.import_module(name)
        print(f"imported {len(names)} modules")
        PY
        docker run --rm vechnost:ci pip freeze > runtime-freeze.txt

    # The web process only: the bot would need a real token to get past
    # getMe. run_webhook itself is covered by tests/test_run_webhook.py.
    - name: Serve the web process from the image and smoke it
      run: |
        docker run -d --name web -p 8000:8000 \
          -e TELEGRAM_BOT_TOKEN=1234567890:TEST_TOKEN_FOR_UNIT_TESTS \
          -e ENABLE_PAYMENT=true -e TRIBUTE_API_KEY=ci-signing-key \
          -e DATABASE_URL=sqlite+aiosqlite:////tmp/ci-smoke.db \
          vechnost:ci python -m uvicorn vechnost_bot.payments.web:app --host 0.0.0.0 --port 8000
        for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
        python -m pip install httpx
        python scripts/smoke_production.py http://127.0.0.1:8000
        docker logs web > uvicorn.log 2>&1
        if grep -E "Traceback|failed" uvicorn.log; then cat uvicorn.log; exit 1; fi

    - name: Keep the installed versions
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: runtime-freeze
        path: runtime-freeze.txt
        if-no-files-found: ignore

  # The lock keeps a release upstream away from production; this is how we
  # hear about one anyway, before the next lock update has to absorb it. It
  # installs today's PyPI, unpinned, and runs the suite - nightly only, so
  # an upstream break never blocks a merge.
  upstream:
    name: Today's PyPI, unpinned
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install today's versions
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]
        pip freeze > upstream-freeze.txt

    - name: Run tests
      run: pytest -q

    - name: Keep the resolved versions
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: upstream-freeze
        path: upstream-freeze.txt
        if-no-files-found: ignore

  # A red nightly run has no commit behind it and so no author to tell: GitHub
  # mails only whoever last edited the cron line. File it where it is seen.
  report-nightly-failure:
    name: File the nightly failure
    if: failure() && github.event_name == 'schedule'
    needs: [lint, test, install-smoke, upstream]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - uses: actions/github-script@v7
      with:
        script: |
          const label = 'ci-nightly';
          const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = `The nightly CI run failed on ${context.sha.slice(0, 7)}: ${run}\n\n` +
                       'A red "Today\'s PyPI, unpinned" job is a release upstream that the lock ' +
                       'keeps away from production: its upstream-freeze artifact against ' +
                       'requirements.lock shows what changed. Any other red job is this commit\'s.';
          try {
            await github.rest.issues.createLabel({
              owner: context.repo.owner, repo: context.repo.repo, name: label, color: 'b60205',
            });
          } catch (e) { /* already there */ }
          const { data: open } = await github.rest.issues.listForRepo({
            owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label,
          });
          if (open.length) {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: open[0].number, body,
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'Nightly CI failed on today\'s PyPI', body, labels: [label],
            });
          }

name: CI

# The default branch here is `master`. This used to say `main, develop`, which
# exist in no clone of this repository — so nothing ever ran, on any pull
# request or any push, and every merge went in unchecked.
on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run ruff
      run: ruff check .

    # Strict, and blocking, on the modules that can hold the line today: the
    # domain layer and the loaders around it. See scripts/typecheck.sh for
    # what is on the list and why. A wholly advisory mypy gates on nothing,
    # and new domain code should not be allowed to arrive untyped.
    - name: Type-check the domain layer
      run: ./scripts/typecheck.sh

    # The rest is not blocking yet: the codebase has a few hundred missing
    # annotations, and fixing those is its own piece of work rather than
    # something to smuggle into whatever PR happens to turn CI on. The output
    # is here so the size of that job stays visible.
    - name: Run mypy (advisory)
      continue-on-error: true
      run: mypy vechnost_bot

  test:
    runs-on: ubuntu-latest

    # The Redis suite is a real integration test against a real server.
    # Without one it skips itself (see tests/conftest.py), which is right on a
    # laptop and wrong here — in CI it should actually run.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    # Runs across every core: `-n auto --dist load` is in pyproject's addopts.
    # No environment to set up — conftest supplies a fake bot token, and
    # nothing here talks to Telegram.
    - name: Run tests
      run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: docker build -t vechnost-bot:ci .

    - name: Test Docker image
      run: |
        # Test that the image builds and can start (without actual bot token)
        docker run --rm vechnost-bot:ci python -c "import vechnost_bot; print('Import successful')"

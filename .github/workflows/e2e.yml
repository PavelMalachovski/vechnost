name: Two-user E2E

# Everything VECHNOST sells needs two people on two phones, so this workflow
# plays both of them (tests/e2e, see its README):
#
#   postgres  scenarios, the bot, the races and a fuzz on PostgreSQL - the
#             database production runs and every other suite does not -
#             in-process and then over real HTTP against a live server
#   fuzz      three people doing anything in any order, checked against a
#             model of the rules; long enough on a schedule to reach every
#             finale, completed test and superseded retake many times
#   browser   two Chromium phones driving the Mini App UI end to end
#
# It runs on push to master too, so Railway's "Wait for CI" waits for it:
# a merge that breaks what a couple does together does not deploy.
on:
  push:
    branches: [ master ]
  pull_request:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      fuzz_examples:
        description: "Fuzzer: how many runs"
        default: "400"
      fuzz_steps:
        description: "Fuzzer: steps per run"
        default: "100"

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Fake, and only ever used to sign the players' initData.
  TELEGRAM_BOT_TOKEN: "1234567890:TEST_TOKEN_FOR_UNIT_TESTS"
  E2E_REPORT_DIR: e2e-report
  # What a live server needs to accept the harness's players and purchases
  # (tests/e2e/harness.py). Nothing here is a real credential.
  E2E_SERVER_ENV: >-
    ENABLE_PAYMENT=true
    TRIBUTE_API_KEY=e2e-tribute-signing-key
    BOT_USERNAME=vechnost_e2e_bot
    TRUSTED_PROXY_HOPS=1
    LOG_LEVEL=WARNING

jobs:
  postgres:
    name: Two users on PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-dev.lock

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes --no-deps -r requirements-dev.lock
        pip install --no-deps .
        pip check
        mkdir -p "$E2E_REPORT_DIR"

    # Startup data steps, the access backfill, alembic end to end, and
    # alembic and create_all building one schema: the PostgreSQL-only faults.
    - name: PostgreSQL-only tests
      env:
        POSTGRES_TEST_URL: postgresql+asyncpg://postgres@localhost:5432/postgres
      run: pytest tests/test_postgres.py -n0 -q -rs

    - name: Create the E2E databases
      run: |
        python - <<'PY'
        from sqlalchemy import create_engine, text
        admin = create_engine("postgresql+psycopg2://postgres@localhost:5432/postgres",
                              isolation_level="AUTOCOMMIT")
        with admin.connect() as conn:
            for name in ("vechnost_inproc", "vechnost_live"):
                conn.execute(text(f"CREATE DATABASE {name}"))
        PY

    - name: Scenarios, the bot and a fuzz, in-process on PostgreSQL
      env:
        E2E_DATABASE_URL: postgresql+asyncpg://postgres@localhost:5432/vechnost_inproc
        E2E_FUZZ_EXAMPLES: "40"
        E2E_FUZZ_STEPS: "60"
      run: pytest tests/e2e -n0 -q -m "not browser"

    - name: Start a live server on PostgreSQL
      run: |
        env $E2E_SERVER_ENV \
          DATABASE_URL=postgresql+asyncpg://postgres@localhost:5432/vechnost_live \
          nohup python -m uvicorn vechnost_bot.payments.web:app --host 127.0.0.1 --port 8000 \
          > "$E2E_REPORT_DIR/live-server.log" 2>&1 &
        for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done

    # The same scenarios over real HTTP, plus the races: a crowd opening one
    # invite, double taps, eighty answers in flight, two purchases at once.
    - name: Scenarios and races over real HTTP
      env:
        E2E_BASE_URL: http://127.0.0.1:8000
      run: pytest tests/e2e -n0 -q -m "not browser"

    - name: The production smoke, against the live server
      run: python scripts/smoke_production.py http://127.0.0.1:8000

    - name: No startup step may fail on PostgreSQL
      run: |
        if grep -E "startup steps failed|Could not create the database" "$E2E_REPORT_DIR/live-server.log"; then
          exit 1
        fi

    - name: Keep the report
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: e2e-postgres
        path: e2e-report
        if-no-files-found: ignore

  fuzz:
    name: Three people doing anything
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-dev.lock

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes --no-deps -r requirements-dev.lock
        pip install --no-deps .
        pip check

    # A few minutes on a pull request; about thirteen at night, or whatever
    # a manual run asks for. A failure prints the shortest sequence of steps
    # that reproduces it, which is the bug report.
    - name: Fuzz
      env:
        E2E_FUZZ_EXAMPLES: ${{ github.event_name == 'schedule' && '400' || inputs.fuzz_examples || '120' }}
        E2E_FUZZ_STEPS: ${{ github.event_name == 'schedule' && '100' || inputs.fuzz_steps || '80' }}
      run: pytest tests/e2e/test_duo_fuzz.py -n0 -q -s

    - name: Keep what the runs reached
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: e2e-fuzz
        path: e2e-report
        if-no-files-found: ignore

  browser:
    name: Two phones in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vechnost_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
    - uses: actions/checkout@v5

    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements-dev.lock

    - name: Install dependencies and Chromium
      run: |
        python -m pip install --upgrade pip
        pip install --require-hashes --no-deps -r requirements-dev.lock
        pip install --no-deps .
        pip check
        python -m playwright install --with-deps chromium
        mkdir -p "$E2E_REPORT_DIR"

    - name: Start a live server on PostgreSQL
      run: |
        env $E2E_SERVER_ENV \
          DATABASE_URL=postgresql+asyncpg://postgres@localhost:5432/vechnost_browser \
          WEBAPP_URL=http://127.0.0.1:8000/app/ \
          nohup python -m uvicorn vechnost_bot.payments.web:app --host 127.0.0.1 --port 8000 \
          > "$E2E_REPORT_DIR/live-server.log" 2>&1 &
        for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done

    - name: Two phones play a room, the test and the board
      env:
        E2E_BROWSER: "1"
        E2E_BASE_URL: http://127.0.0.1:8000
      run: pytest tests/e2e/browser -n0 -q

    # Numbered screenshots of both phones at every step, and a Playwright
    # trace of each phone when a test fails (`playwright show-trace`).
    - name: Keep screenshots and traces
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: e2e-browser
        path: e2e-report
        if-no-files-found: ignore

  # A nightly failure is nobody's pull request, so it would sit unseen in the
  # Actions tab. It becomes an issue instead: one open issue, a comment per
  # failed night, closed by hand once fixed.
  report-nightly-failure:
    name: File the nightly failure
    if: failure() && github.event_name == 'schedule'
    needs: [postgres, fuzz, browser]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - uses: actions/github-script@v8
      with:
        script: |
          const label = 'e2e-nightly';
          const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const body = `The nightly two-user E2E run failed on ${context.sha.slice(0, 7)}: ${run}\n\n` +
                       'The failing job\'s log has the two-user transcript (scenarios), the shrunk ' +
                       'reproduction (fuzzer), or screenshots and traces in its artifacts (browser).';
          try {
            await github.rest.issues.createLabel({
              owner: context.repo.owner, repo: context.repo.repo, name: label, color: 'b60205',
            });
          } catch (e) { /* already there */ }
          const { data: open } = await github.rest.issues.listForRepo({
            owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: label,
          });
          if (open.length) {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: open[0].number, body,
            });
          } else {
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: 'Nightly two-user E2E failed', body, labels: [label],
            });
          }

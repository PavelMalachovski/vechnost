[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vechnost-bot"
version = "1.0.0"
description = "A Telegram bot for the Vechnost card game"
authors = [
    {name = "Vechnost Team", email = "team@vechnost.com"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-telegram-bot[job-queue]>=22.8",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.0.0",
    "pyyaml==6.0.2",
    "pillow>=10.0.0",
    "structlog>=23.0.0",
    "sentry-sdk>=1.40.0",
    "babel>=2.12.0",
    "redis>=5.0.0",
    # The asyncio extra is what brings greenlet, and the async engine cannot
    # import without it. SQLAlchemy 2.0 installed greenlet unasked; 2.1 moved
    # it behind the extra, so a fresh install of a bare `sqlalchemy>=2.0.0`
    # crashed at `import vechnost_bot.payments` with no change on our side.
    "sqlalchemy[asyncio]>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",  # For local development with SQLite
    "asyncpg>=0.29.0",  # For PostgreSQL async support
    "psycopg2-binary>=2.9.9",  # For PostgreSQL sync support
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "qrcode>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    # The suite runs in parallel by default (see addopts); -p no:xdist turns
    # that off for a run where the output order matters.
    "pytest-xdist>=3.5.0",
    # Coverage in CI, with a floor that only rises (see ci.yml).
    "pytest-cov>=5.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
    # The two-user fuzzer in tests/e2e/test_duo_fuzz.py runs in every pytest.
    "hypothesis>=6.100",
]
# Two real browsers driving the Mini App (tests/e2e/browser, opt-in with
# E2E_BROWSER=1). Chromium itself: `python -m playwright install chromium`.
e2e = [
    "playwright>=1.49",
]

[project.scripts]
vechnost-bot = "vechnost_bot.main:main"

# The package runs from a checkout: an editable install, or the checkout on
# PYTHONPATH as the production image does. data/, assets/ and webapp/ stay
# beside it, where vechnost_bot/paths.py finds them. A wheel would carry the
# code alone, and importing it stops with that explanation (audit I-28).
[tool.setuptools.packages.find]
where = ["."]
include = ["vechnost_bot*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    # str+Enum -> StrEnum is not a refactor we can make blind: `str(member)`
    # changes from "CallbackAction.THEME" to "theme", and these enums are
    # what callback data and stored language codes are built from.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# These set something up before importing the package, and have to: a
# sys.path entry for a script run from the repo root, or the environment
# variable Settings refuses to start without.
"scripts/*" = ["E402"]
"tests/*" = ["E402"]

[tool.ruff.format]
# ruff also formats the Python blocks inside Markdown. docs/archive is kept
# as it was written and is not maintained, so rewriting its examples would
# only churn history.
exclude = ["docs/archive/**"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

# Dead code (vulture) and undeclared or unused dependencies (deptry), both
# advisory in CI: a module or a function nothing calls is a trap (CLAUDE.md),
# and a dependency nothing imports is an install that can break a build.
# vulture cannot see what a framework calls by name, so those are listed.
[tool.vulture]
paths = ["vechnost_bot", "scripts"]
min_confidence = 60
ignore_decorators = [
    "@app.*",                               # FastAPI routes, middleware, handlers
    "@router.*",
    "@field_validator",                     # pydantic validators
    "@model_validator",
    "@event.listens_for",                   # SQLAlchemy event hooks
]
ignore_names = [
    "model_config",                         # pydantic settings
    "impl", "cache_ok",                     # SQLAlchemy TypeDecorator
    "process_bind_param", "process_result_value",
    "authorized",                           # a FastAPI dependency's result
    # python-telegram-bot's BaseUpdateProcessor calls these (bot.py).
    "do_process_update", "initialize", "shutdown",
    # Content models, filled from YAML and serialised into the API's JSON:
    "raw_data", "framing", "strengths_fallback", "recommendation",
    "critical_blocks", "why", "art", "tips", "lead", "intro", "outro",
    "subtitle",
    # The tests' way in: dropping the schema, and the board's portals.
    "drop_tables", "portals", "ladders", "snakes",
    "isolation_level",                      # set on the SQLite driver's connection
]

[tool.deptry]
known_first_party = ["vechnost_bot"]
optional_dependencies_dev_groups = ["dev", "e2e"]

[tool.deptry.per_rule_ignores]
# The database drivers SQLAlchemy loads by the name in the URL: asyncpg and
# aiosqlite for the app, psycopg2 for alembic (alembic/env.py). Nothing
# imports them by name.
DEP002 = ["asyncpg", "aiosqlite", "psycopg2-binary"]
# FastAPI is built on Starlette and pins it; web.py takes one type from it.
DEP003 = ["starlette"]

[tool.pytest.ini_options]
# The suite runs across every core by default. `--dist load` hands out
# individual tests rather than whole files, which is what keeps the wall
# clock down when one file is much heavier than the rest; the Redis tests
# take a database per worker so that is safe (see tests/test_redis_storage.py).
# Add `-n0` to run serially — for a debugger, or when interleaved output
# would be in the way.
addopts = "-n auto --dist load"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: A flow through the real handlers, several steps long",
    "slow: Takes seconds by design (real subprocesses, the fuzzer); -m 'not slow' skips them",
    "redis: Tests requiring Redis",
    "e2e: Two-user scenarios in tests/e2e (in-process by default, live with E2E_BASE_URL)",
    "inprocess_only: Needs the in-process server (fake Telegram, the bot); skipped against a live one",
    "live_only: Needs a live server over real HTTP (E2E_BASE_URL); skipped in-process",
    "fuzz: Randomised two-user state-machine runs (budget: E2E_FUZZ_EXAMPLES)",
    "browser: Two real browsers driving the Mini App (needs Playwright + Chromium)",
    "postgres: Needs a PostgreSQL server (POSTGRES_TEST_URL); skipped with a reason without one",
]
filterwarnings = [
    # A dependency's deprecations are its own to fix, and the nightly
    # "Today's PyPI, unpinned" run is where they turn into breakage first.
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:pydantic.*",
    # A deprecation raised in our own code is ours, and an error: it names
    # a call that stops working on the next upgrade (Result.tuples() did).
    "error::DeprecationWarning:vechnost_bot",
    "error::PendingDeprecationWarning:vechnost_bot",
    # A coroutine nobody awaited, or a thread that died with an exception
    # (an aiosqlite connection outliving its event loop), is a bug.
    "error::RuntimeWarning",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.coverage.run]
source = ["vechnost_bot"]
branch = true
# The API handlers reach the database through SQLAlchemy's async bridge,
# which runs each call in a greenlet, and TestClient serves every request on
# a thread of its own. Without both, coverage loses those frames and reports
# the API modules 30-38 points lower than they are.
concurrency = ["thread", "greenlet"]
# The supervisor production starts (run_webhook.py) is tested by running it
# in a subprocess, which coverage sees only with this: 29 % without, 93 % with.
patch = ["subprocess"]
relative_files = true

[tool.coverage.paths]
# CI installs the package as well; a subprocess that imports that copy
# counts for the checkout.
source = ["vechnost_bot", "*/site-packages/vechnost_bot"]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

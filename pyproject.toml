[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vechnost-bot"
version = "1.0.0"
description = "A Telegram bot for the Vechnost card game"
authors = [
    {name = "Vechnost Team", email = "team@vechnost.com"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "python-telegram-bot[job-queue]==21.6",
    "pydantic==2.9.2",
    "pydantic-settings>=2.0.0",
    "pyyaml==6.0.2",
    "pillow>=10.0.0",
    "structlog>=23.0.0",
    "sentry-sdk>=1.40.0",
    "babel>=2.12.0",
    "pycountry>=22.3.0",
    "aiofiles>=23.0.0",
    "aiohttp>=3.8.0",
    "redis>=5.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",  # For local development with SQLite
    "asyncpg>=0.29.0",  # For PostgreSQL async support
    "psycopg2-binary>=2.9.9",  # For PostgreSQL sync support
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "qrcode>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    # The suite runs in parallel by default (see addopts); -p no:xdist turns
    # that off for a run where the output order matters.
    "pytest-xdist>=3.5.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
vechnost-bot = "vechnost_bot.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vechnost_bot*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    # str+Enum -> StrEnum is not a refactor we can make blind: `str(member)`
    # changes from "CallbackAction.THEME" to "theme", and these enums are
    # what callback data and stored language codes are built from.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# These set something up before importing the package, and have to: a
# sys.path entry for a script run from the repo root, or the environment
# variable Settings refuses to start without.
"scripts/*" = ["E402"]
"start_webhook.py" = ["E402"]
"tests/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
# The suite runs across every core by default. `--dist load` hands out
# individual tests rather than whole files, which is what keeps the wall
# clock down when one file is much heavier than the rest; the Redis tests
# take a database per worker so that is safe (see tests/test_redis_storage.py).
# Add `-n0` to run serially — for a debugger, or when interleaved output
# would be in the way.
addopts = "-n auto --dist load"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "performance: Performance tests",
    "slow: Slow running tests",
    "redis: Tests requiring Redis",
    "telegram: Tests requiring Telegram API",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::UserWarning:pydantic.*",
]
